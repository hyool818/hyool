<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HYOOL — 幻想 × 无限 × 生命</title>

    <meta
        name="description"
        content="HYOOL — 幻想 × 无限 × 生命"
    >


    <style>

        /* ========================================
           基础
        ======================================== */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #050507;

            color: #ffffff;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            overflow-x: hidden;

        }


        /* ========================================
           页面
        ======================================== */

        .page {

            position: relative;

            min-height: 100vh;

            overflow: hidden;

        }


        /* ========================================
           背景
        ======================================== */

        .background {

            position: fixed;

            inset: 0;

            z-index: 0;

            background:

                radial-gradient(
                    circle at 50% 38%,
                    rgba(255,255,255,0.045),
                    transparent 48%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,0.018),
                    transparent 35%
                ),

                #050507;

            pointer-events: none;

        }


        /* ========================================
           中央幻想微光
        ======================================== */

        .orb {

            position: fixed;

            width: 560px;

            height: 560px;

            left: 50%;

            top: 38%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(255,255,255,0.045) 0%,
                    rgba(255,255,255,0.015) 30%,
                    transparent 70%
                );

            filter: blur(28px);

            animation:

                orbBreath
                8s
                ease-in-out
                infinite;

            pointer-events: none;

            z-index: 1;

        }


        /* ========================================
           顶部导航
        ======================================== */

        .navbar {

            position: relative;

            z-index: 10;

            width: 100%;

            height: 90px;

            padding:
                0 5vw;

            display: flex;

            align-items: center;

            justify-content: space-between;

        }


        /* ========================================
           左侧品牌
        ======================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 4px;

            flex-shrink: 0;

        }


        .brand-logo-link {

            display: flex;

            align-items: center;

            text-decoration: none;

        }


        .brand-logo {

            display: block;

            width: 135px;

            height: auto;

        }


        /* ========================================
           幻灵入口
        ======================================== */

        .spirit-link {

            position: relative;

            display: inline-flex;

            align-items: center;

            color:
                rgba(255,255,255,0.65);

            font-size: 16px;

            letter-spacing: 2px;

            text-decoration: none;

            white-space: nowrap;

            transition:

                color 0.4s ease,

                text-shadow 0.4s ease;

        }


        /* 幻灵底部光线 */

        .spirit-link::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -7px;

            width: 0;

            height: 1px;

            background:
                rgba(255,255,255,0.7);

            box-shadow:

                0 0 10px
                rgba(255,255,255,0.3);

            transition:

                width 0.5s ease;

        }


        /* 幻灵简介 */

        .spirit-description {

            position: absolute;

            top: 34px;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(-5px);

            width: max-content;

            color:
                rgba(255,255,255,0.38);

            font-size: 11px;

            letter-spacing: 2px;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transition:

                opacity 0.35s ease,

                transform 0.35s ease;

        }


        /* 幻灵 Hover */

        .spirit-link:hover {

            color: #ffffff;

            text-shadow:

                0 0 12px
                rgba(255,255,255,0.45),

                0 0 25px
                rgba(255,255,255,0.12);

        }


        .spirit-link:hover::after {

            width: 100%;

        }


        .spirit-link:hover .spirit-description {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);

        }


        /* ========================================
           右侧导航
        ======================================== */

        .nav {

            display: flex;

            align-items: center;

            gap: 38px;

        }


        .nav-item {

            position: relative;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-decoration: none;

            cursor: pointer;

        }


        .nav-title {

            position: relative;

            color:
                rgba(255,255,255,0.60);

            font-size: 16px;

            letter-spacing: 2px;

            white-space: nowrap;

            transition:

                color 0.3s ease,

                text-shadow 0.3s ease;

        }


        /* 导航底部光线 */

        .nav-title::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -8px;

            width: 0;

            height: 1px;

            transform:
                translateX(-50%);

            background: #ffffff;

            box-shadow:

                0 0 10px
                rgba(255,255,255,0.25);

            transition:

                width 0.4s ease;

        }


        /* ========================================
           导航简介
        ======================================== */

        .nav-description {

            position: absolute;

            top: 34px;

            left: 50%;

            transform:
                translateX(-50%)
                translateY(-5px);

            width: max-content;

            color:
                rgba(255,255,255,0.38);

            font-size: 11px;

            letter-spacing: 2px;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transition:

                opacity 0.35s ease,

                transform 0.35s ease;

        }


        /* ========================================
           导航 Hover
        ======================================== */

        .nav-item:hover .nav-title {

            color: #ffffff;

            text-shadow:

                0 0 12px
                rgba(255,255,255,0.35);

        }


        .nav-item:hover .nav-title::after {

            width: 100%;

        }


        .nav-item:hover .nav-description {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);

        }


        /* ========================================
           主视觉区域
        ======================================== */

        .hero {

            position: relative;

            z-index: 5;

            min-height:
                calc(100vh - 90px);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            text-align: center;

            padding:

                23vh 30px 140px;

        }


        /* ========================================
           中文主题
        ======================================== */

        .theme {

            margin: 0;

            font-size:

                clamp(
                    34px,
                    5vw,
                    64px
                );

            font-weight: 300;

            letter-spacing: 10px;

            line-height: 1.4;

            color:
                rgba(255,255,255,0.94);

            text-shadow:

                0 0 25px
                rgba(255,255,255,0.08);

            opacity: 0;

            animation:

                themeAppear
                1.8s
                ease
                0.3s
                forwards;

        }


        /* ========================================
           英文副标题
        ======================================== */

        .subtitle {

            margin-top: 24px;

            color:
                rgba(255,255,255,0.25);

            font-size:

                clamp(
                    11px,
                    1.5vw,
                    15px
                );

            font-weight: 300;

            letter-spacing: 5px;

            line-height: 1.6;

            opacity: 0;

            animation:

                subtitleAppear
                1.6s
                ease
                0.8s
                forwards;

        }


        /* ========================================
           底部英文
        ======================================== */

        .bottom-text {

            position: fixed;

            z-index: 10;

            left: 0;

            bottom: 28px;

            width: 100%;

            text-align: center;

            color:
                rgba(255,255,255,0.14);

            font-size: 9px;

            letter-spacing: 5px;

            font-weight: 300;

            pointer-events: none;

        }


        /* ========================================
           中文主题出现
        ======================================== */

        @keyframes themeAppear {

            from {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ========================================
           英文副标题出现
        ======================================== */

        @keyframes subtitleAppear {

            from {

                opacity: 0;

                transform:
                    translateY(12px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* ========================================
           背景呼吸
        ======================================== */

        @keyframes orbBreath {

            0%,
            100% {

                opacity: 0.45;

                transform:

                    translate(-50%, -50%)
                    scale(1);

            }

            50% {

                opacity: 0.8;

                transform:

                    translate(-50%, -50%)
                    scale(1.15);

            }

        }


        /* ========================================
           平板
        ======================================== */

        @media (max-width: 900px) {

            .navbar {

                padding:
                    0 30px;

            }


            .nav {

                gap: 25px;

            }


            .nav-title {

                font-size: 14px;

            }


            .hero {

                padding-top:
                    20vh;

            }

        }


        /* ========================================
           手机
        ======================================== */

        @media (max-width: 700px) {

            .navbar {

                height: 75px;

                padding:
                    0 20px;

            }


            .brand-logo {

                width: 105px;

            }


            .spirit-link {

                font-size: 13px;

                letter-spacing: 1px;

            }


            .nav {

                gap: 16px;

            }


            .nav-title {

                font-size: 11px;

                letter-spacing: 1px;

            }


            .nav-description {

                font-size: 9px;

                letter-spacing: 1px;

            }


            .hero {

                padding:

                    20vh 20px 120px;

            }


            .theme {

                font-size: 30px;

                letter-spacing: 4px;

            }


            .subtitle {

                margin-top: 18px;

                font-size: 10px;

                letter-spacing: 3px;

            }


            .bottom-text {

                font-size: 8px;

                letter-spacing: 3px;

                bottom: 20px;

            }

        }


        /* ========================================
           小手机
        ======================================== */

        @media (max-width: 520px) {

            .nav-item:nth-child(n+3) {

                display: none;

            }


            .brand {

                gap: 2px;

            }


            .brand-logo {

                width: 95px;

            }


            .theme {

                font-size: 26px;

            }


            .subtitle {

                font-size: 9px;

            }

        }


    </style>

</head>


<body>


    <div class="page">


        <!-- ==================================
             背景
        =================================== -->

        <div class="background"></div>

        <div class="orb"></div>


        <!-- ==================================

        <header class="navbar">


            <!-- ==============================

            <div class="brand">


                <a
                    href="home.html"

                    <img

                <a

            =================================== -->

            <nav class="nav">

                <a

                    <span class="nav-title">

                    <span class="nav-description">

                </a>


                <!-- 创作 -->

                <a
                    href="#"

                >

                    <span class="nav-title">

                    </span>


                    <span class="nav-description">

                        图片 · 视频 · 音乐 · 小说

                    </span>

                </a>


                <!-- 世界 -->

                <a
                    href="#"
                    class="nav-item"
                >

                    <span class="nav-title">

                    </span>


                    <span class="nav-description">

                        游戏 · 虚拟世界

                    </span>

                </a>


                <!-- 工具 -->

                <a
                    href="#"
                    class="nav-item"
                >

                    <span class="nav-title">

                    </span>


                    <span class="nav-description">

                <!-- 社区 -->

                <a

                    </span>

                    </span>

                </a>


            </nav>


        </header>


        <!-- ==================================
             主视觉
        =================================== -->

        <main class="hero">


            <!-- 中文 -->

            <h1 class="theme">

                幻想 × 无限 × 生命

            </h1>


            <!-- 英文 -->

            <div class="subtitle">

                Fantasy · Infinite · Life

            </div>


        </main>


        <!-- ==================================
             底部英文
        =================================== -->

        <div class="bottom-text">

            ENTER THE DIGITAL WORLD

        </div>


    </div>


</body>

</html>
