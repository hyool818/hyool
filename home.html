<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYOOL — Fantasy · Infinite · Life</title>

    <meta
        name="description"
        content="HYOOL — 幻想 · 无限 · 生命"
    >

    <style>

        /* =========================
           基础
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background: #050507;

            color: #ffffff;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;

            overflow-x: hidden;
        }


        /* =========================
           页面
        ========================= */

        .page {
            position: relative;

            min-height: 100vh;

            overflow: hidden;
        }


        /* =========================
           背景
        ========================= */

        .background {
            position: fixed;

            inset: 0;

            z-index: 0;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(255,255,255,0.045),
                    transparent 48%
                ),

                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,0.018),
                    transparent 35%
                ),

                #050507;

            pointer-events: none;
        }


        /* =========================
           背景微光
        ========================= */

        .orb {
            position: fixed;

            width: 520px;

            height: 520px;

            left: 50%;

            top: 42%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.045)
                    0%,

                    rgba(255,255,255,0.015)
                    30%,

                    transparent
                    70%
                );

            filter: blur(25px);

            animation:
                orbBreath
                8s
                ease-in-out
                infinite;

            pointer-events: none;

            z-index: 1;
        }


        /* =========================
           顶部导航
        ========================= */

        .navbar {
            position: relative;

            z-index: 10;

            width: 100%;

            height: 90px;

            padding:
                0 6vw;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        /* =========================
           左侧品牌
        ========================= */

        .brand {
            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;
        }


        .brand-logo {
            display: block;

            width: 125px;

            height: auto;
        }


        /* =========================
           幻灵入口
        ========================= */

        .spirit-link {

            position: relative;

            display: inline-flex;

            align-items: center;

            gap: 5px;

            color:
                rgba(255,255,255,0.58);

            font-size: 14px;

            letter-spacing: 3px;

            text-decoration: none;

            transition:
                color 0.4s ease,
                text-shadow 0.4s ease;

        }


        .spirit-link::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -7px;

            width: 0;

            height: 1px;

            background:
                rgba(255,255,255,0.7);

            box-shadow:
                0 0 10px
                rgba(255,255,255,0.3);

            transition:
                width 0.5s ease;

        }


        .spirit-link:hover {

            color: #ffffff;

            text-shadow:
                0 0 12px
                rgba(255,255,255,0.45),

                0 0 25px
                rgba(255,255,255,0.12);

        }


        .spirit-link:hover::after {

            width: 100%;

        }


        /* =========================
           右侧导航
        ========================= */

        .nav {

            display: flex;

            align-items: center;

            gap: 36px;

        }


        .nav a {

            position: relative;

            color:
                rgba(255,255,255,0.48);

            font-size: 13px;

            letter-spacing: 2px;

            text-decoration: none;

            transition:
                color 0.3s ease,
                text-shadow 0.3s ease;

        }


        .nav a::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -8px;

            width: 0;

            height: 1px;

            transform:
                translateX(-50%);

            background: #ffffff;

            transition:
                width 0.35s ease;

        }


        .nav a:hover {

            color: #ffffff;

            text-shadow:
                0 0 12px
                rgba(255,255,255,0.25);

        }


        .nav a:hover::after {

            width: 100%;

        }


        /* =========================
           主视觉
        ========================= */

        .hero {

            position: relative;

            z-index: 5;

            min-height:
                calc(100vh - 90px);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                40px 30px 100px;

        }


        /* =========================
           核心主题
        ========================= */

        .theme {

            margin: 0;

            font-size:
                clamp(
                    32px,
                    5vw,
                    62px
                );

            font-weight: 300;

            letter-spacing: 9px;

            line-height: 1.4;

            color:
                rgba(255,255,255,0.92);

            text-shadow:
                0 0 25px
                rgba(255,255,255,0.08);

            opacity: 0;

            animation:
                themeAppear
                1.8s
                ease
                0.3s
                forwards;

        }


        /* =========================
           小提示
        ========================= */

        .hint {

            margin-top: 28px;

            color:
                rgba(255,255,255,0.25);

            font-size: 11px;

            letter-spacing: 5px;

            opacity: 0;

            animation:
                hintAppear
                1.5s
                ease
                1s
                forwards;

        }


        /* =========================
           底部
        ========================= */

        .footer {

            position: fixed;

            z-index: 10;

            left: 6vw;

            bottom: 30px;

            color:
                rgba(255,255,255,0.18);

            font-size: 10px;

            letter-spacing: 3px;

        }


        /* =========================
           动画
        ========================= */

        @keyframes orbBreath {

            0%,
            100% {

                opacity: 0.5;

                transform:
                    translate(-50%, -50%)
                    scale(1);

            }

            50% {

                opacity: 0.85;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);

            }

        }


        @keyframes themeAppear {

            from {

                opacity: 0;

                transform:
                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes hintAppear {

            from {

                opacity: 0;

            }

            to {

                opacity: 1;

            }

        }


        /* =========================
           手机端
        ========================= */

        @media (max-width: 760px) {

            .navbar {

                height: 75px;

                padding:
                    0 24px;

            }


            .brand-logo {

                width: 105px;

            }


            .spirit-link {

                font-size: 12px;

                letter-spacing: 2px;

            }


            .nav {

                gap: 18px;

            }


            .nav a {

                font-size: 11px;

                letter-spacing: 1px;

            }


            .theme {

                font-size: 30px;

                letter-spacing: 4px;

            }


            .hint {

                font-size: 9px;

                letter-spacing: 3px;

            }

        }


        /* =========================
           小屏幕
        ========================= */

        @media (max-width: 520px) {

            .nav a:nth-child(n+3) {

                display: none;

            }


            .brand {

                gap: 8px;

            }


            .brand-logo {

                width: 95px;

            }


            .theme {

                font-size: 26px;

            }

        }

    </style>
</head>


<body>

    <div class="page">


        <!-- 背景 -->

        <div class="background"></div>

        <div class="orb"></div>


        <!-- =====================
             顶部导航
        ====================== -->

        <header class="navbar">


            <!-- 左侧品牌 -->

            <a
                href="home.html"
                class="brand"
            >

                <img
                    src="logo1.png"
                    alt="HYOOL"
                    class="brand-logo"
                >

                <a
                    href="#"
                    class="spirit-link"
                >
                    · 幻灵
                </a>

            </a>


            <!-- 右侧导航 -->

            <nav class="nav">

                <a href="#">
                    AI
                </a>

                <a href="#">
                    创作
                </a>

                <a href="#">
                    世界
                </a>

                <a href="#">
                    工具
                </a>

                <a href="#">
                    社区
                </a>

            </nav>

        </header>


        <!-- =====================
             主视觉
        ====================== -->

        <main class="hero">


            <h1 class="theme">

                Fantasy · Infinite · Life

            </h1>


            <div class="hint">

                ENTER THE DIGITAL WORLD

            </div>


        </main>


        <!-- =====================
             页脚
        ====================== -->

        <div class="footer">

            HYOOL

        </div>


    </div>

</body>
</html>
