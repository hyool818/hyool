<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>HYOOL · 彼岸</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    min-height:100%;

    background:#000;

    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

body{

    overflow-x:hidden;

}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.035),
            transparent 35%
        ),

        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.018),
            transparent 25%
        );

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:80px;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 42px;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:center;

    cursor:pointer;

}

.logo img{

    width:90px;

    height:auto;

    display:block;

    opacity:.82;

}


/* =========================================================
   BACK
========================================================= */

.back{

    position:relative;

    padding:10px 4px;

    color:
        rgba(255,255,255,.55);

    font-size:12px;

    font-weight:300;

    letter-spacing:.22em;

    cursor:pointer;

    transition:

        color .5s ease,

        letter-spacing .6s ease;

}

.back:hover{

    color:#fff;

    letter-spacing:.32em;

}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:
        120px
        24px
        80px;

}


/* =========================================================
   TITLE
========================================================= */

.title{

    font-size:
        clamp(
            36px,
            5vw,
            72px
        );

    font-weight:200;

    letter-spacing:
        .38em;

    margin-left:
        .38em;

    color:
        rgba(255,255,255,.92);

    opacity:0;

    transform:
        translateY(25px);

    animation:
        titleIn
        1.4s
        cubic-bezier(.2,.8,.2,1)
        .15s
        forwards;

}


/* =========================================================
   ENGLISH
========================================================= */

.subtitle{

    margin-top:22px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            10px,
            1vw,
            13px
        );

    font-weight:300;

    letter-spacing:
        .42em;

    margin-left:
        .42em;

    color:
        rgba(255,255,255,.35);

    opacity:0;

    animation:
        fadeIn
        1.5s
        ease
        .5s
        forwards;

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{

    margin-top:50px;

    max-width:620px;

    line-height:2.1;

    font-size:14px;

    font-weight:300;

    letter-spacing:.12em;

    color:
        rgba(255,255,255,.48);

    opacity:0;

    animation:
        fadeIn
        1.5s
        ease
        .8s
        forwards;

}


/* =========================================================
   ENTER BUTTON AREA
========================================================= */

.actions{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:26px;

    margin-top:58px;

    opacity:0;

    animation:
        fadeIn
        1.5s
        ease
        1.1s
        forwards;

}


/* =========================================================
   BUTTON
========================================================= */

.action{

    min-width:130px;

    padding:15px 24px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.015);

    color:
        rgba(255,255,255,.68);

    font-size:11px;

    font-weight:300;

    letter-spacing:.25em;

    cursor:pointer;

    transition:

        border .5s ease,

        color .5s ease,

        background .5s ease,

        transform .6s
        cubic-bezier(.2,.8,.2,1);

}

.action:hover{

    border-color:
        rgba(255,255,255,.42);

    background:
        rgba(255,255,255,.05);

    color:#fff;

    transform:
        translateY(-3px);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    position:fixed;

    left:50%;

    bottom:28px;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.18);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:9px;

    letter-spacing:.4em;

    margin-left:.4em;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:24px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    opacity:0;

    visibility:hidden;

    transition:

        opacity .5s ease,

        visibility .5s ease;

}

.modal.show{

    opacity:1;

    visibility:visible;

}


/* =========================================================
   MODAL BOX
========================================================= */

.modal-box{

    position:relative;

    width:
        min(
            430px,
            100%
        );

    padding:
        48px
        42px
        42px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(8,8,8,.92);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.7);

    transform:
        translateY(20px)
        scale(.97);

    transition:
        transform .6s
        cubic-bezier(.2,.8,.2,1);

}

.modal.show
.modal-box{

    transform:
        translateY(0)
        scale(1);

}


/* =========================================================
   CLOSE
========================================================= */

.close{

    position:absolute;

    top:20px;

    right:22px;

    width:30px;

    height:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    color:
        rgba(255,255,255,.35);

    font-size:20px;

    font-weight:200;

    cursor:pointer;

    transition:
        color .4s ease;

}

.close:hover{

    color:#fff;

}


/* =========================================================
   MODAL TITLE
========================================================= */

.modal-title{

    font-size:25px;

    font-weight:300;

    letter-spacing:.3em;

    margin-left:.3em;

    text-align:center;

}

.modal-subtitle{

    margin-top:14px;

    text-align:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:9px;

    letter-spacing:.35em;

    margin-left:.35em;

    color:
        rgba(255,255,255,.3);

}


/* =========================================================
   FORM
========================================================= */

.form{

    margin-top:38px;

}

.field{

    margin-bottom:18px;

}

.field label{

    display:block;

    margin-bottom:9px;

    font-size:10px;

    letter-spacing:.18em;

    color:
        rgba(255,255,255,.38);

}

.field input{

    width:100%;

    height:48px;

    padding:
        0 15px;

    border:
        1px solid
        rgba(255,255,255,.1);

    outline:none;

    background:
        rgba(255,255,255,.025);

    color:#fff;

    font-family:inherit;

    font-size:13px;

    transition:
        border .4s ease,
        background .4s ease;

}

.field input:focus{

    border-color:
        rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.045);

}


/* =========================================================
   FORM BUTTON
========================================================= */

.submit{

    width:100%;

    height:50px;

    margin-top:10px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(255,255,255,.06);

    color:#fff;

    font-size:11px;

    letter-spacing:.28em;

    cursor:pointer;

    transition:

        background .4s ease,

        border .4s ease;

}

.submit:hover{

    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(255,255,255,.45);

}


/* =========================================================
   SWITCH
========================================================= */

.switch{

    margin-top:24px;

    text-align:center;

    font-size:10px;

    letter-spacing:.1em;

    color:
        rgba(255,255,255,.3);

}

.switch span{

    color:
        rgba(255,255,255,.75);

    cursor:pointer;

    margin-left:6px;

}

.switch span:hover{

    color:#fff;

}


/* =========================================================
   ERROR
========================================================= */

.error{

    min-height:18px;

    margin-top:16px;

    text-align:center;

    font-size:10px;

    line-height:1.7;

    color:
        rgba(255,130,130,.8);

}


/* =========================================================
   USER PANEL
========================================================= */

.user-panel{

    position:fixed;

    inset:0;

    z-index:90;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px;

    background:#000;

    opacity:0;

    visibility:hidden;

    transition:
        opacity .8s ease,
        visibility .8s ease;

}

.user-panel.show{

    opacity:1;

    visibility:visible;

}

.user-inner{

    text-align:center;

}

.user-avatar{

    width:90px;

    height:90px;

    margin:0 auto 28px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.16);

    display:flex;

    align-items:center;

    justify-content:center;

    color:
        rgba(255,255,255,.55);

    font-size:25px;

    font-weight:200;

}

.user-name{

    font-size:28px;

    font-weight:300;

    letter-spacing:.15em;

}

.user-handle{

    margin-top:12px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:11px;

    letter-spacing:.15em;

    color:
        rgba(255,255,255,.3);

}

.user-bio{

    margin-top:28px;

    color:
        rgba(255,255,255,.45);

    font-size:12px;

    letter-spacing:.08em;

}

.user-actions{

    margin-top:42px;

    display:flex;

    gap:18px;

    justify-content:center;

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes titleIn{

    from{

        opacity:0;

        transform:
            translateY(25px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:
            translateY(15px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{

        height:68px;

        padding:
            0 20px;

    }

    .logo img{

        width:70px;

    }

    .hero{

        padding:
            100px
            20px
            70px;

    }

    .title{

        font-size:34px;

        letter-spacing:.28em;

        margin-left:.28em;

    }

    .description{

        font-size:12px;

        line-height:2;

        max-width:330px;

    }

    .actions{

        flex-direction:column;

        width:100%;

        gap:12px;

    }

    .action{

        width:
            min(
                280px,
                100%
            );

    }

    .modal-box{

        padding:
            42px
            24px
            32px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(
    prefers-reduced-motion:reduce
){

    *{

        animation-duration:
            .01ms !important;

        transition-duration:
            .01ms !important;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div
        class="logo"
        id="logoButton"
    >

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </div>


    <div
        class="back"
        id="backButton"
    >
        返回幻灵
    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="hero">

    <div class="title">
        彼岸
    </div>


    <div class="subtitle">
        YONDER
    </div>


    <div class="description">

        每个人都可以拥有属于自己的空间。
        <br>
        创作、展示、分享，让作品抵达彼岸。

    </div>


    <div class="actions">

        <button
            class="action"
            id="loginButton"
        >
            登录
        </button>


        <button
            class="action"
            id="registerButton"
        >
            注册
        </button>

    </div>

</main>



<!-- =======================================================
     FOOTER
======================================================= -->

<footer class="footer">

    HYOOL · YONDER

</footer>



<!-- =======================================================
     AUTH MODAL
======================================================= -->

<div
    class="modal"
    id="authModal"
>

    <div class="modal-box">

        <div
            class="close"
            id="closeModal"
        >
            ×
        </div>


        <div
            class="modal-title"
            id="modalTitle"
        >
            登录
        </div>


        <div
            class="modal-subtitle"
            id="modalSubtitle"
        >
            ENTER YOUR YONDER
        </div>


        <form
            class="form"
            id="authForm"
        >


            <!-- USERNAME -->

            <div class="field">

                <label>
                    账号
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    maxlength="20"
                    placeholder="3–20 位英文 / 数字"
                    required
                >

            </div>


            <!-- DISPLAY NAME -->

            <div
                class="field"
                id="displayNameField"
                style="display:none;"
            >

                <label>
                    显示名称
                </label>

                <input
                    id="displayName"
                    type="text"
                    maxlength="30"
                    placeholder="你的名字"
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label>
                    密码
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="128"
                    placeholder="至少 8 位"
                    required
                >

            </div>


            <!-- CONFIRM -->

            <div
                class="field"
                id="confirmField"
                style="display:none;"
            >

                <label>
                    确认密码
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    maxlength="128"
                    placeholder="再次输入密码"
                >

            </div>


            <!-- INVITE CODE -->

            <div
                class="field"
                id="inviteCodeField"
                style="display:none;"
            >

                <label>
                    邀请码
                </label>

                <input
                    id="inviteCode"
                    type="text"
                    maxlength="32"
                    placeholder="请输入邀请码"
                    autocomplete="off"
                >

            </div>


            <div
                class="error"
                id="formError"
            ></div>


            <button
                class="submit"
                id="submitButton"
                type="submit"
            >
                登录
            </button>


        </form>


        <div
            class="switch"
            id="switchArea"
        >

            还没有账号？

            <span id="switchButton">
                创建账号
            </span>

        </div>

    </div>

</div>



<!-- =======================================================
     USER PANEL
======================================================= -->

<section
    class="user-panel"
    id="userPanel"
>

    <div class="user-inner">


        <div class="user-avatar">
            H
        </div>


        <div
            class="user-name"
            id="userName"
        >
            HYOOL
        </div>


        <div
            class="user-handle"
            id="userHandle"
        >
            @hyool
        </div>


        <div
            class="user-bio"
            id="userBio"
        >
            这是我的彼岸。

        </div>


        <div class="user-actions">

            <button
                class="action"
                id="logoutButton"
            >
                退出登录
            </button>

        </div>

    </div>

</section>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const authModal =
    document.getElementById(
        "authModal"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalSubtitle =
    document.getElementById(
        "modalSubtitle"
    );

const authForm =
    document.getElementById(
        "authForm"
    );

const usernameInput =
    document.getElementById(
        "username"
    );

const displayNameInput =
    document.getElementById(
        "displayName"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );

const displayNameField =
    document.getElementById(
        "displayNameField"
    );

const confirmField =
    document.getElementById(
        "confirmField"
    );

const inviteCodeField =
    document.getElementById(
        "inviteCodeField"
    );

const inviteCodeInput =
    document.getElementById(
        "inviteCode"
    );

const formError =
    document.getElementById(
        "formError"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const switchArea =
    document.getElementById(
        "switchArea"
    );

const switchButton =
    document.getElementById(
        "switchButton"
    );

const userPanel =
    document.getElementById(
        "userPanel"
    );

const userName =
    document.getElementById(
        "userName"
    );

const userHandle =
    document.getElementById(
        "userHandle"
    );

const userBio =
    document.getElementById(
        "userBio"
    );


/* =========================================================
   MODE
========================================================= */

let mode = "login";


/* =========================================================
   OPEN MODAL
========================================================= */

function openAuth(
    selectedMode = "login"
){

    mode =
        selectedMode;


    updateModal();


    formError.textContent =
        "";


    authForm.reset();


    authModal.classList.add(
        "show"
    );


    setTimeout(
        () => {

            usernameInput.focus();

        },
        300
    );

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeAuth(){

    authModal.classList.remove(
        "show"
    );

}


/* =========================================================
   UPDATE MODAL
========================================================= */

function updateModal(){

    if(
        mode === "register"
    ){

        modalTitle.textContent =
            "注册";

        modalSubtitle.textContent =
            "CREATE YOUR YONDER";

        displayNameField.style.display =
            "block";

        confirmField.style.display =
            "block";

        inviteCodeField.style.display =
            "block";

        submitButton.textContent =
            "创建彼岸";

        switchArea.innerHTML =
            '已经拥有账号？ <span id="switchButton">登录</span>';

    }

    else{

        modalTitle.textContent =
            "登录";

        modalSubtitle.textContent =
            "ENTER YOUR YONDER";

        displayNameField.style.display =
            "none";

        confirmField.style.display =
            "none";

        inviteCodeField.style.display =
            "none";

        submitButton.textContent =
            "登录";

        switchArea.innerHTML =
            '还没有账号？ <span id="switchButton">创建账号</span>';

    }


    document
        .getElementById(
            "switchButton"
        )
        .onclick = () => {

            mode =
                mode === "login"
                    ? "register"
                    : "login";

            updateModal();

            formError.textContent =
                "";

        };

}


/* =========================================================
   API
========================================================= */

async function api(path, options = {}) {

    const token = localStorage.getItem("hyool_token");

    const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
    };

    if (token) {
        headers["Authorization"] = "Bearer " + token;
    }

    const response = await fetch(
        path,
        {
            credentials: "include",

            ...options,

            headers: headers
        }
    );


    let data;

    try {

        data = await response.json();

    } catch {

        data = {
            success: false,
            error: "服务器返回异常。"
        };

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "请求失败。"
        );

    }


    return data;

}


/* =========================================================
   GO TO PERSONAL WORLD
========================================================= */

function goToYonder(username) {

    if (!username) {

        return;

    }

    const next = new URLSearchParams(window.location.search).get("next");
    if (next && next.charAt(0) === "/" && next.charAt(1) !== "/") {
        window.location.href = next;
        return;
    }

    window.location.href =
        "/@" +
        encodeURIComponent(username);

}


/* =========================================================
   REGISTER / LOGIN
========================================================= */

authForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        formError.textContent = "";


        const username =
            usernameInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        /* =====================================================
           REGISTER
        ===================================================== */

        if (mode === "register") {

            const displayName =
                displayNameInput.value
                    .trim();

            const inviteCode =
                inviteCodeInput.value
                    .trim();


            const confirmPassword =
                confirmPasswordInput.value;


            if (
                !/^[a-z0-9_-]{3,20}$/.test(
                    username
                )
            ) {

                formError.textContent =
                    "账号格式不正确。";

                return;

            }


            if (password.length < 8) {

                formError.textContent =
                    "密码至少需要 8 位。";

                return;

            }


            if (
                password !==
                confirmPassword
            ) {

                formError.textContent =
                    "两次密码不一致。";

                return;

            }


            try {

                submitButton.disabled =
                    true;

                submitButton.textContent =
                    "创建中…";


                const result =
                    await api(
                        "/api/register",
                        {
                            method: "POST",

                            body:
                                JSON.stringify({
                                    username,
                                    password,
                                    display_name:
                                        displayName,
                                    invite_code:
                                        inviteCode
                                })
                        }
                    );


                if (
                    result.success &&
                    result.user
                ) {

                    if (result.token) localStorage.setItem("hyool_token", result.token);

                    goToYonder(
                        result.user.username
                    );

                    return;

                }


                if (
                    result.success
                ) {

                    goToYonder(
                        username
                    );

                    return;

                }


                throw new Error(
                    result.error ||
                    "注册失败。"
                );

            }

            catch (error) {

                formError.textContent =
                    error.message;

            }

            finally {

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "创建彼岸";

            }


            return;

        }


        /* =====================================================
           LOGIN
        ===================================================== */

        try {

            submitButton.disabled =
                true;

            submitButton.textContent =
                "进入中…";


            const result =
                await api(
                    "/api/login",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );


            if (
                result.success &&
                result.user
            ) {

                if (result.token) localStorage.setItem("hyool_token", result.token);

                goToYonder(
                    result.user.username
                );

                return;

            }


            throw new Error(
                result.error ||
                "登录失败。"
            );

        }

        catch (error) {

            formError.textContent =
                error.message;

        }

        finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "登录";

        }

    }
);


/* =========================================================
   LOAD CURRENT USER
========================================================= */

async function loadCurrentUser() {

    try {

        const result =
            await api(
                "/api/me",
                {
                    method: "GET"
                }
            );


        if (
            result.authenticated &&
            result.user &&
            result.user.username
        ) {

            goToYonder(
                result.user.username
            );

            return true;

        }


        return false;

    }

    catch (error) {

        console.error(
            "LOAD USER ERROR:",
            error
        );

        return false;

    }

}
