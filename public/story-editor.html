<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>作品编辑器 · 幻想世界 · HYOOL</title>
<link rel="stylesheet" href="/workspace/css/workspace.css">
<style>
/* =========================================================
   作品编辑器 · 专用样式（沿用 workspace.css 变量与组件语言）
   ========================================================= */
/* 文本输入 */
input.txt, textarea.txt{width:100%;min-width:0;background:var(--bg3);border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;line-height:1.6}
input.txt:focus, textarea.txt:focus{outline:none;border-color:var(--accent)}
textarea.txt{min-height:120px;resize:vertical}

/* ---------- 视图1：作品库（三步向导） ---------- */
.wizard-steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.wizard-step{font-size:12px;color:var(--muted);padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:#12121c}
.wizard-step.on{color:var(--accent2);border-color:rgba(95,200,255,.45);background:rgba(95,200,255,.08)}
.new-story{display:flex;gap:10px;flex-wrap:wrap;flex-direction:column}
.new-story .txt{width:100%;max-width:520px}
.orient-pick{display:flex;gap:10px;flex-wrap:wrap}
.orient-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:#171726;
  border:1px solid var(--line2);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;
  color:var(--text);transition:.15s;font-size:14px;font-weight:600;line-height:1.4;min-width:140px;flex:1 1 160px}
.orient-card span{font-size:11px;font-weight:400;color:var(--muted)}
.orient-card:hover{border-color:var(--accent)}
.orient-card.active{border-color:var(--accent);background:rgba(139,123,255,.14)}
.orient-card.kind-card{min-height:78px}
.create-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.create-actions .btn.primary{min-width:140px;padding:12px 18px;font-size:14px}
.more-kinds{margin-top:4px}
.more-kinds summary{cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
.more-kinds .orient-pick{margin-top:8px}
.orient-row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.orient-row .mini-btn{visibility:visible}
.mini-btn.active{border-color:var(--accent);background:rgba(139,123,255,.18);color:var(--accent)}
.orient-row-label{margin-left:auto;font-size:10.5px;color:var(--muted)}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.story-card{background:linear-gradient(180deg,#12121c,#0d0d16);border:1px solid var(--line2);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:.18s}
.story-card:hover{border-color:rgba(139,123,255,.5)}
.story-card .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-card .m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.story-badge{font-size:10px;letter-spacing:.05em;background:rgba(139,123,255,.12);color:#a9a2ff;border:1px solid rgba(139,123,255,.35);padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.story-badge.pub{background:rgba(64,200,140,.12);color:#5fd9a8;border-color:rgba(64,200,140,.4)}
.story-card .ops .btn{padding:7px 4px;font-size:12px;white-space:nowrap}
.story-card .ops .btn.pub{color:#5fd9a8;border-color:rgba(64,200,140,.45)}
.story-card .ops .btn.pub:hover{background:rgba(64,200,140,.12)}
.story-card .ops{display:flex;gap:8px;margin-top:auto}
.story-card .ops .btn{flex:1}

/* ---------- 视图2：HYOOL Studio 五区骨架 ---------- */
.editor-wrap{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.studio-shell{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.studio-row{flex:1 1 auto;display:flex;min-height:0}
.studio-left{flex:0 0 248px;max-width:38vw;display:flex;min-height:0;border-right:1px solid var(--line);background:var(--bg2)}
.res-tree{flex:0 0 52px;display:flex;flex-direction:column;gap:4px;padding:8px 6px;border-right:1px solid var(--line);background:#0c0c14}
.res-tree button{width:40px;height:40px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);
  font-size:17px;cursor:pointer;font-family:inherit;transition:.15s;line-height:1}
.res-tree button:hover{border-color:var(--line2);color:var(--text);background:#151522}
.res-tree button.on{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.14);color:#cfc8ff}
.res-tree button span{display:block;font-size:8px;letter-spacing:.02em;margin-top:2px}
.res-panel{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.res-panel h3{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase}
.studio-center{flex:1 1 auto;min-width:0;display:flex;min-height:0}
.studio-props{flex:0 0 268px;max-width:34vw;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:rgba(8,8,14,.92)}
.studio-props-head{flex:0 0 auto;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.studio-props-body{flex:1 1 auto;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.prop-empty{color:var(--muted);font-size:12px;line-height:1.8;text-align:center;padding:24px 8px}
.prop-field .field{margin-bottom:10px}
.prop-field label{font-size:11px;color:var(--muted)}
.prop-preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px}
.prop-preview img,.prop-preview video{display:block;width:100%;max-height:180px;object-fit:cover}
.studio-timeline{flex:0 0 auto;max-height:min(42vh,320px);display:flex;flex-direction:column;border-top:1px solid var(--line);background:#0a0a12}
.studio-timeline.collapsed{max-height:36px;overflow:hidden}
.tl-dock-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.tl-dock-head .tl-dock-title{font-weight:700;color:var(--text);letter-spacing:.06em}
.tl-dock-body{flex:1 1 auto;overflow:auto;padding:8px 12px 10px}
.studio-topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.studio-topbar .studio-kind{font-size:10px;letter-spacing:.08em;padding:4px 10px;border-radius:99px;border:1px solid rgba(139,123,255,.4);
  background:rgba(139,123,255,.12);color:#b8b0ff;white-space:nowrap}
.studio-topbar .studio-title{min-width:120px;max-width:280px}
.studio-topbar .save-dot{font-size:11px;color:var(--muted);white-space:nowrap}
.studio-topbar .save-dot.ok{color:#5fd9a8}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.asset-card{position:relative;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#12121c;cursor:pointer;aspect-ratio:1}
.asset-card:hover{border-color:var(--accent2)}
.asset-card img,.asset-card video{width:100%;height:100%;object-fit:cover;display:block}
.asset-card .asset-audio{display:flex;align-items:center;justify-content:center;height:100%;font-size:22px;background:#151522}
.asset-card .asset-name{position:absolute;left:0;right:0;bottom:0;font-size:9px;padding:3px 5px;background:rgba(0,0,0,.72);color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-card.sel{outline:2px solid var(--accent2)}
.asset-upload{border:1px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer}
.asset-upload:hover{border-color:var(--accent2);color:var(--accent2)}
.asset-filters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.asset-filters .btn.tiny{padding:4px 10px}
.asset-filters .btn.tiny.on{border-color:var(--accent2);color:var(--accent2)}
.world-loc{border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:8px;background:#12121c}
.comic-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.comic-grid{display:grid;gap:8px;max-width:720px;margin:0 auto}
.comic-panel{position:relative;border:2px solid var(--line2);border-radius:10px;min-height:120px;background:#0d0d16;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.comic-panel:hover{border-color:rgba(139,123,255,.45)}
.comic-panel.sel{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(95,200,255,.35)}
.comic-panel .cp-media{flex:1 1 auto;min-height:80px;display:flex;align-items:center;justify-content:center;background:#000}
.comic-panel .cp-media img,.comic-panel .cp-media video{max-width:100%;max-height:220px;object-fit:contain}
.comic-panel .cp-cap{flex:0 0 auto;font-size:11px;padding:6px 8px;color:#cfcfe8;line-height:1.5}
.comic-panel .cp-cap.style-bar{border-top:1px solid var(--line);background:rgba(8,8,14,.92)}
.comic-panel .cp-cap.style-bubble{margin:6px 8px 8px;border-radius:14px;border:1px solid rgba(180,160,255,.45);background:rgba(22,18,38,.92);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.comic-panel .cp-cap.style-narration{position:absolute;left:8px;top:28px;max-width:72%;padding:4px 8px;font-size:10px;font-style:italic;color:#d8d0ff;background:rgba(0,0,0,.45);border-radius:6px;border:none;z-index:2}
.comic-panel .cp-cap .cp-speaker{font-size:10px;font-weight:700;color:var(--accent2);margin-bottom:2px}
.comic-panel .cp-idx{position:absolute;top:6px;left:8px;font-size:10px;color:var(--muted);background:rgba(0,0,0,.55);padding:2px 6px;border-radius:99px;z-index:2}
.comic-panel .cp-upload-label{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:80px;width:100%;cursor:pointer;text-align:center;padding:12px;color:var(--muted);font-size:12px;border-radius:8px}
.comic-panel .cp-upload-label:hover{color:var(--accent2);background:rgba(95,200,255,.08)}
.comic-panel .cp-upload-label input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}
.comic-panel .cp-upload-label.cp-change{position:absolute;right:8px;bottom:8px;z-index:3;min-height:0;width:auto;inset:auto 8px 8px auto;padding:5px 12px;font-size:11px;border-radius:99px;background:rgba(0,0,0,.72);border:1px solid var(--line2);color:#e8e8f0}
.comic-panel .cp-upload-label.cp-change:hover{color:var(--accent2);border-color:var(--accent2)}
.editor-login-banner{padding:10px 16px;font-size:12.5px;line-height:1.6;color:#ece6ff;background:linear-gradient(90deg,rgba(80,50,160,.45),rgba(40,80,140,.35));border-bottom:1px solid rgba(139,123,255,.35);text-align:center}
.editor-login-banner a{color:#9fd4ff;font-weight:600}
.bm-ops .cp-upload-label.btn-file{display:inline-flex;align-items:center;justify-content:center;min-height:0;width:auto;inset:auto;position:relative;padding:6px 12px;font-size:12px;border:1px solid var(--line2);border-radius:8px;background:#151522;color:var(--text)}
.bm-ops .cp-upload-label.btn-file input[type=file]{position:absolute;inset:0}
.comic-panel.drag-over{border-color:var(--accent2);background:rgba(95,200,255,.06)}
.comic-panel .cp-media .cp-upload-hint{position:absolute;bottom:6px;right:8px;font-size:10px;color:var(--muted);pointer-events:none}
.comic-style-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.comic-style-row .btn.tiny.on{border-color:var(--accent2);color:var(--accent2)}
.play-comic-bubble{position:absolute;max-width:78%;padding:12px 14px;border-radius:18px;border:2px solid rgba(200,180,255,.55);
  background:rgba(18,14,32,.88);box-shadow:0 8px 28px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;text-align:left}
.play-comic-bubble .pcb-speaker{font-size:clamp(14px,2.2vw,18px);font-weight:700;color:var(--accent2);margin-bottom:4px}
.play-comic-bubble .pcb-line{font-size:clamp(14px,2.2vw,18px);line-height:1.7;color:#ece8ff;white-space:pre-wrap;word-break:break-word}
.play-comic-narration{position:absolute;max-width:70%;padding:6px 10px;font-size:clamp(13px,2vw,16px);font-style:italic;line-height:1.6;
  color:#e0d8ff;text-shadow:0 1px 8px rgba(0,0,0,.85);transform:translate(-50%,-50%);pointer-events:auto;cursor:grab;white-space:pre-wrap}
.play-comic-bubble.dragging,.play-comic-narration.dragging{cursor:grabbing;opacity:.92}
.card-frame-asset{position:relative}
.card-frame-asset .card-frame-img,.bt-portrait.card-frame-asset .card-frame-img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;object-fit:fill;z-index:3}
.card-frame-asset .card-art{position:relative;z-index:1}
.block.sel{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(95,200,255,.35)}
.tl-visual{background:rgba(120,200,255,.2);border:1px solid rgba(120,200,255,.55);color:#c8e8ff}
.tl-dialogue{background:rgba(180,140,255,.22);border:1px solid rgba(180,140,255,.55);color:#e8d8ff}
.tl-subtitle{background:rgba(200,200,220,.15);border:1px solid rgba(200,200,220,.45);color:#d8d8e8;border-style:dashed}
.editor-side{flex:0 0 240px;max-width:36vw;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg2)}
.editor-side .side-scroll{flex:1 1 auto;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:16px}
.editor-side h3{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase}
.editor-side details.settings-fold{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#101018}
.editor-side details.settings-fold>summary{cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.editor-stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0;
  background:
    radial-gradient(1200px 600px at 20% 0%,rgba(139,123,255,.06),transparent 60%),
    radial-gradient(900px 500px at 90% 100%,rgba(95,200,255,.05),transparent 60%),
    var(--bg)}
.stage-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:rgba(5,5,10,.65)}
.stage-head .ch-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-head .ch-count{font-size:11px;color:var(--muted)}
.stage-work{flex:1 1 auto;min-height:0;display:flex}
.stage-timeline{flex:1 1 46%;min-width:0;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line)}
.stage-scroll{flex:1 1 auto;overflow-y:auto;padding:14px 16px 6px;display:flex;flex-direction:column;gap:10px}
.add-chip-bar{flex:0 0 auto;display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 16px;border-top:1px solid var(--line);
  background:rgba(8,8,14,.85)}
/* 本幕舞台（所见即所得，对标 VN 可视化最小可用） */
.stage-pane{flex:1 1 54%;min-width:240px;display:flex;flex-direction:column;min-height:0;background:#08080f}
.stage-pane-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--line);font-size:12px;color:var(--text)}
.stage-pane-head .sp-title{font-weight:600;letter-spacing:.06em}
.stage-pane-head .sp-hint{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42%}
.stage-canvas-host{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
.stage-canvas{position:relative;background:#000;overflow:hidden;border:1px solid var(--line2);border-radius:12px;
  width:min(100%,720px);aspect-ratio:16/9;max-height:100%;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.stage-canvas.portrait{width:auto;height:min(100%,560px);aspect-ratio:9/16;max-width:100%}
.stage-canvas .sc-bg{position:absolute;inset:0;z-index:1;background:#0a0a12}
.stage-canvas .sc-bg img,.stage-canvas .sc-bg video{width:100%;height:100%;object-fit:cover;display:block}
.stage-canvas .sc-figure{position:absolute;z-index:3;transform:translate(-50%,-100%);cursor:grab;touch-action:none;
  user-select:none;max-height:72%;outline:2px solid transparent;border-radius:4px}
.stage-canvas .sc-figure.sel{outline-color:rgba(95,200,255,.65)}
.stage-canvas .sc-figure.dragging{cursor:grabbing;z-index:6}
.stage-canvas .sc-figure img{display:block;height:auto;width:auto;max-height:min(52vh,420px);max-width:min(48vw,280px);
  pointer-events:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
.stage-canvas .sc-scene-text{position:absolute;z-index:4;max-width:86%;text-align:center;line-height:1.7;color:#fff;
  white-space:pre-wrap;word-break:break-word;text-shadow:0 2px 10px rgba(0,0,0,.9);cursor:grab;touch-action:none;
  font-size:clamp(14px,2.2vw,20px);padding:4px 8px}
.stage-canvas .sc-scene-text.placeholder{opacity:.45;font-style:italic}
.stage-canvas .sc-scene-text.dragging{cursor:grabbing}
.stage-canvas .sc-scene-text.editing,.stage-canvas .sc-dlg .editing,.stage-canvas .sc-choice .editing{
  cursor:text;outline:1px solid rgba(95,200,255,.7);background:rgba(0,0,0,.35);border-radius:6px}
.stage-canvas .sc-dlg{position:absolute;left:0;right:0;bottom:0;z-index:5;text-align:left;
  background:linear-gradient(180deg,rgba(16,16,32,.86),rgba(7,7,16,.94));
  border-top:1px solid rgba(255,255,255,.14);border-radius:12px 12px 0 0;padding:10px 14px 14px}
.stage-canvas .sc-dlg .pd-speaker{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px;letter-spacing:.06em;cursor:text}
.stage-canvas .sc-dlg .pd-line{font-size:13px;line-height:1.65;color:#e8e8f0;white-space:pre-wrap;word-break:break-word;cursor:text}
.stage-trans{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.stage-trans select{font-size:11px;background:#151522;color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:3px 6px}
.stage-canvas .sc-choice{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  background:linear-gradient(180deg,rgba(16,16,32,.88),rgba(7,7,16,.96));
  border-top:1px solid rgba(125,211,168,.28);border-radius:12px 12px 0 0;padding:10px 12px 12px}
.stage-canvas .sc-choice .pc-prompt{font-size:13px;line-height:1.55;color:#e8e8f0;margin-bottom:8px;white-space:pre-wrap}
.stage-canvas .sc-choice .pc-opt{display:block;border:1px solid rgba(125,211,168,.35);background:rgba(20,36,28,.75);
  color:#e8f5ee;border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:6px}
.stage-canvas .sc-empty{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12.5px;text-align:center;padding:20px;line-height:1.7;pointer-events:none}
.block.selected{border-color:rgba(95,200,255,.7);box-shadow:0 0 0 1px rgba(95,200,255,.28),0 8px 24px rgba(0,0,0,.25)}
.add-chip{border:1px solid var(--line2);background:#151522;color:var(--text);border-radius:999px;padding:8px 14px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s}
.add-chip:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(95,200,255,.08)}
.add-chip.primary{border-color:rgba(139,123,255,.55);background:rgba(139,123,255,.14);color:#c8c0ff}

/* 时间线积木 */
.block{display:grid;grid-template-columns:28px 56px 1fr auto;gap:10px 12px;align-items:start;
  border:1px solid var(--line2);border-radius:14px;background:#12121c;padding:12px 12px 12px 8px;
  transition:.15s;animation:blockIn .18s ease;position:relative}
.block:hover{border-color:rgba(139,123,255,.5)}
.block.drag-over{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(95,200,255,.35)}
.block.dragging{opacity:.45}
.block.scene{border-left:3px solid var(--accent2)}
.block.dialogue{border-left:3px solid var(--accent)}
.block.choice{border-left:3px solid #7dd3a8}
.block.perf{border-left:3px solid #e8c56a}
.block.battle,.block.rogue{border-left:3px solid #e8a45c}
.block-handle{grid-row:1 / span 3;align-self:stretch;display:flex;align-items:center;justify-content:center;
  cursor:grab;color:#6a6a7c;font-size:14px;user-select:none;border-radius:8px}
.block-handle:active{cursor:grabbing}
.block-handle:hover{background:rgba(255,255,255,.04);color:var(--accent2)}
.block-tag{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.block-tag .bt-label{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.block-tag .bt-idx{font-size:11px;color:#6a6a7c;font-variant-numeric:tabular-nums}
.block-tag .bt-speaker{font-size:12px;font-weight:700;color:var(--accent);line-height:1.3;
  overflow:hidden;max-width:56px;word-break:break-all;text-align:center}
.block-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.block-text{font-size:13.5px;color:#e8e8f0;line-height:1.7;white-space:pre-wrap;word-break:break-word;cursor:pointer;border-radius:8px;padding:4px 6px;margin:-4px -6px}
.block-text:hover{background:rgba(255,255,255,.04)}
.block-text.empty{color:#7a7a8c;font-style:italic}
.block.dialogue .block-text{color:#d9d9e6}
.block-inline{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.block-inline .txt{font-size:13px}
.block-inline-actions{display:flex;gap:8px;flex-wrap:wrap}
.block-ops{display:flex;flex-direction:column;gap:5px;justify-content:flex-start}
.block-ops .btn{text-align:center}
.block-ops .btn.move-fallback{opacity:.55;font-size:11px;padding:4px 6px}
.block-media,.block-audio{grid-column:2 / -1}

/* 积木上的视觉素材（画面） */
.block-media{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.media-add{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px dashed var(--line2);
  background:rgba(139,123,255,.04);color:var(--muted);border-radius:10px;padding:9px 12px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;width:100%;justify-content:center}
.media-add:hover{color:var(--accent2);border-color:var(--accent2);background:rgba(95,200,255,.06)}
.media-add:disabled{opacity:.6;cursor:wait}
.bm-preview{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.bm-preview img{display:block;width:100%;max-height:260px;object-fit:cover}
.bm-preview video{display:block;width:100%;max-height:260px;background:#000}
.bm-preview .bm-type{position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:.08em;
  background:rgba(0,0,0,.6);color:#cfcfe8;padding:2px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.12)}
.bm-ops{display:flex;gap:8px;flex-wrap:wrap}

/* 积木上的配音 */
.block-audio{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.ba-preview{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#101018}
.ba-preview audio{display:block;width:100%;height:36px}
.add-block{flex:0 0 auto;border:1px dashed var(--line2);background:transparent;color:var(--muted);
  border-radius:12px;padding:15px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;width:100%}
.add-block:hover{color:var(--accent2);border-color:var(--accent2);background:rgba(95,200,255,.05)}
.block-empty{text-align:center;color:var(--muted);padding:36px 12px;line-height:2;font-size:12.5px}

/* 章节列表 */
.ch-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg3);margin-bottom:6px;font-size:12.5px;cursor:pointer;transition:.15s;color:var(--text)}
.ch-item:hover{border-color:var(--line2)}
.ch-item.active{border-color:var(--accent);background:rgba(139,123,255,.12)}
.ch-item .ch-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-item .mini-btn{visibility:hidden}
.ch-item:hover .mini-btn{visibility:visible}
.ch-item .mini-btn.danger{color:var(--bad)}
.ch-item .mini-btn.danger:hover{border-color:var(--bad)}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.modal-card{width:100%;max-width:480px;max-height:84vh;overflow-y:auto;background:#14141f;
  border:1px solid var(--line2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 16px 50px rgba(0,0,0,.55)}
.modal-title{font-size:15px;font-weight:700}
.modal-body{display:flex;flex-direction:column;gap:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.pick-row{display:flex;gap:10px}
.pick-block{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#171726;
  border:1px solid var(--line2);border-radius:12px;padding:18px 12px;cursor:pointer;font-family:inherit;
  color:var(--text);transition:.15s}
.pick-block:hover{border-color:var(--accent);background:#1e1e30}
.pick-block .pb-icon{font-size:24px}
.pick-block .pb-name{font-size:13px;font-weight:600}
.pick-block .pb-desc{font-size:11px;color:var(--muted)}

/* 播放 */
.play-overlay{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  background:
    radial-gradient(1100px 600px at 50% 0%,rgba(139,123,255,.10),transparent 60%),
    var(--bg)}
.play-head{flex:0 0 auto;position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 22px;
  border-bottom:1px solid var(--line);background:rgba(5,5,10,.7)}
.play-head .ph-progress{font-size:12px;color:var(--accent2);font-variant-numeric:tabular-nums}
.play-head .ph-chapter{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-head .ph-vars{font-size:11px;color:#9decc0;font-variant-numeric:tabular-nums;max-width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-head .spacer{flex:1 1 auto}
.play-head .ph-save-btns{display:flex;gap:6px;flex-wrap:wrap}
/* 分支图（对标 Tuesday/Kinexus 故事地图，列表非节点画布） */
.map-overlay{position:fixed;inset:0;z-index:88;display:flex;flex-direction:column;
  background:radial-gradient(900px 500px at 20% 0%,rgba(125,211,168,.08),transparent 55%),var(--bg)}
.map-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 22px;
  border-bottom:1px solid var(--line);background:rgba(5,5,10,.75)}
.map-head .mh-title{font-size:14px;font-weight:600}
.map-head .mh-stats{font-size:11px;color:var(--muted)}
.map-head .spacer{flex:1}
.map-body{flex:1;overflow:auto;padding:16px 18px 28px;display:flex;flex-direction:column;gap:10px}
.map-ch{font-size:11px;letter-spacing:.08em;color:var(--accent2);margin:8px 0 4px;text-transform:uppercase}
.map-node{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:start;
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(16,16,28,.7);cursor:pointer}
.map-node:hover{border-color:rgba(139,123,255,.45)}
.map-node.orphan{border-color:rgba(232,120,120,.45);background:rgba(40,16,16,.45)}
.map-node.dead{border-style:dashed}
.map-node .mn-badge{font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.map-node .mn-badge.start{color:#9decc0;border-color:rgba(125,211,168,.4)}
.map-node .mn-badge.dead{color:#e8c56a;border-color:rgba(232,197,106,.4)}
.map-node .mn-badge.orphan{color:#f0a0a0;border-color:rgba(232,120,120,.4)}
.map-node .mn-badge.choice{color:#a8c8ff;border-color:rgba(139,123,255,.4)}
.map-node .mn-title{font-size:13px;font-weight:600;line-height:1.4}
.map-node .mn-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;word-break:break-word}
.map-node .mn-edges{font-size:11px;color:#9decc0;margin-top:6px;line-height:1.6}
.map-node .mn-visit{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace}
.block.flash{outline:2px solid var(--accent2);box-shadow:0 0 0 4px rgba(139,123,255,.25)}
.play-body{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto}
/* 播放对白框 = 底部「聊天框」：全宽贴底、半透明深色底、文字左对齐；字号/文字颜色可自定义 */
.play-dialogue{position:absolute;left:0;right:0;bottom:0;text-align:left;cursor:pointer;pointer-events:auto;
  background:linear-gradient(180deg,rgba(16,16,32,.86),rgba(7,7,16,.94));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.14);border-radius:14px 14px 0 0;
  padding:14px 22px 20px;box-shadow:0 -14px 42px rgba(0,0,0,.5)}
.play-dialogue .pd-speaker{font-size:clamp(18px,3vw,26px);font-weight:700;color:var(--accent);
  margin-bottom:4px;letter-spacing:.08em}
.play-dialogue .pd-line{font-size:clamp(15px,2.4vw,19px);line-height:1.8;color:#e8e8f0;white-space:pre-wrap;word-break:break-word}
.play-dialogue .pd-live{font-size:11px;color:var(--accent2);margin-top:6px;opacity:.85}
.play-dialogue.play-perf{border-top-color:rgba(232,197,106,.35)}
/* 播放：选项幕（互动分支）—— 底部提示 + 可点选项，点选后跳转 */
.play-choice{position:absolute;left:0;right:0;bottom:0;text-align:left;pointer-events:auto;
  background:linear-gradient(180deg,rgba(16,16,32,.88),rgba(7,7,16,.96));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid rgba(125,211,168,.28);border-radius:14px 14px 0 0;
  padding:14px 18px 18px;box-shadow:0 -14px 42px rgba(0,0,0,.5)}
.play-choice .pc-prompt{font-size:clamp(15px,2.4vw,18px);line-height:1.7;color:#e8e8f0;margin-bottom:10px;white-space:pre-wrap}
.play-choice .pc-opts{display:flex;flex-direction:column;gap:8px}
.play-choice .pc-opt{display:block;width:100%;text-align:left;border:1px solid rgba(125,211,168,.4);
  background:rgba(20,36,28,.85);color:#e8f5ee;border-radius:10px;padding:12px 14px;
  font-size:clamp(14px,2.2vw,16px);line-height:1.5;cursor:pointer;transition:.15s}
.play-choice .pc-opt:hover,.play-choice .pc-opt:focus{border-color:#7dd3a8;background:rgba(36,64,48,.95);outline:none}
.play-choice .pc-opt:active{transform:scale(.99)}

/* 播放：画幅容器 + 视觉素材背景 + 前景文字 */
/* 画幅容器：横屏铺满播放区；竖屏（9:16）时按比例居中收窄，两侧留黑，不再全屏拉伸裁剪 */
.play-frame{position:absolute;inset:0;margin:auto;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;animation:playFadeIn .32s ease both}
.play-frame.tl-none{animation:none}
.play-frame.tl-fadeblack{animation:playFadeBlack .55s ease both}
.play-frame .play-fore{pointer-events:auto}
/* 转场：切幕交叉淡化 —— 新画幅每次重建渐入；旧画幅标记 tl-leave 淡出后由 JS 延迟移除。
   两层叠加（新画幅在后即在顶层）交叉淡化，避免清空重建瞬间露出黑色画底 */
@keyframes playFadeIn{from{opacity:0}to{opacity:1}}
@keyframes playFadeOut{from{opacity:1}to{opacity:0}}
@keyframes playFadeBlack{0%{opacity:0;filter:brightness(0)}45%{opacity:1;filter:brightness(0)}100%{opacity:1;filter:brightness(1)}}
.play-frame.tl-leave{animation:playFadeOut .18s ease both;pointer-events:none}
.play-frame.tl-leave .play-fore{pointer-events:none}
.play-media-bg{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;background:#000}
.play-media-bg img,.play-media-bg video{width:100%;height:100%;object-fit:cover;display:block}
.play-fore{position:relative;z-index:2;max-width:680px;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer}
.play-overlay.has-media .play-fore{background:rgba(8,8,16,.55);border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:30px 34px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 18px 50px rgba(0,0,0,.5);transition:.15s}
.play-overlay.has-media .play-fore:hover{background:rgba(8,8,16,.68);border-color:rgba(139,123,255,.55)}
/* 播放：场景幕 —— 前景退化为全屏透明点击区：无场景文字卡片、无「点击文字进入下一条」提示、
   有媒体时不套玻璃卡片（近乎透明）；点击区域=整个画幅；场景文字（.play-scene-text）单独渲染在 frame 上层可拖拽 */
.play-overlay .play-frame .play-fore.scene-sub-mode{position:absolute;inset:0;max-width:none;width:auto;margin:0}
.play-overlay.has-media .play-fore.scene-sub-mode,
.play-overlay.has-media .play-fore.scene-sub-mode:hover{background:transparent;border-color:transparent;padding:0;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.play-nav{flex:0 0 auto;position:relative;z-index:3;display:flex;align-items:center;gap:14px;justify-content:center;
  padding:14px 22px;border-top:1px solid var(--line);background:rgba(5,5,10,.7)}
.play-nav .pn-count{font-size:12px;color:var(--muted);min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
/* 播放：对白框 = 底部聊天框（全宽贴底、无位置选项）；字号全局统一（内联 25~30px）；场景文字纯文字（无框）可拖拽 */
/* 对白幕：fore 全屏透明点击层（任意处点击推进），聊天框自带半透明深色底 */
.play-overlay .play-frame .play-fore.dlg-fore{position:absolute;inset:0;max-width:none;width:auto;margin:0}
.play-overlay.has-media .play-fore.dlg-fore,
.play-overlay.has-media .play-fore.dlg-fore:hover{background:transparent;border-color:transparent;padding:0;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.play-scene-text{position:absolute;z-index:4;max-width:640px;text-align:center;line-height:1.9;color:#fff;
  white-space:pre-wrap;word-break:break-word;text-shadow:0 2px 10px rgba(0,0,0,.9);cursor:grab;pointer-events:auto;
  touch-action:none;font-size:27px}
.play-figure{position:absolute;z-index:3;transform:translate(-50%,-100%);pointer-events:none;max-height:78%}
.play-figure img{display:block;height:auto;width:auto;max-height:78%;max-width:55vw;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.55))}
.play-scene-text.dragging{cursor:grabbing}
/* 播放：竖屏（9:16）适配 —— 画幅比例由 renderPlay 按播放区尺寸精确计算（JS 设 style），
   两侧留黑居中，不再全屏拉伸裁剪；前景/字幕收窄贴合手机画幅 */
.play-overlay.orient-portrait #playBody{background:#000;padding:0}
.play-overlay.orient-portrait .play-fore{max-width:460px}
.play-overlay.orient-portrait .play-scene-text{max-width:420px}

  /* BGM 弹窗：音量行 */
  .bgm-vol{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .bgm-vol input[type=range]{flex:1;accent-color:var(--accent)}

  /* 角色声音表 */
  .cast-tip{font-size:11.5px;color:var(--muted);line-height:1.7;border:1px dashed var(--line2);border-radius:8px;padding:8px 10px}
  .cast-empty{color:var(--muted);text-align:center;padding:20px;font-size:12.5px}
  .cast-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:10px}
  .cast-name{flex:0 0 90px;font-weight:600;color:var(--text)}
  .cast-kind{flex:0 0 110px}
  .cast-conf{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:8px}
  .cast-conf .bgm-vol{min-width:150px;flex:1}

  /* 宽弹窗（三轨时间轴） */
  .modal-card.modal-wide{max-width:920px}

  /* 三轨时间轴 */
  .tl{display:flex;flex-direction:column;gap:10px}
  .tl-head{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .tl-time{font-variant-numeric:tabular-nums;min-width:58px}
  .tl-total{color:var(--muted)}
  .tl-board{position:relative;display:flex;flex-direction:column;gap:6px;background:#0d0d15;border:1px solid var(--line);border-radius:10px;padding:10px}
  .tl-playhead{position:absolute;top:6px;bottom:6px;left:0;width:1px;background:var(--accent2);z-index:5;pointer-events:none;box-shadow:0 0 6px rgba(95,200,255,.6)}
  .tl-playhead::after{content:"";position:absolute;top:-2px;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent2)}
  .tl-lane{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px}
  .tl-label{font-size:11px;color:var(--muted);text-align:right}
  .tl-track{position:relative;height:26px;background:#15151f;border-radius:6px;overflow:hidden}
  .tl-ruler-row .tl-track{height:20px;background:transparent}
  .tl-ruler{position:absolute;inset:0}
  .tl-tick{position:absolute;top:0;bottom:0;font-size:9px;color:var(--muted);border-left:1px solid var(--line2);padding-left:3px;line-height:1.4}
  .tl-clip{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:10px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer;user-select:none;min-width:10px}
  .tl-bgm{background:rgba(255,170,80,.22);border:1px solid rgba(255,170,80,.6);color:#ffd9a8}
  .tl-voice{background:rgba(139,123,255,.25);border:1px solid rgba(139,123,255,.6);color:#cfc8ff}
  .tl-voice.tl-est{border-style:dashed}
  .tl-sfx{background:rgba(95,200,255,.2);border:1px solid rgba(95,200,255,.55);color:#bfe9ff}
  .tl-sfx.loop{background:rgba(80,220,160,.2);border-color:rgba(80,220,160,.6);color:#c2f5de}
  .tl-sfx.sel{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
  .tl-clip-label{pointer-events:none;overflow:hidden;text-overflow:ellipsis}
  .tl-handle{position:absolute;right:0;top:0;bottom:0;width:8px;background:rgba(255,255,255,.35);cursor:ew-resize;border-radius:0 5px 5px 0}
  .tl-edit{border:1px dashed var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .tl-edit-empty{color:var(--muted);font-size:11.5px;line-height:1.7}
  .tl-edit-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
  .tl-edit-row .field{flex:0 0 170px}
  .tl-edit-row audio{height:32px;flex:1;min-width:180px}
  .tl-field-check{display:flex;align-items:center;gap:6px;flex-direction:row}
  .tl-field-check label{margin:0}
  .tl-field-check input{width:auto}

  /* 积木音效摘要 */
  .sfx-summary{font-size:11.5px;color:var(--muted);line-height:1.6;word-break:break-all}

  /* 卡牌RPG：作品库类型徽章 / 积木战斗摘要 / 配置弹窗 */
  .story-badge.kind{background:rgba(120,200,255,.16);color:#9fd8ff;border-color:rgba(120,200,255,.5)}
  .story-badge.kind.rpg{background:rgba(255,170,80,.18);color:#ffcf8a;border-color:rgba(255,170,80,.55)}
  .story-badge.kind.rogue{background:rgba(180,140,255,.18);color:#d4c2ff;border-color:rgba(180,140,255,.5)}
  .block.rogue{border-left:3px solid #c4a8ff}
  .block-sub{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .rpg-cfg-btns{display:flex;flex-direction:column;gap:6px}
  .rpg-cfg-btns .btn{margin-top:0}

  .studio-table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12.5px}
  .studio-table th,.studio-table td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle}
  .studio-table th{color:var(--muted);font-weight:600;background:#12121c;font-size:11px}
  .studio-table tr.dragging{opacity:.45}

<header class="topbar">

<!-- ============ 视图1：作品库（三步） ============ -->
<div class="hub" id="viewLibrary">

    </section>
