<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>作品编辑器 · 幻想世界 · HYOOL</title>
<link rel="stylesheet" href="/workspace/css/workspace.css">
<style>
/* =========================================================
   作品编辑器 · 专用样式（沿用 workspace.css 变量与组件语言）
   ========================================================= */
/* 文本输入 */
input.txt, textarea.txt{width:100%;min-width:0;background:var(--bg3);border:1px solid var(--line2);color:var(--text);
  border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;line-height:1.6}
input.txt:focus, textarea.txt:focus{outline:none;border-color:var(--accent)}
textarea.txt{min-height:120px;resize:vertical}

/* ---------- 视图1：作品库 ---------- */
.new-story{display:flex;gap:10px;flex-wrap:wrap}
.new-story .txt{flex:1 1 280px;width:auto}
/* 新建作品：分辨率选择卡（16:9 横屏 / 9:16 竖屏） */
.orient-pick{display:flex;gap:10px;flex:0 0 auto}
.orient-card{display:flex;flex-direction:column;align-items:center;gap:3px;background:#171726;
  border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:inherit;
  color:var(--text);transition:.15s;font-size:12.5px;font-weight:600;line-height:1.4}
.orient-card span{font-size:10.5px;font-weight:400;color:var(--muted)}
.orient-card:hover{border-color:var(--accent)}
.orient-card.active{border-color:var(--accent);background:rgba(139,123,255,.14)}
/* 编辑器侧边栏：方向 / 画质切换 */
.orient-row{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.orient-row .mini-btn{visibility:visible}
.mini-btn.active{border-color:var(--accent);background:rgba(139,123,255,.18);color:var(--accent)}
.orient-row-label{margin-left:auto;font-size:10.5px;color:var(--muted)}
.story-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.story-card{background:linear-gradient(180deg,#12121c,#0d0d16);border:1px solid var(--line2);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;transition:.18s}
.story-card:hover{border-color:rgba(139,123,255,.5)}
.story-card .t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-card .m{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.story-badge{font-size:10px;letter-spacing:.05em;background:rgba(139,123,255,.12);color:#a9a2ff;border:1px solid rgba(139,123,255,.35);padding:1px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.story-badge.pub{background:rgba(64,200,140,.12);color:#5fd9a8;border-color:rgba(64,200,140,.4)}
.story-card .ops .btn{padding:7px 4px;font-size:12px;white-space:nowrap}
.story-card .ops .btn.pub{color:#5fd9a8;border-color:rgba(64,200,140,.45)}
.story-card .ops .btn.pub:hover{background:rgba(64,200,140,.12)}
.story-card .ops{display:flex;gap:8px;margin-top:auto}
.story-card .ops .btn{flex:1}

/* ---------- 视图2：编辑器 ---------- */
.editor-wrap{flex:1 1 auto;display:flex;min-height:0}
.editor-side{flex:0 0 300px;max-width:40vw;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg2)}
.editor-side .side-scroll{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:20px}
.editor-side h3{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;font-weight:600}
.editor-stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;min-height:0;
  background:
    radial-gradient(1200px 600px at 20% 0%,rgba(139,123,255,.06),transparent 60%),
    radial-gradient(900px 500px at 90% 100%,rgba(95,200,255,.05),transparent 60%),
    var(--bg)}
.stage-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:rgba(5,5,10,.5)}
.stage-head .ch-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-head .ch-count{font-size:11px;color:var(--muted)}
.stage-scroll{flex:1 1 auto;overflow-y:auto;padding:16px 20px 6px;display:flex;flex-direction:column;gap:12px}

/* 剧情积木 */
.block{display:flex;flex-wrap:wrap;gap:12px;border:1px solid var(--line2);border-radius:12px;background:#12121c;
  padding:13px 14px;transition:.15s;animation:blockIn .18s ease}
.block:hover{border-color:rgba(139,123,255,.5)}
.block.scene{border-left:3px solid var(--accent2)}
.block.dialogue{border-left:3px solid var(--accent)}
.block-tag{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:3px}
.block-tag .bt-label{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.block-tag .bt-speaker{font-size:13px;font-weight:700;color:var(--accent);line-height:1.4;
  overflow:hidden;max-width:60px;word-break:break-all}
.block-main{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.block-text{font-size:13.5px;color:#e8e8f0;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.block-text.empty{color:#7a7a8c;font-style:italic}
.block.dialogue .block-text{color:#d9d9e6}
.block-ops{flex:0 0 auto;display:flex;flex-direction:column;gap:5px;justify-content:center}
.block-ops .btn{text-align:center}

/* 积木上的视觉素材（画面） */
.block-media{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.media-add{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px dashed var(--line2);
  background:rgba(139,123,255,.04);color:var(--muted);border-radius:10px;padding:9px 12px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:.15s;width:100%;justify-content:center}
.media-add:hover{color:var(--accent2);border-color:var(--accent2);background:rgba(95,200,255,.06)}
.media-add:disabled{opacity:.6;cursor:wait}
.bm-preview{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.bm-preview img{display:block;width:100%;max-height:260px;object-fit:cover}
.bm-preview video{display:block;width:100%;max-height:260px;background:#000}
.bm-preview .bm-type{position:absolute;top:8px;right:8px;font-size:10px;letter-spacing:.08em;
  background:rgba(0,0,0,.6);color:#cfcfe8;padding:2px 8px;border-radius:99px;border:1px solid rgba(255,255,255,.12)}
.bm-ops{display:flex;gap:8px;flex-wrap:wrap}

/* 积木上的配音 */
.block-audio{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:8px;padding-top:2px}
.ba-preview{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#101018}
.ba-preview audio{display:block;width:100%;height:36px}
.add-block{flex:0 0 auto;border:1px dashed var(--line2);background:transparent;color:var(--muted);
  border-radius:12px;padding:15px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;width:100%}
.add-block:hover{color:var(--accent2);border-color:var(--accent2);background:rgba(95,200,255,.05)}
.block-empty{text-align:center;color:var(--muted);padding:36px 12px;line-height:2;font-size:12.5px}

/* 章节列表 */
.ch-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg3);margin-bottom:6px;font-size:12.5px;cursor:pointer;transition:.15s;color:var(--text)}
.ch-item:hover{border-color:var(--line2)}
.ch-item.active{border-color:var(--accent);background:rgba(139,123,255,.12)}
.ch-item .ch-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-item .mini-btn{visibility:hidden}
.ch-item:hover .mini-btn{visibility:visible}
.ch-item .mini-btn.danger{color:var(--bad)}
.ch-item .mini-btn.danger:hover{border-color:var(--bad)}

/* 弹窗 */
.modal{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.modal-card{width:100%;max-width:480px;max-height:84vh;overflow-y:auto;background:#14141f;
  border:1px solid var(--line2);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 16px 50px rgba(0,0,0,.55)}
.modal-title{font-size:15px;font-weight:700}
.modal-body{display:flex;flex-direction:column;gap:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.pick-row{display:flex;gap:10px}
.pick-block{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;background:#171726;
  border:1px solid var(--line2);border-radius:12px;padding:18px 12px;cursor:pointer;font-family:inherit;
  color:var(--text);transition:.15s}
.pick-block:hover{border-color:var(--accent);background:#1e1e30}
.pick-block .pb-icon{font-size:24px}
.pick-block .pb-name{font-size:13px;font-weight:600}
.pick-block .pb-desc{font-size:11px;color:var(--muted)}

/* 播放 */
.play-overlay{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
  background:
    radial-gradient(1100px 600px at 50% 0%,rgba(139,123,255,.10),transparent 60%),
    var(--bg)}
.play-head{flex:0 0 auto;position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 22px;
  border-bottom:1px solid var(--line);background:rgba(5,5,10,.7)}
.play-head .ph-progress{font-size:12px;color:var(--accent2);font-variant-numeric:tabular-nums}
.play-head .ph-chapter{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.play-head .spacer{flex:1 1 auto}
.play-body{position:relative;z-index:2;flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto}
/* 播放对白框 = 底部「聊天框」：全宽贴底、半透明深色底、文字左对齐；字号/文字颜色可自定义 */
.play-dialogue{position:absolute;left:0;right:0;bottom:0;text-align:left;cursor:pointer;pointer-events:auto;
  background:linear-gradient(180deg,rgba(16,16,32,.86),rgba(7,7,16,.94));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.14);border-radius:14px 14px 0 0;
  padding:14px 22px 20px;box-shadow:0 -14px 42px rgba(0,0,0,.5)}
.play-dialogue .pd-speaker{font-size:clamp(18px,3vw,26px);font-weight:700;color:var(--accent);
  margin-bottom:4px;letter-spacing:.08em}
.play-dialogue .pd-line{font-size:clamp(15px,2.4vw,19px);line-height:1.8;color:#e8e8f0;white-space:pre-wrap;word-break:break-word}

/* 播放：画幅容器 + 视觉素材背景 + 前景文字 */
/* 画幅容器：横屏铺满播放区；竖屏（9:16）时按比例居中收窄，两侧留黑，不再全屏拉伸裁剪 */
.play-frame{position:absolute;inset:0;margin:auto;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;animation:playFadeIn .32s ease both}
.play-frame .play-fore{pointer-events:auto}
/* 转场：切幕交叉淡化 —— 新画幅每次重建渐入；旧画幅标记 tl-leave 淡出后由 JS 延迟移除。
   两层叠加（新画幅在后即在顶层）交叉淡化，避免清空重建瞬间露出黑色画底 */
@keyframes playFadeIn{from{opacity:0}to{opacity:1}}
@keyframes playFadeOut{from{opacity:1}to{opacity:0}}
.play-frame.tl-leave{animation:playFadeOut .18s ease both;pointer-events:none}
.play-frame.tl-leave .play-fore{pointer-events:none}
.play-media-bg{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;background:#000}
.play-media-bg img,.play-media-bg video{width:100%;height:100%;object-fit:cover;display:block}
.play-fore{position:relative;z-index:2;max-width:680px;width:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer}
.play-overlay.has-media .play-fore{background:rgba(8,8,16,.55);border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:30px 34px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 18px 50px rgba(0,0,0,.5);transition:.15s}
.play-overlay.has-media .play-fore:hover{background:rgba(8,8,16,.68);border-color:rgba(139,123,255,.55)}
/* 播放：场景幕 —— 前景退化为全屏透明点击区：无场景文字卡片、无「点击文字进入下一条」提示、
   有媒体时不套玻璃卡片（近乎透明）；点击区域=整个画幅；场景文字（.play-scene-text）单独渲染在 frame 上层可拖拽 */
.play-overlay .play-frame .play-fore.scene-sub-mode{position:absolute;inset:0;max-width:none;width:auto;margin:0}
.play-overlay.has-media .play-fore.scene-sub-mode,
.play-overlay.has-media .play-fore.scene-sub-mode:hover{background:transparent;border-color:transparent;padding:0;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.play-nav{flex:0 0 auto;position:relative;z-index:3;display:flex;align-items:center;gap:14px;justify-content:center;
  padding:14px 22px;border-top:1px solid var(--line);background:rgba(5,5,10,.7)}
.play-nav .pn-count{font-size:12px;color:var(--muted);min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
/* 播放：对白框 = 底部聊天框（全宽贴底、无位置选项）；字号全局统一（内联 25~30px）；场景文字纯文字（无框）可拖拽 */
/* 对白幕：fore 全屏透明点击层（任意处点击推进），聊天框自带半透明深色底 */
.play-overlay .play-frame .play-fore.dlg-fore{position:absolute;inset:0;max-width:none;width:auto;margin:0}
.play-overlay.has-media .play-fore.dlg-fore,
.play-overlay.has-media .play-fore.dlg-fore:hover{background:transparent;border-color:transparent;padding:0;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.play-scene-text{position:absolute;z-index:4;max-width:640px;text-align:center;line-height:1.9;color:#fff;
  white-space:pre-wrap;word-break:break-word;text-shadow:0 2px 10px rgba(0,0,0,.9);cursor:grab;pointer-events:auto;
  touch-action:none;font-size:27px}
.play-scene-text.dragging{cursor:grabbing}
/* 播放：竖屏（9:16）适配 —— 画幅比例由 renderPlay 按播放区尺寸精确计算（JS 设 style），
   两侧留黑居中，不再全屏拉伸裁剪；前景/字幕收窄贴合手机画幅 */
.play-overlay.orient-portrait #playBody{background:#000;padding:0}
.play-overlay.orient-portrait .play-fore{max-width:460px}
.play-overlay.orient-portrait .play-scene-text{max-width:420px}

  /* BGM 弹窗：音量行 */
  .bgm-vol{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .bgm-vol input[type=range]{flex:1;accent-color:var(--accent)}

  /* 角色声音表 */
  .cast-tip{font-size:11.5px;color:var(--muted);line-height:1.7;border:1px dashed var(--line2);border-radius:8px;padding:8px 10px}
  .cast-empty{color:var(--muted);text-align:center;padding:20px;font-size:12.5px}
  .cast-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:10px}
  .cast-name{flex:0 0 90px;font-weight:600;color:var(--text)}
  .cast-kind{flex:0 0 110px}
  .cast-conf{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:8px}
  .cast-conf .bgm-vol{min-width:150px;flex:1}

  /* 宽弹窗（三轨时间轴） */
  .modal-card.modal-wide{max-width:920px}

  /* 三轨时间轴 */
  .tl{display:flex;flex-direction:column;gap:10px}
  .tl-head{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .tl-time{font-variant-numeric:tabular-nums;min-width:58px}
  .tl-total{color:var(--muted)}
  .tl-board{position:relative;display:flex;flex-direction:column;gap:6px;background:#0d0d15;border:1px solid var(--line);border-radius:10px;padding:10px}
  .tl-playhead{position:absolute;top:6px;bottom:6px;left:0;width:1px;background:var(--accent2);z-index:5;pointer-events:none;box-shadow:0 0 6px rgba(95,200,255,.6)}
  .tl-playhead::after{content:"";position:absolute;top:-2px;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent2)}
  .tl-lane{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:8px}
  .tl-label{font-size:11px;color:var(--muted);text-align:right}
  .tl-track{position:relative;height:26px;background:#15151f;border-radius:6px;overflow:hidden}
  .tl-ruler-row .tl-track{height:20px;background:transparent}
  .tl-ruler{position:absolute;inset:0}
  .tl-tick{position:absolute;top:0;bottom:0;font-size:9px;color:var(--muted);border-left:1px solid var(--line2);padding-left:3px;line-height:1.4}
  .tl-clip{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:10px;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden;cursor:pointer;user-select:none;min-width:10px}
  .tl-bgm{background:rgba(255,170,80,.22);border:1px solid rgba(255,170,80,.6);color:#ffd9a8}
  .tl-voice{background:rgba(139,123,255,.25);border:1px solid rgba(139,123,255,.6);color:#cfc8ff}
  .tl-voice.tl-est{border-style:dashed}
  .tl-sfx{background:rgba(95,200,255,.2);border:1px solid rgba(95,200,255,.55);color:#bfe9ff}
  .tl-sfx.loop{background:rgba(80,220,160,.2);border-color:rgba(80,220,160,.6);color:#c2f5de}
  .tl-sfx.sel{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.5)}
  .tl-clip-label{pointer-events:none;overflow:hidden;text-overflow:ellipsis}
  .tl-handle{position:absolute;right:0;top:0;bottom:0;width:8px;background:rgba(255,255,255,.35);cursor:ew-resize;border-radius:0 5px 5px 0}
  .tl-edit{border:1px dashed var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .tl-edit-empty{color:var(--muted);font-size:11.5px;line-height:1.7}
  .tl-edit-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
  .tl-edit-row .field{flex:0 0 170px}
  .tl-edit-row audio{height:32px;flex:1;min-width:180px}
  .tl-field-check{display:flex;align-items:center;gap:6px;flex-direction:row}
  .tl-field-check label{margin:0}
  .tl-field-check input{width:auto}

  /* 积木音效摘要 */
  .sfx-summary{font-size:11.5px;color:var(--muted);line-height:1.6;word-break:break-all}

  /* 卡牌RPG：作品库类型徽章 / 积木战斗摘要 / 配置弹窗 */
  .story-badge.kind{background:rgba(120,200,255,.16);color:#9fd8ff;border-color:rgba(120,200,255,.5)}
  .story-badge.kind.rpg{background:rgba(255,170,80,.18);color:#ffcf8a;border-color:rgba(255,170,80,.55)}
  .block-sub{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .rpg-cfg-btns{display:flex;flex-direction:column;gap:6px}
  .rpg-cfg-btns .btn{margin-top:0}
  .rpg-tip{font-size:11.5px;color:var(--muted);line-height:1.7;border:1px dashed var(--line2);border-radius:8px;padding:8px 10px}
  .rpg-field{margin:10px 0}
  .rpg-field label{font-size:12px;margin-bottom:4px}
  .rpg-field textarea{min-height:64px;resize:vertical}
  .rpg-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .rpg-empty{color:var(--muted);font-size:12px;text-align:center;padding:16px;border:1px dashed var(--line2);border-radius:8px}
  .rpg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:8px 10px}
  .rpg-row-info{flex:1;min-width:0}
  .rpg-name{font-weight:600;color:var(--text);font-size:13px}
  .rpg-meta{font-size:11px;color:var(--muted);margin-left:8px}
  .rpg-desc{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
  .rpg-ops{display:flex;gap:6px;flex-shrink:0}
  .rpg-form-ops{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .rpg-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg3);cursor:pointer}
  .rpg-check input{width:auto;accent-color:var(--accent)}
  .rpg-enemy-check{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

  /* 卡牌RPG：一键生成示例（新建区按钮 + 角色选择弹窗） */
  .demo-btn{flex:1 1 100%;margin-top:8px;border:1px dashed rgba(255,170,80,.5);background:rgba(255,170,80,.08);color:#ffcf8a}
  .demo-btn:hover{background:rgba(255,170,80,.16);border-color:rgba(255,170,80,.85)}
  .rpg-demo-chars{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;margin-top:4px}
  .rpg-demo-char{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg3);border-radius:10px;padding:8px 10px;cursor:pointer;transition:.15s}
  .rpg-demo-char:hover{border-color:var(--accent)}
  .rpg-demo-char.sel{border-color:var(--accent);background:rgba(139,123,255,.12)}
  .rpg-demo-char input{width:auto;accent-color:var(--accent);flex-shrink:0}
  .rpg-demo-char .av{width:36px;height:36px;border-radius:50%;background:#1a1a28;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;flex-shrink:0}
  .rpg-demo-char .av img{width:100%;height:100%;object-fit:cover}
  .rpg-demo-char .inf{display:flex;flex-direction:column;gap:2px;min-width:0}
  .rpg-demo-char .nm{font-size:13px;font-weight:600;color:var(--text)}
  .rpg-demo-char .ds{font-size:11px;color:var(--muted);line-height:1.5;word-break:break-all}
  .rpg-demo-sep{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.2em;padding:2px 0}

  /* 卡牌RPG：战斗视图（播放画幅内） */
  .battle-view{position:relative;height:100%;width:100%;display:flex;flex-direction:column;gap:10px;padding:16px 18px 12px;box-sizing:border-box;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(139,123,255,.14),transparent 70%),linear-gradient(180deg,#15132a,#0c0b18)}
  .battle-view.portrait{padding:12px 10px 8px}
  .bt-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .bt-bg img,.bt-bg video{width:100%;height:100%;object-fit:cover;opacity:.4}
  .bt-enemies{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-start;gap:12px;flex-wrap:wrap;min-height:96px}
  .bt-enemy{width:150px;border:1px solid rgba(255,255,255,.16);background:rgba(8,8,18,.72);border-radius:12px;padding:8px 10px;text-align:left;cursor:default;transition:.15s}
  .bt-enemy.targetable{cursor:pointer;border-color:rgba(255,120,90,.9);box-shadow:0 0 0 2px rgba(255,120,90,.45),0 6px 18px rgba(255,80,60,.25);animation:btPulse 1s ease-in-out infinite}
  .bt-enemy.dead{opacity:.45;filter:grayscale(1)}
  @keyframes btPulse{0%,100%{box-shadow:0 0 0 2px rgba(255,120,90,.45)}50%{box-shadow:0 0 0 4px rgba(255,120,90,.65)}}
  .bt-enemy-name{font-size:13px;font-weight:700;color:#ffd9a8;margin-bottom:6px}
  .bt-enemy-meta{font-size:11px;color:var(--muted);margin-top:3px}
  .bt-enemy-intent{font-size:10.5px;color:#ff9a8a;margin-top:4px}
  .bt-enemy-intent.dead{color:var(--muted)}
  .bt-bar{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
  .bt-bar-fill{height:100%;border-radius:4px;transition:width .25s}
  .bt-bar-fill.enemy{background:linear-gradient(90deg,#ff5f4d,#ff9a5a)}
  .bt-bar-fill.hp{background:linear-gradient(90deg,#3ad07a,#a5f27a)}
  .bt-hero{position:relative;z-index:1;display:flex;align-items:center;gap:12px;justify-content:space-between}
  .bt-hero-box{flex:1;min-width:0;border:1px solid rgba(255,255,255,.14);background:rgba(8,8,18,.72);border-radius:12px;padding:8px 12px}
  .bt-hero-name{font-size:13px;font-weight:700;color:#cfc8ff;margin-bottom:5px}
  .bt-hp-row{display:flex;align-items:center;gap:8px}
  .bt-hp-num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
  .bt-buffs{display:flex;align-items:center;gap:10px;margin-top:5px;flex-wrap:wrap}
  .bt-shield{font-size:11.5px;color:#7fe3ff;background:rgba(95,200,255,.14);border:1px solid rgba(95,200,255,.45);border-radius:6px;padding:1px 7px}
  .bt-energy{font-size:12px;color:#ffd76a;letter-spacing:2px;text-shadow:0 0 8px rgba(255,200,80,.5)}
  .bt-deck-count{font-size:10.5px;color:var(--muted)}
  .bt-msg{font-size:11.5px;color:#cfc8ff;margin-top:5px;min-height:16px}
  .bt-end-turn{flex:0 0 auto}



  .bt-hand{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-end;gap:8px;flex-wrap:wrap;min-height:118px;padding-top:6px}
  .bt-hand-empty{color:var(--muted);font-size:12px;align-self:center}
  .bt-card{position:relative;width:106px;height:128px;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:linear-gradient(180deg,#2a2550,#171430);color:var(--text);cursor:pointer;text-align:left;padding:26px 8px 8px;transition:transform .12s,box-shadow .12s}
  .bt-card:hover{transform:translateY(-6px);border-color:rgba(139,123,255,.7);box-shadow:0 10px 24px rgba(0,0,0,.5)}
  .bt-card.poor{opacity:.55;filter:grayscale(.4)}
  .bt-card.targeting{border-color:#ffcf8a;box-shadow:0 0 0 2px rgba(255,190,90,.55);transform:translateY(-6px)}
  .bt-cost{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;background:#7d4cff;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .bt-card-icon{font-size:24px;text-align:center;margin-bottom:5px}
  .bt-card-name{font-size:11.5px;font-weight:700;text-align:center;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bt-card-desc{font-size:9.5px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bt-result{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,6,14,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;padding:20px}
  .bt-result-title{font-size:26px;font-weight:800;color:#ffd76a;text-shadow:0 0 20px rgba(255,200,80,.45)}
  .bt-result-title.lost{color:#ff7a6a}
  .bt-result-text{max-width:520px;font-size:14px;color:var(--text);line-height:1.8;white-space:pre-wrap;word-break:break-word}
  .bt-result-ops{display:flex;gap:12px}
  .bt-intro{position:relative;z-index:1;margin:auto;max-width:560px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;border:1px solid rgba(255,255,255,.16);background:rgba(8,8,18,.75);border-radius:18px;padding:28px 30px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .bt-intro-title{font-size:24px;font-weight:800;color:#ffd76a;text-shadow:0 0 16px rgba(255,200,80,.4)}
  .bt-intro-text{font-size:14px;color:var(--text);line-height:1.9;white-space:pre-wrap;word-break:break-word}
  .bt-intro-meta{font-size:13px;color:var(--muted)}
  .bt-intro-ops{display:flex;gap:12px;margin-top:6px}
  .battle-view.result .bt-enemies,.battle-view.result .bt-hero,.battle-view.result .bt-hand{pointer-events:none;filter:blur(1.5px) brightness(.5)}

@keyframes blockIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

@media (max-width:760px){
  .editor-wrap{flex-direction:column}
  .editor-side{flex:0 0 auto;max-width:none;border-right:none;border-bottom:1px solid var(--line)}
  .editor-side .side-scroll{max-height:220px}
  .play-body{padding:18px}
}
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="/fantasy.html">← 返回</a>
  <div class="brand">
    <span class="brand-name">作品编辑器</span>
    <span class="brand-sub">STORY BUILDER · 互动小说 + 卡牌RPG</span>
  </div>
  <div class="topbar-right">
    <button class="btn ghost hidden" id="libBtn">⬅ 作品库</button>
    <button class="btn primary hidden" id="playBtn">▶ 播放作品</button>
  </div>
</header>

<!-- ============ 视图1：作品库 ============ -->
<div class="hub" id="viewLibrary">
  <main class="hub-main">
    <section class="hub-hero">
      <div class="hub-hero-kicker">STORY BUILDER</div>
      <h1 class="hub-hero-name">作品编辑器</h1>
      <p class="hub-hero-meaning">像搭积木一样，搭出你的互动小说与卡牌RPG。</p>
      <p class="hub-hero-tags" id="loginHint" style="display:none;margin-top:6px">🔑 登录后作品自动保存到云端，手机端也能同步继续。 <a href="/yonder.html?next=/story-editor" style="color:#b7b7ff">去登录</a></p>
    </section>

    <section class="hub-section">
      <h2 class="hub-sec-title">新建作品 <span>从第一个章节开始</span></h2>
      <div class="new-story">
        <input type="text" class="txt" id="newTitle" maxlength="40" placeholder="输入作品名称，例如：长安雨">
        <div class="orient-pick" id="createOrient">
          <button type="button" class="orient-card active" data-orient="landscape">🖥 16:9 横屏<span>电脑 · 宽幅</span></button>
          <button type="button" class="orient-card" data-orient="portrait">📱 9:16 竖屏<span>手机 · 短视频</span></button>
        </div>
        <div class="orient-pick" id="createKindRow" style="margin-top:8px">
          <button type="button" class="orient-card kind-card active" data-kind="story">📖 互动小说<span>剧情 + 画面 + 配音</span></button>
          <button type="button" class="orient-card kind-card" data-kind="card_rpg">⚔️ 卡牌RPG<span>剧情 + 能量卡牌战斗</span></button>
        </div>
        <button type="button" class="btn ghost demo-btn hidden" id="rpgDemoBtn">⚡ 一键生成卡牌RPG 示例（用角色库角色当主角）</button>
        <button class="btn primary" id="createBtn">＋ 创建作品</button>
      </div>
    </section>

    <section class="hub-section">
      <h2 class="hub-sec-title">我的作品 <span id="storyCount"></span></h2>
      <div class="story-grid" id="storyList"></div>
    </section>
  </main>
</div>

<!-- ============ 视图2：编辑器 ============ -->
<div class="editor-wrap hidden" id="viewEditor">
  <aside class="editor-side">
    <div class="side-scroll">
      <section>
        <h3>作品信息</h3>
        <div class="field" style="margin:0">
          <input type="text" class="txt" id="storyTitle" maxlength="40">
        </div>
        <div class="orient-row" id="storyOrient" title="画面方向：16:9 横屏（电脑）/ 9:16 竖屏（手机），影响播放画幅与后续上传压缩">
          <button type="button" class="mini-btn orient-btn" data-orient="landscape">🖥 16:9</button>
          <button type="button" class="mini-btn orient-btn" data-orient="portrait">📱 9:16</button>
          <span class="orient-row-label">画面方向</span>
        </div>
        <div class="orient-row" id="storyQual" title="上传画面压缩规格：标准（1280 档）/ 高清（1920 档）">
          <button type="button" class="mini-btn qual-btn" data-qual="standard">标准</button>
          <button type="button" class="mini-btn qual-btn" data-qual="hd">高清</button>
          <span class="orient-row-label">画面画质</span>
        </div>
        <button class="btn wide" id="castBtn" style="margin-top:10px">🎭 角色声音</button>
      </section>
      <section id="rpgConfig" style="display:none">
        <h3>卡牌RPG</h3>
        <div class="rpg-cfg-btns">
          <button class="btn wide" id="rpgCardsBtn">🃏 卡牌库</button>
          <button class="btn wide" id="rpgHeroBtn">🦸 英雄</button>
          <button class="btn wide" id="rpgEnemiesBtn">👹 敌人</button>
        </div>
        <div style="font-size:11px;color:var(--muted);line-height:1.7;margin-top:6px">卡牌/英雄/敌人用于「⚔️ 卡牌战斗」积木；剧情、画面、配音、BGM 与互动小说通用。</div>
      </section>
      <section>
        <h3>章节</h3>
        <button class="btn wide" id="addChapterBtn">＋ 新建章节</button>
        <div id="chapterList" style="margin-top:10px"></div>
      </section>
      <section style="font-size:11px;color:var(--muted);line-height:1.8">
        积木改动自动保存到云端（登录后跨设备同步），刷新不丢失。
      </section>
    </div>
  </aside>
  <div class="editor-stage">
    <div class="stage-head">
      <span class="ch-title" id="chapterTitle"></span>
      <span class="ch-count" id="chapterCount"></span>
      <span style="flex:1"></span>
      <button class="btn small ghost" id="bgmBtn">🎵 BGM</button>
      <button class="btn small ghost" id="renameChapterBtn">重命名章节</button>
    </div>
    <div class="stage-scroll" id="blockList"></div>
    <div style="padding:14px 20px 22px">
      <button class="add-block" id="addBlockBtn">＋ 添加内容</button>
    </div>
  </div>
</div>

<!-- ============ 播放视图 ============ -->
<div class="play-overlay hidden" id="playOverlay">
  <div class="play-head">
    <span class="ph-progress" id="playProgress"></span>
    <span class="ph-chapter" id="playChapter"></span>
    <span class="spacer"></span>
    <button class="btn small ghost" id="playExit">✕ 退出</button>
  </div>
  <div class="play-body" id="playBody"></div>
  <div class="play-nav" id="playNav">
    <button class="btn" id="playPrev">← 上一条</button>
    <span class="pn-count" id="playCount"></span>
    <button class="btn primary" id="playNext">下一条 →</button>
  </div>
</div>

<!-- ============ 通用弹窗 ============ -->
<div class="modal hidden" id="modal">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn primary hidden" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="/story-editor.js"></script>
</body>
</html>
