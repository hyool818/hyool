<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>crop-compare check</title>
<style>
  body { font-family: ui-monospace, monospace; font-size: 13px; background: #12121c; color: #e6e6f0; padding: 16px; }
  #results { white-space: pre-wrap; line-height: 1.7; }
  iframe { position: fixed; left: -9999px; top: -9999px; width: 800px; height: 600px; border: 0; }
</style>
</head>
<body>
<pre id="results">RUNNING…</pre>
<iframe id="w" src="/workspace.html" title="workspace"></iframe>
<script>
const results = [];
function line(s) {
  results.push(s);
  const el = document.getElementById('results');
  if (el) el.textContent = results.join('\n');
}
function ok(cond, name, extra = '') { line((cond ? 'PASS' : 'FAIL') + '  ' + name + (extra ? '  ' + extra : '')); }

const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = () => document.getElementById('w').contentWindow;

async function main() {
  try {
    // 等待 workspace app 初始化完成（app.js 末尾挂出 enterWorkspaceTab）
    let ready = false;
    for (let i = 0; i < 80; i++) {
      try {
        ready = f().eval('typeof window.enterWorkspaceTab === "function"');
      } catch (e) { /* 跨文档读取窗口，尚未就绪 */ }
      if (ready) break;
      await sleep(250);
    }
    ok(ready, 'workspace.html 加载完成');
    if (!ready) throw new Error('iframe 未就绪');
    await sleep(800); // 等模块 + 编解码器预热

    // 进入编辑器视图（否则 #editorView 保持 display:none，画布布局尺寸为 0）
    f().eval(`document.querySelector('.tool-cta[data-go="editor"]').click()`);
    await sleep(400);

    // 注入一个小 PNG 触发 handleFiles → renderImage → layoutStage
    const png = await f().eval(`
      (async () => {
        const c = document.createElement('canvas');
        c.width = 64; c.height = 48;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#e05'; ctx.fillRect(0, 0, 64, 48);
        ctx.fillStyle = '#fff'; ctx.fillRect(8, 8, 24, 32);
        const blob = await new Promise(r => c.toBlob(r, 'image/png'));
        const file = new File([blob], 't.png', { type: 'image/png' });
        const dt = new DataTransfer();
        dt.items.add(file);
        const inp = document.getElementById('fileInput');
        inp.files = dt.files;
        inp.dispatchEvent(new Event('change'));
        return true;
      })()
    `);
    await png;

    // 等待图片载入完成（compareWrap 取消 hidden 且 canvasOut 有尺寸）
    let loaded = false;
    for (let i = 0; i < 60; i++) {
      loaded = f().eval(`(() => {
        const w = document.getElementById('compareWrap');
        const o = document.getElementById('canvasOut');
        return !w.classList.contains('hidden') && o.width > 0;
      })()`);
      if (loaded) break;
      await sleep(250);
    }
    ok(loaded, '图片载入');
    ok(f().eval(`!document.getElementById('topExportBtn').classList.contains('hidden')`), '导入后顶栏「保存/导出」按钮可见');
    // 布局诊断：确认 mosaicLayer 在 iframe 里的实际布局尺寸（此前 stagePoint 拿到 NaN 疑似 rect.width=0）
    const layoutDiag = f().eval(`(() => {
      const l = document.getElementById('mosaicLayer');
      const w = document.getElementById('compareWrap');
      const lr = l.getBoundingClientRect();
      const wr = w.getBoundingClientRect();
      const body = document.body.getBoundingClientRect();
      return JSON.stringify({
        layer: { w: lr.width, h: lr.height, left: lr.left, top: lr.top },
        wrap: { w: wr.width, h: wr.height },
        body: { w: body.width, h: body.height },
        iw: innerWidth, ih: innerHeight,
        attr: { w: l.width, h: l.height },
      });
    })()`);
    line('DIAG  layout=' + layoutDiag);

    // 有效（computed）样式断言：clip 必须测 getComputedStyle —— 上一版只查内联 style.clipPath，
    // 但 CSS 类规则 `.compare-canvas.out{clip-path:inset(0 50% 0 0)}` 仍会生效，右半照样露出原图
    const computedClip = () => f().eval(`getComputedStyle(document.getElementById('canvasOut')).clipPath`);
    const tagOpacity = () => f().eval(`getComputedStyle(document.querySelector('.compare-tag.tag-left')).opacity`);
    const dividerLeft = () => f().eval(`document.getElementById('compareDivider').style.left`);

    // 1) 对比关闭：canvasOut 应完整显示（无任何 clip），原图/处理后标签隐藏
    let clip = computedClip();
    ok(clip === 'none', '关闭对比时 canvasOut 无 clip-path（computed）', 'clipPath=' + JSON.stringify(clip));
    ok(tagOpacity() === '0', '关闭对比时 原图/处理后 标签隐藏', 'opacity=' + tagOpacity());

    // 2) 开启对比：clip-path 应为 inset，分割线跟随滑块（默认 50%），标签可见
    f().eval(`document.getElementById('compareToggle').click()`);
    await sleep(320); // 等 .compare-tag 的 opacity .2s 过渡完成
    clip = computedClip();
    ok(String(clip).indexOf('inset') === 0, '开启对比时 canvasOut 有 clip-path', 'clipPath=' + JSON.stringify(clip));
    ok(dividerLeft() === '50%', '开启对比时分割线对齐滑块位置', 'left=' + JSON.stringify(dividerLeft()));
    ok(tagOpacity() === '1', '开启对比时 原图/处理后 标签可见', 'opacity=' + tagOpacity());

    // 3) 关闭对比：clip 清空 + 标签隐藏
    f().eval(`document.getElementById('compareToggle').click()`);
    await sleep(320); // 等 opacity 过渡完成
    clip = computedClip();
    ok(clip === 'none', '再次关闭对比后 clip-path 清空', 'clipPath=' + JSON.stringify(clip));
    ok(tagOpacity() === '0', '再次关闭对比后标签隐藏', 'opacity=' + tagOpacity());

    // 记录裁剪前的画布内容，供步骤 7 对比「裁剪放大已生效」
    f().eval(`(() => {
      const o = document.getElementById('canvasOut');
      window.__beforeCrop = o.getContext('2d').getImageData(0, 0, o.width, o.height).data;
      return true;
    })()`);

    // 4) 拖拽裁剪（回归点：裁剪后 canvasOut 被 CSS 裁掉右半 →「左右分离」）
    f().eval(`(() => {
      document.getElementById('mosaicLayer').setPointerCapture = () => {}; // 合成事件没有真实 pointer 捕获
      document.getElementById('cropModeBtn').click();
      const layer = document.getElementById('mosaicLayer');
      const r = layer.getBoundingClientRect();
      const mk = (type, x, y) => new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 1, clientX: x, clientY: y });
      layer.dispatchEvent(mk('pointerdown', r.left + r.width * 0.2, r.top + r.height * 0.2));
      window.dispatchEvent(mk('pointermove', r.left + r.width * 0.7, r.top + r.height * 0.8));
      window.dispatchEvent(mk('pointerup', r.left + r.width * 0.7, r.top + r.height * 0.8));
      return true;
    })()`);
    await sleep(900); // 等 processImageData 异步完成后 drawOverlay
    clip = computedClip();
    ok(clip === 'none', '裁剪后（对比仍关）canvasOut 无 clip-path', 'clipPath=' + JSON.stringify(clip));

    // 5) 裁剪已生效：清除按钮可见 + 画布内容已变为裁剪放大结果（预览保持原画布尺寸，把裁剪区拉伸铺满）
    const cropState = f().eval(`(() => {
      const clearBtn = document.getElementById('cropClearBtn');
      const out = document.getElementById('canvasOut');
      const overlay = document.getElementById('mosaicLayer');
      const octx = out.getContext('2d');
      const lctx = overlay.getContext('2d');
      let overlayPainted = false;
      const id = lctx.getImageData(0, 0, overlay.width, overlay.height).data;
      for (let i = 3; i < id.length; i += 4) { if (id[i] > 0) { overlayPainted = true; break; } }
      return JSON.stringify({
        clearVisible: !clearBtn.classList.contains('hidden'),
        nowHash: octx.getImageData(0, 0, out.width, out.height).data.length,
        overlayPainted,
        overlayW: overlay.width, overlayH: overlay.height,
        outW: out.width, outH: out.height,
      });
    })()`);
    const cs = JSON.parse(cropState);
    ok(cs.clearVisible && cs.overlayPainted, '裁剪已生效（清除按钮可见 + 裁剪遮罩已绘制）', 'crop=' + JSON.stringify(cs));

    // 6) 裁剪内容确实改变：与步骤 3 后（未裁剪）的画布内容对比
    const differ = f().eval(`(() => {
      const o = document.getElementById('canvasOut');
      const a = o.getContext('2d').getImageData(0, 0, o.width, o.height).data;
      const before = window.__beforeCrop;
      if (!before || before.length !== a.length) return true;
      let diff = 0;
      for (let i = 0; i < a.length; i += 4) {
        if (Math.abs(before[i] - a[i]) + Math.abs(before[i+1] - a[i+1]) + Math.abs(before[i+2] - a[i+2]) > 12) { diff++; if (diff > 10) break; }
      }
      return diff > 0;
    })()`);
    ok(differ, '裁剪后画布内容已改变（裁剪放大生效）');

    // 7) 裁剪后开启对比仍应正常出分割（裁剪编辑与对比共存），最后恢复关闭
    f().eval(`document.getElementById('compareToggle').click()`);
    await sleep(320); // 等 opacity 过渡完成
    clip = computedClip();
    ok(String(clip).indexOf('inset') === 0, '裁剪后开启对比仍有 clip-path', 'clipPath=' + JSON.stringify(clip));
    f().eval(`document.getElementById('compareToggle').click()`);
    await sleep(320);

    line('');
    line('--- console/errors ---');
    document.title = results.some(r => r.startsWith('FAIL') || r.startsWith('FATAL')) ? 'SMOKE-FAIL' : 'SMOKE-OK';
  } catch (e) {
    line('FAIL  异常：' + e.message);
    document.title = 'SMOKE-FAIL';
  }
}

main();
</script>
</body>
</html>
