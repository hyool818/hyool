<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>游戏工坊 · HYOOL</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed; min-height: 100vh; line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 64px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  background: linear-gradient(to bottom, rgba(5,5,8,.52), transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 8px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); }
.page { max-width: 1000px; margin: 0 auto; padding: 96px 24px 80px; }
.loading { text-align: center; padding: 80px 0; color: var(--muted); }
.spinner { width: 26px; height: 26px; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

.world-head { display: flex; gap: 20px; margin-bottom: 1.6rem; flex-wrap: wrap; }
.world-cover { width: 220px; height: 165px; object-fit: cover; border-radius: 16px; border: 1px solid var(--glass-border); background: #0c0d14; flex: 0 0 auto; }
.world-info { flex: 1; min-width: 240px; }
.world-info h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: .2rem; }
.world-info .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: .4rem 0; }
.badge { font-size: .66rem; padding: 2px 9px; border-radius: 999px; background: rgba(139,139,255,.16); color: #b7b7ff; }
.badge.form { background: rgba(120,220,170,.14); color: #9fdcbb; }
.world-info .desc { font-size: .84rem; color: rgba(255,255,255,.7); }
.cast-chips { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
.cast-chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-border); font-size: .76rem; }
.cast-chip img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #0c0d14; }


.player {
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.04);
  border-radius: 20px; padding: 28px 26px; min-height: 320px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.scene-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.scene-count { font-size: .72rem; color: var(--muted); }
.scene-title { font-size: .8rem; color: var(--accent); font-weight: 600; }
.scene-body { flex: 1; }
.scene-type-narration { font-size: .95rem; color: rgba(255,255,255,.85); white-space: pre-wrap; line-height: 1.9; }
.scene-dialogue {
  max-width: 85%; background: rgba(139,139,255,.10); border: 1px solid rgba(139,139,255,.28);
  border-radius: 16px; padding: 14px 18px;
}
.scene-dialogue .who { font-size: .74rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.scene-dialogue .what { font-size: .92rem; white-space: pre-wrap; line-height: 1.7; }
.scene-choices { display: grid; gap: .6rem; margin-top: 1rem; }
.choice-btn {
  text-align: left; border: 1px solid rgba(139,139,255,.35); background: rgba(139,139,255,.08);
  color: #fff; padding: 12px 16px; border-radius: 12px; font: inherit; font-size: .9rem; cursor: pointer;
  transition: all .2s;
}
.choice-btn:hover { background: rgba(139,139,255,.2); border-color: var(--accent); transform: translateY(-1px); }
.scene-end { text-align: center; padding: 20px 0; }
.scene-end .end-title { font-size: 1.3rem; font-weight: 800; margin-bottom: .4rem; }
.scene-end .end-sum { color: var(--muted); font-size: .86rem; margin-bottom: 1.2rem; white-space: pre-wrap; }
.player-actions { display: flex; gap: .8rem; margin-top: 1.6rem; }
.btn {
  border: 0; border-radius: 12px; padding: 11px 22px; font-size: 14px; cursor: pointer;
  font-weight: 600; transition: opacity .2s, transform .2s; flex: 1;
}
.btn-accent { background: var(--accent); color: #0a0a12; }
.btn-accent:hover { opacity: .88; transform: translateY(-1px); }
.btn-ghost { background: rgba(255,255,255,.08); color: #fff; }
.btn-ghost:hover { opacity: .85; }
.btn:disabled { opacity: .4; cursor: default; transform: none; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state .big { font-size: 2.4rem; margin-bottom: .8rem; opacity: .6; }
@media (max-width: 600px) {
  .world-cover { width: 100%; height: 150px; }
  .player { padding: 20px 16px; }
}
</style>
</head>
<body>
<header class="header">
  <a class="header-link" href="/hub">← 返回我的彼岸</a>
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:.72rem;color:var(--muted);" id="typeLabel"></span>
    <a class="header-link" href="/" style="background:none;padding:0;color:var(--muted);">HYOOL</a>
  </div>
</header>
<main class="page" id="page">
  <div class="loading" id="loading"><span class="spinner"></span><div>正在加载世界…</div></div>
  <div id="content" style="display:none;"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const escapeHtml = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const api = (p, o = {}) => {
  const t = localStorage.getItem("hyool_token");
  const h = { "Content-Type": "application/json", ...(o.headers || {}) };
  if (t) h["Authorization"] = "Bearer " + t;
  return fetch(p, { credentials: "include", ...o, headers: h }).then(async r => {
    let d; try { d = await r.json(); } catch { d = { success: false, error: "服务器返回异常。" }; }
    if (!r.ok) throw new Error(d.error || "请求失败。");
    return d;
  });
};

let world = null;
let scenes = [];
let cursor = 0;

function getScenes(w) {
  const s = w && w.script_json;
  if (Array.isArray(s)) return s;
  if (s && Array.isArray(s.scenes)) return s.scenes;
  return [];
}

function renderScene() {
  const body = $("sceneBody");
  const sc = scenes[cursor];
  if (!sc) { renderEnd(); return; }

  const isNarration = sc.type === "narration" || !sc.type;
  $("sceneCount").textContent = "第 " + (cursor + 1) + " / " + scenes.length + " 幕";

  let html = "";
  if (isNarration) {
    html = `<div class="scene-type-narration">${escapeHtml(sc.text || "")}</div>`;
  } else if (sc.type === "choice") {
    html = `<div class="scene-type-narration" style="margin-bottom:.6rem;">${escapeHtml(sc.text || "")}</div><div class="scene-choices">` +
      (sc.choices || []).map((c, i) => `<button class="choice-btn" data-cc="${i}">${escapeHtml(c.text || "继续")}</button>`).join("") +
      `</div>`;
  } else {
    html = `<div class="scene-dialogue"><div class="who">${escapeHtml(sc.speaker || "角色")}</div><div class="what">${escapeHtml(sc.text || "")}</div></div>`;
  }
  body.innerHTML = html;

  $("choiceNext").style.display = "none";
  $("prevBtn").style.display = cursor > 0 ? "" : "none";
  $("nextBtn").style.display = sc.type === "choice" ? "none" : "";

  body.querySelectorAll(".choice-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const c = sc.choices[parseInt(btn.dataset.cc, 10)];
      const next = c && c.next;
      const idx = scenes.findIndex(s => s.id === next);
      if (idx >= 0) cursor = idx;
      else cursor = Math.min(cursor + 1, scenes.length - 1);
      renderScene();
    });
  });
}

function renderEnd() {
  const s = world.script_json;
  const summary = (s && s.summary) || world.description || "故事在此落幕。";
  const title = (s && s.title) || world.name;
  $("sceneBody").innerHTML = `<div class="scene-end">
    <div class="end-title">🎬 ${escapeHtml(title)}</div>
    <div class="end-sum">${escapeHtml(summary || "— 剧终 —")}</div>
  </div>`;
  $("sceneCount").textContent = "剧终";
  $("prevBtn").style.display = "";
  $("nextBtn").style.display = "none";
  $("choiceNext").style.display = "none";
}


function renderWorld() {
  const c = $("content");
  const s = world.script_json || {};
  const title = (s.title) || world.name;
  const summary = s.summary || "";
  const formLabel = ({ story: "故事剧本", game: "H5 小游戏", mixed: "故事 + 游戏" })[world.type] || world.type;
  const genreLabel = (world.settings && (world.settings.genreLabel || world.settings.genre)) || "世界";

  c.innerHTML = `
    <div class="world-head">
      <img class="world-cover" src="${escapeHtml(world.cover_image || "")}" alt="" onerror="this.style.opacity=.2">
      <div class="world-info">
        <h1>${escapeHtml(world.name)}</h1>
        <div class="badges"><span class="badge">${escapeHtml(genreLabel)}</span><span class="badge form">${escapeHtml(formLabel)}</span></div>
        <div class="desc">${escapeHtml(world.description || "")}</div>
        <div class="cast-chips">${(world.cast || []).map(ch => `<span class="cast-chip"><img src="${escapeHtml(ch.image_url || "")}" alt="" onerror="this.style.opacity=.2">${escapeHtml(ch.name)}</span>`).join("")}</div>
      </div>
    </div>
    <div class="player">
      <div class="scene-top">
        <span class="scene-count" id="sceneCount"></span>
        <span class="scene-title">${escapeHtml(title)}${summary ? " · " + escapeHtml(summary.slice(0, 24)) + "…" : ""}</span>
      </div>
      <div class="scene-body" id="sceneBody"></div>
      <div class="player-actions">
        <button class="btn btn-ghost" id="prevBtn">← 上一幕</button>
        <button class="btn btn-accent" id="nextBtn">下一步 →</button>
        <button class="btn btn-accent" id="choiceNext" style="display:none;">继续 →</button>
      </div>
    </div>`;

  scenes = getScenes(world);

  $("typeLabel").textContent = "混合世界 · " + formLabel;
  $("prevBtn").addEventListener("click", () => {
    cursor = Math.max(0, cursor - 1);
    while (cursor > 0 && scenes[cursor] && scenes[cursor].type === "choice") cursor--;
    renderScene();
  });
  $("nextBtn").addEventListener("click", () => {
    cursor = Math.min(scenes.length, cursor + 1);
    renderScene();
  });
  $("choiceNext").addEventListener("click", () => {
    cursor = Math.min(scenes.length, cursor + 1);
    renderScene();
  });

  if (!scenes.length) {
    $("sceneBody").innerHTML = `<div class="empty-state"><div class="big">📜</div>这个世界的剧本还没有沉淀。<br>去角色对话页点「🎬 沉淀为剧本」，把日常对话变成剧本。</div>`;
    $("sceneCount").textContent = "无剧本";
    $("prevBtn").style.display = "none";
    $("nextBtn").style.display = "none";
    return;
  }

  renderScene();
}

(async function init() {
  const worldId = new URLSearchParams(location.search).get("world");
  if (!worldId) {
    $("loading").innerHTML = `<div class="empty-state"><div class="big">🌍</div>缺少世界参数。<br><a href="/hub" class="btn btn-accent" style="display:inline-block;text-decoration:none;margin-top:12px;">去我的彼岸</a></div>`;
    return;
  }
  try {
    const res = await api("/api/worlds/" + worldId);
    if (!res.success) throw new Error(res.error || "世界不存在。");
    world = res.world;
  } catch (e) {
    $("loading").innerHTML = `<div class="empty-state"><div class="big">😢</div>${escapeHtml(e.message)}<br><a href="/hub" class="btn btn-accent" style="display:inline-block;text-decoration:none;margin-top:12px;">去我的彼岸</a></div>`;
    return;
  }
  $("loading").style.display = "none";
  $("content").style.display = "block";
  renderWorld();
})();
</script>
</body>
</html>
