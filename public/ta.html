<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="TA 独立原型：陪伴式对话 + 本机记忆，数据只保存在当前设备。">
<title>TA</title>
<style>
:root{
  --bg:#07070c; --panel:#0d0d16; --panel-2:#13131f; --text:#f0ecff; --muted:#8a87a6;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --accent:#8b7bff; --accent-2:#5ad1ff; --ok:#5ce1a6; --warn:#ff8399;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1100px 560px at 50% -12%, #191338 0%, #07070c 58%), var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font-family:inherit;color:inherit}
.app{position:relative;max-width:820px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- 顶栏 ---------- */
.top{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(9,9,15,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:600;color:#fff;background:linear-gradient(140deg,var(--accent),#3d2f8a);box-shadow:0 0 0 1px var(--line-2),0 8px 24px -12px var(--accent);transition:box-shadow .5s,transform .5s}
.avatar.good{box-shadow:0 0 0 1px rgba(92,225,166,.45),0 8px 26px -10px rgba(92,225,166,.65)}
.avatar.low{box-shadow:0 0 0 1px rgba(255,131,153,.4),0 8px 26px -10px rgba(255,131,153,.55)}
.avatar.talk{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who #cpName{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;white-space:nowrap;color:#cfc8ff;border:1px solid rgba(139,123,255,.45);background:rgba(139,123,255,.12)}
.who-sub{margin-top:3px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px;line-height:1;cursor:pointer;transition:.2s}
.iconbtn:hover{color:var(--text);border-color:var(--accent)}

/* ---------- 消息流 ---------- */
.stage{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 8px;display:flex;flex-direction:column;gap:14px}
.stage::-webkit-scrollbar{width:6px}
.stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.day{align-self:center;font-size:11px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
.row{display:flex;gap:9px;max-width:88%;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row.her{align-self:flex-start}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.mini{width:28px;height:28px;flex:0 0 auto;align-self:flex-end;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;background:linear-gradient(140deg,var(--accent),#3d2f8a)}
.bubble{padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.68;white-space:pre-wrap;word-break:break-word}
.row.her .bubble{background:var(--panel-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.row.me .bubble{background:linear-gradient(140deg,#6f5cf5,#4a37c9);border-bottom-right-radius:6px;color:#fff}
/* 字字动画：整句先占位（不跳动），逐字淡入 + 上浮；只有 .revealing 期间才隐藏，
   JS 半路挂掉最多是「直接显示」，不会白屏 */
.bubble .ch{display:inline-block;max-width:100%;transition:opacity .18s ease,transform .18s ease}
.bubble.revealing .ch{opacity:0;transform:translateY(.16em)}
.bubble.revealing .ch.on{opacity:1;transform:none}
.meta{margin-top:5px;font-size:10.5px;color:var(--muted);text-align:right}
.row.her .meta{text-align:left}
.typing{display:flex;gap:4px;align-items:center;height:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
/* ---------- 输入区 ---------- */
.composer{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(9,9,15,.9);backdrop-filter:blur(14px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12.5px;color:var(--muted);padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;transition:.2s}
.chip:hover{color:var(--text);border-color:var(--accent)}
.composer-row{display:flex;gap:9px;align-items:flex-end}
#input{flex:1 1 auto;min-height:46px;max-height:132px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);outline:none;resize:none;font-size:14.5px;line-height:1.5;transition:border-color .2s}
#input:focus{border-color:rgba(139,123,255,.6)}
.send{flex:0 0 auto;width:46px;height:46px;border:0;border-radius:14px;background:linear-gradient(140deg,#7d6bfb,#4b38cb);cursor:pointer;display:grid;place-items:center;transition:.2s}
.send:disabled{opacity:.4;cursor:default}
.send:not(:disabled):hover{transform:translateY(-1px)}
.send svg{width:20px;height:20px;fill:#fff}
.hint{margin-top:7px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.hint .dot{color:var(--ok)}

/* ---------- 首次设置 ---------- */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(6,6,11,.94);backdrop-filter:blur(6px)}
.overlay[hidden]{display:none}
.setup{width:100%;max-width:460px;max-height:100%;overflow-y:auto;padding:22px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.setup h1{font-size:19px;letter-spacing:.02em}
.setup .sub{margin-top:9px;font-size:12.5px;line-height:1.75;color:var(--muted)}
.field{margin-top:18px}
.field>label{display:block;margin-bottom:7px;font-size:12px;color:var(--muted)}
.field input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);outline:none;font-size:14px}
.field input:focus{border-color:rgba(139,123,255,.6)}
.personas{display:grid;gap:9px;margin-top:9px}
.persona{text-align:left;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:.2s}
.persona:hover{border-color:rgba(139,123,255,.55)}
.persona.on{border-color:var(--accent);background:linear-gradient(140deg,rgba(139,123,255,.18),rgba(90,209,255,.06))}
.persona .pname{font-size:14px;font-weight:600}
.persona .pline{margin-top:4px;font-size:12px;line-height:1.6;color:var(--muted)}
.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:linear-gradient(140deg,#7d6bfb,#4b38cb);font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.primary:hover{filter:brightness(1.08)}
.tiny{margin-top:12px;font-size:11px;line-height:1.7;text-align:center;color:var(--muted)}

/* ---------- 语音 / 预设选择器 ---------- */
.opts{display:grid;gap:9px;margin-top:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;padding:11px 13px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:.2s;color:var(--text)}
.opt:hover{border-color:rgba(139,123,255,.55)}
.opt.on{border-color:var(--accent);background:linear-gradient(140deg,rgba(139,123,255,.18),rgba(90,209,255,.06))}
.opt .oname{display:block;font-size:13.5px;font-weight:600}
.opt .oline{display:block;margin-top:4px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.mic,.imgbtn{flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:17px;line-height:1;cursor:pointer;transition:.2s}
.mic:hover,.imgbtn:hover{color:var(--text);border-color:var(--accent)}
.mic.live{border-color:var(--warn);color:#ffc3cd;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,131,153,.45)}50%{box-shadow:0 0 0 8px rgba(255,131,153,0)}}
.imgbtn[disabled]{opacity:.42;cursor:not-allowed}
.setting{margin-top:12px;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:12.5px;line-height:1.6;text-align:left;cursor:pointer;transition:.2s}
.setting:hover{border-color:var(--accent)}
.setting b{color:var(--accent-2);font-weight:600}
.iconbtn.on{color:var(--text);border-color:var(--accent)}
#linkState.off .dot{color:var(--muted)}
#linkState.cloud .dot{color:var(--accent-2)}
.src{font-size:10px;color:var(--muted);margin-top:4px}
.src.local{color:#c9b8ff}

/* ---------- 记忆抽屉 ---------- */
.scrim{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;z-index:30;width:min(92%,360px);display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);transform:translateX(102%);transition:transform .28s ease}
.drawer.open{transform:none}
.drawer-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.drawer-head h2{flex:1 1 auto;font-size:14px}
.drawer-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;gap:12px;padding:2px 2px 6px}
.stat span{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.bar{margin-top:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s}
.mem{padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--panel-2)}
.mem .mt{font-size:11px;letter-spacing:.04em;color:var(--accent-2)}
.mem .mv{margin-top:5px;font-size:13.5px;line-height:1.6;word-break:break-word}
.mem .md{margin-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.mem .md button{border:0;background:none;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer}
.mem .md button:hover{color:var(--warn)}
.empty{padding:18px 6px;font-size:12.5px;line-height:1.8;text-align:center;color:var(--muted)}
.danger{margin-top:auto;padding:12px;border-radius:13px;border:1px solid rgba(255,131,153,.28);background:rgba(255,131,153,.06);color:#ffb4c2;font-size:12.5px;cursor:pointer;transition:.2s}
.danger:hover{background:rgba(255,131,153,.12)}

@media (max-width:480px){
  .row{max-width:92%}
  .top{padding:10px 12px}
  .avatar{width:42px;height:42px;font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="avatar" id="avatar" aria-hidden="true">伴</div>
    <div style="flex:1 1 auto;min-width:0">
      <div class="who">
        <span id="cpName">TA</span>
        <span class="tag" id="cpStage">初识</span>
      </div>
      <div class="who-sub" id="cpStatus">心情 60 · 亲密 0 · 0 条记忆</div>
    </div>
    <button type="button" class="iconbtn" id="voiceBtn" title="语音开关" aria-label="语音开关" aria-pressed="true">🔊</button>
    <button type="button" class="iconbtn" id="openMemory" title="记忆与关系" aria-label="记忆与关系">✦</button>
    <button type="button" class="iconbtn" id="resetBtn" title="重新设置伴侣" aria-label="重新设置伴侣">⟲</button>
  </header>

  <main class="stage" id="stage" aria-live="polite" aria-relevant="additions text"></main>

  <footer class="composer">
    <div class="chips" id="chips"></div>
    <div class="composer-row">
      <button type="button" class="mic" id="micBtn" title="点一下开始说话，再点一下结束" aria-label="语音输入">🎙</button>
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送 / Shift+Enter 换行）" aria-label="输入消息"></textarea>
      <button type="button" class="imgbtn" id="imageBtn" disabled aria-label="图片生成（未开放）">🖼</button>
      <button type="button" class="send" id="sendBtn" aria-label="发送">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
    <div class="hint">
      <span id="linkState"><span class="dot">●</span> 正在连接…</span>
      <span id="hintRight"></span>
    </div>
  </footer>

  <div class="overlay" id="setupOverlay" hidden>
    <section class="setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <h1 id="setupTitle">先定一下 TA 的样子</h1>
      <p class="sub">人设只开放四项基础设定：性别 / 音色 / 性格 / 名字（都用预设，不支持自定义）。对话与记忆只存在本机（存储键 hyool-ta-v1），随时可一键清空。</p>
      <div class="field">
        <label>性别</label>
        <div class="opts two" id="genderList"></div>
      </div>
      <div class="field">
        <label>音色（按性别筛选的中文神经语音）</label>
        <div class="opts two" id="voiceList"></div>
      </div>
      <div class="field">
        <label>性格（决定说话方式）</label>
        <div class="opts" id="personaList"></div>
      </div>
      <div class="field">
        <label>名字（预设，不可自定义）</label>
        <div class="opts two" id="nameList"></div>
      </div>
      <button type="button" class="primary" id="startBtn">开始对话</button>
      <p class="tiny">联网时台词由模型生成、语音用云端音色；断网或模型失败会自动回落到本机台词库与设备语音 —— 不会因为网络问题变哑巴。</p>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="记忆与关系">
    <div class="drawer-head">
      <h2>记忆与关系</h2>
      <button type="button" class="iconbtn" id="closeDrawer" aria-label="关闭">✕</button>
    </div>
    <div class="drawer-body">
      <div class="stats" id="stats"></div>
      <div id="memList" style="display:flex;flex-direction:column;gap:10px"></div>
      <button type="button" class="setting" id="voiceSrcBtn">音色来源：本机语音</button>
      <button type="button" class="setting" id="llmBtn">台词模型：自动（本机优先）</button>
      <button type="button" class="danger" id="wipeBtn">清空全部本机数据</button>
    </div>
  </aside>
</div>
<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  var STORE_KEY = 'hyool-ta-v1';
  var MAX_MESSAGES = 400;
  var MAX_MEMORIES = 80;
  var IDLE_MS = 90000;
  var IDLE_GAP = 8 * 60 * 1000;

  var TA_API_BASE = '/api/ta';
  var CHAT_TIMEOUT_MS = 9000;
  /* 必须比服务端的整条合成链预算（20s）更大：页面先超时的话，
     服务器白算一场，用户听到的永远是兜底音。两头同时改，别只改一边。 */
  var TTS_TIMEOUT_MS = 22000;
  /* 本机模型（OpenAI 兼容端点）：llama.cpp / LM Studio / vLLM / Ollama 都是这个协议。
     为什么由页面直连：Worker 在 Cloudflare 边缘，永远够不着 127.0.0.1；
     而 llama.cpp 默认就回 CORS 头，浏览器可以直接说上话。
     提示词与「去 AI 味」仍然由服务端给（/api/ta/prompt、/api/ta/polish），只有一份实现。 */
  var LOCAL_LLM = { url: 'http://127.0.0.1:8080/v1', model: '', probeMs: 1500, chatMs: 30000 };

  var PERSONAS = [
    { id: 'gentle', title: '温柔 · 守夜人', desc: '「慢慢说，我在听」——先接住情绪，再聊事情。' },
    { id: 'sunny', title: '元气 · 小太阳', desc: '「好耶！说来听听」——热情、爱起哄、顺手给建议。' },
    { id: 'clear', title: '清醒 · 参谋', desc: '「先把问题拆开」——冷静、克制、给下一步动作。' }
  ];

  /* 人设只开放四项预设（性别 / 音色 / 性格 / 名字），下面这份内置镜像保证离线也能开局；
     联网时用 /api/ta/config 的结果覆盖合并（服务端是唯一权威，音色池与 src/tts.js 同源）。 */
  var GENDERS = [
    { id: 'female', label: '女声', desc: '偏柔和、细腻的听感' },
    { id: 'male', label: '男声', desc: '偏沉稳、清亮的听感' }
  ];

  var VOICES = {
    female: [
      { id: 'zh-CN-XiaoxiaoNeural', name: '普通 · 晓晓' },
      { id: 'zh-CN-XiaoyiNeural', name: '元气 · 晓伊' },
      { id: 'zh-HK-HiuGaaiNeural', name: '粤语 · 曉佳' },
      { id: 'zh-HK-HiuMaanNeural', name: '粤语 · 曉曼' },
      { id: 'zh-TW-HsiaoChenNeural', name: '台湾腔 · 曉臻' },
      { id: 'zh-TW-HsiaoYuNeural', name: '台湾腔 · 曉雨' }
    ],
    male: [
      { id: 'zh-CN-YunjianNeural', name: '沉稳 · 云健' },
      { id: 'zh-CN-YunxiNeural', name: '阳光 · 云希' },
      { id: 'zh-CN-YunxiaNeural', name: '少年 · 云夏' },
      { id: 'zh-CN-YunyangNeural', name: '磁性 · 云扬' },
      { id: 'zh-HK-WanLungNeural', name: '粤语 · 雲龍' },
      { id: 'zh-TW-YunJheNeural', name: '台湾腔 · 雲哲' }
    ]
  };

  var NAMES = {
    female: ['小满', '晚晚', '知夏', '阿离', '南栀', '清和', '小雅'],
    male: ['阿澄', '云舟', '砚青', '临岸', '十一', '远野']
  };

  /** 服务端能力（/api/ta/config 拉到后覆盖；拉不到就用上面的内置镜像） */
  var SERVER = {
    online: false,
    version: '',
    models: [],
    defaultModel: '',
    features: { voice_out: true, voice_in: true, image: false },
    asr: { available: false },
    tts: { chain: [], local: false, local_voices: [] },  // 服务端合成的实际层（自建 GPT-SoVITS → 站内 MeloTTS）
    ttsProvider: '',   // 上一次成功合成用的层（读 X-TA-TTS-Provider）
    ttsVoice: '',      // 上一次成功合成用的音色（读 X-TA-TTS-Voice）
    ttsAttempts: '',   // 上一次的降级原因（读 X-TA-TTS-Attempts，ASCII 短码，空串=没降级）
    llm: { enabled: false, url: '', model: '', defaults: { url: '', model: '' } },  // 服务端给的本机模型提示（可空）
    localState: '',    // 本机模型最近一次探测结果：ready / timeout / net / http…（空 = 还没探）
    localModel: '',    // 本机模型实际用的模型名（来自 /v1/models）
    lastVia: ''        // 上一句台词是谁说的：local（本机模型）/ cloud（服务端模型）/ 空（本机台词库）
  };

  function localComplete(cfg, model, messages, voice) {
    if (!model) return Promise.resolve({ ok: false, code: 'NO_MODEL', reply: '' });
    var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, LOCAL_LLM.chatMs);
    var t0 = Date.now();
    var opt = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store',
      body: JSON.stringify({
        model: model,
        messages: messages,
        temperature: 0.95,
        max_tokens: voice ? 160 : 320,
        stream: false
      })
    };
    if (ctl) opt.signal = ctl.signal;
    return fetch(cfg.url + '/chat/completions', opt).then(function (res) {
      if (!res.ok) return { ok: false, code: 'HTTP_' + res.status, reply: '' };
      return res.json().then(function (d) {
        var c = d && d.choices && d.choices[0];
        var text = String((c && ((c.message && c.message.content) || c.text)) || '');
        var raw = tidyLocal(text, voice);
        if (!raw) return { ok: false, code: 'EMPTY', reply: '' };
        return {
          ok: true,
          raw: raw,
          reply: raw,
          model: { id: 'local', label: '本机 · ' + model, provider: 'local' },
          latency: Date.now() - t0,
          via: 'local'
        };
      });
    }).catch(function (e) {
      return { ok: false, code: (e && e.name === 'AbortError') ? 'TIMEOUT' : 'NETWORK', reply: '' };
    }).finally(function () { clearTimeout(timer); });
  }

  /* ================= 传输层（TA 唯一的联网口） =================
     本机模型（§8.1）是这条契约的第一次真换：chat 里收口「本机优先 → 云端 → 模板」，
     引擎层（意图 / 记忆 / 心情 / 台词库）一行都没动；换设备端模型同样只改这一处。 */
  var TA_API = {
    online: function () {

    req: function (path, init, timeoutMs) {

    config: function () {

      return TA_API.req('/config', { method: 'GET' }, 5000).then(function (r) {

        SERVER.version = String(d.version || '');
        SERVER.models = Array.isArray(d.models) ? d.models : [];
        SERVER.defaultModel = String(d.default_model || '');

        if (d.asr) SERVER.asr = d.asr;
        if (d.voices) SERVER.voices = d.voices;
        if (d.tts) SERVER.tts = d.tts;

    },

    /* 生成台词：服务端已做「去 AI 味」清洗，这里只兜长度与空值（云端链路） */
    cloud: function (payload) {
      if (!TA_API.online() || typeof fetch !== 'function') {
        return Promise.resolve({ ok: false, code: 'OFFLINE', reply: '' });
      }
      return TA_API.req('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload || {})
      }, CHAT_TIMEOUT_MS).then(function (r) {
        var d = (r && r.data) || {};
        var text = String(d.reply || '').trim();

        return { ok: false, code: code, reply: '' };

    },

    /* 台词主链路：本机优先（auto）/ 只云端（cloud）/ 只本机（local）。
       「谁来说」在这里收口，引擎层（意图 / 记忆 / 心情 / 台词库）完全不感知。 */
    chat: function (payload) {
      if (!TA_API.online() || typeof fetch !== 'function') {
        return Promise.resolve({ ok: false, code: 'OFFLINE', reply: '' });
      }
      var cfg = TA_API.localCfg();
      var first = cfg.enabled
        ? TA_API.localChat(payload)
        : Promise.resolve({ ok: false, code: 'LOCAL_OFF', reply: '' });
      return first.then(function (r) {
        if (r && r.ok && r.reply) { SERVER.lastVia = 'local'; return r; }
        if (cfg.onlyLocal) {
          SERVER.lastVia = '';
          return { ok: false, code: (r && r.code) || 'LOCAL_DOWN', reply: '' };
        }
        return TA_API.cloud(payload).then(function (c) {

        });

    },

    /* 本机模型的设置（存在状态里：地址 / 模型名 / 三种模式） */
    localCfg: function () {
      var s = (state && state.local) || {};
      var mode = /^(auto|cloud|local)$/.test(String(s.mode || '')) ? String(s.mode) : 'auto';
      return {
        mode: mode,
        enabled: mode !== 'cloud',
        onlyLocal: mode === 'local',
        url: normalizeLocalUrl(s.url),
        model: trimStr(s.model, 80)
      };
    },

    /* 探一下本机端点活没活：GET /v1/models（1.5s 超时，15s 缓存） */
    localProbe: function (cfg, force) {
      var url = (cfg && cfg.url) || normalizeLocalUrl(state && state.local && state.local.url);
      var now = Date.now();
      if (!force && LOCAL_PROBE.res && LOCAL_PROBE.url === url && now - LOCAL_PROBE.at < 15000) {
        return Promise.resolve(LOCAL_PROBE.res);
      }
      if (typeof fetch !== 'function') return Promise.resolve({ ok: false, reason: 'nofetch' });
      var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); }, LOCAL_LLM.probeMs);
      var opt = { method: 'GET', cache: 'no-store' };
      if (ctl) opt.signal = ctl.signal;
      return fetch(url + '/models', opt).then(function (res) {
        if (!res.ok) return { ok: false, reason: 'http' + res.status };
        return res.json().then(function (d) {

        }, function () { return { ok: false, reason: 'json' }; });
      }).catch(function (e) {

      }).then(function (out) {
        LOCAL_PROBE = { at: Date.now(), url: url, res: out };
        SERVER.localState = out.ok ? 'ready' : (out.reason || 'down');
        if (out.model) SERVER.localModel = out.model;
        return out;
      }).finally(function () { clearTimeout(timer); });
    },

    /* 系统提示词：作者是服务端（人设收紧 + 去 AI 味都写在这份提示里）；拉不到就用上次缓存的那份 */
    localSystem: function (payload) {
      var key = promptKey(payload);
      if (PROMPT_CACHE[key]) return Promise.resolve(PROMPT_CACHE[key]);
      return TA_API.req('/prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          persona: payload && payload.persona,
          mood: payload && payload.mood,
          intimacy: payload && payload.intimacy,
          memories: payload && payload.memories,
          channel: payload && payload.channel
        })
      }, 6000).then(function (r) {
        var d = (r && r.data) || {};
        var sys = (r && r.ok && d.success) ? String(d.system || '') : '';
        if (sys) { rememberPrompt(key, sys); return sys; }
        return String((state && state.localPrompt) || '');
      }).catch(function () {
        return String((state && state.localPrompt) || '');
      });
    },

    /* 走本机模型：探活 → 取提示词 → 本机生成 → 服务端擦 AI 腔 → 返回台词 */
    localChat: function (payload) {
      var cfg = TA_API.localCfg();
      if (!cfg.enabled || typeof fetch !== 'function') {
        return Promise.resolve({ ok: false, code: 'LOCAL_OFF', reply: '' });
      }
      return TA_API.localProbe(cfg).then(function (probe) {
        if (!probe.ok) return { ok: false, code: 'LOCAL_DOWN', reply: '' };
        return TA_API.localSystem(payload).then(function (sys) {
          if (!sys) return { ok: false, code: 'NO_PROMPT', reply: '' };
          var msgs = [{ role: 'system', content: sys }];
          ((payload && payload.recent) || []).slice(-8).forEach(function (m) {
            var t = trimStr(m && m.text, 300);
            if (t) msgs.push({ role: (m.role === 'me') ? 'user' : 'assistant', content: t });
          });
          msgs.push({ role: 'user', content: trimStr(payload && payload.message, 500) });
          var voice = !!(payload && payload.channel === 'voice');
          // 用户手填的模型名优先；留空才用 /v1/models 报的第一个
          return localComplete(cfg, cfg.model || probe.model, msgs, voice).then(function (r) {
            if (!r.ok) return r;
            return TA_API.polish(r.raw, voice ? 'voice' : 'text').then(function (clean) {
              if (clean) r.reply = clean;
              delete r.raw;
              return r;
            });
          });
        });
      });
    },

    /* 「去 AI 味」：服务端 humanizeTaReply 是唯一权威；拉不到就保留本机 tidyLocal 的结果 */
    polish: function (text, channel) {
      if (!TA_API.online() || typeof fetch !== 'function') return Promise.resolve('');
      return TA_API.req('/polish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: String(text || '').slice(0, 600), channel: channel === 'voice' ? 'voice' : 'text' })
      }, 5000).then(function (r) {
        var d = (r && r.data) || {};
        return (r && r.ok && d.success) ? String(d.reply || '') : '';
      }).catch(function () { return ''; });
    },

    /* 语音合成 → 可直接播放的 objectURL（失败返回 null，页面改用设备语音）。
       ctl 由 speak() 传入：说话被打断 / 被新台词顶掉时立刻掐掉这次合成，
       免得旧请求还占着自建层和隧道，越堆越慢。 */
    tts: function (text, voice, rate, ctl) {
      if (!TA_API.online() || typeof fetch !== 'function') return Promise.resolve(null);
      var own = (typeof AbortController === 'function') ? new AbortController() : null;
      var timer = setTimeout(function () { if (own) own.abort(); }, TTS_TIMEOUT_MS);
      var opt = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, voice: voice, rate: rate || '+0%' })
      };
      var signal = (ctl && ctl.signal) ? ctl.signal : (own ? own.signal : null);
      if (signal) opt.signal = signal;
      return fetch(TA_API_BASE + '/tts', opt).then(function (res) {
        // 服务端链决定实际用哪一层（本地 GPT-SoVITS / 站内 MeloTTS），记下来给状态栏用
        readTtsHeaders(res);
        if (!res.ok) return null;
        return res.blob();
      }).then(function (blob) {

      }).catch(function () { return null; }).finally(function () { clearTimeout(timer); });
    },

    /* 语音识别（浏览器不支持本地识别时的兜底路线；返回空串表示没听清） */
    asr: function (blob) {
      if (!TA_API.online() || typeof fetch !== 'function' || !blob || typeof FileReader !== 'function') {
        return Promise.resolve('');
      }
      return new Promise(function (resolve) {
        var fr = new FileReader();
        fr.onload = function () {
          var b64 = String(fr.result || '').split(',')[1] || '';
          if (!b64) { resolve(''); return; }
          TA_API.req('/asr', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ audio: b64, language: 'zh' })
          }, 20000).then(function (r) {
            var d = (r && r.data) || {};
            resolve((r && r.ok && d.success && d.text) ? String(d.text).trim() : '');
          }).catch(function () { resolve(''); });
        };
        fr.onerror = function () { resolve(''); };
        fr.readAsDataURL(blob);
      });
    }
  };

  API.TA_API = TA_API;
  API.stateRef = function () { return state; };   // 调试/自测用：拿到当前状态对象（与 localStorage 里那份同源）
  API.SERVER = SERVER;
  API.GENDERS = GENDERS;
  API.VOICES = VOICES;
  API.NAMES = NAMES;

  /* ================= 本机存储 ================= */
  var state = defaultState();

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  }

  function load() {

      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return false;
      var base = defaultState();
      state = {
        version: 2,
        persona: (d.persona && (d.persona.gender || d.persona.id || d.persona.tone)) ? normalizePersona(d.persona) : null,
        settings: {
          voice: !(d.settings && d.settings.voice === false),
          cloudVoice: !!(d.settings && d.settings.cloudVoice),
          model: (d.settings && typeof d.settings.model === 'string') ? d.settings.model.slice(0, 40) : ''
        },
        local: {
          mode: /^(auto|cloud|local)$/.test(String((d.local && d.local.mode) || '')) ? String(d.local.mode) : 'auto',
          url: normalizeLocalUrl(d.local && d.local.url),
          model: trimStr(d.local && d.local.model, 80)
        },
        localPrompt: (typeof d.localPrompt === 'string') ? d.localPrompt.slice(0, 4000) : '',
        mood: clamp(Number(d.mood) || base.mood, 0, 100),
        intimacy: clamp(Number(d.intimacy) || 0, 0, 100),
        messages: Array.isArray(d.messages) ? d.messages.slice(-MAX_MESSAGES) : [],
        memories: Array.isArray(d.memories) ? d.memories.slice(0, MAX_MEMORIES) : [],
        createdAt: Number(d.createdAt) || base.createdAt,
        lastAt: Number(d.lastAt) || 0,
        lastProactiveAt: Number(d.lastProactiveAt) || 0,
        lastNetHintAt: Number(d.lastNetHintAt) || 0,
        llmCount: Number(d.llmCount) || 0,
        localCount: Number(d.localCount) || 0

      return true;
    } catch (e) { return false; }
  }

  function save() {
    var ls = store();
    if (!ls) return;
    try { ls.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式等忽略 */ }
  }

  function wipe() {
    var ls = store();
    try { if (ls) ls.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    state = defaultState();
  }

  /* ================= 文案 ================= */
  var INTROS = {
    gentle: ['我是{name}。不着急，你想到什么说什么，我都接着。', '我是{name}。今天说什么都行，我先在这儿等着。', '我在，{call}。慢慢来，不急着说正事。'],
    sunny: ['我是{name}！今天也一起开开心心的吧！', '我是{name}！快说说今天发生了什么好玩的事！', '来啦！{call}今天想聊点什么呀！'],
    clear: ['我是{name}。有事说事，没事也可以随便聊。', '我是{name}。先说结论还是先说过程？', '在。{call}，今天要处理什么？']
  };
  /* ================= 字字动画 ================= */
  /* 这里只管「文字怎么出现」，跟语音没有任何耦合：say() 里语音先起，动画自己跑完。
     每个字（英文按词、emoji 按字）一个 span：整句先占位再逐字淡入，句子不会越写越跳；
     标点后留一拍（句末长、逗号短），长句自动提速，整段有上限；
     全局只有一个动画在跑：新台词立刻顶掉旧的，旧的当场补全并照旧归档（不留半句、不丢消息）；
     收尾把 span 换回纯文本，「减少动效」偏好下直接铺全文。 */
  var REVEAL_PAUSE_STOP = 190;   // 。！？…
  var REVEAL_PAUSE_SOFT = 70;    // ，、；：
  var revealTimer = 0;
  var revealSeq = 0;
  var revealPending = null;

  /* 中文/标点逐字、英文数字连成词、空白原样留在文本节点里（不进 span，免得 pre-wrap 换行丢） */
  function revealTokens(text) {
    var chars = Array.from(String(text == null ? '' : text));
    var out = [];
    var word = '';
    function flush() {
      if (!word) return;
      out.push({ t: word, word: true });
      word = '';
    }
    for (var i = 0; i < chars.length; i++) {
      var c = chars[i];
      if (/\s/.test(c)) { flush(); out.push({ t: c, space: true }); continue; }
      if (/[A-Za-z0-9_'’\-.@#%&+=]/.test(c)) { word += c; continue; }
      flush();
      out.push({ t: c });
    }
    flush();
    return out;
  }

  /* 节奏口径（纯函数，方便自测）：基础间隔按字数自适应 9~40 ms，标点另加一拍 */
  function revealPlan(text) {
    var tokens = revealTokens(text);
    var base = Math.min(40, Math.max(9, Math.round(1000 / Math.max(8, tokens.length))));
    var steps = [];
    for (var i = 0; i < tokens.length; i++) {
      var tk = tokens[i];
      var delay = 0;
      if (!tk.space) {
        delay = base;
        if (/[。！？!?…]$|\.$/.test(tk.t)) delay += REVEAL_PAUSE_STOP;
        else if (/[，,、；;：:]$/.test(tk.t)) delay += REVEAL_PAUSE_SOFT;
      }
      steps.push({ t: tk.t, space: !!tk.space, delay: delay });
    }
    return { base: base, steps: steps };
  }

  function avatarTalk(on) {
    try { if (el && el.avatar && el.avatar.classList) el.avatar.classList[on ? 'add' : 'remove']('talk'); } catch (e) { }
  }

  function scrollDown() { if (el && el.stage) el.stage.scrollTop = el.stage.scrollHeight; }

  /* 被顶掉的那条：当场补全 + 照旧归档（它只是文字慢，消息不能丢） */
  function revealSettle() {
    if (!revealPending) return;
    var f = revealPending;
    revealPending = null;
    f();
  }

  function stream(node, text, done) {
    var plain = String(text == null ? '' : text);
    var steps = revealPlan(plain).steps;
    revealSeq++;
    var mySeq = revealSeq;
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = 0; }
    revealSettle();

    node.textContent = '';
    node.classList.add('revealing');
    var frag = document.createDocumentFragment();
    var items = [];                          // 只有要逐字出现的才进 items
    for (var i = 0; i < steps.length; i++) {
      if (steps[i].space) { frag.appendChild(document.createTextNode(steps[i].t)); continue; }
      var span = document.createElement('span');
      span.className = 'ch';
      span.textContent = steps[i].t;
      frag.appendChild(span);
      items.push({ el: span, delay: steps[i].delay });
    }
    node.appendChild(frag);

    function settle() {
      for (var k = 0; k < items.length; k++) items[k].el.classList.add('on');
      node.textContent = plain;              // 收尾换成纯文本：历史里只留一份字符串
      try { node.classList.remove('revealing'); } catch (e) { }
      avatarTalk(false);
      if (done) done();
    }

    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }

    if (!items.length || reduce) { revealPending = null; settle(); return; }

    revealPending = settle;
    avatarTalk(true);
    var idx = 0;
    var lastScroll = 0;
    function tick() {
      if (mySeq !== revealSeq) return;        // 被新台词顶掉：这轮停手（settle 已由对方代跑）
      items[idx].el.classList.add('on');
      idx++;
      var now = Date.now();
      if (now - lastScroll > 140) { lastScroll = now; scrollDown(); }
      if (idx >= items.length) { revealTimer = 0; revealPending = null; settle(); return; }
      revealTimer = setTimeout(tick, items[idx - 1].delay);
    }
    tick();
  }

  /* ================= DOM 层 ================= */
  var el = {};    // boot() 里按 id 填；提到外层是为了无 DOM 环境（自测）也能安全调用

  function boot() {
    ['stage', 'input', 'sendBtn', 'avatar', 'cpName', 'cpStage', 'cpStatus', 'chips', 'hintRight',
      'setupOverlay', 'genderList', 'voiceList', 'personaList', 'nameList', 'startBtn',
      'openMemory', 'closeDrawer', 'drawer', 'scrim', 'stats', 'memList', 'wipeBtn', 'resetBtn',
      'voiceSrcBtn', 'llmBtn',
      'voiceBtn', 'micBtn', 'imageBtn', 'linkState'
    ].forEach(function (id) { el[id] = document.getElementById(id); });

    var busy = false;
    var last = null;

    function toneOf() { return personaOf().personality || 'gentle'; }
    function nameOf() { return personaOf().name || 'TA'; }
    function callOf() { return '你'; }
    function voiceIdOf() { return personaOf().voice || voiceListOf(personaOf().gender)[0].id; }
    function initial() { return nameOf().slice(0, 1) || '伴'; }

    function ctx() {
      return {
        tone: toneOf(), name: nameOf(), call: callOf(),
        mood: state.mood, intimacy: state.intimacy,
        memories: state.memories, turn: state.messages.length
      };
    }

    function renderTop() {
      el.cpName.textContent = nameOf();
      el.cpStage.textContent = stageOf(state.intimacy);
      el.avatar.textContent = initial();
      el.avatar.classList.toggle('good', state.mood >= 70);
      el.avatar.classList.toggle('low', state.mood < 35);
      el.cpStatus.textContent = '心情 ' + Math.round(state.mood) + ' · 亲密 ' + Math.round(state.intimacy) +
        ' · ' + state.memories.length + ' 条记忆';
      el.hintRight.textContent = state.messages.length
        ? (state.messages.length + ' 条对话 · 模型 ' + (state.llmCount || 0) + ' / 本机 ' + (state.localCount || 0))
        : '';
      renderLink();
      setVoiceUI();
      paintLlmBtn();
    }

    /* 底部左侧：连接状态（人话，不出现技术术语式的报错） */
    function renderLink() {
      var live = TA_API.online();
      var on = !(state.settings && state.settings.voice === false);
      var cloud = !!(state.settings && state.settings.cloudVoice);
      var used = TTS_PROVIDER_LABEL[SERVER.ttsProvider] || '';
      var src = cloud ? ('服务端音色' + (used ? '（' + used + '）' : '')) : '本机音色';
      // 台词是谁说的：本机模型 / 服务端模型；都没接住就是本机台词库
      var said = (SERVER.lastVia === 'local' || SERVER.lastVia === 'cloud')
        ? ('台词走' + (SERVER.lastVia === 'local' ? '本机模型' : '模型'))
        : '台词走本机台词库';
      el.linkState.className = live ? 'cloud' : 'off';
      el.linkState.innerHTML = '<span class="dot">●</span> ' + (!on
        ? '已静音 · 只打字'
        : (live ? '在线 · ' + said + ' · 语音用' + src : '离线 · 本机台词库 + 设备语音，照常聊'));
      // 悬停看得到「上次合成走了哪层 / 本机模型连没连上」：排查用，不占版面
      var notes = [];
      var note = ttsNotice();
      if (note) notes.push('语音链本次记录（用 ' + (SERVER.ttsProvider || '?') + '）：' + note);
      var cfg = TA_API.localCfg();
      notes.push('台词：' + (SERVER.lastVia === 'local'
        ? ('本机模型 ' + (SERVER.localModel || '(名字待探)'))
        : (SERVER.lastVia === 'cloud' ? '服务端模型' : '本机台词库')));
      notes.push('本机端点：' + cfg.url + '（' + (SERVER.localState === 'ready'
        ? '能连上'
        : (SERVER.localState ? '没连上：' + SERVER.localState : '还没探')) + '）');
      el.linkState.title = notes.join('\n');
    }

    /* 音色来源按钮：服务端到底有没有自建 GPT-SoVITS，这里如实说 ——
       否则用户开了「云端音色」听到的还是站内合成，只会觉得声音「莫名变了」。
       注意只在 config 真的拉回来之后才敢下判断（SERVER.online 为假时什么都不说）。 */
    function localTtsOff() {
      return !!(SERVER.online && SERVER.tts && SERVER.tts.local === false);
    }

    function setVoiceSrcUI() {
      var cloud = !!(state.settings && state.settings.cloudVoice);
      var note = (SERVER.tts && SERVER.tts.local)
        ? '：本地 GPT-SoVITS 优先'
        : (localTtsOff() ? '：自建 GPT-SoVITS 未接' : '');
      el.voiceSrcBtn.innerHTML = '音色来源：<b>' + (cloud ? '云端（服务端合成' + note + '）' : '本机语音（快、离线可用）') + '</b>　点这里切换';
    }

    /* 台词模型按钮：点 = 切三种模式（自动 / 只用云端 / 只用本机）；双击 = 改本机地址与模型名 */
    var LLM_MODE_TEXT = {
      auto: '自动（本机优先）',
      cloud: '只用云端',
      local: '只用本机'
    };

    function paintLlmBtn() {
      if (!el.llmBtn) return;
      var cfg = TA_API.localCfg();
      el.llmBtn.innerHTML = '台词模型：<b>' + (LLM_MODE_TEXT[cfg.mode] || LLM_MODE_TEXT.auto) + '</b>　点这里切换';
      var probed = (LOCAL_PROBE.res && LOCAL_PROBE.url === cfg.url) ? LOCAL_PROBE.res : null;
      var stateText = !probed
        ? '还没探'
        : (probed.ok ? ('能连上：' + (probed.model || '已就绪')) : ('没连上（' + (probed.reason || 'down') + '）'));
      el.llmBtn.title = '本机端点：' + cfg.url +
        (cfg.model ? ('\n模型名：' + cfg.model) : '\n模型名：自动（取 /v1/models 第一项）') +
        '\n状态：' + stateText + '\n双击可改地址 / 模型名';
    }

    function setVoiceUI() {
      var on = !(state.settings && state.settings.voice === false);
      el.voiceBtn.textContent = on ? '🔊' : '🔇';
      el.voiceBtn.classList.toggle('on', on);
      el.voiceBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      setVoiceSrcUI();
    }

    function clock(ts) {
      var d = new Date(ts);
      return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    }

    function dayKey(ts) { return new Date(ts).toDateString(); }

    function dayLabel(ts) {
      return dayKey(ts) === new Date().toDateString() ? '今天' : (new Date(ts).getMonth() + 1) + '月' + new Date(ts).getDate() + '日';
    }

    /* scrollDown() 在 IIFE 顶层（字字动画也要用） */

    function rowNode(msg) {
      var row = document.createElement('div');
      row.className = 'row ' + (msg.role === 'me' ? 'me' : 'her');
      if (msg.role !== 'me') {
        var av = document.createElement('div');
        av.className = 'mini';
        av.textContent = initial();
        row.appendChild(av);
      }
      var wrap = document.createElement('div');
      var bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.text || '';
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = clock(msg.at || Date.now());
      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      row.appendChild(wrap);
      return { row: row, bubble: bubble, meta: meta, msg: msg };
    }

    function appendRow(msg) {
      last = rowNode(msg);
      el.stage.appendChild(last.row);
      scrollDown();
      return last;
    }
    function renderAll() {
      el.stage.innerHTML = '';
      var prev = '';
      state.messages.forEach(function (m) {
        var k = dayKey(m.at || Date.now());
        if (k !== prev) {
          prev = k;
          var sep = document.createElement('div');
          sep.className = 'day';
          sep.textContent = dayLabel(m.at || Date.now());
          el.stage.appendChild(sep);
        }
        appendRow(m);
      });
      scrollDown();
    }

    function push(role, text) {
      var msg = {
        id: String(Date.now()) + Math.random().toString(16).slice(2, 6),
        role: role, text: text, at: Date.now()
      };
      state.messages.push(msg);
      if (state.messages.length > MAX_MESSAGES) state.messages = state.messages.slice(-MAX_MESSAGES);
      state.lastAt = msg.at;
      appendRow(msg);
      save();
      renderTop();
      return msg;
    }

    /* 字字动画整段在 IIFE 顶层（见「DOM 层」前的 stream 一节）：
       这样它不依赖 boot()，无 DOM 环境也能单测，API 也能安全地把它挂出去。 */

    function typingNode() {
      var row = document.createElement('div');
      row.className = 'row her';
      var av = document.createElement('div');
      av.className = 'mini';
      av.textContent = initial();
      var b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
      row.appendChild(av);
      row.appendChild(b);
      el.stage.appendChild(row);
      scrollDown();
      return b;
    }

    /* ---------- 侧栏 ---------- */
    function renderStats() {
      var days = Math.max(1, Math.ceil((Date.now() - state.createdAt) / 86400000));
      var rows = [
        ['心情', Math.round(state.mood), state.mood],
        ['亲密', Math.round(state.intimacy), state.intimacy],
        ['关系阶段', stageOf(state.intimacy), state.intimacy],
        ['认识', days + ' 天', Math.min(100, days)],
        ['对话条数', state.messages.length, Math.min(100, state.messages.length)],
        ['记忆条数', state.memories.length, Math.min(100, state.memories.length * 4)],
        ['模型生成', state.llmCount || 0, Math.min(100, (state.llmCount || 0) * 2)],
        ['本机兜底', state.localCount || 0, Math.min(100, (state.localCount || 0) * 2)]
      ];
      el.stats.innerHTML = '';
      rows.forEach(function (r) {
        var box = document.createElement('div');
        box.className = 'stat';
        var span = document.createElement('span');
        var a = document.createElement('b');
        a.textContent = r[0];
        var b = document.createElement('i');
        b.textContent = String(r[1]);
        b.style.fontStyle = 'normal';
        span.appendChild(a);
        span.appendChild(b);
        var bar = document.createElement('div');
        bar.className = 'bar';
        var fillNode = document.createElement('i');
        fillNode.style.width = clamp(Number(r[2]) || 0, 0, 100) + '%';
        bar.appendChild(fillNode);
        box.appendChild(span);
        box.appendChild(bar);
        el.stats.appendChild(box);
      });
    }

    function renderMemories() {
      el.memList.innerHTML = '';
      if (!state.memories.length) {
        var e = document.createElement('div');
        e.className = 'empty';
        e.textContent = '还没有记忆。试试说「我喜欢喝冰美式」「记住我周五要交稿」，TA 会自己记下来。';
        el.memList.appendChild(e);
        return;
      }
      state.memories.forEach(function (mem) {
        var box = document.createElement('div');
        box.className = 'mem';
        var t = document.createElement('div');
        t.className = 'mt';
        t.textContent = mem.type;
        var v = document.createElement('div');
        v.className = 'mv';
        v.textContent = mem.value;
        var d = document.createElement('div');
        d.className = 'md';
        var time = document.createElement('span');
        time.textContent = dayLabel(mem.at || Date.now());
        var del = document.createElement('button');
        del.type = 'button';
        del.textContent = '忘记';
        del.addEventListener('click', function () {
          state.memories = state.memories.filter(function (x) { return x.id !== mem.id; });
          save();
          renderMemories();
          renderStats();
          renderTop();
        });
        d.appendChild(time);
        d.appendChild(del);
        box.appendChild(t);
        box.appendChild(v);
        box.appendChild(d);
        el.memList.appendChild(box);
      });
    }

    function renderChips() {
      el.chips.innerHTML = '';
      CHIPS.forEach(function (text) {
        var c = document.createElement('button');
        c.type = 'button';
        c.className = 'chip';
        c.textContent = text;
        c.addEventListener('click', function () { send(text, true); });
        el.chips.appendChild(c);
      });
    }
    /* ---------- 交互 ---------- */
    function uid() { return String(Date.now()) + Math.random().toString(16).slice(2, 6); }

    function addMemories(text) {
      var found = matchMemories(text);
      var added = null;
      found.forEach(function (f) {
        var dup = state.memories.some(function (m) { return m.type === f.type && m.value === f.value; });
        if (dup) return;
        var mem = { id: uid(), type: f.type, value: f.value, at: Date.now() };
        state.memories.unshift(mem);
        if (state.memories.length > MAX_MEMORIES) state.memories = state.memories.slice(0, MAX_MEMORIES);
        if (!added) added = mem;
      });
      return added;
    }

    function autoGrow() {
      el.input.style.height = 'auto';
      el.input.style.height = Math.min(132, el.input.scrollHeight) + 'px';
    }

    function key() {
      var t = toneOf();
      return t === 'sunny' ? 's' : (t === 'clear' ? 'c' : 'g');
    }

    function commit(msg) {
      state.messages.push(msg);
      if (state.messages.length > MAX_MESSAGES) state.messages = state.messages.slice(-MAX_MESSAGES);
      state.lastAt = msg.at;
      save();
      renderTop();
      busy = false;
      el.sendBtn.disabled = false;
      scrollDown();
    }

    /* ---------- 说话（语音输出）：云端音色优先，失败降级设备语音 ---------- */
    var audioEl = null;
    var speakingUrl = null;
    var toastTimer = null;
    /* 进行中的合成请求：说话打断 / 新台词 / 断网 / 静音都要它立刻停 ——
       否则旧请求还占着自建层与隧道，越堆越慢（听感就是「越聊越机械」） */
    var ttsCtl = null;
    var ttsSeq = 0;
    var ttsDegradeHinted = false;

    function toast(msg) {
      var box = document.getElementById('taToast');
      if (!box) {
        box = document.createElement('div');
        box.id = 'taToast';
        box.style.cssText = 'position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:60;max-width:82%;padding:9px 14px;border-radius:12px;border:1px solid var(--line-2);background:rgba(20,20,32,.96);color:var(--text);font-size:12.5px;line-height:1.5;text-align:center';
        document.querySelector('.app').appendChild(box);
      }
      box.textContent = msg;
      box.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { box.style.display = 'none'; }, 2600);
    }

    /* 掐掉进行中的合成 + 把已排队的响应作废（ttsSeq 变了，迟到的结果自己丢掉） */
    function abortTts() {
      ttsSeq++;
      if (ttsCtl) { try { ttsCtl.abort(); } catch (e) { } ttsCtl = null; }
    }

    function stopSpeaking() {
      abortTts();
      if (audioEl) { try { audioEl.pause(); } catch (e) { } audioEl = null; }
      if (speakingUrl) { try { URL.revokeObjectURL(speakingUrl); } catch (e) { } speakingUrl = null; }
      if (typeof speechSynthesis !== 'undefined') { try { speechSynthesis.cancel(); } catch (e) { } }
    }

    /* 设备本地音色优选：在系统语音里挑跟人设性别/听感最接近的中文音色 */
    var DEVICE_HINTS = {
      female: ['Xiaoxiao', 'Xiaoyi', 'HsiaoChen', 'HsiaoYu', 'HiuGaai', 'HiuMaan', '晓晓', '晓伊', '晓雨', '晓臻',
        'Tingting', '婷婷', 'Meijia', '美佳', 'Xiaomo', 'Yaoyao', 'Sinji', 'female'],
      male: ['Yunjian', 'Yunxi', 'Yunxia', 'Yunyang', 'WanLung', 'YunJhe', '云健', '云希', '云扬', '云龙',
        'Kangkang', 'Liang', 'Yun', 'male']
    };

    function pickDeviceVoice() {
      if (typeof speechSynthesis === 'undefined' || !speechSynthesis.getVoices) return null;
      var all = [];
      try { all = speechSynthesis.getVoices() || []; } catch (e) { return null; }
      if (!all.length) return null;
      var zh = all.filter(function (v) { return /^zh/i.test(v.lang || ''); });
      var pool = zh.length ? zh : all;
      var hints = DEVICE_HINTS[personaOf().gender === 'male' ? 'male' : 'female'];
      for (var i = 0; i < hints.length; i++) {
        for (var j = 0; j < pool.length; j++) {
          var n = ((pool[j].name || '') + ' ' + (pool[j].voiceURI || '')).toLowerCase();
          if (n.indexOf(hints[i].toLowerCase()) >= 0) return pool[j];
        }
      }
      return pool[0] || null;
    }

    /* 设备本地语音（零网络、零延迟）；连它都没有就别硬放，只出文字 */
    function speakLocal(text) {
      if (typeof speechSynthesis === 'undefined' || typeof SpeechSynthesisUtterance === 'undefined') return null;
      try {
        var u = new SpeechSynthesisUtterance(text);
        var v = pickDeviceVoice();
        if (v) { u.voice = v; u.lang = v.lang || 'zh-CN'; } else { u.lang = 'zh-CN'; }
        u.rate = toneOf() === 'sunny' ? 1.06 : 0.98;
        u.pitch = personaOf().gender === 'male' ? 0.92 : 1.06;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        return v;
      } catch (e) { return null; }
    }

    /* 服务端音色没接上时讲一句人话（每次会话只说一次，别念经）：
       用户「第一次好、后面变机械」的困惑，九成是这里没说话。 */
    function serverVoiceHint() {
      if (ttsDegradeHinted) return;
      ttsDegradeHinted = true;
      if (SERVER.online && SERVER.tts && SERVER.tts.local === false) {
        toast('云端音色只有站内合成：自建 GPT-SoVITS 还没接上，先这么听着');
      } else {
        toast('服务端音色这次没接上，先用本机声音；下一句我自动再试');
      }
    }

    /**
     * 说话：默认走设备本地音色（快、离线、按性别挑音色）；
     * 开了「云端音色」或设备没有可用中文音色时，才去要 /api/ta/tts。
     * 「单飞」：一次只允许一个合成在跑，新的顶掉旧的（旧的连请求一起掐）。
     */
    function speak(text) {
      if (!text || (state.settings && state.settings.voice === false)) return;
      if (document.hidden) return;
      stopSpeaking();                      // 顺带中止上一段还没回来的合成
      var device = pickDeviceVoice();
      var preferCloud = !!(state.settings && state.settings.cloudVoice);
      if (!TA_API.online() || (!preferCloud && device)) { speakLocal(text); return; }
      var mySeq = ttsSeq;
      var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
      ttsCtl = ctl;
      TA_API.tts(String(text).slice(0, 300), voiceIdOf(), '+0%', ctl).then(function (url) {
        if (mySeq !== ttsSeq) return;      // 已经被打断 / 被新台词顶掉，这段声音作废
        ttsCtl = null;
        if (!url) { serverVoiceHint(); speakLocal(text); return; }
        speakingUrl = url;
        renderLink();   // 状态栏显示这次实际用的是哪一层（本地 GPT-SoVITS / 站内音色）
        audioEl = new Audio(url);
        audioEl.onended = stopSpeaking;
        var p = audioEl.play();
        if (p && p.catch) p.catch(function () { if (mySeq === ttsSeq) speakLocal(text); });
      })['catch'](function () {
        if (mySeq !== ttsSeq) return;
        ttsCtl = null;
        serverVoiceHint();
        speakLocal(text);
      });
    }

    /**
     * 出一句台词：**先出声，再逐字显示**。
     * 语音和字字动画互不等待 —— 声音不该被字幕拖住（以前是动画播完才开口）；
     * 动画被下一句顶掉时当场补全并照旧归档，消息不会丢。
     */
    function say(out, kind) {
      var msg = { id: uid(), role: 'her', text: out, at: Date.now(), src: kind || 'local' };
      if (msg.src === 'llm') state.llmCount = (state.llmCount || 0) + 1;
      else state.localCount = (state.localCount || 0) + 1;
      renderLink();   // 状态栏如实说这句台词是谁说的（本机模型 / 云端模型 / 本机台词库）
      var node = rowNode({ role: 'her', text: '', at: msg.at });
      el.stage.appendChild(node.row);
      scrollDown();
      speak(out);                                   // 语音先起，不等字幕
      stream(node.bubble, out, function () { commit(msg); });
      busy = true;
      if (el.sendBtn) el.sendBtn.disabled = true;
    }

    /**
     * 回复主链路：本机先算状态 → 请模型说话 → 模型不行就立刻用本机台词接住。
     * 引擎决定「该说什么」，这一层只决定「谁来说」。
     */
    function reply(text, channel) {
      busy = true;
      el.sendBtn.disabled = true;
      var typing = typingNode();
      var c = ctx();
      var started = Date.now();

      function finish(out, kind) {
        var wait = Math.max(0, 420 - (Date.now() - started));
        setTimeout(function () {
          if (typing.parentNode) typing.parentNode.removeChild(typing);
          say(out, kind);
        }, wait);
      }

      if (!TA_API.online()) {
        finish(fallbackReply(text, c, 'offline'), 'local');
        return;
      }

      TA_API.chat({
        message: text,
        persona: personaOf(),
        model: (state.settings && state.settings.model) || '',
        channel: channel === 'voice' ? 'voice' : 'text',
        mood: state.mood,
        intimacy: state.intimacy,
        memories: state.memories.slice(0, 12),
        recent: state.messages.slice(-9, -1).map(function (m) { return { role: m.role, text: m.text }; })
      }).then(function (r) {
        if (r.ok && r.reply) { finish(r.reply, 'llm'); return; }
        var kind = (r.code === 'TIMEOUT' || r.code === 'NETWORK') ? 'confused' : '';
        finish(fallbackReply(text, c, kind), 'local');
      }).catch(function () {
        finish(fallbackReply(text, c, 'confused'), 'local');
      });
    }

    /* ---------- 听（语音输入）：浏览器本地识别优先 → Whisper 兜底 ---------- */
    var recog = null;
    var recorder = null;
    var listening = false;

    function micUI(on) {
      listening = on;
      el.micBtn.classList.toggle('live', on);
      el.input.placeholder = on ? '我在听，你说…' : '说点什么…（Enter 发送 / Shift+Enter 换行）';
    }

    function stopMic() {
      try { if (recog) recog.stop(); } catch (e) { }
      recog = null;
      try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) { }
      micUI(false);
    }

    function startRecognizer() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return false;
      try {
        recog = new SR();
        recog.lang = 'zh-CN';
        recog.continuous = false;
        recog.interimResults = true;
        var base = '';
        recog.onresult = function (e) {
          var txt = '';
          for (var i = e.resultIndex; i < e.results.length; i++) {
            txt += e.results[i][0].transcript;
            if (e.results[i].isFinal) base = (base + ' ' + txt).trim();
          }
          el.input.value = (base + ' ' + txt).trim();
          autoGrow();
        };
        recog.onerror = function () { micUI(false); };
        recog.onend = function () {
          micUI(false);
          var t = el.input.value.trim();
          el.input.value = '';
          autoGrow();
          if (t) send(t, false, 'voice');
        };
        stopSpeaking();
        recog.start();
        micUI(true);
        return true;
      } catch (e) { recog = null; return false; }
    }

    function startRecorder() {
      if (!navigator.mediaDevices || typeof MediaRecorder === 'undefined') return false;
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        var chunks = [];
        try { recorder = new MediaRecorder(stream); } catch (e) { return; }
        recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = function () {
          try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) { }
          micUI(false);
          var blob = new Blob(chunks, { type: 'audio/webm' });
          if (blob.size < 1024) { toast('没听清，再试一次？'); return; }
          el.input.placeholder = '正在听懂你说的话…';
          TA_API.asr(blob).then(function (t) {
            el.input.placeholder = '说点什么…（Enter 发送 / Shift+Enter 换行）';
            if (t) send(t, false, 'voice'); else toast('没听清，你再说一遍？');
          });
        };
        stopSpeaking();
        recorder.start();
        micUI(true);
      }).catch(function () { toast('麦克风没有权限'); });
      return true;
    }

    function toggleMic() {
      if (listening) { stopMic(); return; }
      if (startRecognizer()) return;
      if (startRecorder()) return;
      toast('这个浏览器不支持语音输入，先用键盘吧');
    }

    function send(text, fromChip, channel) {
      if (busy) return;
      var t = text == null ? el.input.value : text;
      t = String(t).trim();
      if (!t) return;
      if (channel === 'voice') { stopSpeaking(); stopMic(); }   // 说话打断：用户一开口就闭嘴
      if (!fromChip) { el.input.value = ''; autoGrow(); }
      var newMem = addMemories(t);
      state.mood = clamp(state.mood + scoreMood(t), 0, 100);
      state.intimacy = clamp(state.intimacy + 2 + (newMem ? 2 : 0), 0, 100);
      push('me', t);
      renderMemories();
      renderStats();
      renderTop();
      save();
      reply(t, channel);
    }

    function maybeProactive() {
      if (busy || !state.persona || document.hidden) return;
      var now = Date.now();
      if (now - state.lastAt < IDLE_MS) return;
      if (now - (state.lastProactiveAt || 0) < IDLE_GAP) return;
      state.lastProactiveAt = now;
      save();
      say(fill(pickFresh(LINES.proactive[key()], state.messages.length + Math.round(now / 1000)), '', ctx()), 'local');
    }
    /* ---------- 抽屉 ---------- */
    function openDrawer() {
      renderStats();
      renderMemories();
      paintLlmBtn();
      el.drawer.classList.add('open');
      el.scrim.classList.add('on');
      // 打开抽屉顺手探一下本机模型（用户主动打开，探一次不吵；连不上也不弹任何东西）
      var cfg = TA_API.localCfg();
      if (cfg.enabled) {
        TA_API.localProbe(cfg).then(function () { paintLlmBtn(); renderLink(); });
      }
    }

    function closeDrawer() {
      el.drawer.classList.remove('open');
      el.scrim.classList.remove('on');
    }

    /* ---------- 首次设置（只给预设，不给自由输入） ---------- */
    var draft = normalizePersona(null);

    function namesOf(gender) {
      var g = gender === 'male' ? 'male' : 'female';
      var s = SERVER.names && SERVER.names[g];
      if (s && s.length) return s;
      return NAMES[g] || NAMES.female;
    }

    function optionNode(title, desc, on, onClick) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (on ? ' on' : '');
      var n = document.createElement('span');
      n.className = 'oname';
      n.textContent = title;
      b.appendChild(n);
      if (desc) {
        var l = document.createElement('span');
        l.className = 'oline';
        l.textContent = desc;
        b.appendChild(l);
      }
      b.addEventListener('click', onClick);
      return b;
    }

    function paintSetup() {
      draft = normalizePersona(draft);

      el.genderList.innerHTML = '';
      GENDERS.forEach(function (g) {
        el.genderList.appendChild(optionNode(g.label, g.desc, draft.gender === g.id, function () {
          draft.gender = g.id;
          draft.voice = voiceListOf(g.id)[0].id;      // 性别与音色必须一致
          draft.name = namesOf(g.id)[0];
          paintSetup();
        }));
      });

      el.voiceList.innerHTML = '';
      voiceListOf(draft.gender).forEach(function (v) {
        el.voiceList.appendChild(optionNode(v.name, '', draft.voice === v.id, function () {
          draft.voice = v.id;
          paintSetup();
        }));
      });

      el.personaList.innerHTML = '';
      PERSONAS.forEach(function (p) {
        el.personaList.appendChild(optionNode(p.title, p.desc, draft.personality === p.id, function () {
          draft.personality = p.id;
          paintSetup();
        }));
      });

      el.nameList.innerHTML = '';
      namesOf(draft.gender).forEach(function (n) {
        el.nameList.appendChild(optionNode(n, '', draft.name === n, function () {
          draft.name = n;
          paintSetup();
        }));
      });
    }

    function openSetup() {
      el.setupOverlay.hidden = false;
      draft = normalizePersona(state.persona);
      paintSetup();
    }

    function startChat() {
      state.persona = normalizePersona(draft);
      el.setupOverlay.hidden = true;
      save();
      renderTop();
      renderMemories();
      renderStats();
      scrollDown();
      /* 刚设好伴侣先说一句 —— 不然「开始对话」之后是一片静默，像坏了 */
      if (!state.messages.length) {
        push('her', fill(pick(INTROS[toneOf()], state.memories.length + nameOf().length), '', ctx()));
      }
    }

    /* ---------- 事件 ---------- */
    el.startBtn.addEventListener('click', startChat);
    el.sendBtn.addEventListener('click', function () { send(null, false); });
    el.voiceBtn.addEventListener('click', function () {
      var on = !(state.settings && state.settings.voice === false);
      state.settings.voice = !on;
      if (!state.settings.voice) stopSpeaking();
      save();
      setVoiceUI();
      if (state.settings.voice) toast('语音已开：能听我说了');
    });
    el.micBtn.addEventListener('click', toggleMic);
    el.voiceSrcBtn.addEventListener('click', function () {
      state.settings.cloudVoice = !state.settings.cloudVoice;
      save();
      setVoiceSrcUI();
      renderLink();
      if (!state.settings.cloudVoice) toast('音色来源：本机语音');
      else if (localTtsOff()) toast('云端音色：自建 GPT-SoVITS 还没接上，先用站内合成（不行自动回本机）');
      else toast('音色来源：云端（服务端合成，不行会自动回本机）');
    });
    var llmClickTimer = null;
    el.llmBtn.addEventListener('click', function () {
      // 双击是「改地址」，别让第一下就切了模式：等 260ms 再执行单击动作
      if (llmClickTimer) { clearTimeout(llmClickTimer); llmClickTimer = null; return; }
      llmClickTimer = setTimeout(function () {
        llmClickTimer = null;
        var order = ['auto', 'cloud', 'local'];
        var cfg = TA_API.localCfg();
        state.local.mode = order[(order.indexOf(cfg.mode) + 1) % order.length];
        save();
        paintLlmBtn();
        renderLink();
        toast(state.local.mode === 'auto'
          ? '台词：本机模型优先，连不上就回云端'
          : (state.local.mode === 'cloud' ? '台词：只用云端模型' : '台词：只用本机模型'));
      }, 260);
    });
    el.llmBtn.addEventListener('dblclick', function () {
      if (llmClickTimer) { clearTimeout(llmClickTimer); llmClickTimer = null; }
      var cfg = TA_API.localCfg();
      var url = window.prompt('本机模型地址（OpenAI 兼容 /v1，例如 http://127.0.0.1:8080/v1）', cfg.url);
      if (url == null) return;
      var model = window.prompt('模型名（留空 = 自动用 /v1/models 的第一项）', cfg.model);
      state.local.url = normalizeLocalUrl(url);
      state.local.model = trimStr(model, 80);
      save();
      paintLlmBtn();
      toast('正在试这台本机模型…');
      TA_API.localProbe(TA_API.localCfg(), true).then(function (r) {
        paintLlmBtn();
        renderLink();
        toast(r.ok ? ('本机模型能连上：' + (r.model || '已就绪')) : '这台没连上，先用云端 / 本机台词兜着');
      });
    });
    el.imageBtn.addEventListener('click', function () {
      toast('图片生成还在做，后续版本开放');
    });
    if (typeof window.addEventListener === 'function') {
      window.addEventListener('online', renderLink);
      window.addEventListener('offline', function () { stopSpeaking(); renderLink(); });
    }
    el.input.addEventListener('input', autoGrow);
    el.input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send(null, false);
      }
    });
    el.openMemory.addEventListener('click', openDrawer);
    el.closeDrawer.addEventListener('click', closeDrawer);
    el.scrim.addEventListener('click', closeDrawer);
    el.resetBtn.addEventListener('click', function () {
      if (!window.confirm('重新设置伴侣？现有对话与记忆会保留。')) return;
      closeDrawer();
      openSetup();
    });
    el.wipeBtn.addEventListener('click', function () {
      if (!window.confirm('清空本机全部数据？对话与记忆都会被删除，无法恢复。')) return;
      wipe();
      closeDrawer();
      el.stage.innerHTML = '';
      renderTop();
      renderMemories();
      renderStats();
      openSetup();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stopSpeaking();
      else maybeProactive();
    });
    setInterval(maybeProactive, 15000);

    /* ---------- 启动 ---------- */
    renderChips();
    load();
    renderTop();
    if (state.persona) {
      el.setupOverlay.hidden = true;
      renderAll();
      renderMemories();
      renderStats();
      if (!state.messages.length) {
        push('her', fill(pick(INTROS[toneOf()], state.memories.length + nameOf().length), '', ctx()));
      }
    } else {
      openSetup();
    }
    autoGrow();

    /* 服务端能力异步补全（音色池 / 预设 / 功能开关）；拉不到就继续用内置镜像 */
    TA_API.config().then(function (cfg) {
      if (!cfg) return;
      if (state.persona) {
        state.persona = normalizePersona(state.persona);
        renderTop();
      } else {
        paintSetup();
      }
    });
  }

  if (typeof document !== 'undefined' && document.getElementById) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})();
</script>
</body>
</html>
