<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 角色工坊</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed; min-height: 100vh; overflow-x: hidden; line-height: 1.7;
}
a { color: inherit; text-decoration: none; }

.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 72px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
  background: linear-gradient(to bottom, rgba(5,5,8,.52), transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .12em; font-size: 15px; }
.header .logo img { height: 30px; width: auto; }
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s, transform .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); transform: translateY(-1px); }
.header-link.accent { background: var(--accent); color: #0a0a12; font-weight: 600; }
.header-link.accent:hover { opacity: .88; }

/* 创造下拉 */
.create-wrap { position: relative; }
.create-menu {
  position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
  min-width: 210px; background: #161722; border: 1px solid var(--glass-border);
  border-radius: 14px; padding: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  opacity: 0; visibility: hidden; transform: translateY(-6px);
  transition: opacity .2s, transform .2s, visibility 0s linear .2s;
}
.create-menu.open { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity .2s, transform .2s; }
.create-menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent;
  color: rgba(255,255,255,.82); font: inherit; font-size: 13px; text-align: left;
  padding: 11px 12px; border-radius: 10px; cursor: pointer; transition: background .2s;
}
.create-menu button:hover { background: rgba(139,139,255,.16); color: #fff; }
.create-menu .menu-icon { font-size: 17px; }
.create-menu .menu-sub { display: block; font-size: .7rem; color: var(--muted); margin-top: 2px; }

.page { max-width: 1100px; margin: 0 auto; padding: 110px 24px 100px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem; }
.page-head h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; }
.page-head p { color: var(--muted); font-size: .9rem; margin-top: .3rem; }

/* Tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 1.4rem; }
.tab {
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.05);
  color: var(--muted); padding: 9px 20px; border-radius: 999px; font-size: 13px;
  cursor: pointer; transition: all .25s; font: inherit;
}
.tab:hover { color: #fff; }
.tab.active { background: var(--accent); color: #0a0a12; font-weight: 600; border-color: transparent; }
.tab .cnt { font-size: .72rem; opacity: .8; margin-left: 4px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }

.card {
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.05);
  border-radius: 18px; overflow: hidden; cursor: pointer;
  transition: transform .25s, background .25s, border .25s;
  backdrop-filter: blur(18px); display: flex; flex-direction: column;
  position: relative;
}
@media (hover: hover) { .card:hover { transform: translateY(-4px); background: rgba(255,255,255,.08); border-color: rgba(139,139,255,.3); } }
.card .thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: center top; background: #0c0d14; display: block; }
.card .body { padding: 1rem 1.1rem 1.2rem; flex: 1; display: flex; flex-direction: column; }
.card .name { font-size: 1.05rem; font-weight: 700; margin-bottom: .15rem; }
.card .world { font-size: .74rem; color: var(--accent); margin-bottom: .5rem; }
.card .hook { font-size: .82rem; color: rgba(255,255,255,.6); line-height: 1.55; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { font-size: .7rem; color: var(--muted); margin-top: .8rem; display: flex; justify-content: space-between; align-items: center; }

/* Card action buttons */
.card-actions {
  position: absolute; top: 10px; right: 10px; display: flex; gap: 6px;
  opacity: 0; transition: opacity .2s; z-index: 5;
}
.card:hover .card-actions { opacity: 1; }
@media (hover: none) { .card-actions { opacity: 1; } }
.card-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all .2s;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.card-btn.edit { background: rgba(255,255,255,.15); color: rgba(255,255,255,.9); }
.card-btn.edit:hover { background: rgba(139,139,255,.4); color: #fff; }
.card-btn.del { background: rgba(255,80,80,.2); color: rgba(255,160,160,.9); }
.card-btn.del:hover { background: rgba(255,80,80,.45); color: #fff; }

/* World card extras */
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin: .2rem 0 .5rem; }
.badge {
  font-size: .66rem; padding: 2px 9px; border-radius: 999px;
  background: rgba(139,139,255,.16); color: #b7b7ff; letter-spacing: .02em;
}
.badge.form { background: rgba(120,220,170,.14); color: #9fdcbb; }
.badge.status { background: rgba(255,190,90,.14); color: #f0c37f; }

.create-card {
  border: 1px dashed rgba(139,139,255,.35); background: rgba(139,139,255,.04);
  border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; cursor: pointer; min-height: 260px; color: var(--muted);
  transition: all .25s; font: inherit;
}
.create-card:hover { border-color: var(--accent); color: #fff; background: rgba(139,139,255,.09); }
.create-card .plus { font-size: 2.2rem; opacity: .7; }
.create-card .label { font-size: .9rem; }

.empty {
  padding: 80px 20px; text-align: center; border: 1px dashed rgba(255,255,255,.10);
  border-radius: 20px; color: rgba(255,255,255,.32); font-size: 14px;
}
.empty .big { font-size: 2.4rem; margin-bottom: .8rem; opacity: .5; }
.empty .go {
  margin-top: 1.4rem; display: inline-block; border: 0; border-radius: 12px;
  padding: 12px 26px; background: var(--accent); color: #0a0a12; font-weight: 700;
  cursor: pointer; transition: opacity .2s, transform .2s;
}
.empty .go:hover { opacity: .88; transform: translateY(-1px); }

.loading-screen { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.spinner { width: 26px; height: 26px; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Modal base */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s;
}
.modal-overlay.show { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
.modal {
  width: min(540px, 92vw); max-height: 86vh; overflow-y: auto;
  background: linear-gradient(135deg, #161722, #0c0d14);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 26px 24px; transform: translateY(16px) scale(.97); opacity: 0;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.modal-overlay.show .modal { transform: translateY(0) scale(1); opacity: 1; }
.modal h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 1rem; }
.modal .field-group { margin-bottom: 1rem; }
.modal .field-group label { display: block; font-size: .74rem; color: var(--muted); margin-bottom: .35rem; }
.modal .field-group input, .modal .field-group textarea {
  width: 100%; border: 1px solid rgba(255,255,255,.10); border-radius: 10px;
  padding: 10px 14px; background: rgba(255,255,255,.05); color: #fff;
  outline: none; font: inherit; font-size: .88rem; transition: border .3s;
}
.modal .field-group input:focus, .modal .field-group textarea:focus { border-color: var(--accent); }
.modal .field-group textarea { min-height: 70px; resize: vertical; line-height: 1.6; }
.modal-actions { display: flex; gap: .8rem; margin-top: 1.4rem; }
.modal-actions .btn {
  flex: 1; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer;
  font-weight: 600; transition: opacity .2s, transform .2s;
}
.modal-actions .btn-save { background: var(--accent); color: #0a0a12; }
.modal-actions .btn-save:hover { opacity: .88; transform: translateY(-1px); }
.modal-actions .btn-save:disabled { opacity: .4; cursor: wait; }
.modal-actions .btn-cancel { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.1); }
.modal-actions .btn-cancel:hover { background: rgba(255,255,255,.14); color: #fff; }
.modal-actions .btn-delete { background: rgba(255,80,80,.5); color: #fff; }
.modal-actions .btn-delete:hover { background: rgba(255,80,80,.7); }
.confirm-text { font-size: .92rem; color: rgba(255,255,255,.8); line-height: 1.6; text-align: center; }
.confirm-name { color: var(--accent); font-weight: 700; }

/* Wizard */
.wizard-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem; }
.wizard-steps { display: flex; gap: 5px; }
.wizard-step-dot { width: 20px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.10); transition: all .35s; }
.wizard-step-dot.done { background: var(--accent); }
.wizard-step-dot.active { background: #c9a84c; box-shadow: 0 0 8px rgba(201,168,76,.4); }
.wstep { display: none; animation: wstepIn .4s cubic-bezier(.2,.8,.2,1); }
.wstep.active { display: block; }
@keyframes wstepIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.wstep-title { font-size: 1.15rem; font-weight: 700; margin-bottom: .25rem; }
.wstep-desc { font-size: .82rem; color: var(--muted); margin-bottom: 1.2rem; }
.option-grid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.option-card {
  position: relative; cursor: pointer; border: 1px solid var(--glass-border); border-radius: 12px;
  padding: 14px 12px; background: rgba(255,255,255,.04); transition: all .25s; user-select: none;
  display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center;
}
.option-card:hover { border-color: rgba(139,139,255,.35); background: rgba(255,255,255,.07); }
.option-card.selected {
  border-color: rgba(201,168,76,.6); background: rgba(201,168,76,.08);
  box-shadow: 0 0 0 1px rgba(201,168,76,.3);
}
.option-card.selected .check {
  position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%;
  background: #c9a84c; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #0a0a12;
}
.option-card .check { display: none; }
.option-card .name { font-size: .9rem; font-weight: 600; }
.option-card .desc { font-size: .7rem; color: var(--muted); line-height: 1.4; }
.option-card .emoji { font-size: 1.6rem; }

.char-select-grid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); max-height: 42vh; overflow-y: auto; padding-right: 4px; }
.char-select {
  position: relative; display: flex; gap: 10px; align-items: center; cursor: pointer;
  border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px;
  background: rgba(255,255,255,.04); transition: all .2s; user-select: none;
}
.char-select:hover { border-color: rgba(139,139,255,.35); }
.char-select.selected { border-color: rgba(201,168,76,.6); background: rgba(201,168,76,.07); }
.char-select.selected .check {
  position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%;
  background: #c9a84c; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #0a0a12;
}
.char-select .check { display: none; }
.char-select img { width: 44px; height: 44px; object-fit: cover; border-radius: 10px; background: #0c0d14; }
.char-select .cs-name { font-size: .85rem; font-weight: 600; }
.char-select .cs-world { font-size: .68rem; color: var(--muted); }

.cover-preview {
  width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px;
  background: #0c0d14; border: 1px solid var(--glass-border); display: block; margin-bottom: .8rem;
}
.form-grid { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

/* World detail */
.detail-cover { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; background: #0c0d14; display: block; margin-bottom: 1rem; border: 1px solid var(--glass-border); }
.detail-desc { font-size: .85rem; color: rgba(255,255,255,.72); line-height: 1.7; margin: .6rem 0 .9rem; }
.detail-cast { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: .4rem; }
.detail-cast .dc { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-border); cursor: pointer; }
.detail-cast .dc:hover { border-color: var(--accent); }
.detail-cast img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #0c0d14; }
.detail-cast .dc-name { font-size: .78rem; }
.hint-line { font-size: .78rem; color: var(--muted); margin-top: .4rem; }

/* Toast */
#toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
  background: rgba(20,22,32,.94); border: 1px solid rgba(139,139,255,.4); color: #fff;
  padding: 11px 22px; border-radius: 999px; font-size: 13px; z-index: 500;
  opacity: 0; visibility: hidden; transition: all .3s; pointer-events: none; white-space: nowrap; max-width: 90vw;
}
#toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .header { height: 58px; padding: 0 16px; }
  .page { padding: 80px 16px calc(60px + env(safe-area-inset-bottom)); }
  .page-head h1 { font-size: 1.5rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .8rem; }
  .card .body { padding: .7rem .8rem .8rem; }
  .card .name { font-size: .92rem; }
  .header-link { padding: 7px 12px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="loading-screen" id="loading"><span class="spinner"></span></div>

<div id="app" style="display:none;">
  <header class="header">
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="/" id="backLink" class="header-link" style="padding:8px 13px;font-size:13px;">← 我的主页</a>
      <a class="logo" href="/?entered=1"><img src="/logo1.png" alt="HYOOL"></a>
    </div>
    <div style="display:flex;gap:.6rem;align-items:center;" id="headerActions">
      <div class="create-wrap">
        <button class="header-link accent" id="createBtn">＋ 创造 ▾</button>
        <div class="create-menu" id="createMenu">
          <button data-act="role"><span class="menu-icon">🎭</span><span>创造角色<span class="menu-sub">孕育新的 AI 生命，作为世界的演员</span></span></button>
          <button data-act="world"><span class="menu-icon">🌍</span><span>自定义世界<span class="menu-sub">从题材到选角，搭建你的世界</span></span></button>
        </div>
      </div>
      <button class="header-link" id="logoutBtn">退出</button>
      <a class="header-link accent" href="/yonder" id="loginLink" style="display:none;">登录</a>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>角色工坊</h1>
        <p id="subTitle">自定义创造 AI 角色，作为你世界剧本的演员。</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="role">角色 <span class="cnt" id="roleCnt"></span></button>
      <button class="tab" data-tab="world">世界 <span class="cnt" id="worldCnt"></span></button>
    </div>

    <!-- 角色区 -->
    <section id="roleSection">
      <div class="grid" id="grid"></div>
      <div class="empty" id="emptyRole" style="display:none;">
        <div class="big">🎭</div>
        <span id="emptyRoleText">这里还没有角色。<br>创造一个，作为你世界的第一位演员。</span>
        <div><button class="go" id="emptyRoleGo">创造角色</button></div>
      </div>
    </section>

    <!-- 世界区 -->
    <section id="worldSection" style="display:none;">
      <div class="grid" id="worldGrid"></div>
      <div class="empty" id="emptyWorld" style="display:none;">
        <div class="big">🌍</div>
        <span id="emptyWorldText">还没有世界。<br>自定义一个世界，让角色与故事真正存在。</span>
        <div><button class="go" id="emptyWorldGo">自定义世界</button></div>
      </div>
    </section>
  </main>
</div>

<!-- 自定义世界向导 -->
<div class="modal-overlay" id="wizardModal">
  <div class="modal">
    <div class="wizard-head">
      <h2 style="margin:0;">自定义世界</h2>
      <div class="wizard-steps" id="wizardSteps"></div>
    </div>

    <div class="wstep active" data-wstep="1">
      <div class="wstep-title">选择<span style="color:#c9a84c;">世界题材</span></div>
      <div class="wstep-desc">你的世界将基于哪种想象展开？</div>
      <div class="option-grid" id="genreGrid"></div>
    </div>

    <div class="wstep" data-wstep="2">
      <div class="wstep-title">命名与<span style="color:#c9a84c;">设定</span></div>
      <div class="wstep-desc">一句话设定会参与封面生成，越具体越贴近想象。</div>
      <div class="field-group"><label>世界名称</label><input type="text" id="wName" maxlength="40" placeholder="例如：星陨之地"></div>
      <div class="field-group"><label>一句话设定</label><textarea id="wDesc" maxlength="300" placeholder="例如：被流星撕裂的大陆上，最后一个守夜人苏醒了。"></textarea></div>
      <div class="wstep-title" style="font-size:.95rem;margin-bottom:.6rem;">世界载体</div>
      <div class="form-grid" id="formGrid"></div>
    </div>

    <div class="wstep" data-wstep="3">
      <div class="wstep-title">选择<span style="color:#c9a84c;">角色</span></div>
      <div class="wstep-desc">从你的角色工坊里挑选世界的演员（可多选，也可跳过稍后补充）。</div>
      <div class="char-select-grid" id="wCastGrid"></div>
    </div>

    <div class="wstep" data-wstep="4">
      <div class="wstep-title">生成<span style="color:#c9a84c;">封面</span></div>
      <div class="wstep-desc">AI 将按题材与设定绘制世界封面，不满意可重新生成。</div>
      <img class="cover-preview" id="coverPreview" alt="世界封面" onerror="this.style.opacity=.2">
      <div style="display:flex;gap:.6rem;">
        <button class="btn btn-cancel" style="flex:1;" onclick="wizardRegenCover()">🔄 换一张</button>
      </div>
    </div>

    <div class="wstep" data-wstep="5">
      <div class="wstep-title">确认<span style="color:#c9a84c;">创建</span></div>
      <div class="wstep-desc">核对信息后创建世界，之后可随时编辑与补充。</div>
      <img class="cover-preview" id="coverPreview2" alt="世界封面" style="max-height:180px;object-fit:cover;">
      <div class="hint-line" id="wSummary" style="margin-bottom:.6rem;"></div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="wizardPrev">上一步</button>
      <button class="btn btn-save" id="wizardNext">下一步</button>
    </div>
  </div>
</div>

<!-- 世界详情 -->
<div class="modal-overlay" id="worldDetailModal">
  <div class="modal">
    <h2>世界详情</h2>
    <img class="detail-cover" id="detailCover" alt="">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.2rem;" id="detailBadges"></div>
    <h2 style="font-size:1.4rem;margin:.4rem 0 .2rem;" id="detailName">—</h2>
    <p class="detail-desc" id="detailDesc"></p>
    <div class="field-group"><label>世界角色</label><div class="detail-cast" id="detailCast"></div></div>
    <div class="field-group"><label>剧本</label><div id="detailScript"></div></div>
    <div class="modal-actions">
      <button class="btn btn-delete" id="detailDelete">删除世界</button>
      <button class="btn btn-save" id="detailPlay">进入工坊</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>编辑角色</h2>
    <div class="field-group"><label>名字</label><input type="text" id="editName" maxlength="40"></div>
    <div class="field-group"><label>外貌</label><textarea id="editAppearance" maxlength="800"></textarea></div>
    <div class="field-group"><label>性格</label><textarea id="editPersonality" maxlength="800"></textarea></div>
    <div class="field-group"><label>背景</label><textarea id="editBackground" maxlength="2000"></textarea></div>
    <div class="field-group"><label>说话风格</label><textarea id="editSpeech" maxlength="400"></textarea></div>
    <div class="field-group"><label>世界名称</label><input type="text" id="editWorldName" maxlength="80"></div>
    <div class="field-group"><label>世界描述</label><textarea id="editWorldDesc" maxlength="1200"></textarea></div>
    <div class="field-group"><label>故事钩子</label><textarea id="editHook" maxlength="400"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="editCancel">取消</button>
      <button class="btn btn-save" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h2 id="deleteTitle">删除角色</h2>
    <p class="confirm-text">确定删除 <span class="confirm-name" id="deleteName"></span> 吗？<br><span id="deleteExtra"></span></p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="deleteCancel">取消</button>
      <button class="btn btn-delete" id="deleteConfirm">删除</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const api = (p, o = {}) => {
  const t = localStorage.getItem("hyool_token");
  const h = { "Content-Type": "application/json", ...(o.headers || {}) };
  if (t) h["Authorization"] = "Bearer " + t;
  return fetch(p, { credentials: "include", ...o, headers: h }).then(async r => {
    let d; try { d = await r.json(); } catch { d = { success: false, error: "服务器返回异常。" }; }
    if (!r.ok) throw new Error(d.error || "请求失败。");
    return d;
  });
};

const $ = id => document.getElementById(id);
const escapeHtml = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const isSvg = u => u && (u.endsWith(".svg") || u.includes("/portrait"));

let isGuest = true;
let allChars = [];
let allWorlds = [];
let editingChar = null;
let deletingChar = null;
let deletingWorld = null;

let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function showModal(id, show) {
  const el = $(id);
  if (!el) return;
  el.classList.toggle("show", !!show);
}

/* 题材与载体选项 */
const GENRES = [
  { id: "fantasy", emoji: "🌌", name: "奇幻", desc: "魔法与传说" },
  { id: "scifi", emoji: "🚀", name: "科幻", desc: "星海与未来" },
  { id: "city", emoji: "🏙️", name: "都市", desc: "灯火与日常" },
  { id: "mystery", emoji: "🔍", name: "悬疑", desc: "迷雾与真相" },
  { id: "wuxia", emoji: "⚔️", name: "武侠", desc: "江湖与侠义" },
  { id: "daily", emoji: "☕", name: "日常", desc: "温柔与陪伴" },
  { id: "apocalypse", emoji: "🌋", name: "末日", desc: "废墟与守望" },
  { id: "custom", emoji: "✨", name: "自定义", desc: "完全原创" }
];
const GENRE_PROMPT = {
  fantasy: "epic fantasy world, magic, glowing forests, floating islands, mysterious ruins",
  scifi: "sci-fi world, neon metropolis, space station, stars, futuristic technology",
  city: "modern city skyline at dusk, warm lights, bustling streets",
  mystery: "mysterious noir city, thick fog, dim streetlights, hidden clues",
  wuxia: "chinese wuxia world, misty mountains, ancient pavilions, flying sword",
  daily: "cozy peaceful everyday scene, warm sunlight, gentle atmosphere",
  apocalypse: "post-apocalyptic wasteland, ruined buildings, dramatic stormy sky",
  custom: "dreamlike original world, surreal landscape, cinematic"
};
const GENRE_LABEL = Object.fromEntries(GENRES.map(g => [g.id, g.name]));
const FORMS = [
  { id: "story", emoji: "📜", name: "故事剧本", desc: "VN / 叙事向" },
  { id: "game", emoji: "🎮", name: "H5 小游戏", desc: "可玩的游戏" },
  { id: "mixed", emoji: "🌍", name: "故事 + 游戏", desc: "两者兼顾" }
];
const FORM_LABEL = { story: "故事剧本", game: "H5 小游戏", mixed: "故事 + 游戏" };

/* Tabs */
function switchTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  $("roleSection").style.display = tab === "role" ? "" : "none";
  $("worldSection").style.display = tab === "world" ? "" : "none";
}

/* 创造下拉 */
function toggleCreateMenu(open) {
  const m = $("createMenu");
  if (open === undefined) open = !m.classList.contains("open");
  m.classList.toggle("open", open);
}

/* ---------- 角色区 ---------- */
function renderChars(chars, guest) {
  allChars = chars || [];
  $("roleCnt").textContent = allChars.length || "";
  const grid = $("grid");

  let html = "";
  if (!allChars.length) {
    $("emptyRole").style.display = "block";
    if (guest) {
      $("emptyRoleText").innerHTML = "还没有公开的角色。<br>登录后来创造第一位演员吧。";
      $("emptyRoleGo").textContent = "登录后创造";
    } else {
      $("emptyRoleText").innerHTML = "这里还没有角色。<br>创造一个，作为你世界的第一位演员。";
      $("emptyRoleGo").textContent = "创造角色";
    }
    grid.innerHTML = "";
    return;
  }
  $("emptyRole").style.display = "none";

  html += allChars.map((c, i) => {
    const href = guest ? "/yonder.html?next=/buddy/" + escapeHtml(c.id) : "/buddy/" + escapeHtml(c.id);
    const actions = guest ? "" : `
      <div class="card-actions">
        <button class="card-btn edit" onclick="event.stopPropagation();openEdit(${i})" title="编辑">✏️</button>
        <button class="card-btn del" onclick="event.stopPropagation();openDelete(${i})" title="删除">🗑️</button>
      </div>`;
    const tag = guest ? "a" : "div";
    const linkAttr = guest ? `href="${href}"` : `onclick="location.href='${href}'"`;
    return `<${tag} class="card" ${linkAttr}>
      ${actions}
      <img class="thumb" src="${escapeHtml(c.image_url || '')}" alt="" onerror="this.style.opacity=.2">
      <div class="body">
        <div class="name">${escapeHtml(c.name || '未名')}</div>
        <div class="world">${escapeHtml(c.world_name || '')}</div>
        <div class="hook">${escapeHtml(c.story_hook || c.appearance || '')}</div>
        <div class="foot"><span>${c.created_at ? new Date(c.created_at).toLocaleDateString('zh-CN') : ''}</span></div>
      </div>
    </${tag}>`;
  }).join("");

  if (!guest) {
    html += `<button class="create-card" onclick="location.href='/create/character/'">
      <div class="plus">+</div><div class="label">创造角色</div>
    </button>`;
  }
  grid.innerHTML = html;
}

/* Edit modal */
function openEdit(idx) {
  const c = allChars[idx];
  if (!c) return;
  editingChar = c;
  $("editName").value = c.name || "";
  $("editAppearance").value = c.appearance || "";
  $("editPersonality").value = c.personality || "";
  $("editBackground").value = c.background || "";
  $("editSpeech").value = c.speech_style || "";
  $("editWorldName").value = c.world_name || "";
  $("editWorldDesc").value = c.world_description || "";
  $("editHook").value = c.story_hook || "";
  showModal("editModal", true);
}

function closeEdit() {
  showModal("editModal", false);
  editingChar = null;
}

async function saveEdit() {
  if (!editingChar) return;
  const btn = $("editSave");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const res = await api("/api/characters/" + editingChar.id + "/update", {
      method: "POST",
      body: JSON.stringify({
        name: $("editName").value.trim(),
        appearance: $("editAppearance").value.trim(),
        personality: $("editPersonality").value.trim(),
        background: $("editBackground").value.trim(),
        speech_style: $("editSpeech").value.trim(),
        world_name: $("editWorldName").value.trim(),
        world_description: $("editWorldDesc").value.trim(),
        story_hook: $("editHook").value.trim()
      })
    });
    if (!res.success) throw new Error(res.error || "保存失败。");
    Object.assign(editingChar, res.character);
    renderChars(allChars, false);
    closeEdit();
    toast("角色已保存。");
  } catch (e) {
    toast(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "保存";
  }
}

/* Delete modal */
function openDelete(idx) {
  const c = allChars[idx];
  if (!c) return;
  deletingChar = c;
  deletingWorld = null;
  $("deleteTitle").textContent = "删除角色";
  $("deleteName").textContent = c.name || "未名";
  $("deleteExtra").textContent = "所有对话和记忆将一并删除，此操作不可撤销。";
  showModal("deleteModal", true);
}

function closeDelete() {
  showModal("deleteModal", false);
  deletingChar = null;
  deletingWorld = null;
}

async function confirmDelete() {
  if (deletingWorld) {
    await deleteWorld();
    return;
  }
  if (!deletingChar) return;
  const btn = $("deleteConfirm");
  btn.disabled = true; btn.textContent = "删除中…";
  try {
    const res = await api("/api/characters/" + deletingChar.id + "/delete", { method: "POST" });
    if (!res.success) throw new Error(res.error || "删除失败。");
    allChars = allChars.filter(c => c.id !== deletingChar.id);
    renderChars(allChars, false);
    closeDelete();
    toast("角色已删除。");
  } catch (e) {
    toast(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "删除";
  }
}

/* ---------- 世界区 ---------- */
function renderWorlds(worlds) {
  allWorlds = worlds || [];
  $("worldCnt").textContent = allWorlds.length || "";
  const grid = $("worldGrid");

  if (!allWorlds.length) {
    $("emptyWorld").style.display = "block";
    grid.innerHTML = "";
    return;
  }
  $("emptyWorld").style.display = "none";

  grid.innerHTML = allWorlds.map((w, i) => {
    const genreLabel = GENRE_LABEL[w.settings && w.settings.genre] || (w.settings && w.settings.genreLabel) || "世界";
    const formLabel = FORM_LABEL[w.type] || w.type;
    const statusLabel = w.status === "published" ? "已上线" : "草稿";
    const castInfo = (w.cast && w.cast.length) ? `演员 ${w.cast.length}` : "暂无演员";
    return `<div class="card" onclick="openWorldDetail(${i})">
      <div class="card-actions">
        <button class="card-btn del" onclick="event.stopPropagation();openWorldDelete(${i})" title="删除">🗑️</button>
      </div>
      <img class="thumb" src="${escapeHtml(w.cover_image || '')}" alt="" onerror="this.style.opacity=.2">
      <div class="body">
        <div class="name">${escapeHtml(w.name)}</div>
        <div class="badges">
          <span class="badge">${escapeHtml(genreLabel)}</span>
          <span class="badge form">${escapeHtml(formLabel)}</span>
          <span class="badge status">${statusLabel}</span>
        </div>
        <div class="hook">${escapeHtml(w.description || '')}</div>
        <div class="foot"><span>${castInfo}</span><span>${w.updated_at ? new Date(w.updated_at).toLocaleDateString('zh-CN') : ''}</span></div>
      </div>
    </div>`;
  }).join("") + `
    <button class="create-card" onclick="openWizard()">
      <div class="plus">+</div><div class="label">自定义世界</div>
    </button>`;
}

function openWorldDetail(idx) {
  const w = allWorlds[idx];
  if (!w) return;
  const genreLabel = GENRE_LABEL[w.settings && w.settings.genre] || (w.settings && w.settings.genreLabel) || "世界";
  const formLabel = FORM_LABEL[w.type] || w.type;
  const statusLabel = w.status === "published" ? "已上线" : "草稿";

  $("detailCover").src = w.cover_image || "";
  $("detailName").textContent = w.name;
  $("detailDesc").textContent = w.description || "暂无设定。";
  $("detailBadges").innerHTML =
    `<span class="badge">${escapeHtml(genreLabel)}</span>` +
    `<span class="badge form">${escapeHtml(formLabel)}</span>` +
    `<span class="badge status">${statusLabel}</span>`;

  const cast = w.cast || [];
  $("detailCast").innerHTML = cast.length
    ? cast.map(c => `<span class="dc" onclick="location.href='/buddy/${escapeHtml(c.id)}'">
        <img src="${escapeHtml(c.image_url || '')}" alt="" onerror="this.style.opacity=.2">${escapeHtml(c.name)}</span>`).join("")
    : `<span class="hint-line">还没有演员，可稍后在工坊中补充。</span>`;

  const rawScript = w.script_json;
  const scenes = Array.isArray(rawScript) ? rawScript : (rawScript && Array.isArray(rawScript.scenes) ? rawScript.scenes : []);
  $("detailScript").innerHTML = scenes.length > 0
    ? `<span class="hint-line">已有 ${scenes.length} 幕剧本${w.source_conversation ? "（沉淀自日常对话）" : ""}。</span>`
    : `<span class="hint-line">剧本尚未生成。在角色对话页「沉淀为剧本」，或稍后在 VN 编辑器中编写。</span>`;

  $("detailDelete").onclick = () => openWorldDelete(idx);
  $("detailPlay").textContent = "进入工坊";
  $("detailPlay").onclick = () => {
    if (w.type === "game" || w.type === "mixed") {
      location.href = w.play_url || "/game-workshop?world=" + w.id;
    } else {
      toast("VN 编辑器即将开放，先试试「沉淀为剧本」吧。");
    }
  };
  showModal("worldDetailModal", true);
}

function openWorldDelete(idx) {
  const w = allWorlds[idx];
  if (!w) return;
  showModal("worldDetailModal", false);
  deletingWorld = w;
  deletingChar = null;
  $("deleteTitle").textContent = "删除世界";
  $("deleteName").textContent = w.name;
  $("deleteExtra").textContent = "世界的剧本与素材将一并删除，此操作不可撤销。";
  showModal("deleteModal", true);
}

async function deleteWorld() {
  if (!deletingWorld) return;
  const btn = $("deleteConfirm");
  btn.disabled = true; btn.textContent = "删除中…";
  try {
    const res = await api("/api/worlds/" + deletingWorld.id + "/delete", { method: "POST" });
    if (!res.success) throw new Error(res.error || "删除失败。");
    allWorlds = allWorlds.filter(w => w.id !== deletingWorld.id);
    renderWorlds(allWorlds);
    closeDelete();
    toast("世界已删除。");
  } catch (e) {
    toast(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "删除";
  }
}

/* ---------- 自定义世界向导 ---------- */
let wizard = { step: 1, genre: null, form: "story", name: "", desc: "", castIds: [], cover: "", seed: 0 };

function renderWizardSteps() {
  $("wizardSteps").innerHTML = Array.from({ length: 5 }, (_, i) => {
    const n = i + 1;
    const cls = n < wizard.step ? "done" : n === wizard.step ? "active" : "";
    return `<span class="wizard-step-dot ${cls}"></span>`;
  }).join("");
}

function wizardGo(step) {
  wizard.step = step;
  renderWizardSteps();
  document.querySelectorAll("#wizardModal .wstep").forEach(el => {
    el.classList.toggle("active", Number(el.dataset.wstep) === step);
  });
  const next = $("wizardNext");
  if (step === 5) {
    next.textContent = "创建世界";
    const castNames = (allChars.filter(c => wizard.castIds.includes(c.id)) || []).map(c => c.name).join("、");
    $("wSummary").innerHTML =
      `题材：${GENRE_LABEL[wizard.genre] || "—"}　载体：${FORM_LABEL[wizard.form] || "—"}<br>` +
      `名称：${escapeHtml(wizard.name)}<br>` +
      (wizard.desc ? `设定：${escapeHtml(wizard.desc)}<br>` : "") +
      `演员：${castNames || "（暂无，稍后补充）"}`;
  } else {
    next.textContent = "下一步";
  }
  next.className = "btn btn-save";
  $("wizardPrev").style.visibility = step === 1 ? "hidden" : "visible";
}

function wizardInit() {
  wizard = { step: 1, genre: null, form: "story", name: "", desc: "", castIds: [], cover: "", seed: 0 };
  $("wName").value = "";
  $("wDesc").value = "";

  $("genreGrid").innerHTML = GENRES.map(g => `
    <div class="option-card" data-genre="${g.id}" onclick="pickGenre('${g.id}')">
      <span class="check">✓</span><span class="emoji">${g.emoji}</span>
      <span class="name">${g.name}</span><span class="desc">${g.desc}</span>
    </div>`).join("");

  $("formGrid").innerHTML = FORMS.map(f => `
    <div class="option-card" data-form="${f.id}" onclick="pickForm('${f.id}')">
      <span class="check">✓</span><span class="emoji">${f.emoji}</span>
      <span class="name">${f.name}</span><span class="desc">${f.desc}</span>
    </div>`).join("");
  pickForm("story");

  $("wCastGrid").innerHTML = allChars.length
    ? allChars.map(c => `
        <div class="char-select" data-cid="${escapeHtml(c.id)}" onclick="toggleCast('${escapeHtml(c.id)}', this)">
          <span class="check">✓</span>
          <img src="${escapeHtml(c.image_url || '')}" alt="" onerror="this.style.opacity=.2">
          <span><span class="cs-name">${escapeHtml(c.name || '未名')}</span><br><span class="cs-world">${escapeHtml(c.world_name || '')}</span></span>
        </div>`).join("")
    : `<span class="hint-line" style="grid-column:1/-1;">还没有角色。可以先跳过，稍后在工坊中补充演员。</span>`;

  wizardGo(1);
}

function pickGenre(id) {
  wizard.genre = id;
  document.querySelectorAll("#genreGrid .option-card").forEach(el => {
    el.classList.toggle("selected", el.dataset.genre === id);
  });
}
function pickForm(id) {
  wizard.form = id;
  document.querySelectorAll("#formGrid .option-card").forEach(el => {
    el.classList.toggle("selected", el.dataset.form === id);
  });
}
function toggleCast(id, el) {
  const idx = wizard.castIds.indexOf(id);
  if (idx >= 0) { wizard.castIds.splice(idx, 1); el.classList.remove("selected"); }
  else { wizard.castIds.push(id); el.classList.add("selected"); }
}

function buildCoverUrl() {
  const g = GENRE_PROMPT[wizard.genre] || GENRE_PROMPT.custom;
  const desc = wizard.desc ? ", " + wizard.desc : "";
  const prompt = `${g}, world named ${wizard.name}${desc}, cinematic concept art, wide shot, highly detailed, no text, no watermark`;
  wizard.seed = Math.floor(Math.random() * 1000000);
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=1024&height=768&nologo=true&model=flux&seed=${wizard.seed}`;
}
function wizardRegenCover() {
  wizard.cover = buildCoverUrl();
  $("coverPreview").src = wizard.cover;
  $("coverPreview2").src = wizard.cover;
}

function wizardNext() {
  if (wizard.step === 1 && !wizard.genre) { toast("请先选择世界题材。"); return; }
  if (wizard.step === 2) {
    wizard.name = $("wName").value.trim();
    wizard.desc = $("wDesc").value.trim();
    if (!wizard.name) { toast("请给世界起个名字。"); return; }
  }
  if (wizard.step === 4 && !wizard.cover) wizardRegenCover();
  if (wizard.step === 5) { wizardCreate(); return; }
  wizardGo(wizard.step + 1);
}
function wizardPrev() {
  if (wizard.step > 1) wizardGo(wizard.step - 1);
}

async function wizardCreate() {
  const btn = $("wizardNext");
  btn.disabled = true; btn.textContent = "创建中…";
  try {
    const res = await api("/api/worlds", {
      method: "POST",
      body: JSON.stringify({
        name: wizard.name,
        description: wizard.desc,
        type: wizard.form,
        cast_ids: wizard.castIds,
        cover_image: wizard.cover,
        settings: { genre: wizard.genre, genreLabel: GENRE_LABEL[wizard.genre] }
      })
    });
    if (!res.success) throw new Error(res.error || "创建失败。");
    showModal("wizardModal", false);
    allWorlds.unshift(res.world);
    renderWorlds(allWorlds);
    switchTab("world");
    toast("世界已创建。");
  } catch (e) {
    toast(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "下一步";
  }
}

/* ---------- 初始化 ---------- */
async function checkAuthSoft() {
  const t = localStorage.getItem("hyool_token");
  try {
    const h = {};
    if (t) h["Authorization"] = "Bearer " + t;
    const res = await fetch("/api/me", { credentials: "include", cache: "no-store", headers: h });
    const data = await res.json();
    return data.authenticated ? data : null;
  } catch {
    return null;
  }
}

function openWizard() {
  if (isGuest) { location.href = "/yonder.html?next=/hub"; return; }
  wizardInit();
  showModal("wizardModal", true);
}

/* 点击外部关闭创造下拉 */
document.addEventListener("click", e => {
  const wrap = $("createMenu").closest(".create-wrap");
  if (wrap && wrap.contains(e.target)) return;
  toggleCreateMenu(false);
});

document.addEventListener("DOMContentLoaded", async () => {
  const auth = await checkAuthSoft();
  isGuest = !auth;

  if (auth && auth.user && auth.user.username) {
    $("backLink").href = "/@" + auth.user.username;
  }

  if (isGuest) {
    $("createBtn").style.display = "none";
    $("logoutBtn").style.display = "none";
    $("loginLink").style.display = "";
    $("subTitle").textContent = "浏览大家创造的角色，登录后即可定制你的世界。";
  } else {
    $("logoutBtn").addEventListener("click", async () => {
      localStorage.removeItem("hyool_token");
      try { await api("/api/logout", { method: "POST" }); } catch {}
      location.href = "/yonder";
    });
  }

  /* 事件绑定 */
  $("createBtn").addEventListener("click", e => { e.stopPropagation(); toggleCreateMenu(); });
  $("createMenu").querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => {
      toggleCreateMenu(false);
      if (b.dataset.act === "role") location.href = "/create/character/";
      else openWizard();
    });
  });
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
  $("emptyRoleGo").addEventListener("click", () => {
    if (isGuest) location.href = "/yonder.html?next=/hub";
    else location.href = "/create/character/";
  });
  $("emptyWorldGo").addEventListener("click", openWizard);
  $("wizardPrev").addEventListener("click", wizardPrev);
  $("wizardNext").addEventListener("click", wizardNext);
  $("editCancel").addEventListener("click", closeEdit);
  $("editSave").addEventListener("click", saveEdit);
  $("deleteCancel").addEventListener("click", closeDelete);
  $("deleteConfirm").addEventListener("click", confirmDelete);

  ["editModal", "deleteModal", "wizardModal", "worldDetailModal"].forEach(id => {
    $(id).addEventListener("click", e => { if (e.target.id === id) showModal(id, false); });
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeEdit(); closeDelete(); showModal("wizardModal", false); showModal("worldDetailModal", false); }
  });

  /* 加载数据 */
  try {
    const res = await api("/api/hub");
    renderChars(res.characters || [], isGuest);
  } catch (e) {
    $("grid").innerHTML = '<div style="text-align:center;">加载失败：' + escapeHtml(e.message) + '</div>';
    $("loading").style.display = "none";
    return;
  }

  if (!isGuest) {
    try {
      const wres = await api("/api/worlds");
      renderWorlds(wres.worlds || []);
    } catch (e) {
      $("worldGrid").innerHTML = '<div style="text-align:center;">世界加载失败：' + escapeHtml(e.message) + '</div>';
    }
  } else {
    renderWorlds([]);
    $("emptyWorldText").innerHTML = "登录后即可创建你的自定义世界。";
    $("emptyWorldGo").textContent = "登录";
    $("emptyWorldGo").onclick = () => { location.href = "/yonder.html?next=/hub"; };
  }

  $("loading").style.display = "none";
  $("app").style.display = "block";

  /* ?world=id 直达世界详情（例如从 buddy「沉淀为剧本」跳转） */
  const wp = new URLSearchParams(location.search).get("world");
  if (wp && !isGuest && allWorlds.length) {
    const wi = allWorlds.findIndex(w => w.id === wp);
    if (wi >= 0) {
      switchTab("world");
      openWorldDetail(wi);
    }
  }
});
</script>
</body>
</html>
