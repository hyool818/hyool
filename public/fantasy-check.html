<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FANTASY-CHECK</title>
</head>
<body>
<pre id="results">RUNNING…</pre>
<iframe id="fa" src="fantasy.html" style="width:1280px;height:800px;border:1px solid #333"></iframe>
<script>
const results = [];
function line(s){ results.push(s); document.getElementById('results').textContent = results.join('\n'); }
function ok(cond, name, extra=''){ line((cond?'PASS':'FAIL')+'  '+name+(extra?'  '+extra:'')); }
function waitFrame(){
  return new Promise((resolve, reject) => {
    const f = document.getElementById('fa');
    const to = setTimeout(() => reject(new Error('iframe load timeout')), 60000);
    f.addEventListener('load', () => { clearTimeout(to); resolve(); }, { once: true });
  });
}
async function main(){
  try {
    await waitFrame();
    await new Promise(r => setTimeout(r, 800));
    const doc = document.getElementById('fa').contentDocument;
    const q = (s) => doc.querySelector(s);
    const qa = (s) => [...doc.querySelectorAll(s)];

    ok(q('.hub-hero-name') && q('.hub-hero-name').textContent.trim() === '幻想', 'hub hero shows 幻想');
    ok(qa('.tool-card').length === 5, 'fantasy hub has 5 tool cards', 'got ' + qa('.tool-card').length);
    ok(q('.tool-card.featured h3') && q('.tool-card.featured h3').textContent.includes('游戏工坊'), 'featured game workshop card present');
    ok(!!q('.tool-card.featured .tool-cta[href="game-studio.html"]'), 'game workshop card links to game-studio.html');
    ok(q('.tool-card.featured .tool-badge').textContent.trim() === '已开放', 'game workshop card badge shows 已开放');
    const names = qa('.tool-card h3').map(h => h.textContent);
    ok(['游戏工坊','音乐工作室','VN 编辑器','Live2D','TTS 声音'].every(n => names.includes(n)), 'all 5 planned cards named');
    ok(!!q('.world-link[href="workspace.html"]') && !!q('.world-link[href="yonder.html"]'), 'world links to 无限/彼岸 present');
    ok(!!q('.world-link[href="/hub"]') && q('.world-link[href="/hub"] .world-link-name').textContent.trim() === '生命', '生命链接指向角色工坊 /hub');

    // 敬请期待按钮 toast 生效
    const btn = q('.tool-cta[data-go="soon"]');
    btn.click();
    await new Promise(r => setTimeout(r, 250));
    ok(q('#toast').classList.contains('show'), 'soon button shows toast');

    document.title = 'SMOKE-OK';
  } catch (e) {
    line('FATAL: ' + (e && e.stack || e && e.message || e));
    document.title = 'SMOKE-FAIL';
  }
}
main();
</script>
</body>
</html>
