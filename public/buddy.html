<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 相遇</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed;
  min-height: 100dvh; min-height: 100vh; overflow: hidden;
  line-height: 1.7;
}
a { color: inherit; text-decoration: none; }

/* Header */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 64px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  background: linear-gradient(to bottom, rgba(5,5,8,.62), transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.header .left { display: flex; align-items: center; gap: 14px; }
.back-link {
  font-size: 13px; color: var(--muted); cursor: pointer; letter-spacing: .02em;
  transition: color .2s; background: none; border: 0;
}
.back-link:hover { color: #fff; }
.char-name { font-weight: 700; font-size: .95rem; }
.char-sub { font-size: .72rem; color: var(--muted); }
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 8px 13px; border-radius: 999px; font-size: 12px; cursor: pointer;
  transition: background .2s, color .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); }

/* Settings Modal */
.settings-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.settings-overlay.show { display: flex; }
.settings-panel {
  background: linear-gradient(145deg, #1a1b2e, #12131f);
  border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 24px; width: 90%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.settings-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
.setting-row { margin-bottom: 18px; }
.setting-label { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
.setting-label .val { color: var(--accent); font-weight: 600; }
.setting-slider { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); outline: none; }
.setting-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
.setting-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none; }
.setting-seg { display: flex; gap: 6px; }
.setting-seg button {
  flex: 1; padding: 8px 0; border: 1px solid var(--glass-border); border-radius: 8px;
  background: transparent; color: var(--muted); font-size: .8rem; cursor: pointer; transition: all .2s;
}
.setting-seg button.active { background: rgba(139,139,255,.15); color: var(--accent); border-color: rgba(139,139,255,.4); }
.setting-select {
  width: 100%; padding: 9px 10px; border-radius: 8px;
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.06);
  color: var(--text); font-size: .82rem; outline: none; cursor: pointer;
}
.setting-select option { background: #12131f; color: var(--text); }
.voice-row { display: flex; gap: 8px; align-items: stretch; }
.voice-row .setting-select { flex: 1; }
.voice-preview-btn {
  flex: 0 0 auto; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--glass-border);
  background: rgba(255,255,255,.06); color: var(--text); font-size: .8rem; cursor: pointer;
  transition: all .2s; font-family: inherit; white-space: nowrap;
}
.voice-preview-btn:hover { background: rgba(139,139,255,.15); border-color: rgba(139,139,255,.4); color: var(--accent); }
.voice-preview-btn.playing { background: rgba(139,139,255,.15); color: var(--accent); animation: voiceBtnPulse 1s infinite ease-in-out; }
@keyframes voiceBtnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.intimacy-bar { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.intimacy-fill { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.intimacy-fill span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #c084fc); border-radius: 3px; transition: width .4s; }
.settings-close {
  width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 10px;
  background: rgba(139,139,255,.15); color: var(--accent); font-size: .9rem; cursor: pointer;
  transition: background .2s;
}
.settings-close:hover { background: rgba(139,139,255,.25); }

/* Main layout: split view */
.main {
  display: flex; height: 100dvh; height: 100vh; padding-top: 64px;
}

/* Portrait panel */
.portrait-panel {
  flex: 0 0 42%; max-width: 560px; min-width: 280px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  position: relative; overflow: hidden;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,.4) 100%);
  border-right: 1px solid var(--glass-border);
}
.portrait-panel::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 60%, rgba(139,139,255,.10), transparent 50%);
}
.portrait-stage {
  position: relative; width: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 0; overflow: hidden;
}
.portrait-img {
  width: 100%; height: 100%; object-fit: cover; object-position: center top;
  filter: drop-shadow(0 8px 40px rgba(0,0,0,.5));
  animation: portraitBreathe 5s ease-in-out infinite;
  position: relative; z-index: 2;
}
.portrait-glow {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 40%; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at 50% 100%, rgba(139,139,255,.20), transparent 60%);
  opacity: .5; animation: glowPulse 5s ease-in-out infinite;
}
.portrait-stage.speaking .portrait-glow {
  opacity: 1; animation: speakGlow 1.2s ease-in-out infinite;
}
.portrait-stage.speaking .portrait-img {
  animation: portraitSpeak 1.2s ease-in-out infinite;
}
.portrait-ripple {
  position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
  width: 30%; height: 30%; border-radius: 50%; pointer-events: none; z-index: 0;
  border: 1px solid rgba(139,139,255,.15);
  opacity: 0;
}
.portrait-stage.speaking .portrait-ripple {
  animation: rippleOut 1.5s ease-out infinite;
}
@keyframes portraitBreathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.015); }
}
@keyframes glowPulse {
  0%, 100% { opacity: .4; }
  50% { opacity: .65; }
}
@keyframes portraitSpeak {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}
@keyframes speakGlow {
  0%, 100% { opacity: .6; }
  50% { opacity: 1; }
}
@keyframes rippleOut {
  0% { transform: translateX(-50%) scale(.8); opacity: .4; }
  100% { transform: translateX(-50%) scale(1.8); opacity: 0; }
}

/* Portrait toolbar (future features) */
.portrait-toolbar {
  flex: 0 0 auto; width: 100%; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; justify-content: center; gap: .5rem; z-index: 5;
  background: linear-gradient(to top, rgba(0,0,0,.5), transparent);
}
.tool-btn {
  border: 1px solid var(--glass-border); background: var(--glass);
  color: rgba(255,255,255,.5); padding: 7px 14px; border-radius: 999px;
  font-size: 12px; cursor: pointer; transition: all .2s; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
.tool-btn:hover { background: rgba(255,255,255,.10); color: rgba(255,255,255,.7); }
.tool-btn .badge { font-size: 9px; background: rgba(139,139,255,.2); color: var(--accent); padding: 1px 5px; border-radius: 4px; }

/* Chat panel */
.chat-panel {
  flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%;
}
.chat-area { flex: 1; overflow-y: auto; padding: 20px 24px 8px; }
.chat-inner { max-width: 680px; margin: 0 auto; }

/* Messages */
.msg-row { display: flex; margin-bottom: 1.1rem; animation: fadeUp .4s cubic-bezier(.2,.8,.2,1); }
.msg-row.user { flex-direction: row-reverse; }
.msg-row .bubble {
  max-width: 78%; padding: 13px 16px; border-radius: 18px; font-size: .92rem;
  white-space: pre-wrap; word-break: break-word; line-height: 1.65;
}
.msg-row.assistant .bubble {
  background: rgba(255,255,255,.06); border: 1px solid var(--glass-border);
  border-top-left-radius: 4px;
}
.msg-row.user .bubble {
  background: var(--accent); color: #0a0a12; border-top-right-radius: 4px; font-weight: 500;
}
.msg-time { font-size: .68rem; color: var(--muted); margin: 4px 10px 0; align-self: flex-end; }
.msg-row.user .msg-time { text-align: right; }
/* TTS 朗读按钮 */
.speaker-btn {
  flex: 0 0 auto; align-self: center; margin-left: 8px;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.05);
  color: var(--muted); font-size: .78rem; cursor: pointer; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.speaker-btn:hover { color: var(--accent); border-color: rgba(139,139,255,.4); background: rgba(139,139,255,.12); }
.speaker-btn.playing { color: var(--accent); border-color: rgba(139,139,255,.5); background: rgba(139,139,255,.15); animation: ttsPulse 1s infinite ease-in-out; }
.speaker-btn:disabled { opacity: .45; cursor: default; }
@keyframes ttsPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.typing .bubble { display: flex; gap: 5px; align-items: center; padding: 16px 18px; }
.typing .bubble span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: dotBounce 1.2s infinite ease-in-out;
}
.typing .bubble span:nth-child(2) { animation-delay: .15s; }
.typing .bubble span:nth-child(3) { animation-delay: .3s; }
@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-6px); opacity: 1; }
}
/* Memory bar */
.mem-bar {
  max-width: 680px; margin: 0 auto 8px; padding: 6px 4px;
  font-size: .72rem; color: var(--muted); display: flex; align-items: center; gap: 6px;
}
.mem-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Message media (历史消息中已存的图片/视频，兼容渲染) */
.msg-media { margin-top: 8px; border-radius: 14px; overflow: hidden; }
.msg-media:first-child { margin-top: 0; }
.msg-media img, .msg-media video {
  display: block; width: 100%; max-width: 280px; max-height: 300px;
  object-fit: cover; border-radius: 12px; background: rgba(0,0,0,.35);
}
.msg-media img { cursor: zoom-in; }
.msg-text + .msg-media, .msg-media + .msg-media { margin-top: 8px; }

/* 更换形象按钮（角色肖像面板） */
.change-portrait-btn {
  flex: 0 0 auto; padding: 8px 14px; border: 1px solid rgba(139,139,255,.35);
  border-radius: 999px; background: rgba(139,139,255,.10); color: var(--accent);
  font-size: 12px; cursor: pointer; transition: all .2s;
}
.change-portrait-btn:hover { background: rgba(139,139,255,.22); border-color: rgba(139,139,255,.6); }

/* 形象裁剪弹窗（竖版 3:4，输出 720×960） */
.crop-backdrop {
  position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.65);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.crop-backdrop.active { display: flex; }
.crop-modal {
  width: 100%; max-width: 320px; padding: 24px;
  border: 1px solid var(--glass-border); border-radius: 20px;
  background: linear-gradient(145deg, #1a1b2e, #12131f);
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.crop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.crop-header h2 { margin: 0; font-size: 17px; font-weight: 600; }
.crop-header .crop-hint { font-size: 11px; color: var(--muted); font-weight: 400; }
.crop-stage {
  position: relative; width: 210px; height: 280px; margin: 0 auto 20px;
  border-radius: 14px; overflow: hidden; background: #0a0a12;
}
#cropCanvas { display: block; width: 210px; height: 280px; touch-action: none; cursor: grab; }
#cropCanvas:active { cursor: grabbing; }
.crop-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.crop-controls button {
  width: 36px; height: 36px; border: 0; border-radius: 10px;
  background: rgba(255,255,255,.1); color: #fff; font-size: 18px; cursor: pointer;
  flex-shrink: 0; transition: background .2s;
}
.crop-controls button:hover { background: rgba(255,255,255,.18); }
.crop-controls input[type="range"] { flex: 1; accent-color: var(--accent); }
.crop-actions { display: flex; gap: 12px; }
.crop-btn-cancel {
  flex: 1; border: 1px solid rgba(255,255,255,.15); border-radius: 12px; padding: 12px;
  background: transparent; color: rgba(255,255,255,.7); font-size: 14px; cursor: pointer; transition: background .2s;
}
.crop-btn-cancel:hover { background: rgba(255,255,255,.06); }
.crop-btn-confirm {
  flex: 1; border: 0; border-radius: 12px; padding: 12px;
  background: var(--accent); color: #0a0a12; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.crop-btn-confirm:hover { opacity: .88; }
.crop-btn-confirm:disabled { opacity: .5; cursor: wait; }

/* Composer */
.composer {
  padding: 12px 24px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.06);
  background: rgba(5,5,8,.4); backdrop-filter: blur(8px); flex: 0 0 auto;
}
.composer-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea {
  flex: 1; min-height: 48px; max-height: 140px; resize: none;
  border: 1px solid rgba(255,255,255,.10); border-radius: 16px;
  padding: 13px 16px; background: rgba(255,255,255,.06); color: #fff;
  outline: none; font: inherit; font-size: .92rem; line-height: 1.5; transition: border .3s;
}
.composer textarea:focus { border-color: var(--accent); }
.composer textarea::placeholder { color: rgba(255,255,255,.28); }
.send-btn {
  border: 0; border-radius: 16px; padding: 0 20px; height: 48px; cursor: pointer;
  background: var(--accent); color: #0a0a12; font-weight: 700; font-size: 14px;
  transition: opacity .2s, transform .2s; white-space: nowrap;
}
.send-btn:hover { opacity: .88; transform: translateY(-1px); }
.send-btn:disabled { opacity: .4; cursor: wait; }

/* Mobile toggle for portrait */
.portrait-toggle {
  display: none; position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); right: 16px; z-index: 40;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-border);
  background: rgba(20,20,30,.8); backdrop-filter: blur(10px); color: var(--accent);
  cursor: pointer; font-size: 18px; align-items: center; justify-content: center;
  transition: transform .2s;
}
.portrait-toggle:hover { transform: scale(1.08); }

/* States */
.loading-screen {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: .9rem; flex-direction: column; gap: 14px;
  background: radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%), #050507;
}
.spinner {
  width: 26px; height: 26px; border: 2px solid rgba(255,255,255,.15);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err-screen { text-align: center; padding: 2rem; }
.err-screen a { color: var(--accent); }

/* Mobile: portrait becomes overlay */
@media (max-width: 768px) {
  .header { padding: 0 16px; height: 58px; }
  .main { padding-top: 58px; flex-direction: column; }
  .portrait-panel {
    position: fixed; inset: 58px 0 auto 0; z-index: 30; max-width: none; min-width: 0;
    height: 45%; border-right: 0; border-bottom: 1px solid var(--glass-border);
    transform: translateY(-100%); transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .portrait-panel.mobile-show { transform: translateY(0); }
  .chat-panel { flex: 1; }
  .chat-area, .composer { padding-left: 14px; padding-right: 14px; }
  .msg-row .bubble { max-width: 88%; }
  .char-sub { display: none; }
  .portrait-toggle { display: flex; }
  .portrait-toolbar { padding-bottom: 6px; }
  .tool-btn { padding: 6px 10px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="loading-screen" id="loading"><span class="spinner"></span><span>正在相遇……</span></div>

<div id="app" style="display:none;">
  <header class="header">
    <div class="left">
      <button class="back-link" id="backBtn">← 返回</button>
      <div>
        <div class="char-name" id="charName"></div>
        <div class="char-sub" id="charWorld"></div>
      </div>
    </div>
    <div style="display:flex;gap:.5rem;">
      <button class="header-link" id="settingsBtn">⚙ 设置</button>
      <a class="header-link" id="shareLink" href="#">分享</a>
      <button class="header-link" id="logoutBtn">退出</button>
    </div>
  </header>

  <div class="main">
    <!-- Portrait Panel -->
    <aside class="portrait-panel" id="portraitPanel">
      <div class="portrait-stage" id="portraitStage">
        <div class="portrait-ripple"></div>
        <div class="portrait-glow"></div>
        <img class="portrait-img" id="portraitImg" alt="" src="">
      </div>
      <div class="portrait-toolbar">
        <button class="change-portrait-btn" id="changePortraitBtn" type="button">✏️ 更换形象</button>
        <button class="tool-btn" onclick="alert('装扮功能即将上线')">装扮 <span class="badge">soon</span></button>
        <button class="tool-btn" onclick="alert('场景功能即将上线')">场景 <span class="badge">soon</span></button>
        <button class="tool-btn" onclick="alert('天气功能即将上线')">天气 <span class="badge">soon</span></button>
      </div>
      <input type="file" id="portraitInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
    </aside>

    <!-- Chat Panel -->
    <div class="chat-panel">
      <div class="chat-area" id="chatArea">
        <div class="chat-inner" id="chatInner"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="msgInput" placeholder="对 TA 说点什么……" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile portrait toggle -->
  <button class="portrait-toggle" id="portraitToggle">👤</button>
</div>

<!-- Settings Modal -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-title">角色设定</div>

    <div class="setting-row">
      <div class="setting-label"><span>灵魂 · 沉稳/灵动</span><span class="val" id="tempVal">0.9</span></div>
      <input type="range" class="setting-slider" id="tempSlider" min="0.3" max="1.1" step="0.1" value="0.9">
      <div style="font-size:.72rem;color:var(--muted);margin-top:4px;">超过1.0角色可能语无伦次，建议0.7~1.0</div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>话语 · 寡言/健谈</span><span class="val" id="tokenVal">150</span></div>
      <input type="range" class="setting-slider" id="tokenSlider" min="60" max="300" step="20" value="150">
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>主动程度</span></div>
      <div class="setting-seg" id="proSeg">
        <button data-v="passive">被动</button>
        <button data-v="balanced" class="active">适中</button>
        <button data-v="active">主动</button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>TA 的声音</span></div>
      <div class="voice-row">
        <select class="setting-select" id="voiceSelect"></select>
        <button type="button" class="voice-preview-btn" id="voicePreviewBtn" title="试听当前声音">🔊 试听</button>
      </div>
      <div style="font-size:.72rem;color:var(--muted);margin-top:4px;">🔊 试听可聆听当前声音；回复旁的 🔊 可朗读 TA 的话语</div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>语速 · 沉稳/轻快</span><span class="val" id="rateVal">0%</span></div>
      <input type="range" class="setting-slider" id="rateSlider" min="-50" max="50" step="5" value="0">
      <div style="font-size:.72rem;color:var(--muted);margin-top:4px;">负值更沉稳，正值更轻快；可配合 🔊 试听调整</div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>羁绊</span></div>
      <div class="intimacy-bar">
        <span id="intimacyLabel">初识</span>
        <div class="intimacy-fill"><span id="intimacyFill" style="width:0%"></span></div>
        <span id="intimacyNum">0</span>
      </div>

    <button class="settings-close" id="settingsClose">完成</button>
  </div>
</div>

<!-- Image crop modal -->
<div class="crop-backdrop" id="cropBackdrop">
  <div class="crop-modal">
    <div class="crop-header"><h2>裁剪形象</h2><span class="crop-hint">竖版 3:4 · 720×960</span></div>
    <div class="crop-stage">
      <canvas id="cropCanvas" width="280" height="280"></canvas>
    </div>
    <div class="crop-controls">
      <button type="button" id="cropZoomOut" title="缩小">−</button>
      <input type="range" id="cropZoom" min="100" max="400" step="10" value="100">
      <button type="button" id="cropZoomIn" title="放大">＋</button>
    </div>
    <div class="crop-actions">
      <button type="button" class="crop-btn-cancel" id="cropCancel">取消</button>
      <button type="button" class="crop-btn-confirm" id="cropConfirm">完成</button>
    </div>
  </div>
</div>

<script>
const api = (p, o = {}) => {
  const t = localStorage.getItem("hyool_token");
  const h = { "Content-Type": "application/json", ...(o.headers || {}) };
  if (t) h["Authorization"] = "Bearer " + t;
  const timeout = o.timeout || 120000;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  return fetch(p, { credentials: "include", ...o, headers: h, signal: ctrl.signal })
    .then(async r => { let d; try { d = await r.json(); } catch { d = { success:false, error:"服务器返回异常。" }; } if (!r.ok) throw new Error(d.error || "请求失败。"); return d; })
    .catch(e => { if (e.name === "AbortError") throw new Error("请求超时，请稍后重试。"); throw e; })
    .finally(() => clearTimeout(timer));
};

const $ = id => document.getElementById(id);
const escapeHtml = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

function getCharId() {
  const parts = location.pathname.split("/").filter(Boolean);
  return parts[1] || "";
}

let character = null;
let sending = false;
let chatConfig = { temperature: 0.9, max_tokens: 150, proactivity: "balanced", voice: "", rate: 0 };
let currentIntimacy = 0;
let characterGender = "";
let previewAudio = null;

function scrollBottom() { const a = $("chatArea"); a.scrollTop = a.scrollHeight; }
if (window.visualViewport) window.visualViewport.addEventListener("resize", scrollBottom);

function addMessage(role, content, animate) {
  const row = document.createElement("div");
  row.className = "msg-row " + role + (animate ? " typing" : "");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (animate) {
    bubble.innerHTML = "<span></span><span></span><span></span>";
  } else {
    renderContent(bubble, content);
  }
  row.appendChild(bubble);
  if (role === "assistant" && !animate && content) {
    const speechText = extractPlainText(content);
    if (speechText) {
      const btn = document.createElement("button");
      btn.className = "speaker-btn";
      btn.type = "button";
      btn.title = "朗读这条回复";
      btn.textContent = "🔊";
      btn.addEventListener("click", () => speakText(speechText, btn));
      row.appendChild(btn);
    }
  }
  $("chatInner").appendChild(row);
  scrollBottom();
  return row;
}

/* 消息内容渲染：支持纯文本与 {text, images:[{url,kind}]} 两种格式 */
function renderContent(bubble, content) {
  let text = "";
  let images = [];
  if (typeof content === "string") {
    if (content.indexOf("{") === 0) {
      try {
        const p = JSON.parse(content);
        if (p && typeof p === "object" && ("text" in p || "images" in p)) {
          text = typeof p.text === "string" ? p.text : "";
          images = Array.isArray(p.images) ? p.images : [];
        } else {
          text = content;
        }
      } catch { text = content; }
    } else {
      text = content;
    }
  } else if (content && typeof content === "object") {
    text = typeof content.text === "string" ? content.text : "";
    images = Array.isArray(content.images) ? content.images : [];
  }
  if (text) {
    const t = document.createElement("div");
    t.className = "msg-text";
    t.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
    bubble.appendChild(t);
  }
  images.forEach(a => {
    const src = typeof a === "string" ? a : (a && a.url ? a.url : "");
    const kind = typeof a === "string" ? "image" : (a && a.kind === "video" ? "video" : "image");
    if (!src) return;
    const item = document.createElement("div");
    item.className = "msg-media";
    if (kind === "video") {
      const v = document.createElement("video");
      v.src = src; v.controls = true; v.playsInline = true; v.preload = "metadata";
      item.appendChild(v);
    } else {
      const img = document.createElement("img");
      img.src = src; img.alt = ""; img.loading = "lazy";
      img.addEventListener("click", () => window.open(src, "_blank"));
      item.appendChild(img);
    }
    bubble.appendChild(item);
  });
}

/* 提取消息的纯文本部分（供 TTS 朗读） */
function extractPlainText(content) {
  if (typeof content === "string") {
    if (content.indexOf("{") === 0) {
      try {
        const p = JSON.parse(content);
        if (p && typeof p.text === "string") return p.text;
      } catch {}
    }
    return content;
  }
  return content && typeof content.text === "string" ? content.text : "";
}

async function checkAuth() {
  const t = localStorage.getItem("hyool_token");
  for (let i = 0; i < 2; i++) {
    try {
      const h = {};
      if (t) h["Authorization"] = "Bearer " + t;
      const res = await fetch("/api/me", { credentials: "include", cache: "no-store", headers: h });
      const data = await res.json();
      if (data.authenticated) return true;
      if (i === 1) { location.href = "/yonder.html?next=" + encodeURIComponent(location.pathname); return false; }
    } catch {
      if (i === 1) { location.href = "/yonder.html?next=" + encodeURIComponent(location.pathname); return false; }
      await new Promise(r => setTimeout(r, 800));
    }
  }
  location.href = "/yonder.html?next=" + encodeURIComponent(location.pathname);
  return false;
}

function intimacyLabel(v) {
  if (v >= 50) return "灵魂羁绊";
  if (v >= 30) return "亲密";
  if (v >= 10) return "熟识";
  if (v >= 1) return "初见";
  return "初识";
}
function intimacyPct(v) { return Math.min(100, (v / 50) * 100); }

function renderCharacter(c) {
  $("charName").textContent = c.name || "TA";
  $("charWorld").textContent = c.world_name || "";
  const img = $("portraitImg");
  if (c.image_url) {
    img.src = c.image_url;
    img.style.display = "";
  } else {
    img.style.display = "none";
  }
  if (c.share_url) $("shareLink").href = c.share_url;
  characterGender = c.gender || "";
  if (c.chat_config) {
    try { chatConfig = { ...chatConfig, ...(typeof c.chat_config === "string" ? JSON.parse(c.chat_config) : c.chat_config) }; } catch {}
  }
  // 安全clamp，极端值自动修正
  chatConfig.temperature = Math.min(1.1, Math.max(0.3, chatConfig.temperature || 0.9));
  chatConfig.max_tokens  = Math.min(300, Math.max(60, chatConfig.max_tokens || 150));
  chatConfig.rate = Math.min(50, Math.max(-50, chatConfig.rate || 0));
  if (!["passive","balanced","active"].includes(chatConfig.proactivity)) chatConfig.proactivity = "balanced";
  currentIntimacy = c.intimacy || 0;
  updateSettingsUI();
  // 角色性别与已保存配置都确认后再加载声音列表，保证严格按性别过滤（去掉男女混杂）
  loadVoices();
}

function updateSettingsUI() {
  $("tempVal").textContent = chatConfig.temperature.toFixed(1);
  $("tempSlider").value = chatConfig.temperature;
  // 高温预警：>=1.0 时数值变红
  const tempWarn = chatConfig.temperature >= 1.0;
  $("tempVal").style.color = tempWarn ? "#f87171" : "";
  $("tokenVal").textContent = chatConfig.max_tokens;
  $("tokenSlider").value = chatConfig.max_tokens;
  document.querySelectorAll("#proSeg button").forEach(b => {
    b.classList.toggle("active", b.dataset.v === chatConfig.proactivity);
  });
  $("intimacyLabel").textContent = intimacyLabel(currentIntimacy);
  $("intimacyNum").textContent = currentIntimacy;
  $("intimacyFill").style.width = intimacyPct(currentIntimacy) + "%";
  const vs = $("voiceSelect");
  if (vs) vs.value = chatConfig.voice || "";
  $("rateVal").textContent = (chatConfig.rate > 0 ? "+" : "") + chatConfig.rate + "%";
  $("rateSlider").value = chatConfig.rate;
}

let saveTimer = null;
function saveConfig() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await api("/api/buddy/" + getCharId() + "/chat-config", {
        method: "POST",
        body: JSON.stringify(chatConfig)
      });
    } catch {}
  }, 500);
}

function setSpeaking(on) {
  const stage = $("portraitStage");
  if (on) stage.classList.add("speaking");
  else stage.classList.remove("speaking");
}

/* ---------- TTS 朗读 ---------- */
let ttsAudio = null;
let ttsPlayingBtn = null;

/* 实际朗读用的声音：已选声音，否则按性别给默认（男 → 云健，其余 → 晓晓） */
function effectiveVoice() {
  if (chatConfig.voice) return chatConfig.voice;
  return characterGender === "male" ? "zh-CN-YunjianNeural" : "";
}

/* 语速参数：chatConfig.rate 是整数偏移（-50~50），转成 Edge 接受的形式（+30% / -20% / +0%） */
function rateParam() {
  const r = chatConfig.rate || 0;
  return (r >= 0 ? "+" : "") + r + "%";
}

function voicePreviewText(voiceId) {
  if (voiceId.startsWith("en-")) return "Hi, I'm your digital life. It's so nice to meet you!";
  if (voiceId.startsWith("ja-")) return "こんにちは、あなたのデジタルライフです。よろしくお願いします。";
  if (voiceId.startsWith("ko-")) return "안녕하세요, 당신의 디지털 라이프입니다. 만나서 반가워요.";
  return "你好呀，我是你的数字生命。很高兴能和你相遇，今天想聊点什么？";
}

async function playVoicePreview(voiceId) {
  const btn = $("voicePreviewBtn");
  if (!btn) return;
  if (previewAudio && !previewAudio.paused) {
    try { previewAudio.pause(); } catch {}
    previewAudio = null;
    btn.classList.remove("playing");
    btn.textContent = "🔊 试听";
    return;
  }
  if (previewAudio) { try { previewAudio.pause(); } catch {} previewAudio = null; }
  btn.textContent = "合成中…";
  try {
    const text = voicePreviewText(voiceId || "zh-CN-XiaoxiaoNeural");
    const res = await fetch("/api/tts", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        ...(localStorage.getItem("hyool_token") ? { Authorization: "Bearer " + localStorage.getItem("hyool_token") } : {})
      },
      body: JSON.stringify({ text, voice: voiceId, rate: rateParam() })
    });
    if (!res.ok) {
      let d = {};
      try { d = await res.json(); } catch {}
      throw new Error(d.error || "语音合成失败。");
    }
    const blob = await res.blob();
    const audioUrl = URL.createObjectURL(blob);
    const audio = new Audio(audioUrl);
    previewAudio = audio;
    btn.textContent = "⏹ 停止";
    btn.classList.add("playing");
    const done = () => {
      URL.revokeObjectURL(audioUrl);
      btn.textContent = "🔊 试听";
      btn.classList.remove("playing");
      if (previewAudio === audio) previewAudio = null;
    };
    audio.addEventListener("ended", done);
    audio.addEventListener("error", done);
    await audio.play();
  } catch (e) {
    btn.textContent = "🔊 试听";
    btn.classList.remove("playing");
    alert(e.message);
  }
}

function setBtnState(btn, state) {
  if (!btn) return;
  btn.disabled = state === "loading";
  btn.classList.toggle("playing", state === "playing");
  btn.textContent = state === "loading" ? "⋯" : "🔊";
}

async function speakText(text, btn) {
  if (!text) return;
  // 再次点击正在播放的按钮 → 停止
  if (ttsAudio && !ttsAudio.paused && ttsPlayingBtn === btn) {
    try { ttsAudio.pause(); } catch {}
    ttsPlayingBtn = null;
    setBtnState(btn, false);
    return;
  }
  if (ttsAudio) { try { ttsAudio.pause(); } catch {} }
  ttsPlayingBtn = null;
  setBtnState(btn, "loading");
  try {
    const voice = effectiveVoice();
    const res = await fetch("/api/tts", {
      method: "POST",
      credentials: "include",
      headers: {
        "Content-Type": "application/json",
        ...(localStorage.getItem("hyool_token") ? { Authorization: "Bearer " + localStorage.getItem("hyool_token") } : {})
      },
      body: JSON.stringify({ text, voice, rate: rateParam() })
    });
    if (!res.ok) {
      let d = {};
      try { d = await res.json(); } catch {}
      throw new Error(d.error || "语音合成失败。");
    }
    const blob = await res.blob();
    const audioUrl = URL.createObjectURL(blob);
    const audio = new Audio(audioUrl);
    ttsAudio = audio;
    ttsPlayingBtn = btn;
    setBtnState(btn, "playing");
    const done = () => {
      URL.revokeObjectURL(audioUrl);
      if (ttsPlayingBtn === btn) ttsPlayingBtn = null;
      setBtnState(btn, false);
    };
    audio.addEventListener("ended", done);
    audio.addEventListener("error", done);
    await audio.play();
  } catch (e) {
    setBtnState(btn, false);
    alert(e.message);
  }
}

async function loadVoices() {
  const sel = $("voiceSelect");
  if (!sel) return;
  sel.innerHTML = ""; // 每次都重建选项：须在角色性别已知后调用，否则会列出全部（男女混杂）
  try {
    const res = await api("/api/tts/voices");
    const auto = document.createElement("option");
    auto.value = "";
    auto.textContent = characterGender === "male" ? "自动（云健）" : "自动（默认晓晓）";
    sel.appendChild(auto);
    const list = res.voices || [];
    // 角色性别明确时严格过滤：男角色只列男声、女角色只列女声；中性/未知列出全部
    let filtered = list;
    if (characterGender === "male") filtered = list.filter(v => v.gender === "male");
    else if (characterGender === "female") filtered = list.filter(v => v.gender === "female");
    // 已保存的声音与角色性别不符 → 自动纠正为默认（不再把异性别声音加回列表）
    if (chatConfig.voice && !filtered.some(v => v.id === chatConfig.voice)) {
      chatConfig.voice = "";
      saveConfig();
    }
    filtered.forEach(v => {
      const o = document.createElement("option");
      o.value = v.id;
      o.textContent = v.name;
      sel.appendChild(o);
    });
    sel.value = chatConfig.voice || "";
  } catch {}
}

async function loadMessages() {
  const id = getCharId();
  try {
    const res = await api("/api/buddy/" + id + "/messages");
    character = res.character;
    renderCharacter(character);
    (res.messages || []).forEach(m => addMessage(m.role, m.content, false));
    if (res.memories_count) {
      const bar = document.createElement("div");
      bar.className = "mem-bar";
      bar.innerHTML = '<span class="dot"></span> TA 记得 ' + res.memories_count + ' 段与你有关的记忆';
      $("chatInner").insertBefore(bar, $("chatInner").firstChild);
    }
    if (!res.messages || res.messages.length === 0) {
      addMessage("assistant", "（你们的故事从这里开始。对 TA 说第一句话吧。）", false);
    }
    $("loading").style.display = "none";
    $("app").style.display = "flex";
    scrollBottom();
  } catch (e) {
    $("loading").innerHTML = '<div class="err-screen">加载失败：' + escapeHtml(e.message) + '<br><a href="/hub">返回数字生命库</a></div>';
  }
}

/* ---------- 更换角色形象（本地上传 → 竖版裁剪 → 更新形象） ---------- */
const PORTRAIT_MAX_BYTES = 5 * 1024 * 1024; // 单文件 5MB
let portraitCropCb = null; // 裁剪完成回调（收到裁剪后的 Blob）
let cropState = {
  img: null, viewW: 210, viewH: 280, baseScale: 1,
  zoom: 1, offsetX: 0, offsetY: 0, drag: false, dragStartX: 0, dragStartY: 0
};

function isStaticPortrait(type) {
  return ["image/jpeg", "image/png", "image/webp"].includes(type);
}

/* 选择文件后的入口：静态图走竖版裁剪，GIF 直接上传 */
function handlePortraitFile(file) {
  if (!file) return;
  if (file.size > PORTRAIT_MAX_BYTES) {
    alert("「" + (file.name || "图片") + "」超过 5MB 限制。");
    return;
  }
  if (isStaticPortrait(file.type)) { openCropModal(file, uploadPortrait); return; }
  if (file.type === "image/gif") { uploadPortrait(file); return; }
  alert("仅支持 JPG/PNG/WebP 静态图或 GIF 动图。");
}

/* 上传形象图片并更新角色的形象（image_url） */
async function uploadPortrait(blob) {
  const btn = $("cropConfirm");
  const formData = new FormData();
  formData.append("file", blob, blob.type === "image/gif" ? "portrait.gif" : "portrait.png");
  try {
    const res = await fetch("/api/upload", {
      method: "POST",
      credentials: "include",
      headers: (() => { const h = {}; const t = localStorage.getItem("hyool_token"); if (t) h["Authorization"] = "Bearer " + t; return h; })(),
      body: formData
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "上传失败。");
    const r = await api("/api/buddy/" + getCharId() + "/image", {
      method: "POST", body: JSON.stringify({ image_url: data.url })
    });
    if (!r.success) throw new Error(r.error || "更新形象失败。");
    character.image_url = data.url;
    const img = $("portraitImg");
    img.src = data.url;
    img.style.display = "";
    $("portraitPanel").classList.remove("mobile-show");
  } catch (e) {
    alert("更换形象失败：" + e.message);
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ---- 竖版 3:4 形象裁剪 ---- */
function clampCropOffset() {
  const scale = cropState.baseScale * cropState.zoom;
  const sw = cropState.img.width * scale;
  const sh = cropState.img.height * scale;
  const maxOX = Math.max(0, (sw - cropState.viewW) / 2);
  const maxOY = Math.max(0, (sh - cropState.viewH) / 2);
  cropState.offsetX = Math.min(maxOX, Math.max(-maxOX, cropState.offsetX));
  cropState.offsetY = Math.min(maxOY, Math.max(-maxOY, cropState.offsetY));
}

function renderCrop() {
  const canvas = $("cropCanvas");
  const ctx = canvas.getContext("2d");
  const W = cropState.viewW, H = cropState.viewH;
  ctx.fillStyle = "#0a0a12";
  ctx.fillRect(0, 0, W, H);
  if (!cropState.img) return;
  clampCropOffset();
  const scale = cropState.baseScale * cropState.zoom;
  const sw = cropState.img.width * scale;
  const sh = cropState.img.height * scale;
  const drawX = W / 2 - sw / 2 + cropState.offsetX;
  const drawY = H / 2 - sh / 2 + cropState.offsetY;
  ctx.drawImage(cropState.img, drawX, drawY, sw, sh);
  ctx.strokeStyle = "rgba(139,139,255,.6)";
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W - 2, H - 2);
}

function openCropModal(file, cb) {
  portraitCropCb = cb;
  const btn = $("cropConfirm");
  if (btn) btn.disabled = false;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      cropState.img = img;
      cropState.baseScale = Math.max(cropState.viewW / img.width, cropState.viewH / img.height);
      cropState.zoom = 1;
      cropState.offsetX = 0;
      cropState.offsetY = 0;
      const zoomEl = $("cropZoom");
      if (zoomEl) { zoomEl.value = 100; zoomEl.min = 100; zoomEl.max = 400; }
      renderCrop();
      $("cropBackdrop").classList.add("active");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function closeCropModal() {
  $("cropBackdrop").classList.remove("active");
  cropState.img = null;
}

function confirmCrop() {
  if (!cropState.img) return;
  const btn = $("cropConfirm");
  if (btn) btn.disabled = true;
  const W = cropState.viewW, H = cropState.viewH;
  const scale = cropState.baseScale * cropState.zoom;
  const sw = cropState.img.width * scale;
  const sh = cropState.img.height * scale;
  const drawX = W / 2 - sw / 2 + cropState.offsetX;
  const drawY = H / 2 - sh / 2 + cropState.offsetY;
  const srcX = -drawX / scale;
  const srcY = -drawY / scale;
  const srcW = W / scale;
  const srcH = H / scale;
  const out = document.createElement("canvas");
  out.width = 720;
  out.height = 960;
  const octx = out.getContext("2d");
  octx.drawImage(cropState.img, srcX, srcY, srcW, srcH, 0, 0, 720, 960);
  const cb = portraitCropCb;
  portraitCropCb = null;
  closeCropModal();
  out.toBlob(function(blob) {
    if (!blob) { if (btn) btn.disabled = false; alert("裁剪失败，请重试。"); return; }
    if (cb) cb(blob);
  }, "image/png");
}

async function sendMessage() {
  if (sending) return;
  const input = $("msgInput");
  const text = input.value.trim();
  if (!text) return;
  sending = true;
  $("sendBtn").disabled = true;
  input.value = "";
  input.style.height = "auto";
  addMessage("user", text, false);
  const typingRow = addMessage("assistant", "", true);
  setSpeaking(true);
  try {
    const res = await api("/api/buddy/" + getCharId() + "/chat", {
      method: "POST", body: JSON.stringify({ message: text })
    });
    if (!res.success) throw new Error(res.error || "对话失败。");
    setSpeaking(false);
    typingRow.classList.remove("typing");
    const replyText = res.reply;
    typingRow.querySelector(".bubble").innerHTML = escapeHtml(replyText).replace(/\n/g, "<br>");
    const spBtn = document.createElement("button");
    spBtn.className = "speaker-btn";
    spBtn.type = "button";
    spBtn.title = "朗读这条回复";
    spBtn.textContent = "🔊";
    spBtn.addEventListener("click", () => speakText(replyText, spBtn));
    typingRow.appendChild(spBtn);
    if (res.intimacy !== undefined) {
      currentIntimacy = res.intimacy;
      updateSettingsUI();
    }
    if (res.memories_count !== undefined) {
      const bar = document.querySelector(".mem-bar");
      if (bar) {
        bar.innerHTML = '<span class="dot"></span> TA 记得 ' + res.memories_count + ' 段与你有关的记忆';
      }
    }
    scrollBottom();
  } catch (e) {
    setSpeaking(false);
    typingRow.remove();
    const errRow = addMessage("assistant", "（出了点问题：" + e.message + "）", false);
    errRow.querySelector(".bubble").style.color = "#ff8b8b";
  } finally {
    sending = false;
    $("sendBtn").disabled = false;
    input.focus();
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  if (!(await checkAuth())) return;
  if (!getCharId()) { location.href = "/hub"; return; }

  $("backBtn").addEventListener("click", () => { location.href = "/hub"; });
  $("logoutBtn").addEventListener("click", async () => {
    localStorage.removeItem("hyool_token");
    try { await api("/api/logout", { method: "POST" }); } catch {}
    location.href = "/yonder";
  });

  // Mobile portrait toggle
  $("portraitToggle").addEventListener("click", () => {
    $("portraitPanel").classList.toggle("mobile-show");
  });

  // Settings
  $("settingsBtn").addEventListener("click", () => {
    updateSettingsUI();
    $("settingsOverlay").classList.add("show");
  });
  $("settingsClose").addEventListener("click", () => {
    $("settingsOverlay").classList.remove("show");
  });
  $("settingsOverlay").addEventListener("click", (e) => {
    if (e.target === $("settingsOverlay")) $("settingsOverlay").classList.remove("show");
  });
  $("tempSlider").addEventListener("input", (e) => {
    chatConfig.temperature = parseFloat(e.target.value);
    $("tempVal").textContent = chatConfig.temperature.toFixed(1);
    saveConfig();
  });
  $("tokenSlider").addEventListener("input", (e) => {
    chatConfig.max_tokens = parseInt(e.target.value);
    $("tokenVal").textContent = chatConfig.max_tokens;
    saveConfig();
  });
  document.querySelectorAll("#proSeg button").forEach(btn => {
    btn.addEventListener("click", () => {
      chatConfig.proactivity = btn.dataset.v;
      document.querySelectorAll("#proSeg button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      saveConfig();
    });
  });
  $("voiceSelect").addEventListener("change", (e) => {
    chatConfig.voice = e.target.value;
    saveConfig();
  });
  $("rateSlider").addEventListener("input", (e) => {
    chatConfig.rate = parseInt(e.target.value);
    $("rateVal").textContent = (chatConfig.rate > 0 ? "+" : "") + chatConfig.rate + "%";
    saveConfig();
  });
  $("voicePreviewBtn").addEventListener("click", () => {
    playVoicePreview(effectiveVoice());
  });
  // 声音列表在 loadMessages()（renderCharacter）拿到角色性别后重建，保证严格按性别过滤

  const input = $("msgInput");
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $("sendBtn").addEventListener("click", sendMessage);

  // 更换形象（本地上传 → 竖版裁剪 → 更新角色形象）
  $("changePortraitBtn").addEventListener("click", () => $("portraitInput").click());
  $("portraitInput").addEventListener("change", (e) => {
    handlePortraitFile(e.target.files && e.target.files[0]);
    e.target.value = "";
  });

  // 形象裁剪
  $("cropCancel").addEventListener("click", closeCropModal);
  $("cropConfirm").addEventListener("click", confirmCrop);
  $("cropZoomOut").addEventListener("click", () => {
    cropState.zoom = Math.max(1, +(cropState.zoom - 0.1).toFixed(2));
    $("cropZoom").value = Math.round(cropState.zoom * 100);
    renderCrop();
  });
  $("cropZoomIn").addEventListener("click", () => {
    cropState.zoom = Math.min(4, +(cropState.zoom + 0.1).toFixed(2));
    $("cropZoom").value = Math.round(cropState.zoom * 100);
    renderCrop();
  });
  $("cropZoom").addEventListener("input", (e) => {
    cropState.zoom = parseFloat(e.target.value) / 100;
    renderCrop();
  });
  $("cropCanvas").addEventListener("mousedown", (e) => {
    cropState.drag = true;
    cropState.dragStartX = e.clientX - cropState.offsetX;
    cropState.dragStartY = e.clientY - cropState.offsetY;
  });
  window.addEventListener("mousemove", (e) => {
    if (!cropState.drag) return;
    cropState.offsetX = e.clientX - cropState.dragStartX;
    cropState.offsetY = e.clientY - cropState.dragStartY;
    renderCrop();
  });
  window.addEventListener("mouseup", () => { cropState.drag = false; });
  $("cropCanvas").addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    cropState.drag = true;
    cropState.dragStartX = t.clientX - cropState.offsetX;
    cropState.dragStartY = t.clientY - cropState.offsetY;
  }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (!cropState.drag) return;
    const t = e.touches[0];
    cropState.offsetX = t.clientX - cropState.dragStartX;
    cropState.offsetY = t.clientY - cropState.dragStartY;
    renderCrop();
  }, { passive: true });
  window.addEventListener("touchend", () => { cropState.drag = false; });

  await loadMessages();
});
</script>
</body>
</html>
