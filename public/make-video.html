<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=/make.html">
<title>跳转中…</title>
<script>
(function () {
  var dest = new URL('/make.html', location.origin);
  location.search.replace(/^\?/, '').split('&').filter(Boolean).forEach(function (pair) {
    var i = pair.indexOf('=');
    if (i < 0) dest.searchParams.set(pair, '');
    else dest.searchParams.set(pair.slice(0, i), decodeURIComponent(pair.slice(i + 1)));
  });
  if (!dest.searchParams.has('story') && !dest.searchParams.has('hint')) {
    dest.searchParams.set('hint', 'video');
  }
  location.replace(dest.pathname + dest.search);
})();
</script>
</head>
<body>
<p>正在跳转到 <a href="/make.html">视觉小说编辑器</a>…</p>
</body>
</html>
