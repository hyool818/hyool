<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>我的作品 · HYOOL</title>
<link rel="stylesheet" href="/workspace/css/workspace.css">
<style>
.mw-main{max-width:920px;margin:0 auto;padding:0 16px 48px}
.mw-hero p{color:var(--muted);font-size:13px;line-height:1.7;margin-top:8px}
.mw-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 12px}
.mw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mw-card{border:1px solid var(--line2);border-radius:12px;background:#12121c;padding:14px;display:flex;flex-direction:column;gap:10px}
.mw-card .row{display:flex;gap:10px;align-items:flex-start}
.mw-card .thumb{width:72px;height:48px;border-radius:8px;background:#0a0a12;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:20px}
.mw-card .thumb img{width:100%;height:100%;object-fit:cover}
.mw-card .info{flex:1;min-width:0}
.mw-card .title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw-card .meta{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.5}
.mw-card .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;border:1px solid var(--line2);color:var(--muted);margin-right:4px}
.mw-card .badge.pub{border-color:rgba(95,200,255,.35);color:var(--accent2)}
.mw-card .ops{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mw-card .ops .btn{padding:6px 10px;font-size:11px}
.mw-empty,.mw-login{text-align:center;padding:48px 16px;color:var(--muted);line-height:1.85;font-size:13px}
.mw-login a{color:var(--accent2)}
</style>
</head>
<body>
<div class="hub">
  <header class="hub-topbar">
    <a class="back" href="/studio.html">← 创作</a>
    <div class="hub-brand">
      <span class="hub-brand-name">我的作品</span>
      <span class="hub-brand-en">PLAY · EDIT · PUBLISH</span>
    </div>
  </header>
  <main class="mw-main">
    <section class="mw-hero">
      <h1 class="hub-hero-name" style="font-size:22px;margin:12px 0 0">全部作品</h1>
      <p>小说、漫画、卡牌、H5 游戏都在这里。点<strong>试玩</strong>立刻看效果，满意再<strong>发布</strong>到广场。</p>
    </section>
    <div id="mwLogin" class="mw-login hidden">请先 <a href="/yonder.html?next=/my-works.html">登录</a>，云端作品才会显示。</div>
    <div id="mwApp" class="hidden">
      <div class="mw-bar">
        <span id="mwCount" style="font-size:12px;color:var(--muted)"></span>
        <span style="flex:1"></span>
        <a class="btn primary" href="/studio.html" style="text-decoration:none">＋ 新建作品</a>
      </div>
      <div id="mwGrid" class="mw-grid"></div>
      <div id="mwEmpty" class="mw-empty hidden">还没有作品。<a href="/studio.html">去创作中枢</a> 选一种类型开始。</div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/my-works.js?v=20260827"></script>
</body>
</html>
