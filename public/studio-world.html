<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>创造世界 · HYOOL</title>
<link rel="stylesheet" href="/workspace/css/workspace.css">
<link rel="stylesheet" href="/profile-hub.css">
<style>
.st-main{max-width:720px;margin:0 auto;padding:0 16px 56px}
.st-q{font-size:clamp(22px,4.5vw,32px);font-weight:700;margin:20px 0 8px}
.st-sub{color:var(--muted);font-size:14px;line-height:1.75;margin-bottom:24px}
.st-links{display:grid;gap:10px}
.st-links a{display:block;padding:16px 18px;border-radius:14px;border:1px solid var(--line2);
  background:#12121c;color:inherit;text-decoration:none;transition:.15s}
.st-links a:hover{border-color:rgba(139,123,255,.5)}
.st-links a .t{font-size:15px;font-weight:600;margin-bottom:4px}
.st-links a .d{font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="hub">
  <header class="hub-topbar">
    <a class="back" href="/make.html">← 创建作品</a>
    <div class="hub-brand">
      <span class="hub-brand-name">创造世界</span>
      <span class="hub-brand-en">WORLD · IP</span>
    </div>
  </header>
  <main class="st-main">
    <h1 class="st-q">给作品一个「世界」</h1>
    <p class="st-sub">角色、关系、会自己运转的生命世界。和写故事不冲突——你可以先写故事，再来这里补角色和 IP。</p>
    <div class="st-links">
      <a href="/create.html">
        <div class="t">👤 创建一个角色</div>
        <div class="d">名字、性格、形象。可以聊天，也可以放进下面的世界。</div>
      </a>
      <a href="/create-life-world.html">
        <div class="t">🌍 创建生命世界</div>
        <div class="d">多角色、多场景，AI 帮你推进关系和小剧情。</div>
      </a>
      <a href="/plaza">
        <div class="t">🏛 幻灵广场</div>
        <div class="d">逛别人发布的作品和世界，找灵感或直接玩。</div>
      </a>
      <a href="/my-vault?from=%2Fstudio-world.html">
        <div class="t">🗄 我的素材库</div>
        <div class="d">图片、配音、视频云端保存，作品里复用。</div>
      </a>
      <a href="/yonder.html">
        <div class="t">🏠 我的主页</div>
        <div class="d">登录后展示你的作品，分享给朋友。</div>
      </a>
    </div>
  </main>
</div>
<script type="module" src="/studio-world.js?v=20260828c"></script>
</body>
</html>
