<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>游戏工坊 · 幻想世界 · HYOOL</title>
<link rel="stylesheet" href="/workspace/css/workspace.css">
<style>
/* ---------- 游戏工坊专用 ---------- */
.game-stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:12px;
  padding:16px;overflow-y:auto;
  background:
    radial-gradient(1200px 600px at 20% 0%,rgba(139,123,255,.06),transparent 60%),
    radial-gradient(900px 500px at 90% 100%,rgba(95,200,255,.05),transparent 60%),
    var(--bg)}
.game-panel{flex:0 0 330px;border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:18px;
  overflow-y:auto;background:var(--bg2)}
.game-panel h3{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;font-weight:600}
.tpl-picker{display:flex;gap:10px;flex-wrap:wrap}
.tpl-card{flex:1 1 150px;min-width:140px;border:1px solid var(--line2);background:var(--bg3);border-radius:12px;
  padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s;
  text-align:left;font-family:inherit;color:var(--text)}
.tpl-card:hover{border-color:var(--accent)}
.tpl-card.active{border-color:var(--accent);background:rgba(139,123,255,.13)}
.tpl-card.active .tpl-icon{transform:scale(1.12)}
.tpl-icon{font-size:22px;flex:0 0 30px;text-align:center;transition:.15s}
.tpl-info{min-width:0}
.tpl-info b{font-size:13.5px;display:block}
.tpl-info p{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.game-box{position:relative;flex:1 1 auto;min-height:320px;border:1px solid var(--line2);border-radius:14px;
  overflow:hidden;background:#000}
#gameCanvasHost{position:absolute;inset:0}
#gameCanvasHost canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;text-align:center;padding:20px;
  background:rgba(5,5,10,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay .big{font-size:40px}
.overlay .ov-title{font-size:17px;font-weight:700}
.overlay .ov-sub{font-size:12.5px;color:var(--muted);max-width:340px;line-height:1.7}
.game-hud{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;gap:8px;justify-content:space-between;
  padding:10px 14px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.38),transparent)}
.hud-chip{font-size:12px;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);
  border-radius:999px;padding:4px 12px;display:flex;gap:6px;align-items:center}
.hud-chip b{color:var(--accent2);font-variant-numeric:tabular-nums}
.hud-chip .life{color:#f87171}
.go-card{background:#12121c;border:1px solid var(--line2);border-radius:16px;padding:24px 30px;min-width:260px;max-width:340px}
.go-title{font-size:18px;font-weight:800;margin-bottom:4px}
.go-score{font-size:40px;font-weight:800;color:var(--accent2);line-height:1.15}
.go-score span{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.go-stat{font-size:12.5px;color:var(--muted);margin:6px 0 2px}
.go-best{font-size:12px;color:var(--warn);margin-bottom:16px}
.go-actions{display:flex;flex-direction:column;gap:8px}
.go-actions .btn{width:100%}
.controls{flex:0 0 auto;display:flex;gap:10px;align-items:center}
.controls .spacer{flex:1}
.engine-badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.engine-badge b{color:var(--accent2)}
.save-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--line2);
  border-radius:10px;padding:10px 12px;margin-bottom:8px}
.save-icon{font-size:20px;flex:0 0 30px;text-align:center}
.save-info{flex:1;min-width:0}
.save-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-sub{font-size:11px;color:var(--muted)}
.save-sub b{color:var(--warn)}
.save-ops{display:flex;gap:6px}
.btn.danger{border-color:rgba(248,113,113,.4);color:var(--bad)}
.btn.danger:hover{background:rgba(248,113,113,.12);border-color:var(--bad)}
@media (max-width:760px){
  .layout{flex-direction:column}
  .game-stage{flex:1 1 55%;min-height:280px}
  .game-panel{flex:1 1 45%;max-width:none;border-left:none;border-top:1px solid var(--line)}
  .tpl-card{flex:1 1 100%}
}
</style>
<body>

<header class="topbar">
  <a class="back" href="/fantasy.html">← 返回</a>
  <div class="brand">
    <span class="brand-name">游戏工坊</span>
    <span class="brand-sub">GAME STUDIO · 模板化小游戏生成器</span>
  </div>
  <div class="topbar-right">
    <span class="engine-badge" id="engineBadge">引擎 <b>待启动</b></span>
  </div>
</header>

<div class="layout">

  <div class="game-stage">
    <!-- 模板选择 -->
    <div class="tpl-picker" id="tplPicker"></div>

    <!-- 试玩区 -->
    <div class="game-box">
      <div class="game-hud hidden" id="gameHud">
        <span class="hud-chip">得分 <b id="hudScore">0</b></span>
        <span class="hud-chip" id="hudStatWrap">本局 <b id="hudStat">-</b></span>
        <span class="hud-chip" id="hudLivesWrap" style="display:none">生命 <b class="life" id="hudLives"></b></span>
        <span class="hud-chip">时间 <b id="hudTime">30</b>s</span>
      </div>

      <div id="gameCanvasHost"></div>

      <div class="overlay" id="idleOverlay">
        <div class="big">🎮</div>
        <div class="ov-title">准备开始</div>
        <div class="ov-sub" id="idleHint">选择模板、配置角色与难度，然后点「开始试玩」。所有内容在浏览器内运行，不需要上传任何文件。</div>
        <button class="btn primary wide" id="idleStartBtn" style="max-width:220px">▶ 开始试玩</button>
      </div>

      <div class="overlay hidden" id="loadingOverlay">
        <div class="big">⏳</div>
        <div class="ov-title">正在加载游戏引擎…</div>
        <div class="ov-sub">首次加载需从 CDN 拉取 PixiJS（约 650KB），之后由浏览器缓存。</div>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="go-card">
          <div class="go-title" id="goTitle">时间到！</div>
          <div class="go-score" id="goScore">0<span>分</span></div>
          <div class="go-stat" id="goStat"></div>
          <div class="go-best" id="goBest"></div>
          <div class="go-actions">
            <button class="btn primary" id="goAgainBtn">↻ 再玩一次</button>
            <button class="btn" id="goSaveBtn">＋ 保存到我的游戏</button>
            <button class="btn ghost" id="goCloseBtn">返回编辑</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn">▶ 开始试玩</button>
      <button class="btn" id="stopBtn" disabled>■ 停止</button>
      <span class="spacer"></span>
      <span style="font-size:11px;color:var(--muted)" id="ctrlHint"></span>
    </div>
  </div>

  <aside class="game-panel">

    <section>
      <h3>① 配置你的游戏</h3>
      <div class="field">
        <label>游戏名称</label>
        <input type="text" id="cfgName" class="num" value="我的小游戏" maxlength="24">
      </div>
      <div class="field">
        <label>主角 / 角色（emoji）</label>
        <input type="text" id="cfgHero" class="num" value="🧺" maxlength="8">
      </div>
      <div class="field">
        <label>掉落物 / 敌人（emoji，留空则随机）</label>
        <input type="text" id="cfgItem" class="num" value="" maxlength="8" placeholder="留空随机">
      </div>
      <div class="field">
        <label>背景颜色</label>
        <div class="row" style="margin:0">
          <input type="color" id="cfgBg" value="#1b2340" style="width:44px;height:30px;padding:0;border:1px solid var(--line2);border-radius:7px;background:var(--bg3)">
          <span class="mono" style="font-size:12px;color:var(--muted)" id="cfgBgVal">#1b2340</span>
        </div>
      </div>
      <div class="field">
        <label>难度</label>
        <input type="range" id="cfgDiff" min="1" max="3" step="1" value="2">
        <div class="row" style="justify-content:space-between;margin-top:2px">
          <span style="font-size:11px;color:var(--muted)" id="cfgDiffVal">普通</span>
          <span style="font-size:11px;color:var(--muted)">简单 ← → 困难</span>
        </div>
      </div>
      <div class="field">
        <label>单局时长</label>
        <select id="cfgTime">
          <option value="20">20 秒</option>
          <option value="30" selected>30 秒</option>
          <option value="45">45 秒</option>
          <option value="60">60 秒</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="cfgSound" checked> 音效（Web Audio 合成，无外部音频）</label>
    </section>

    <section>
      <h3>② 我的游戏</h3>
      <button class="btn wide" id="saveBtn">＋ 保存当前配置</button>
      <div id="saveList" style="margin-top:12px"></div>
    </section>

    <section style="font-size:11px;color:var(--muted);line-height:1.7">
      游戏引擎：PixiJS（WebGL）按需从 CDN 加载，加载失败自动回退 Canvas 2D。存档保存在浏览器本地。
    </section>

  </aside>
</div>

<div class="toast" id="toast"></div>
<script type="module" src="/workspace/js/game-studio.js"></script>
</body>
</html>
