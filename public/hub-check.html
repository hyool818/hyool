<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HUB-CHECK</title>
</head>
<body>
<pre id="results">RUNNING…</pre>
<iframe id="fa" src="about:blank" style="width:1280px;height:800px;border:1px solid #333"></iframe>
<script>
/* /hub 已改为重定向；角色库/世界库在个人主页，向导与编辑由 ProfileHubUI 提供 */
const results = [];
function line(s){ results.push(s); document.getElementById('results').textContent = results.join('\n'); }
function ok(cond, name, extra=''){ line((cond?'PASS':'FAIL')+'  '+name+(extra?'  '+extra:'')); }

const u = 'hbtest' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36).slice(0,4);
let token = '';

async function register(){
  const r = await fetch('/api/register', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: 'testpass123', display_name: 'Hub测试', invite_code: 'HUBTEST2026' })
  });
  const d = await r.json();
  if (!d.success) throw new Error('register failed: ' + (d.error || r.status));
  token = d.token || '';
  if (token) localStorage.setItem('hyool_token', token);
  return d;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function waitFor(fn, timeout, what){
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      let v = null;
      try { v = fn(); } catch(e) {}
      if (v) { clearInterval(iv); resolve(v); }
      else if (Date.now() - t0 > timeout) { clearInterval(iv); reject(new Error('timeout: ' + what)); }
    }, 150);
  });
}

async function loadHub(path) {
  const f = document.getElementById('fa');
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error('iframe load timeout')), 60000);
    f.addEventListener('load', () => { clearTimeout(to); res(); }, { once: true });
    f.src = path;
  });
  return f;
}

async function main(){
  try {
    await register();
    ok(!!token, 'register user', u);

    const f = await loadHub('/hub');
    const profilePath = '/@' + u;

    await waitFor(() => {
      const d = f.contentDocument;
      return d && d.location && d.location.pathname === profilePath ? d : null;
    }, 25000, '/hub redirect to profile');
    ok(true, '/hub 重定向到个人主页', profilePath);

    const doc = await waitFor(() => {
      const d = f.contentDocument;
      return (d.getElementById('app') && d.getElementById('app').style.display === 'block') ? d : null;
    }, 25000, 'profile app ready');
    const win = f.contentWindow;
    const q = (s) => doc.querySelector(s);
    const qa = (s) => [...doc.querySelectorAll(s)];

    await waitFor(() => win.ProfileHubUI && doc.getElementById('wizardModal'), 25000, 'ProfileHubUI mounted');
    await sleep(400);

    const h2World = doc.getElementById('worldsSection');
    ok(!!q('#charGrid') && !!q('#worldGrid'), '个人主页含角色库/世界库网格');
    ok(h2World && (h2World.querySelector('h2') || {}).textContent.trim() === '世界库', '世界库区块标题');
    ok(!!q('#worldGrid button.create-card'), '世界库「创造世界」按钮');

    q('#worldGrid button.create-card').click();
    await sleep(350);
    ok(q('#wizardModal').classList.contains('show'), '自定义世界向导打开');
    ok(qa('#wizardSteps .wizard-step-dot').length === 5, '向导 5 步圆点');
    ok(q('.wstep.active[data-wstep="1"]') != null, '第 1 步: 题材');

    const genreCard = q('#genreGrid .option-card[data-genre="fantasy"]');
    ok(!!genreCard, '题材卡片存在');
    genreCard.click();
    await sleep(80);
    q('#wizardNext').click();
    await sleep(200);
    ok(q('.wstep.active[data-wstep="2"]') != null, '第 2 步: 命名与设定');

    q('#wName').value = '星陨之地';
    q('#wDesc').value = '被流星撕裂的大陆上，最后一个守夜人苏醒了。';
    const storyForm = q('#formGrid .option-card[data-form="story"]');
    ok(!!storyForm, '载体选项存在');
    storyForm.click();
    await sleep(80);
    q('#wizardNext').click();
    await sleep(200);
    ok(q('.wstep.active[data-wstep="3"]') != null, '第 3 步: 选角色');

    q('#wizardNext').click();
    await sleep(250);
    ok(q('.wstep.active[data-wstep="4"]') != null, '第 4 步: 生成封面');

    q('#wizardNext').click();
    await sleep(300);
    ok(q('.wstep.active[data-wstep="5"]') != null, '第 5 步: 确认创建');
    ok(q('#coverPreview2').src && q('#coverPreview2').src.includes('image.pollinations.ai'), '封面 URL 已生成', (q('#coverPreview2').src || '').slice(0, 80));
    ok(q('#wSummary').textContent.includes('星陨之地'), '摘要含世界名');

    q('#wizardNext').click();
    await waitFor(() => {
      const d = f.contentDocument;
      return (d.getElementById('worldGrid').textContent.includes('星陨之地')) ? d : null;
    }, 15000, 'world card appears');
    ok(true, '创建世界成功, 卡片出现在世界库');

    const wCard = qa('#worldGrid .world-card').find(c => c.querySelector('.name') && c.querySelector('.name').textContent.includes('星陨之地'));
    ok(!!wCard, '世界库展示世界卡片');
    wCard.click();
    await sleep(350);
    ok(q('#worldDetailModal').classList.contains('show'), '世界详情弹窗打开');
    ok(q('#detailName').textContent === '星陨之地', '详情显示世界名');
    ok(q('#detailBadges').textContent.includes('奇幻') && q('#detailBadges').textContent.includes('故事剧本'), '详情徽章: 题材/载体');
    q('#detailDelete').click();
    await sleep(250);
    ok(q('#deleteModal').classList.contains('show'), '删除确认弹窗');
    q('#deleteConfirm').click();
    await waitFor(() => {
      const d = f.contentDocument;
      return (!d.getElementById('worldGrid').textContent.includes('星陨之地')) ? d : null;
    }, 15000, 'world deleted');
    ok(true, '删除世界成功');

    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    localStorage.removeItem('hyool_token');
    await loadHub('/hub');
    const gdoc = await waitFor(() => {
      const d = f.contentDocument;
      return (d && d.location && d.location.pathname === '/plaza') ? d : null;
    }, 20000, 'hub guest redirected to /plaza');
    await sleep(300);
    ok(true, '游客 /hub 重定向到 /plaza', gdoc.location.pathname);
    ok(gdoc.querySelector('h1') && gdoc.querySelector('h1').textContent.includes('幻灵世界'), '幻灵世界广场大标题');

    if (token) localStorage.setItem('hyool_token', token);
    const fails = results.filter(r => r.startsWith('FAIL')).length;
    document.title = fails ? 'SMOKE-FAIL' : 'SMOKE-OK';
    line('==== 冒烟结果: ' + (fails ? '失败 ' + fails + ' 项' : '全部通过') + ' ====');
  } catch (e) {
    line('FATAL: ' + (e && e.stack || e && e.message || e));
    document.title = 'SMOKE-FAIL';
  }
}
main();
</script>
</body>
</html>
