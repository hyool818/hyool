<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 幻灵世界</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed; min-height: 100vh; overflow-x: hidden; line-height: 1.7;
}
a { color: inherit; text-decoration: none; }

.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 72px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
  background: linear-gradient(to bottom, rgba(5,5,8,.52), transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .12em; font-size: 15px; }
.header .logo img { height: 30px; width: auto; }
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s, transform .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); transform: translateY(-1px); }

.page { max-width: 1100px; margin: 0 auto; padding: 110px 24px 100px; }
.page-head { margin-bottom: 1.6rem; }
.page-head h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; }
.page-head p { color: var(--muted); font-size: .9rem; margin-top: .3rem; }
.page-head .cnt { color: var(--accent); font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.2rem; }

.card {
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.05);
  border-radius: 18px; overflow: hidden; cursor: pointer;
  transition: transform .25s, background .25s, border .25s;
  backdrop-filter: blur(18px); display: flex; flex-direction: column; position: relative;
}
@media (hover: hover) { .card:hover { transform: translateY(-4px); background: rgba(255,255,255,.08); border-color: rgba(139,139,255,.3); } }
.card .thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; object-position: center top; background: #0c0d14; display: block; }
.card .body { padding: 1rem 1.1rem 1.1rem; flex: 1; display: flex; flex-direction: column; }
.card .name { font-size: 1rem; font-weight: 700; margin-bottom: .4rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .hook { font-size: .82rem; color: rgba(255,255,255,.6); line-height: 1.55; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .owner { display: flex; align-items: center; gap: 8px; margin-top: .8rem; }
.card .owner img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #0c0d14; border: 1px solid rgba(255,255,255,.12); }
.card .owner .oname { font-size: .78rem; color: rgba(255,255,255,.85); }
.card .owner .ouname { font-size: .7rem; color: var(--muted); }
.card .foot { font-size: .7rem; color: var(--muted); margin-top: .7rem; display: flex; justify-content: space-between; align-items: center; }
.badge { font-size: .62rem; padding: 2px 9px; border-radius: 999px; background: rgba(139,139,255,.16); color: #b7b7ff; letter-spacing: .02em; }
.badge.life { background: rgba(120,220,170,.14); color: #9fdcbb; }
.badge.story { background: rgba(255,190,110,.14); color: #ffcf8e; }
.badge.story.rpg { background: rgba(255,120,90,.16); color: #ffb3a3; }
.badge.story.rogue { background: rgba(180,140,255,.16); color: #d4c2ff; }

.empty { padding: 90px 20px; text-align: center; border: 1px dashed rgba(255,255,255,.10); border-radius: 20px; color: rgba(255,255,255,.32); font-size: 14px; }
.loading { text-align: center; color: var(--muted); padding: 90px 0; }
.err { text-align: center; color: #ff9a9a; padding: 60px 20px; font-size: 14px; }
.err a { color: #b7b7ff; }
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="/"><img src="/logo1.png" alt="HYOOL"></a>
  <div style="display:flex;gap:.6rem;align-items:center;">
    <a class="header-link" href="/">首页</a>
    <a class="header-link" href="/hub">个人主页</a>
  </div>
</header>

<main class="page">

  <div class="page-head">
    <h1>🌍 幻灵世界</h1>
    <p>每一位主人发布的生命世界与故事作品，都在这里自由运转。<span class="cnt" id="cnt"></span></p>
  </div>

  <div id="status" class="loading">加载中…</div>
  <div id="grid" class="grid"></div>

<script>
const $ = id => document.getElementById(id);
const escapeHtml = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

async function loadPlaza() {
  try {
    const res = await fetch("/api/plaza", { credentials: "include" });
    const data = await res.json();
    if (!data.success) throw new Error(data.error || "加载失败。");

    const worlds = data.worlds || [];
    const stories = data.stories || [];
    const total = worlds.length + stories.length;
    $("cnt").textContent = total ? `（${worlds.length} 个世界 · ${stories.length} 部作品 正在运转）` : "";
    $("status").style.display = "none";
    const worldCards = worlds.map(w => {
      const name = escapeHtml(w.name || "未名世界");
      const desc = escapeHtml(w.description || "TA 还没有写世界简介。");
      const ownerName = escapeHtml(w.owner_display_name || w.owner_username || "TA");
      const ownerUser = w.owner_username ? "@" + escapeHtml(w.owner_username) : "";
      const avatar = escapeHtml(w.owner_avatar_url || "");
      const natives = Number(w.natives_count) || 0;
      const scenes = Number(w.scenes_count) || 0;
      const updated = w.updated_at ? new Date(w.updated_at).toLocaleDateString("zh-CN") : "";
      return `<div class="card" onclick="location.href='/world?world=${w.id}&from=/plaza'">
        <img class="thumb" src="${escapeHtml(w.cover_image || '')}" alt="" loading="lazy" onerror="this.style.opacity=.2">
        <div class="body">
          <div class="name">${name}<span class="badge life">生命世界</span></div>
          <div class="hook">${desc}</div>
          <div class="owner">
            ${avatar ? `<img src="${avatar}" alt="" onerror="this.style.visibility='hidden'">` : "<img src='/logo1.png' alt=''>"}
            <div><div class="oname">${ownerName}</div>${ownerUser ? `<div class="ouname">${ownerUser}</div>` : ""}</div>
          </div>
          <div class="foot">
            <span>原住民 ${natives} · 场景 ${scenes}</span>
            <span>${updated}</span>
          </div>
        </div>
      </div>`;
    }).join("");
    const storyCards = stories.map(s => {
      const name = escapeHtml(s.title || "未名作品");
      const ownerName = escapeHtml(s.owner_display_name || s.owner_username || "TA");
      const ownerUser = s.owner_username ? "@" + escapeHtml(s.owner_username) : "";
      const avatar = escapeHtml(s.owner_avatar_url || "");
      const orient = s.orientation === "portrait" ? "📱 9:16 竖屏" : "🖥 16:9 横屏";
      const updated = s.updated_at ? new Date(s.updated_at).toLocaleDateString("zh-CN") : "";
      const isRpg = s.kind === "card_rpg";
      const isRogue = s.kind === "gacha_rogue";
      const isH5 = s.kind === "h5_game";
      const badge = isH5
        ? `<span class="badge story" style="background:rgba(120,200,140,.14);color:#a8e8b8">🎮 H5</span>`
        : isRogue
        ? `<span class="badge story rogue">🂠 卡牌</span>`
        : isRpg ? `<span class="badge story rpg">⚔️ 卡牌RPG</span>` : `<span class="badge story">故事作品</span>`;
      const hook = isH5
        ? `H5 网页游戏 · ${orient} · 浏览器即玩`
        : isRogue
        ? `卡牌：挂机 / 排队技能 / 每局不同`
        : isRpg
        ? `${Number(s.cards_count) || 0} 张角色卡 · ${Number(s.enemies_count) || 0} 个敌人 · 自动角色战斗`
        : `${Number(s.chapters_count) || 0} 章 · ${Number(s.blocks_count) || 0} 块积木 · ${orient}`;
      const playHref = isH5
        ? `/h5-play.html?story=${s.id}&from=/plaza`
        : (s.kind === "story" || s.kind === "interactive_video" || !s.kind)
        ? `/make.html?story=${s.id}&play=1&from=/plaza`
        : `/story-editor.html?story=${s.id}&play=1&from=/plaza`;
      return `<div class="card" onclick="location.href='${playHref}'">
        <img class="thumb" src="${escapeHtml(s.cover_image || '')}" alt="" loading="lazy" onerror="this.style.opacity=.2">
        <div class="body">
          <div class="name">${name}${badge}</div>
          <div class="hook">${hook}</div>
          <div class="owner">
            ${avatar ? `<img src="${avatar}" alt="" onerror="this.style.visibility='hidden'">` : "<img src='/logo1.png' alt=''>"}
            <div><div class="oname">${ownerName}</div>${ownerUser ? `<div class="ouname">${ownerUser}</div>` : ""}</div>
          </div>
          <div class="foot">
            <span>${isH5 ? "🎮 H5 游戏" : isRogue ? "🂠 肉鸽自动" : isRpg ? "⚔️ 自动战斗" : "文字剧情"}</span>
            <span>${updated}</span>
          </div>
        </div>
      </div>`;
    }).join("");
    $("grid").innerHTML = (worldCards + storyCards) || `<div class="empty">还没有已发布的生命世界或故事作品。<br>去 <a href="/hub" style="color:#b7b7ff">个人主页</a> 创建并发布你的第一个作品吧。</div>`;
  } catch (e) {
    $("status").style.display = "none";
    $("grid").innerHTML = `<div class="err">加载失败：${escapeHtml(e.message)}<br><a href="/">返回首页</a></div>`;
  }
}

loadPlaza();
</script>

</main>

</body>
</html>
