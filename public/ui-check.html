<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UI-CHECK</title>
</head>
<body>
<pre id="results">RUNNING…</pre>
<iframe id="ws" src="workspace.html" style="width:1280px;height:800px;border:1px solid #333"></iframe>
<script>
const results = [];
function line(s){ results.push(s); document.getElementById('results').textContent = results.join('\n'); }
function ok(cond, name, extra=''){ line((cond?'PASS':'FAIL')+'  '+name+(extra?'  '+extra:'')); }
function waitFrame(){
  return new Promise((resolve, reject) => {
    const f = document.getElementById('ws');
    const to = setTimeout(() => reject(new Error('iframe load timeout')), 60000);
    f.addEventListener('load', () => { clearTimeout(to); resolve(); }, { once: true });
  });
}
async function main(){
  try {
    await waitFrame();
    await new Promise(r => setTimeout(r, 3000)); // wait app.js / hub.js modules
    const doc = document.getElementById('ws').contentDocument;
    const win = document.getElementById('ws').contentWindow;
    const q = (s) => doc.querySelector(s);
    const qa = (s) => [...doc.querySelectorAll(s)];
    const visible = (el) => el && !el.classList.contains('hidden') && win.getComputedStyle(el).display !== 'none';

    // 1) hub is the default landing view
    ok(visible(q('#hubView')), 'hub view visible on load');
    ok(!visible(q('#editorView')), 'editor view hidden on load');
    ok(q('.hub-hero-name') && q('.hub-hero-name').textContent.trim() === '无限', 'hub hero shows 无限');
    ok(q('.tool-card.featured h3') && q('.tool-card.featured h3').textContent.includes('FastEdit'), 'featured FastEdit card present');

    // 2) detailed feature intro
    const feats = qa('.tool-card.featured .tool-feats li').length;
    ok(feats === 10, 'featured card has 10 detailed feature bullets', 'got ' + feats);
    const toolCards = qa('.tool-card').length;
    ok(toolCards === 6, 'tool grid has 6 tool cards', 'got ' + toolCards);
    const cardNames = qa('.tool-card h3').map(h => h.textContent);
    ok(cardNames.includes('音频工坊'), 'audio workshop card present');
    ok(!!qa('.tool-card').some(c => (c.querySelector('.tool-cta').getAttribute('onclick') || '').includes('audio.html')), 'audio card links to /audio.html');
    const fantasyLink = q('.world-link[href="fantasy.html"]');
    ok(!!fantasyLink, 'fantasy world link points to fantasy.html');

    // 3) hidden editor still boots app.js
    ok(q('#presetGrid') && q('#presetGrid').children.length === 10, 'preset grid built (10)', 'got ' + (q('#presetGrid') ? q('#presetGrid').children.length : 'none'));
    ok(typeof win.enterWorkspaceTab === 'function', 'enterWorkspaceTab exposed on window');

    // 4) enter tool
    q('.tool-cta[data-go="editor"]').click();
    await new Promise(r => setTimeout(r, 500));
    ok(!visible(q('#hubView')), 'hub hidden after entering tool');
    ok(visible(q('#editorView')), 'editor visible after entering tool');
    ok(q('.brand-name') && q('.brand-name').textContent.includes('FastEdit'), 'editor brand shows FastEdit 图片工作台');

    // 5) preset list readability: class names now match CSS, text must be light
    const nameEl = q('.preset-card .preset-name');
    const metaEl = q('.preset-card .preset-meta');
    const noteEl = q('.preset-card .preset-note');
    ok(!!nameEl && !!metaEl && !!noteEl, 'preset name/meta/note spans rendered');
    const color = nameEl ? win.getComputedStyle(nameEl).color : '';
    const r = color.match(/\d+/);
    ok(r && +r[0] > 200, 'preset name text is light (was black-on-dark)', color);
    const bg = win.getComputedStyle(q('.preset-card')).backgroundColor;
    ok(bg && bg !== 'rgba(0, 0, 0, 0)', 'preset card has explicit bg', bg);
    const metaColor = win.getComputedStyle(metaEl).color;
    ok(metaColor && +metaColor.match(/\d+/)[0] > 100, 'preset meta text readable', metaColor);

    // 6) back to hub
    q('#backToHubBtn').click();
    await new Promise(r => setTimeout(r, 400));
    ok(visible(q('#hubView')) && !visible(q('#editorView')), 'back button restores hub');

    // 7) direct tool entry: AI opens AI panel
    q('.tool-cta[data-go="ai"]').click();
    await new Promise(r => setTimeout(r, 400));
    ok(visible(q('#editorView')) && q('.tab-panel[data-panel="ai"]').classList.contains('active'), 'AI tool entry opens AI panel');

    document.title = 'SMOKE-OK';
  } catch (e) {
    line('FATAL: ' + (e && e.stack || e && e.message || e));
    document.title = 'SMOKE-FAIL';
  }
}
main();
</script>
</body>
</html>
