<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 幻灵</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}


/* =========================================================
   PAGE 1 已移除（ENTER HYOOL 入口页）
   首页直接进入世界选择页
========================================================= */


/* =========================================================
   PAGE 2
========================================================= */

#world{
    position:fixed;
    inset:0;

    z-index:20;

    width:100%;
    height:100%;

    background:#000;

    opacity:0;
    visibility:hidden;

    transform:scale(1.04);

    pointer-events:none;

    overflow:hidden;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear 1.5s;
}

#world.show{
    opacity:1;
    visibility:visible;

    transform:scale(1);

    pointer-events:auto;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s;
}


/* =========================================================
   VIDEO
========================================================= */

.life-video{
    position:absolute;

    inset:-5%;

    width:110%;
    height:110%;

    object-fit:cover;
    object-position:center;

    display:block;

    border:0;
    outline:0;

    background:#000;

    opacity:0;

    transform:scale(1.08);

    filter:
        brightness(.32)
        contrast(1.08)
        saturate(.65);

    pointer-events:none;

    user-select:none;

    transition:
        opacity 4s cubic-bezier(.2,.8,.2,1),
        transform 8s cubic-bezier(.2,.8,.2,1);
}

#world.show .life-video{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   VIDEO ATMOSPHERE
========================================================= */

.life-overlay{
    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,.12) 35%,
            rgba(0,0,0,.48) 72%,
            rgba(0,0,0,.82) 100%
        );
}

.life-vignette{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.72) 100%
        );
}


/* =========================================================
   SMALL LOGO
========================================================= */

.world-logo{
    position:absolute;

    left:42px;
    top:34px;

    z-index:10;

    opacity:0;

    transform:translateY(-10px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    transition-delay:2.5s;
}

#world.show .world-logo{
    opacity:.7;
    transform:translateY(0);
}

.world-logo img{
    width:90px;
    height:auto;
    display:block;
}


/* =========================================================
   MAIN LOGO（四个世界入口上方）
========================================================= */

.world-logo-main{
    position:absolute;

    left:50%;
    top:4%;

    z-index:10;

    transform:translateX(-50%);

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    transition-delay:2.5s;
}

#world.show .world-logo-main{
    opacity:1;

    transform:translateX(-50%);
}

.world-logo-main img{
    width:800px;
    height:auto;
    max-width:88vw;

    display:block;
}


/* =========================================================
   CENTER TEXT
========================================================= */

.core{
    position:absolute;

    left:50%;
    top:50%;

    z-index:7;

    transform:
        translate(-50%,-50%)
        translateY(50px)
        scale(.82);

    width:max-content;

    text-align:center;

    pointer-events:auto;

    opacity:0;

    transition:
        opacity 1.5s ease,
        transform 1.5s cubic-bezier(.2,.8,.2,1);

    transition-delay:.3s;
}

#world.show .core{
    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0)
        scale(1);
}

.core-cn{
    font-size:clamp(26px,3vw,42px);

    font-weight:300;

    letter-spacing:.28em;
    margin-left:.28em;

    color:rgba(255,255,255,.9);
}

.core-en{
    margin-top:20px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:clamp(13px,1.4vw,19px);

    font-weight:300;

    letter-spacing:.3em;
    margin-left:.3em;

    color:rgba(255,255,255,.52);
}


/* =========================================================
   CORE ENTRY (clickable words)
========================================================= */

.core-entry{
    display:inline-block;

    cursor:pointer;

    padding-bottom:5px;

    border-bottom:1px solid transparent;

    transition:
        color .6s ease,
        text-shadow .6s ease,
        border-color .6s ease,
        opacity .5s ease,
        transform .6s cubic-bezier(.2,.8,.2,1);
}

.core-entry:hover{
    color:#fff;

    text-shadow:
        0 0 14px rgba(255,255,255,.45),
        0 0 32px rgba(255,255,255,.18);

    border-bottom-color:
        rgba(255,255,255,.35);

    transform:translateY(-2px);
}

.core-cn:hover .core-entry:not(:hover){
    opacity:.38;
}

.core-sep{
    display:inline-block;

    margin:0 .18em;

    color:rgba(255,255,255,.16);

    font-weight:200;
}


/* =========================================================
   FLOATING STAR
========================================================= */

.light{
    position:absolute;

    z-index:9;

    width:32px;
    height:32px;

    cursor:default;

    opacity:0;

    transform:scale(.55);

    transition:
        opacity 1.8s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   FOUR POSITIONS
========================================================= */

.light.yonder,
.light.infinite{
    display:none !important;
    pointer-events:none;
}

.light.fantasy,
.light.life{
    cursor:pointer;
}

.light.fantasy{
    left:50%;
    top:28%;

    margin-left:-16px;
    margin-top:-16px;

    animation:
        floatFantasy 6s ease-in-out infinite;
}

.light.yonder{
    left:24%;
    top:50%;

    margin-left:-16px;
    margin-top:-16px;

    animation:
        floatYonder 7s ease-in-out infinite;
}

.light.infinite{
    right:24%;
    top:48%;

    margin-right:-16px;
    margin-top:-16px;

    animation:
        floatInfinite 6.5s ease-in-out infinite;
}

.light.life{
    left:50%;
    bottom:28%;

    margin-left:-16px;
    margin-bottom:-16px;

    animation:
        floatLife 5.5s ease-in-out infinite;
}


/* =========================================================
   LIGHT APPEAR
========================================================= */

#world.lights-active .light{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   STAR GEM (diamond core)
========================================================= */

.light::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:6px;
    height:6px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    border-radius:
        42% 58% 46% 54%;

    background:rgba(255,255,255,1);

    box-shadow:
        0 0 6px rgba(255,255,255,1),
        0 0 16px rgba(255,255,255,.65),
        0 0 34px rgba(255,255,255,.32),
        0 0 60px rgba(255,255,255,.14);

    animation:
        orbPulse 4.5s ease-in-out infinite;
}


/* =========================================================
   STAR HALO (glowing ring)
========================================================= */

.light::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:22px;
    height:22px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.08),
        0 0 14px rgba(255,255,255,.1);

    animation:
        haloPulse 7s ease-in-out infinite;
}


/* =========================================================
   DIFFERENT STAR RHYTHMS
========================================================= */

.light.fantasy::before{
    animation-delay:0s;
}

.light.yonder::before{
    animation-delay:-1.7s;
}

.light.infinite::before{
    animation-delay:-3.1s;
}

.light.life::before{
    animation-delay:-4.2s;
}

.light.fantasy::after{
    animation-delay:0s;
}

.light.yonder::after{
    animation-delay:-2.3s;
}

.light.infinite::after{
    animation-delay:-3.8s;
}

.light.life::after{
    animation-delay:-1.2s;
}


/* =========================================================
   ORB PULSE (diamond twinkle)
========================================================= */

@keyframes orbPulse{

    0%,100%{
        opacity:.5;

        transform:
            translate(-50%,-50%)
            rotate(42deg)
            scale(.78);

        box-shadow:
            0 0 4px rgba(255,255,255,.6),
            0 0 12px rgba(255,255,255,.32),
            0 0 26px rgba(255,255,255,.15);
    }

    50%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            rotate(48deg)
            scale(1.25);

        box-shadow:
            0 0 8px rgba(255,255,255,1),
            0 0 22px rgba(255,255,255,.6),
            0 0 44px rgba(255,255,255,.28),
            0 0 80px rgba(255,255,255,.12);
    }
}


/* =========================================================
   HALO PULSE
========================================================= */

@keyframes haloPulse{

    0%,100%{
        opacity:.2;

        transform:
            translate(-50%,-50%)
            scale(.82);

        border-color:
            rgba(255,255,255,.05);
    }

    50%{
        opacity:.5;

        transform:
            translate(-50%,-50%)
            scale(1.18);

        border-color:
            rgba(255,255,255,.14);
    }
}


/* =========================================================
   FLOATING MOVEMENT
========================================================= */

@keyframes floatFantasy{

    0%,100%{
        margin-top:-16px;
    }

    50%{
        margin-top:-27px;
    }
}

@keyframes floatYonder{

    0%,100%{
        margin-left:-16px;
    }

    50%{
        margin-left:-4px;
    }
}

@keyframes floatInfinite{

    0%,100%{
        margin-right:-16px;
    }

    50%{
        margin-right:-4px;
    }
}

@keyframes floatLife{

    0%,100%{
        margin-bottom:-16px;
    }

    50%{
        margin-bottom:-5px;
    }
}


/* =========================================================
   LABEL
========================================================= */

.light-label{
    position:absolute;

    left:50%;
    top:50%;

    width:max-content;

    pointer-events:none;

    opacity:0;

    transition:
        opacity .8s ease,
        transform .9s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   LABEL TITLE
========================================================= */

.light-name{
    font-size:24px;

    font-weight:300;

    letter-spacing:.3em;
    margin-left:.3em;

    color:rgba(255,255,255,.92);

    text-align:center;
}

.light-meaning{
    margin-top:10px;

    font-size:15px;

    font-weight:300;

    letter-spacing:.1em;
    margin-left:.1em;

    color:rgba(255,255,255,.65);

    text-align:center;
}

.light-tags{
    margin-top:6px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:11px;

    letter-spacing:.1em;
    margin-left:.1em;

    color:rgba(255,255,255,.34);

    text-align:center;
}


/* =========================================================
   LABEL POSITION + HOVER REVEAL
========================================================= */

.light.fantasy .light-label{
    transform:
        translate(-50%,-50%)
        translateY(-62px);
}

.light.fantasy:hover .light-label{
    opacity:1;
    transform:
        translate(-50%,-50%)
        translateY(-68px);
}


.light.yonder .light-label{
    transform:
        translate(-100%,-50%)
        translateX(-48px);
}

.light.yonder:hover .light-label{
    opacity:1;
    transform:
        translate(-100%,-50%)
        translateX(-54px);
}


.light.infinite .light-label{
    transform:
        translate(0,-50%)
        translateX(48px);
}

.light.infinite:hover .light-label{
    opacity:1;
    transform:
        translate(0,-50%)
        translateX(54px);
}


.light.life .light-label{
    transform:
        translate(-50%,-50%)
        translateY(62px);
}

.light.life:hover .light-label{
    opacity:1;
    transform:
        translate(-50%,-50%)
        translateY(68px);
}


/* =========================================================
   HOVER STAR (subtle brighten)
========================================================= */

.light:hover{
    z-index:15;
    transform:scale(1.15);
}

.light:hover::before{
    animation-play-state:paused;
    opacity:1;
    box-shadow:
        0 0 10px rgba(255,255,255,1),
        0 0 26px rgba(255,255,255,.7),
        0 0 55px rgba(255,255,255,.35),
        0 0 100px rgba(255,255,255,.15);
}

.light:hover::after{
    opacity:.7;
    border-color:rgba(255,255,255,.18);
}


/* =========================================================
   CENTER DIM ON STAR HOVER
========================================================= */

#world:has(.light:hover) .core{
    opacity:.5;
}


/* =========================================================
   REALM
========================================================= */

.realm{
    position:absolute;

    left:50%;
    bottom:3.8%;

    z-index:9;

    transform:
        translateX(-50%)
        translateY(10px);

    text-align:center;

    pointer-events:none;

    opacity:0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay:3s;
}

#world.show .realm{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   SLOGAN（并入世界选择页）
========================================================= */

.world-slogan{
    position:absolute;

    left:50%;
    top:calc(50% + 150px);

    z-index:7;

    transform:
        translateX(-50%)
        translateY(18px);

    width:max-content;

    text-align:center;

    pointer-events:none;

    opacity:0;

    transition:
        opacity 1.5s ease,
        transform 1.5s cubic-bezier(.2,.8,.2,1);

    transition-delay:1.2s;
}

#world.show .world-slogan{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.world-slogan .line-one,
.world-slogan .line-two{
    font-size:clamp(17px,1.45vw,21px);

    font-weight:300;

    letter-spacing:.14em;
    margin-left:.14em;

    line-height:2;
}

.world-slogan .line-one{
    color:rgba(255,255,255,.82);
}

.world-slogan .line-two{
    color:rgba(255,255,255,.45);
}

.realm::before{
    content:"";

    display:block;

    width:18px;
    height:1px;

    margin:0 auto 10px;

    background:rgba(255,255,255,.16);
}

.realm-title{
    font-family:Arial,Helvetica,sans-serif;

    font-size:clamp(8px,.8vw,11px);

    font-weight:300;

    letter-spacing:.45em;
    margin-left:.45em;

    color:rgba(255,255,255,.3);
}


/* =========================================================
   COMING SOON MODAL
========================================================= */

.coming-soon{
    position:fixed;
    inset:0;

    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.58);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    opacity:0;
    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .8s ease,
        visibility 0s linear .8s;
}

.coming-soon.show{
    opacity:1;
    visibility:visible;

    pointer-events:auto;

    transition:
        opacity .8s ease,
        visibility 0s;
}


.coming-panel{
    position:relative;

    width:min(420px,82vw);

    padding:52px 36px 48px;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.015)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55);

    transform:
        translateY(18px)
        scale(.97);

    opacity:0;

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);
}

.coming-soon.show .coming-panel{
    opacity:1;

    transform:
        translateY(0)
        scale(1);
}


.coming-panel::before{
    content:"";

    position:absolute;

    left:50%;
    top:-1px;

    width:40px;
    height:1px;

    transform:translateX(-50%);

    background:rgba(255,255,255,.4);
}


.coming-world{
    font-size:clamp(22px,2.4vw,30px);

    font-weight:300;

    letter-spacing:.38em;
    margin-left:.38em;

    color:rgba(255,255,255,.92);
}


.coming-meaning{
    margin-top:16px;

    font-size:12px;

    font-weight:300;

    letter-spacing:.16em;
    margin-left:.16em;

    color:rgba(255,255,255,.48);
}


.coming-en{
    margin-top:32px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:9px;

    font-weight:300;

    letter-spacing:.38em;
    margin-left:.38em;

    color:rgba(255,255,255,.3);
}


.coming-line{
    width:22px;
    height:1px;

    margin:26px auto 20px;

    background:rgba(255,255,255,.12);
}


.coming-close{
    display:inline-block;

    padding:8px 18px;

    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;

    font-size:9px;

    letter-spacing:.3em;
    margin-left:.3em;

    color:rgba(255,255,255,.38);

    transition:
        color .5s ease,
        letter-spacing .6s ease;
}

.coming-close:hover{
    color:rgba(255,255,255,.85);

    letter-spacing:.42em;
}


/* =========================================================
   WORLD TRANSITION
========================================================= */

#world.entering-world::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:100;

    background:#fff;

    opacity:0;

    animation:
        worldFlash .9s ease forwards;

    pointer-events:none;
}

@keyframes worldFlash{

    0%{
        opacity:0;
    }

    35%{
        opacity:.16;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .world-slogan{
        top:calc(50% + 130px);
    }

    .world-logo{
        left:20px;
        top:22px;
    }

    .world-logo img{
        width:70px;
    }

    .world-logo-main{
        top:3.5%;
    }

    .world-logo-main img{
        width:600px;
    }

    .core{
        width:90vw;
    }

    .core-cn{
        font-size:20px;
        letter-spacing:.12em;
        margin-left:.12em;
    }

    .core-en{
        font-size:10px;
        letter-spacing:.12em;
        margin-left:.12em;
    }

    .light.fantasy{
        top:26%;
    }

    .light.yonder{
        left:17%;
    }

    .light.infinite{
        right:17%;
    }

    .light.life{
        bottom:27%;
    }

    .light-name{
        font-size:20px;
    }

    .light-meaning{
        font-size:12px;
    }

    .light-tags{
        font-size:8px;
        max-width:180px;
        white-space:normal;
        line-height:1.7;
    }

    .light.yonder .light-label,
    .light.yonder:hover .light-label{
        left:8px;
        transform:translateY(-50%);
    }

    .light.infinite .light-label,
    .light.infinite:hover .light-label{
        left:auto;
        right:8px;
        transform:translateY(-50%);
    }

    .coming-panel{
        width:82vw;

        padding:
            46px
            24px
            42px;
    }

    .coming-world{
        font-size:21px;
    }

    .coming-meaning{
        font-size:10px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     PAGE 1 已移除（ENTER HYOOL 入口）
     首页直接进入世界选择页
======================================================= -->



<!-- =======================================================
     PAGE 2
======================================================= -->

<section id="world">


    <!-- VIDEO -->

    <video
        class="life-video"
        id="lifeVideo"
        src="./life.mp4"
        muted
        defaultmuted
        playsinline
        webkit-playsinline
        x5-playsinline="true"
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        preload="metadata"
        disablepictureinpicture
        disableremoteplayback
        controlslist="nodownload nofullscreen noremoteplayback"
    ></video>


    <div class="life-overlay"></div>

    <div class="life-vignette"></div>


    <!-- LOGO -->

    <div class="world-logo">

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </div>


    <!-- MAIN LOGO -->

    <div class="world-logo-main">

        <img
            src="./logo.png"
            alt="HYOOL"
        >

    </div>


    <!-- ===================================================
         FANTASY
    ==================================================== -->

    <div
        class="light fantasy"
        data-world="create"
    >

        <div class="light-label">

            <div class="light-name">
                创作作品
            </div>

            <div class="light-meaning">
                故事 · 游戏 · 漫画，改完就能玩。
            </div>

            <div class="light-tags">
                互动小说 · 卡牌 · H5 · 漫画 · AI 一句话
            </div>

        </div>

    </div>


    <!-- 彼岸入口改到底栏；此处隐藏旧光点 -->

    <div
        class="light yonder"
        data-world="yonder"
        aria-hidden="true"
    ></div>


    <div
        class="light infinite"
        data-world="infinite"
        aria-hidden="true"
    ></div>


    <!-- ===================================================
         创造世界
    ==================================================== -->

    <div
        class="light life"
        data-world="world"
    >

        <div class="light-label">

            <div class="light-name">

            </div>

            <div class="light-meaning">

    <!-- ===================================================

    <div class="core">

        <div class="core-cn">
            <span class="core-entry" data-world="create">创作作品</span>
            <span class="core-sep">×</span>
            <span class="core-entry" data-world="world">创造世界</span>
        </div>

        <div class="core-en">
            Create Works · Create World
        </div>

    </div>


    <!-- ===================================================
         SLOGAN
    ==================================================== -->

    <div class="world-slogan">

        <div class="line-one">
            零基础，也能做出能玩的作品。
        </div>

        <div class="line-two">
            AI 辅助 · 实时预览 · 站内发布
        </div>

    </div>


    <!-- ===================================================
         REALM
    ==================================================== -->

    <div class="realm">

        <div class="realm-title">
            HYOOL
        </div>

        <div class="home-util" style="margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;font-size:11px;letter-spacing:.08em">
            <a href="/make.html" style="color:rgba(255,255,255,.55);text-decoration:none">创作</a>
            <a href="/plaza" style="color:rgba(255,255,255,.55);text-decoration:none">去玩</a>
            <a href="/yonder.html" style="color:rgba(255,255,255,.55);text-decoration:none">我的</a>
            <a href="/brain.html" style="color:rgba(255,255,255,.55);text-decoration:none">AI 中枢</a>

<!-- =======================================================
     COMING SOON MODAL
======================================================= -->

<div
    class="coming-soon"
    id="comingSoon"
>

    <div
        class="coming-panel"
        id="comingPanel"
    >

        <div
            class="coming-world"
            id="comingWorld"
        >
            幻想
        </div>

        <div
            class="coming-meaning"
            id="comingMeaning"
        >
            让想象成为作品。
        </div>

        <div class="coming-en">
            THE WORLD IS COMING
        </div>

        <div class="coming-line"></div>

        <div
            class="coming-close"
            id="comingClose"
        >
            CLOSE
        </div>

    </div>

</div>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const world =
    document.getElementById("world");

const lifeVideo =
    document.getElementById("lifeVideo");

const lights =
    document.querySelectorAll(".light");


/* =========================================================
   COMING SOON ELEMENTS
========================================================= */

const comingSoon =
    document.getElementById("comingSoon");

const comingWorld =
    document.getElementById("comingWorld");

const comingMeaning =
    document.getElementById("comingMeaning");

const comingClose =
    document.getElementById("comingClose");


/* =========================================================
   WORLD INFORMATION
========================================================= */

const worldInfo = {

    fantasy:{
        name:"幻想",
        meaning:"让想象成为作品。"
    },

    infinite:{
        name:"无限",
        meaning:"让创造拥有无限可能。"
    },

    life:{
        name:"生命",
        meaning:"让创造拥有真正的存在。"
    }

};


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        /* 直接进入世界选择页（原 ENTER HYOOL 入口已移除） */

        world.classList.add("show");


        /* 从第一帧开始 */

        try{

            lifeVideo.currentTime = 0;

        }catch(e){}


        /*
         * 国内夸克/UC 等会劫持带音轨的 <video>：全屏原生播放器 + 有声，
         * 盖住整页。已去掉 mp4 音轨；此处再强制静音/内联，避免二次接管。
         */
        try{
            lifeVideo.defaultMuted = true;
            lifeVideo.muted = true;
            lifeVideo.volume = 0;
            lifeVideo.setAttribute("muted", "");
            lifeVideo.setAttribute("playsinline", "");
            lifeVideo.setAttribute("webkit-playsinline", "");
            lifeVideo.setAttribute("x5-playsinline", "true");
            lifeVideo.setAttribute("x5-video-player-type", "h5");
            lifeVideo.playsInline = true;
        }catch(e){}


        /* 自动播放（勿依赖 HTML autoplay，减少夸克提前接管） */

        const playPromise =
            lifeVideo.play();


        if(
            playPromise !== undefined
        ){

            playPromise.catch(
                () => {}
            );

        }


        /*
         * 约 1.2 秒后
         * 四个星芒开始出现
         */

        setTimeout(
            () => {

                world.classList.add(
                    "lights-active"
                );

            },
            1200
        );

    }
);


/* =========================================================
   VIDEO END
========================================================= */

lifeVideo.addEventListener(
    "ended",
    () => {

        lifeVideo.pause();

    }
);


/* =========================================================
   OPEN COMING SOON
========================================================= */

function openComingSoon(worldName){

    const info =
        worldInfo[worldName];

    if(!info){
        return;
    }


    comingWorld.textContent =
        info.name;

    comingMeaning.textContent =
        info.meaning;


    comingSoon.classList.add("show");

}


/* =========================================================
   CLOSE COMING SOON
========================================================= */

function closeComingSoon(){

    comingSoon.classList.remove("show");

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

comingClose.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        closeComingSoon();

    }
);


/* =========================================================
   CLICK BACKGROUND TO CLOSE
========================================================= */

comingSoon.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            comingSoon
        ){

            closeComingSoon();

        }

    }
);


/* =========================================================
   ESC TO CLOSE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeComingSoon();

        }

    }
);


/* =========================================================
   CORE ENTRY CLICKS (center text = world entrances)
========================================================= */

function goWorld(worldName){
    let href = null;
    if (worldName === "create" || worldName === "fantasy") href = "make.html";
    else if (worldName === "world" || worldName === "life") href = "studio-world.html";
    else if (worldName === "yonder") href = "yonder.html";
    else if (worldName === "infinite") href = "workspace.html";
    if (!href) return;
    world.classList.add("entering-world");
    setTimeout(() => { window.location.href = href; }, 650);
}

document.querySelectorAll(".core-entry").forEach(
    entry => {

        entry.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                goWorld(entry.dataset.world);

            }
        );

    }
);

document.querySelectorAll(".light[data-world]").forEach(
    el => {

        el.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                const w = el.dataset.world;

                if (w === "yonder" || w === "infinite") return;

                goWorld(w);

            }
        );

    }
);

/* legacy block removed — navigation via goWorld() */



</script>

</body>
</html>
