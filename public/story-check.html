<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>STORY CHECK</title>
<style>
body{font-family:system-ui;background:#0d0d16;color:#eee;padding:16px;margin:0}
iframe{width:100%;height:78vh;border:1px solid #333;border-radius:10px;background:#fff}
#results{white-space:pre-wrap;font-size:12px;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<iframe id="se" src="/story-editor"></iframe>
<div id="results"></div>
<script>
const $ = id => document.getElementById(id);
const out = [];
function ok(name, cond, extra) {
  out.push((cond ? 'PASS' : 'FAIL') + '  ' + name + (extra ? '  | ' + extra : ''));
  $('results').textContent = out.join('\n');
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const win = () => $('se').contentWindow;

(async () => {
  try {
    // A. 未登录打开：StoryEditor 就绪 + 登录提示可见
    await wait(3000);
    const seWin = win();
    ok('A1 StoryEditor.ready', !!seWin.StoryEditor && seWin.StoryEditor.ready === true);
    const hint = seWin.document.getElementById('loginHint');
    ok('A2 未登录 loginHint 可见', !!hint && hint.style.display !== 'none');

    // B. 登录后重载：服务端列表加载 + 提示隐藏
    const lg = await fetch('/api/login', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'smokews', password: 'testpass123' }) });
    const ld = await lg.json();
    if (!ld.success) throw new Error('login failed: ' + ld.error);
    localStorage.setItem('hyool_token', ld.token);
    $('se').src = '/story-editor?t=' + Date.now();
    await wait(3500);
    const seWin2 = win();
    const list0 = seWin2.StoryEditor.list();
    ok('B1 登录后列表来自服务端', list0.length > 0, 'count=' + list0.length);
    ok('B2 loginHint 隐藏', seWin2.document.getElementById('loginHint').style.display === 'none');
    ok('B3 卡片含发布按钮', !!seWin2.document.querySelector('#storyList .story-card .ops .btn.pub'));

    // C. 创建作品（走 POST /api/stories）
    seWin2.document.getElementById('newTitle').value = 'browser-smoke-story';
    seWin2.document.getElementById('createBtn').click();
    await wait(2500);
    const list1 = seWin2.StoryEditor.list();
    ok('C1 创建后列表 +1', list1.length === list0.length + 1, list0.length + ' -> ' + list1.length);
    const newStory = list1[0];
    ok('C2 新作品 id 为 st_ 前缀', /^st_[a-z0-9]+$/.test(newStory.id), newStory.id);

    // D0. 给作品加一块 scene 积木（真实编辑路径：addBlock → setBlockContent → 防抖上传云端）
    seWin2.StoryEditor.open(newStory.id);
    seWin2.StoryEditor.addBlock('scene');
    await wait(400);
    const cur = seWin2.StoryEditor.list().find(x => x.id === newStory.id);
    const bid = cur.chapters[0].blocks[0].id;
    ok('D0 积木已添加', !!bid, 'block=' + bid);
    seWin2.StoryEditor.setBlockContent(bid, 'browser-smoke-scene');
    const cancelBtn = seWin2.document.getElementById('modalCancel');
    if (cancelBtn) cancelBtn.click();
    await wait(2000); // 等防抖 800ms + 上传

    // D. URL 直达播放（owner 播放已含积木的作品）
    $('se').src = '/story-editor?story=' + encodeURIComponent(newStory.id) + '&play=1&t=' + Date.now();
    await wait(3000);
    const seWin3 = win();
    const overlay = seWin3.document.getElementById('playOverlay');
    ok('D1 直达播放 playOverlay 可见', !!overlay && !overlay.classList.contains('hidden'));
    ok('D2 播放标题=新建作品', (seWin3.StoryEditor.current() || {}).title === 'browser-smoke-story');
    // 关闭播放：owner 退出播放回到编辑器视图（仅游客只读作品回库）
    seWin3.document.getElementById('playExit').click();
    await wait(400);
    ok('D3 退出播放 overlay 隐藏', seWin3.document.getElementById('playOverlay').classList.contains('hidden'));
    ok('D4 owner 退出播放回编辑器', !seWin3.document.getElementById('viewEditor').classList.contains('hidden'));

    // D5. 分支图 + 访问标记 + 本机存档
    seWin3.StoryEditor.open(newStory.id);
    await wait(400);
    const g = seWin3.StoryEditor.analyzeStoryGraph();
    ok('D5a 分支图有节点', !!(g && g.nodes && g.nodes.length >= 1), 'nodes=' + (g && g.nodes && g.nodes.length));
    seWin3.StoryEditor.startPlay();
    await wait(500);
    const snap = seWin3.StoryEditor.play();
    ok('D5b 访问标记 v_*', !!(snap && snap.state && snap.current && snap.state[snap.current.visit] === 1), snap && snap.current && snap.current.visit);
    ok('D5c 存档槽0', !!seWin3.StoryEditor.savePlaySlot(0));
    seWin3.StoryEditor.playNext();
    await wait(200);
    const idxAfter = seWin3.StoryEditor.play().idx;
    ok('D5d 读档回槽0', !!seWin3.StoryEditor.loadPlaySlot(0));
    await wait(300);
    ok('D5e 读档后 idx 恢复', seWin3.StoryEditor.play().idx === snap.idx, 'was ' + idxAfter + ' now ' + seWin3.StoryEditor.play().idx);
    seWin3.StoryEditor.stopPlay();
    seWin3.StoryEditor.openStoryMap();
    await wait(200);
    ok('D5f 分支图 overlay', !seWin3.document.getElementById('mapOverlay').classList.contains('hidden'));
    seWin3.document.getElementById('mapExit').click();

    // E. 清理：删除刚创建的作品（走 DELETE API）
    const del = await fetch('/api/stories/' + encodeURIComponent(newStory.id) + '/delete', { method: 'POST', headers: { Authorization: 'Bearer ' + ld.token } });
    const dd = await del.json();
    ok('E1 删除作品', !!dd.success);

    document.title = out.some(l => l.startsWith('FAIL')) ? 'SMOKE-FAIL' : 'SMOKE-OK';
  } catch (e) {
    out.push('EXCEPTION: ' + (e.message || e));
    $('results').textContent = out.join('\n');
    document.title = 'SMOKE-FAIL';
  }
})();
</script>
</body>
</html>
