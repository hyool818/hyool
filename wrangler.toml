name = "hyool"
main = "src/index.js"
compatibility_date = "2026-08-15"
account_id = "6f39e97c5df21fb0de0a5a0df79d2e94"

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"

[vars]
# TA 自建语音层（GPT-SoVITS）参考音色：稳定配置放这里；只有 token 必须用 wrangler secret（见 docs/TA.md §7）
# 参考音频三级优先：TA_TTS_LOCAL_VOICES[voice] -> FEMALE_REF/MALE_REF -> TA_TTS_LOCAL_REF（下面这条是兜底）
TA_TTS_LOCAL_URL = 'https://ata-disc-slots-honolulu.trycloudflare.com'
TA_TTS_LOCAL_FEMALE_REF = 'D:\AI\refs\xiaoya-b.wav'
TA_TTS_LOCAL_FEMALE_PROMPT_TEXT = '如果你看到我在发呆，可能是在想中午吃什么。'
TA_TTS_LOCAL_REF = 'D:\ai\tmp\dataset_demo\seg_0003.wav'
TA_TTS_LOCAL_PROMPT_TEXT = '这件事我想了很久，还是决定告诉你。'
TA_TTS_LOCAL_PROMPT_LANG = 'zh'
TA_TTS_LOCAL_TEXT_LANG = 'zh'
TA_TTS_LOCAL_MEDIA = 'wav'

[[d1_databases]]
binding = "DB"
database_name = "hyool-db"
database_id = "86e8193a-c300-4d58-9fed-c3d7b9e98af2"

[[vectorize]]
binding = "VECTORIZE"
index_name = "hyool-memory"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "hyool-assets"

[triggers]
# 生命世界后台自主运转（watch 模式仅在线运转，不依赖 cron）
crons = ["*/15 * * * *"]
