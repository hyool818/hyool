<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HYOOL · 创造数字生命</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.7;
}
a { color: inherit; text-decoration: none; }

/* Header */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: 72px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
  background: linear-gradient(to bottom, rgba(5,5,8,.52), transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .12em; font-size: 15px; }
.header .logo img { height: 30px; width: auto; }
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s, transform .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); transform: translateY(-1px); }

/* Page */
.page { max-width: 820px; margin: 0 auto; padding: 120px 24px 100px; }

.stage { display: none; animation: fadeUp .6s cubic-bezier(.2,.8,.2,1); }
.stage.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

/* Hero */
.hero { text-align: center; margin-bottom: 2.5rem; }
.hero h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: .6rem; }
.hero p { color: var(--muted); font-size: .95rem; }

/* Form */
.form-group { margin-bottom: 1.4rem; }
.form-group label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .5rem; letter-spacing: .04em; }
.form-group textarea {
  width: 100%; min-height: 140px; resize: vertical;
  border: 1px solid rgba(255,255,255,.10); border-radius: 14px;
  padding: 14px 16px; background: rgba(255,255,255,.05); color: #fff;
  outline: none; font: inherit; line-height: 1.6; transition: border .3s, background .3s;
}
.form-group textarea:focus { border-color: var(--accent); background: rgba(255,255,255,.07); }
.form-group textarea::placeholder { color: rgba(255,255,255,.28); }

.hint { font-size: .76rem; color: var(--muted); margin-top: .4rem; }

/* Buttons */
.btn {
  border: 0; border-radius: 13px; padding: 14px 22px; font-size: 14px; cursor: pointer;
  transition: opacity .2s, transform .2s, background .2s, border .3s, color .3s;
  font-weight: 600;
}
.btn-primary { width: 100%; background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .88; transform: translateY(-1px); }
.btn-primary:disabled { opacity: .45; cursor: wait; }
.btn-ghost {
  background: rgba(255,255,255,.06); color: rgba(255,255,255,.82);
  border: 1px solid rgba(255,255,255,.12);
}
.btn-ghost:hover { background: rgba(255,255,255,.12); color: #fff; transform: translateY(-1px); }

/* Result */
.result-card {
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.05);
  border-radius: 22px; overflow: hidden; backdrop-filter: blur(18px);
  box-shadow: 0 18px 50px rgba(0,0,0,.20);
}
.portrait {
  width: 100%; aspect-ratio: 1 / 1; max-height: 360px; object-fit: cover;
  background: rgba(0,0,0,.3); display: block;
}
.portrait.svg-fallback { object-fit: contain; background: #0c0d14; }
.result-body { padding: 1.6rem 1.8rem 1.8rem; }
.result-body h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: .2rem; }
.result-body .world { color: var(--accent); font-size: .85rem; margin-bottom: 1.2rem; }
.field { margin-bottom: 1rem; }
.field .k { font-size: .72rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: .25rem; }
.field .v { font-size: .92rem; color: rgba(255,255,255,.86); }
.result-actions { display: flex; gap: .8rem; margin-top: 1.6rem; flex-wrap: wrap; }
.result-actions .btn { flex: 1; min-width: 140px; }

.badge {
  display: inline-block; font-size: .68rem; padding: .18rem .5rem; border-radius: 6px;
  background: rgba(139,139,255,.16); color: var(--accent); margin-bottom: 1rem; letter-spacing: .04em;
}

/* Error / loading */
.msg { text-align: center; padding: 1rem; color: var(--muted); font-size: .9rem; }
.msg.error { color: #ff8b8b; }
.spinner {
  display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.2);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .page { padding: 100px 16px 60px; }
  .hero h1 { font-size: 1.7rem; }
  .result-actions { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header class="header">
  <a class="logo" href="/"><img src="/logo1.png" alt="HYOOL"><span>HYOOL</span></a>
  <div style="display:flex;gap:.6rem;align-items:center;">
    <a class="header-link" href="/hub">我的数字生命</a>
    <button class="header-link" id="logoutBtn">退出</button>
  </div>
</header>

<main class="page">
  <!-- 输入阶段 -->
  <section class="stage active" id="stageInput">
    <div class="hero">
      <h1>创造一个数字生命</h1>
      <p>写下你的脑洞，HYOOL 将为你孕育一个角色、世界与故事。</p>
    </div>
    <div class="form-group">
      <label>你的脑洞</label>
      <textarea id="ideaInput" placeholder="例如：一个住在废弃月球基地的少女，她相信月亮是一颗沉睡的心脏。" maxlength="2000"></textarea>
      <div class="hint" id="counter">0 / 2000</div>
    </div>
    <div id="inputMsg" class="msg"></div>
    <button class="btn btn-primary" id="createBtn">CREATE LIFE</button>
  </section>

  <!-- 生成中 -->
  <section class="stage" id="stageLoading">
    <div class="msg"><span class="spinner"></span> &nbsp;正在孕育数字生命……</div>
  </section>

  <!-- 结果阶段 -->
  <section class="stage" id="stageResult">
    <div class="hero"><h1>数字生命已诞生</h1><p>与 TA 相遇，或把 TA 分享给世界。</p></div>
    <div class="result-card">
      <img class="portrait" id="charImg" alt="">
      <div class="result-body">
        <span class="badge" id="aiBadge">AI · mock</span>
        <h2 id="charName"></h2>
        <div class="world" id="charWorld"></div>
        <div class="field"><div class="k">外貌</div><div class="v" id="charAppearance"></div></div>
        <div class="field"><div class="k">性格</div><div class="v" id="charPersonality"></div></div>
        <div class="field"><div class="k">背景</div><div class="v" id="charBackground"></div></div>
        <div class="field"><div class="k">说话风格</div><div class="v" id="charSpeech"></div></div>
        <div class="field"><div class="k">故事钩子</div><div class="v" id="charHook"></div></div>
        <div class="result-actions">
          <button class="btn btn-primary" id="meetBtn">与 TA 相遇</button>
          <button class="btn btn-ghost" id="shareBtn">分享</button>
          <button class="btn btn-ghost" id="againBtn">再创造一个</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const api = (p, o = {}) => {
  const t = localStorage.getItem("hyool_token");
  const h = { "Content-Type": "application/json", ...(o.headers || {}) };
  if (t) h["Authorization"] = "Bearer " + t;
  return fetch(p, { credentials: "include", ...o, headers: h }).then(async r => { let d; try { d = await r.json(); } catch { d = { success:false, error:"服务器返回异常。" }; } if (!r.ok) throw new Error(d.error || "请求失败。"); return d; });
};

const $ = id => document.getElementById(id);
function showStage(name) {
  document.querySelectorAll(".stage").forEach(s => s.classList.remove("active"));
  $("stage" + name).classList.add("active");
}

let currentChar = null;

async function checkAuth() {
  const t = localStorage.getItem("hyool_token");
  for (let i = 0; i < 2; i++) {
    try {
      const h = {};
      if (t) h["Authorization"] = "Bearer " + t;
      const res = await fetch("/api/me", { credentials: "include", cache: "no-store", headers: h });
      const data = await res.json();
      if (data.authenticated) return true;
      if (i === 1) { location.href = "/yonder.html?next=/create"; return false; }
    } catch {
      if (i === 1) { location.href = "/yonder.html?next=/create"; return false; }
      await new Promise(r => setTimeout(r, 800));
    }
  }
  location.href = "/yonder.html?next=/create";
  return false;
}

function renderCharacter(c) {
  currentChar = c;
  const img = $("charImg");
  img.src = c.image_url || "";
  img.classList.toggle("svg-fallback", c.image_url && c.image_url.endsWith(".svg") || c.image_url && c.image_url.includes("/portrait"));
  img.onerror = () => { img.style.display = "none"; };
  $("charName").textContent = c.name || "未名";
  $("charWorld").textContent = (c.world_name ? c.world_name + " — " : "") + (c.world_description || "");
  $("charAppearance").textContent = c.appearance || "—";
  $("charPersonality").textContent = c.personality || "—";
  $("charBackground").textContent = c.background || "—";
  $("charSpeech").textContent = c.speech_style || "—";
  $("charHook").textContent = c.story_hook || "—";
  showStage("Result");
}

document.addEventListener("DOMContentLoaded", async () => {
  if (!(await checkAuth())) return;

  const idea = $("ideaInput");
  const counter = $("counter");
  idea.addEventListener("input", () => { counter.textContent = idea.value.length + " / 2000"; });

  $("logoutBtn").addEventListener("click", async () => {
    localStorage.removeItem("hyool_token");
    try { await api("/api/logout", { method: "POST" }); } catch {}
    location.href = "/yonder";
  });

  $("createBtn").addEventListener("click", async () => {
    const text = idea.value.trim();
    if (text.length < 4) { $("inputMsg").className = "msg error"; $("inputMsg").textContent = "请至少输入一句脑洞描述（4 字以上）。"; return; }
    $("inputMsg").textContent = "";
    showStage("Loading");
    try {
      const res = await api("/api/create", { method: "POST", body: JSON.stringify({ idea: text }) });
      if (!res.success) throw new Error(res.error || "创造失败。");
      $("aiBadge").textContent = "AI · " + (res.ai_mode || "mock") + " / 图像 · " + (res.image_mode || "mock");
      renderCharacter(res.character);
    } catch (e) {
      $("inputMsg").className = "msg error";
      $("inputMsg").textContent = e.message;
      showStage("Input");
    }
  });

  $("meetBtn").addEventListener("click", () => {
    if (currentChar) location.href = "/buddy/" + currentChar.id;
  });
  $("shareBtn").addEventListener("click", () => {
    if (currentChar && currentChar.share_url) location.href = currentChar.share_url;
  });
  $("againBtn").addEventListener("click", () => {
    idea.value = ""; counter.textContent = "0 / 2000"; currentChar = null;
    showStage("Input");
  });
});
</script>
</body>
</html>
