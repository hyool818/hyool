```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYOOL — 数字世界</title>

    <meta name="description" content="HYOOL — 数字世界">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050507;
            color: #ffffff;
            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }

        /* =========================
           背景
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.055) 0%,
                    rgba(255, 255, 255, 0.018) 25%,
                    transparent 55%
                ),
                #050507;
        }

        /* =========================
           微光
        ========================= */

        .light {
            position: fixed;
            left: 50%;
            top: 50%;

            width: 320px;
            height: 320px;

            transform: translate(-50%, -50%);

            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.035) 30%,
                transparent 70%
            );

            filter: blur(20px);

            opacity: 0;

            animation:
                lightAppear 2.2s ease forwards,
                lightBreath 5s ease-in-out 2.2s infinite;
        }

        /* =========================
           主内容
        ========================= */

        .container {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        /* =========================
           Logo
        ========================= */

        .logo {
            width: 600px;
            max-width: 78vw;
            height: auto;

            opacity: 0;

            transform:
                scale(0.88)
                translateY(15px);

            filter:
                brightness(0.75)
                drop-shadow(
                    0 0 0 rgba(255, 255, 255, 0)
                );

            animation:
                logoAppear 1.8s
                cubic-bezier(0.22, 1, 0.36, 1)
                0.35s
                forwards,

                logoBreath 5s
                ease-in-out
                2.2s
                infinite;
        }

        /* =========================
           副标题
        ========================= */

        .subtitle {
            margin-top: 28px;

            font-size: 18px;

            letter-spacing: 8px;

            color: rgba(255, 255, 255, 0.58);

            opacity: 0;

            transform: translateY(12px);

            animation:
                subtitleAppear 1.5s
                ease
                1.4s
                forwards;
        }

        /* =========================
           底部细线
        ========================= */

        .line {
            width: 0;
            height: 1px;

            margin-top: 28px;

            background: rgba(255, 255, 255, 0.35);

            animation:
                lineAppear 1.5s
                ease
                1.8s
                forwards;
        }

        /* =========================
           动画
        ========================= */

        @keyframes lightAppear {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.6);
            }

            100% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        @keyframes lightBreath {

            0%,
            100% {
                opacity: 0.65;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }

        @keyframes logoAppear {

            0% {
                opacity: 0;

                transform:
                    scale(0.88)
                    translateY(15px);

                filter:
                    brightness(0.5)
                    blur(8px);
            }

            60% {
                opacity: 1;

                filter:
                    brightness(1)
                    blur(0);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter:
                    brightness(1)
                    drop-shadow(
                        0 0 18px
                        rgba(255, 255, 255, 0.08)
                    );
            }
        }

        @keyframes logoBreath {

            0%,
            100% {
                transform: scale(1);

                filter:
                    brightness(1)
                    drop-shadow(
                        0 0 14px
                        rgba(255, 255, 255, 0.06)
                    );
            }

            50% {
                transform: scale(1.025);

                filter:
                    brightness(1.05)
                    drop-shadow(
                        0 0 28px
                        rgba(255, 255, 255, 0.12)
                    );
            }
        }

        @keyframes subtitleAppear {

            0% {
                opacity: 0;
                transform: translateY(12px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineAppear {

            0% {
                width: 0;
                opacity: 0;
            }

            100% {
                width: 90px;
                opacity: 1;
            }
        }

        /* =========================
           手机端
        ========================= */

        @media (max-width: 600px) {

            .logo {
                width: 300px;
                max-width: 82vw;
            }

            .subtitle {
                font-size: 14px;
                letter-spacing: 5px;
            }

            .light {
                width: 240px;
                height: 240px;
            }
        }

        /* =========================
           减少动画模式
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="light"></div>

    <main class="container">

        <img
            src="logo.png"
            alt="HYOOL"
            class="logo"
        >

        <div class="subtitle">
            敬请期待
        </div>

        <div class="line"></div>

    </main>

</body>
</html>
```
