<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>HYOOL · 幻灵</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}

button,
a {
    font: inherit;
}


/* =========================================================
   PAGE 1
========================================================= */

#entrance {

    position: fixed;
    inset: 0;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #000;

    opacity: 1;
    transform: scale(1);

    transition:
        opacity 1.25s cubic-bezier(.77,0,.18,1),
        transform 1.5s cubic-bezier(.2,.8,.2,1);
}

#entrance.exit {

    opacity: 0;

    transform: scale(1.035);

    pointer-events: none;
}


/* =========================================================
   FIRST PAGE ATMOSPHERE
========================================================= */

#entrance::before {

    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 800px;
    max-height: 800px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.035) 0%,
            rgba(255,255,255,.012) 35%,
            transparent 72%
        );

    opacity: 0;

    transform: scale(.75);

    pointer-events: none;

    transition:
        opacity 1.5s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);
}

#entrance.active::before {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    position: relative;
    z-index: 2;

    display: flex;
    flex-direction: column;
    align-items: center;

    text-align: center;

    user-select: none;
}


/* =========================================================
   LOGO
========================================================= */

.logo {

    display: flex;
    align-items: center;
    justify-content: center;

    opacity: 0;

    transform: translateY(24px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .2s forwards;
}

.logo img {

    display: block;

    width:
        clamp(
            260px,
            28vw,
            520px
        );

    height: auto;

    object-fit: contain;
}


/* =========================================================
   CHINESE NAME
========================================================= */

.chinese-name {

    margin-top: 24px;

    font-size:
        clamp(
            18px,
            2vw,
            28px
        );

    font-weight: 300;

    letter-spacing: .55em;

    margin-left: .55em;

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    opacity: 0;

    transform: translateY(16px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .45s forwards;
}


/* =========================================================
   SLOGAN
========================================================= */

.slogan {

    position: relative;
    z-index: 2;

    margin-top: 58px;

    text-align: center;

    opacity: 0;

    transform: translateY(18px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .75s forwards;
}

.slogan .line-one,
.slogan .line-two {

    font-size:
        clamp(
            17px,
            1.45vw,
            21px
        );

    font-weight: 300;

    letter-spacing: .14em;

    margin-left: .14em;

    line-height: 2;
}

.slogan .line-one {

    color:
        rgba(
            255,
            255,
            255,
            .82
        );
}

.slogan .line-two {

    color:
        rgba(
            255,
            255,
            255,
            .45
        );
}


/* =========================================================
   ENTER AREA
========================================================= */

.enter-area {

    position: relative;
    z-index: 5;

    margin-top: 72px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   BACKGROUND CHINESE
========================================================= */

.enter-bg {

    position: absolute;

    white-space: nowrap;

    pointer-events: none;

    font-size:
        clamp(
            48px,
            8vw,
            110px
        );

    font-weight: 200;

    letter-spacing: .18em;

    margin-left: .18em;

    color:
        rgba(
            255,
            255,
            255,
            0
        );

    filter: blur(9px);

    transform: scale(.94);

    transition:
        color 1s ease,
        filter 1.2s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.enter-area:hover .enter-bg {

    color:
        rgba(
            255,
            255,
            255,
            .045
        );

    filter: blur(2px);

    transform: scale(1);
}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enter {

    position: relative;

    z-index: 2;

    padding: 18px 32px;

    cursor: pointer;

    user-select: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;

    font-weight: 400;

    letter-spacing: .42em;

    margin-left: .42em;

    color:
        rgba(
            255,
            255,
            255,
            .7
        );

    transition:
        color .6s ease,
        letter-spacing .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter::before {

    content: "";

    position: absolute;

    inset: 0;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    opacity: 0;

    transform: scale(.92);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter:hover {

    color:
        rgba(
            255,
            255,
            255,
            .95
        );

    letter-spacing: .55em;
}

.enter:hover::before {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   ENTER GLOW
========================================================= */

.enter::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;
    height: 90px;

    transform:
        translate(-50%,-50%)
        scale(.6);

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.08),
            transparent 70%
        );

    opacity: 0;

    filter: blur(18px);

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);

    pointer-events: none;

    z-index: -1;
}

.enter:hover::after {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   PAGE 2
========================================================= */

#world {

    position: fixed;

    inset: 0;

    z-index: 20;

    width: 100%;
    height: 100%;

    background: #000;

    opacity: 0;

    visibility: hidden;

    transform: scale(1.04);

    pointer-events: none;

    overflow: hidden;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear 1.5s;
}

#world.show {

    opacity: 1;

    visibility: visible;

    transform: scale(1);

    pointer-events: auto;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s;
}


/* =========================================================
   LIFE VIDEO
========================================================= */

.life-video {

    position: absolute;

    inset: -5%;

    width: 110%;
    height: 110%;

    display: block;

    object-fit: cover;

    object-position: center;

    border: none;
    outline: none;

    background: #000;

    opacity: 0;

    transform: scale(1.08);

    filter:
        brightness(.32)
        contrast(1.08)
        saturate(.65);

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

    transition:
        opacity 4s cubic-bezier(.2,.8,.2,1),
        transform 8s cubic-bezier(.2,.8,.2,1);
}

#world.show .life-video {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   LIFE OVERLAY
========================================================= */

.life-overlay {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,.12) 35%,
            rgba(0,0,0,.48) 72%,
            rgba(0,0,0,.82) 100%
        );
}


/* =========================================================
   VIGNETTE
========================================================= */

.life-vignette {

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.72) 100%
        );
}


/* =========================================================
   WORLD LOGO
========================================================= */

.world-logo {

    position: absolute;

    left: 42px;
    top: 34px;

    z-index: 10;

    opacity: 0;

    transform: translateY(-10px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    transition-delay: 5.8s;
}

#world.show .world-logo {

    opacity: .7;

    transform: translateY(0);
}

.world-logo img {

    width: 90px;

    height: auto;

    display: block;
}


/* =========================================================
   CORE PHRASE
========================================================= */

.core {

    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 7;

    transform:
        translate(-50%,-50%)
        translateY(20px);

    width: max-content;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay: 8.1s;
}

#world.show .core {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}


/* =========================================================
   CORE CHINESE
========================================================= */

.core-cn {

    font-size:
        clamp(
            18px,
            2vw,
            28px
        );

    font-weight: 300;

    letter-spacing: .28em;

    margin-left: .28em;

    color:
        rgba(
            255,
            255,
            255,
            .9
        );
}


/* =========================================================
   CORE ENGLISH
========================================================= */

.core-en {

    margin-top: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            9px,
            .9vw,
            12px
        );

    font-weight: 300;

    letter-spacing: .3em;

    margin-left: .3em;

    color:
        rgba(
            255,
            255,
            255,
            .52
        );
}


/* =========================================================
   FOUR WORLDS
========================================================= */

.world-entry {

    position: absolute;

    z-index: 8;

    text-align: center;

    cursor: pointer;

    user-select: none;

    width: 280px;

    opacity: 0;

    transition:
        opacity 1.5s ease,
        transform 1.5s cubic-bezier(.2,.8,.2,1);
}


/* ---------------------------------------------------------
   TOP — FANTASY
--------------------------------------------------------- */

.world-entry.fantasy {

    left: 50%;

    top: 12%;

    transform:
        translateX(-50%)
        translateY(-15px);

    transition-delay: 8.45s;
}


/* ---------------------------------------------------------
   LEFT — YONDER
--------------------------------------------------------- */

.world-entry.yonder {

    left: 10%;

    top: 50%;

    transform:
        translateY(-50%)
        translateX(-15px);

    transition-delay: 8.65s;
}


/* ---------------------------------------------------------
   RIGHT — INFINITE
--------------------------------------------------------- */

.world-entry.infinite {

    right: 10%;

    top: 50%;

    transform:
        translateY(-50%)
        translateX(15px);

    transition-delay: 8.8s;
}


/* ---------------------------------------------------------
   BOTTOM — LIFE
--------------------------------------------------------- */

.world-entry.life {

    left: 50%;

    bottom: 12%;

    transform:
        translateX(-50%)
        translateY(15px);

    transition-delay: 8.95s;
}


/* =========================================================
   SHOW FOUR WORLDS
========================================================= */

#world.show .world-entry {

    opacity: 1;
}

#world.show .world-entry.fantasy {

    transform:
        translateX(-50%)
        translateY(0);
}

#world.show .world-entry.yonder {

    transform:
        translateY(-50%)
        translateX(0);
}

#world.show .world-entry.infinite {

    transform:
        translateY(-50%)
        translateX(0);
}

#world.show .world-entry.life {

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   ENTRY TITLE
========================================================= */

.entry-title {

    position: relative;

    display: inline-block;

    font-size:
        clamp(
            19px,
            2vw,
            27px
        );

    font-weight: 300;

    letter-spacing: .32em;

    margin-left: .32em;

    color:
        rgba(
            255,
            255,
            255,
            .68
        );

    transition:
        color .7s ease,
        letter-spacing .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   ENTRY TITLE GLOW
========================================================= */

.entry-title::before {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 160px;
    height: 70px;

    transform:
        translate(-50%,-50%)
        scale(.7);

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.07),
            transparent 70%
        );

    filter: blur(20px);

    opacity: 0;

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);

    pointer-events: none;

    z-index: -1;
}


/* =========================================================
   ENTRY DESCRIPTION
========================================================= */

.entry-description {

    margin-top: 12px;

    opacity: 0;

    transform: translateY(8px);

    pointer-events: none;

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   DESCRIPTION MAIN
========================================================= */

.entry-description .meaning {

    font-size:
        clamp(
            12px,
            1vw,
            14px
        );

    font-weight: 300;

    letter-spacing: .12em;

    margin-left: .12em;

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    line-height: 1.8;
}


/* =========================================================
   DESCRIPTION TAGS
========================================================= */

.entry-description .tags {

    margin-top: 7px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            7px,
            .7vw,
            9px
        );

    font-weight: 300;

    letter-spacing: .12em;

    margin-left: .12em;

    color:
        rgba(
            255,
            255,
            255,
            .38
        );

    white-space: nowrap;
}


/* =========================================================
   HOVER
========================================================= */

.world-entry:hover .entry-title {

    color:
        rgba(
            255,
            255,
            255,
            1
        );

    letter-spacing: .4em;

    transform: translateY(-2px);
}

.world-entry:hover .entry-title::before {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.world-entry:hover .entry-description {

    opacity: 1;

    transform: translateY(0);
}


/* =========================================================
   HOVER OTHER ITEMS
========================================================= */

#world:has(.world-entry:hover)
.world-entry:not(:hover) {

    opacity: .32;
}

#world:has(.world-entry:hover) .core {

    opacity: .72;
}


/* =========================================================
   REALM
========================================================= */

.realm {

    position: absolute;

    left: 50%;

    bottom: 3.8%;

    z-index: 9;

    transform:
        translateX(-50%)
        translateY(10px);

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay: 9.1s;
}

#world.show .realm {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   REALM TITLE
========================================================= */

.realm-title {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            8px,
            .8vw,
            11px
        );

    font-weight: 300;

    letter-spacing: .45em;

    margin-left: .45em;

    color:
        rgba(
            255,
            255,
            255,
            .3
        );
}


/* =========================================================
   SUBTLE SEPARATOR
========================================================= */

.realm::before {

    content: "";

    display: block;

    width: 18px;

    height: 1px;

    margin: 0 auto 10px;

    background:
        rgba(
            255,
            255,
            255,
            .16
        );
}


/* =========================================================
   LOGO ANIMATION
========================================================= */

@keyframes logoIn {

    from {

        opacity: 0;

        transform:
            translateY(24px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {


    .logo img {

        width: 220px;
    }


    .chinese-name {

        margin-top: 20px;

        font-size: 18px;

        letter-spacing: .45em;

        margin-left: .45em;
    }


    .slogan {

        margin-top: 46px;
    }


    .slogan .line-one,
    .slogan .line-two {

        font-size: 14px;

        letter-spacing: .1em;

        margin-left: .1em;
    }


    .enter-area {

        margin-top: 60px;
    }


    .enter-bg {

        font-size: 54px;
    }


    .world-logo {

        left: 20px;

        top: 22px;
    }


    .world-logo img {

        width: 70px;
    }


    .core {

        width: 90vw;
    }


    .core-cn {

        font-size: 16px;

        letter-spacing: .15em;

        margin-left: .15em;
    }


    .core-en {

        font-size: 7px;

        letter-spacing: .16em;

        margin-left: .16em;
    }


    .world-entry {

        width: 190px;
    }


    .world-entry.fantasy {

        top: 13%;
    }


    .world-entry.yonder {

        left: 3%;
    }


    .world-entry.infinite {

        right: 3%;
    }


    .world-entry.life {

        bottom: 12%;
    }


    .entry-title {

        font-size: 17px;

        letter-spacing: .2em;

        margin-left: .2em;
    }


    .entry-description .meaning {

        font-size: 10px;

        letter-spacing: .06em;

        margin-left: .06em;
    }


    .entry-description .tags {

        font-size: 6px;

        letter-spacing: .05em;

        margin-left: .05em;

        white-space: normal;

        line-height: 1.7;
    }


    .realm {

        bottom: 4%;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        transition-duration: .01ms !important;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     PAGE 1 — HYOOL / 幻灵
======================================================= -->

<section id="entrance">


    <div class="brand">


        <div class="logo">

            <img
                src="./logo1.png"
                alt="HYOOL"
            >

        </div>


    </div>


    <div class="slogan">


        <div class="line-one">

            自幻想，奔赴彼岸。

        </div>


        <div class="line-two">

            于无限，孕育生命。

        </div>


    </div>


    <div class="enter-area">


        <div class="enter-bg">

            进入幻灵

        </div>


        <div
            class="enter"
            id="enterButton"
        >

            ENTER HYOOL

        </div>


    </div>


</section>



<!-- =======================================================
     PAGE 2 — HYOOL REALM
======================================================= -->

<section id="world">


    <!-- ===================================================
         LIFE VIDEO

         注意：
         不要添加 controls
    ==================================================== -->

    <video
        class="life-video"
        id="lifeVideo"
        src="./life.mp4"
        muted
        playsinline
        webkit-playsinline
        autoplay
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
    ></video>


    <!-- ===================================================
         ATMOSPHERE
    ==================================================== -->

    <div class="life-overlay"></div>

    <div class="life-vignette"></div>


    <!-- ===================================================
         SMALL HYOOL LOGO
    ==================================================== -->

    <div class="world-logo">

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </div>


    <!-- ===================================================
         FOUR WORLD ENTRIES
    ==================================================== -->


    <!-- FANTASY -->

    <div
        class="world-entry fantasy"
        data-world="fantasy"
    >

        <div class="entry-title">

            幻想

        </div>


        <div class="entry-description">

            <div class="meaning">

                让想象成为作品。

            </div>


            <div class="tags">

                AI 图片 · 视频 · 音乐 · 故事 · 角色

            </div>

        </div>

    </div>



    <!-- YONDER -->

    <div
        class="world-entry yonder"
        data-world="yonder"
    >

        <div class="entry-title">

            彼岸

        </div>


        <div class="entry-description">

            <div class="meaning">

                让作品抵达彼岸。

            </div>


            <div class="tags">

                展示 · 分享 · 发现 · 个人空间 · 社区

            </div>

        </div>

    </div>



    <!-- INFINITE -->

    <div
        class="world-entry infinite"
        data-world="infinite"
    >

        <div class="entry-title">

            无限

        </div>


        <div class="entry-description">

            <div class="meaning">

                让创造拥有无限可能。

            </div>


            <div class="tags">

                AI 模型 · 工具 · 素材 · 工作流 · 实验

            </div>

        </div>

    </div>



    <!-- LIFE -->

    <div
        class="world-entry life"
        data-world="life"
    >

        <div class="entry-title">

            生命

        </div>


        <div class="entry-description">

            <div class="meaning">

                让创造拥有真正的存在。

            </div>


            <div class="tags">

                AI 角色 · 数字人格 · 智能体 · 虚拟生命

            </div>

        </div>

    </div>



    <!-- ===================================================
         CORE PHRASE
    ==================================================== -->

    <div class="core">


        <div class="core-cn">

            幻想 × 彼岸 × 无限 × 生命

        </div>


        <div class="core-en">

            Fantasy · Yonder · Infinite · Life

        </div>


    </div>



    <!-- ===================================================
         REALM
    ==================================================== -->

    <div class="realm">

        <div class="realm-title">

            HYOOL REALM

        </div>

    </div>


</section>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const entrance =
    document.getElementById("entrance");

const world =
    document.getElementById("world");

const button =
    document.getElementById("enterButton");

const enterArea =
    document.querySelector(".enter-area");

const lifeVideo =
    document.getElementById("lifeVideo");


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        entrance.classList.add("active");

    }
);


/* =========================================================
   ENTER HYOOL
========================================================= */

button.addEventListener(
    "click",
    () => {


        /*
         * 防止重复点击
         */

        button.style.pointerEvents =
            "none";


        /*
         * 第一页离开
         */

        entrance.classList.add("exit");


        /*
         * 第二页进入
         */

        setTimeout(
            () => {


                world.classList.add("show");


                /*
                 * 从第一帧开始
                 */

                try {

                    lifeVideo.currentTime = 0;

                } catch (error) {

                    console.log(error);

                }


                /*
                 * 确保静音
                 *
                 * 静音状态下浏览器允许
                 * 自动播放。
                 */

                lifeVideo.muted = true;

                lifeVideo.setAttribute(
                    "muted",
                    ""
                );


                /*
                 * 开始播放
                 */

                const playPromise =
                    lifeVideo.play();


                if (
                    playPromise !== undefined
                ) {

                    playPromise.catch(
                        (error) => {

                            console.log(
                                "Video autoplay blocked:",
                                error
                            );

                        }
                    );

                }

            },
            450
        );

    }
);


/* =========================================================
   ENTER MAGNETIC EFFECT
========================================================= */

enterArea.addEventListener(
    "mousemove",
    (event) => {


        const rect =
            enterArea.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const x =
            event.clientX -
            centerX;


        const y =
            event.clientY -
            centerY;


        const moveX =
            Math.max(
                -6,
                Math.min(
                    6,
                    x * .08
                )
            );


        const moveY =
            Math.max(
                -4,
                Math.min(
                    4,
                    y * .08
                )
            );


        button.style.transform =
            `translate(
                ${moveX}px,
                ${moveY}px
            )`;

    }
);


/* =========================================================
   RESET ENTER
========================================================= */

enterArea.addEventListener(
    "mouseleave",
    () => {

        button.style.transform = "";

    }
);


/* =========================================================
   VIDEO END
========================================================= */

/*
 * 不循环。
 *
 * 视频结束后停在最后一帧。
 */

lifeVideo.addEventListener(
    "ended",
    () => {

        lifeVideo.pause();

    }
);


/* =========================================================
   WORLD ENTRY INTERACTION
========================================================= */

const worldEntries =
    document.querySelectorAll(
        ".world-entry"
    );


worldEntries.forEach(
    (entry) => {


        entry.addEventListener(
            "mouseenter",
            () => {

                /*
                 * 以后这里可以加入：
                 *
                 * - 页面切换
                 * - 光线响应
                 * - 粒子响应
                 * - 声音
                 * - 页面转场
                 */

                const worldName =
                    entry.dataset.world;

                console.log(
                    "Enter:",
                    worldName
                );

            }
        );


        entry.addEventListener(
            "click",
            () => {

                const worldName =
                    entry.dataset.world;

                console.log(
                    "HYOOL WORLD:",
                    worldName
                );


                /*
                 * 后续真正接入四个世界。
                 */

            }
        );

    }
);


/* =========================================================
   MOBILE TOUCH
========================================================= */

button.addEventListener(
    "touchstart",
    () => {

        button.style.color =
            "rgba(255,255,255,.95)";

    }
);


/* =========================================================
   FUTURE AUDIO
========================================================= */

/*
 * 以后加入背景音乐时，
 * 可以直接在这里接入。
 *
 * 例如：
 *
 * const ambientAudio =
 *     new Audio("./ambient.mp3");
 *
 * ambientAudio.loop = true;
 * ambientAudio.volume = 0;
 *
 * 然后在 ENTER HYOOL 点击后：
 *
 * ambientAudio.play();
 *
 * 再通过渐变慢慢提高音量。
 *
 * 现在暂时不启用。
 */

</script>


</body>

</html>
