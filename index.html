<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYOOL — 幻灵 · 数字世界</title>

    <meta
        name="description"
        content="HYOOL — 幻灵 · 数字世界"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050507;
            color: #ffffff;

            font-family:
                Arial,
                "Microsoft YaHei",
                sans-serif;
        }


        /* =========================
           背景
        ========================= */

        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.055) 0%,
                    rgba(255, 255, 255, 0.018) 28%,
                    transparent 60%
                ),
                #050507;
        }


        /* =========================
           中央幻想微光
        ========================= */

        .light {
            position: fixed;

            left: 50%;
            top: 45%;

            width: 420px;
            height: 420px;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.10) 0%,
                    rgba(255, 255, 255, 0.035) 30%,
                    transparent 70%
                );

            filter: blur(30px);

            opacity: 0;

            animation:
                lightAppear 2.5s ease forwards,
                lightBreath 6s ease-in-out 2.5s infinite;

            pointer-events: none;
        }


        /* =========================
           主容器
        ========================= */

        .container {
            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        /* =========================
           Logo
        ========================= */

        .logo {
            width: 520px;

            max-width: 78vw;

            height: auto;

            opacity: 0;

            transform:
                scale(0.90)
                translateY(15px);

            animation:
                logoAppear 1.8s
                cubic-bezier(0.22, 1, 0.36, 1)
                0.2s
                forwards,

                logoBreath 6s
                ease-in-out
                2s
                infinite;
        }


        /* =========================
           进入 HYOOL
        ========================= */

        .enter {
            position: relative;

            display: inline-block;

            margin-top: 48px;

            padding: 12px 20px;

            color:
                rgba(255, 255, 255, 0.60);

            font-size: 16px;

            letter-spacing: 6px;

            text-decoration: none;

            opacity: 0;

            transform:
                translateY(15px);

            animation:
                enterAppear 1.6s
                ease
                1.5s
                forwards;

            transition:
                color 0.5s ease,
                text-shadow 0.5s ease,
                transform 0.5s ease;
        }


        /* =========================
           幻想光线
        ========================= */

        .enter::after {
            content: "";

            position: absolute;

            left: 50%;

            bottom: 0;

            width: 0;

            height: 1px;

            transform:
                translateX(-50%);

            background:
                rgba(255, 255, 255, 0.65);

            box-shadow:
                0 0 12px
                rgba(255, 255, 255, 0.45);

            transition:
                width 0.6s ease;
        }


        /* =========================
           鼠标经过
        ========================= */

        .enter:hover {
            color: #ffffff;

            transform:
                translateY(-3px);

            text-shadow:
                0 0 12px
                rgba(255, 255, 255, 0.55),

                0 0 30px
                rgba(255, 255, 255, 0.18);
        }


        .enter:hover::after {
            width: 100%;
        }


        /* =========================
           Logo 出现
        ========================= */

        @keyframes logoAppear {

            0% {
                opacity: 0;

                transform:
                    scale(0.90)
                    translateY(15px);

                filter:
                    brightness(0.5)
                    blur(10px);
            }

            60% {
                opacity: 1;

                filter:
                    brightness(1)
                    blur(0);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter:
                    brightness(1);
            }
        }


        /* =========================
           Logo 呼吸
        ========================= */

        @keyframes logoBreath {

            0%,
            100% {
                transform:
                    scale(1);

                filter:
                    brightness(1)
                    drop-shadow(
                        0 0 10px
                        rgba(255,255,255,0.05)
                    );
            }

            50% {
                transform:
                    scale(1.025);

                filter:
                    brightness(1.05)
                    drop-shadow(
                        0 0 28px
                        rgba(255,255,255,0.13)
                    );
            }
        }


        /* =========================
           微光出现
        ========================= */

        @keyframes lightAppear {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.6);
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }


        /* =========================
           微光呼吸
        ========================= */

        @keyframes lightBreath {

            0%,
            100% {
                opacity: 0.55;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                opacity: 0.9;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }


        /* =========================
           进入按钮出现
        ========================= */

        @keyframes enterAppear {

            0% {
                opacity: 0;

                transform:
                    translateY(15px);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           手机端
        ========================= */

        @media (max-width: 600px) {

            .logo {
                width: 360px;

                max-width: 82vw;
            }

            .enter {
                margin-top: 38px;

                font-size: 14px;

                letter-spacing: 5px;
            }

            .light {
                width: 280px;
                height: 280px;
            }
        }


        /* =========================
           减少动画
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;
            }
        }

    </style>
</head>


<body>

    <!-- 背景 -->

    <div class="background"></div>


    <!-- 中央微光 -->

    <div class="light"></div>


    <!-- 主内容 -->

    <main class="container">

        <!-- HYOOL Logo -->

        <img
            src="logo.png"
            alt="HYOOL"
            class="logo"
        >


        <!-- 进入 HYOOL -->

        <a
            href="home.html"
            class="enter"
        >
            进入 HYOOL
        </a>

    </main>


</body>
</html>
