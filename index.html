<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 幻灵</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}


/* =========================================================
   PAGE 1
========================================================= */

#entrance{
    position:fixed;
    inset:0;
    z-index:10;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:#000;

    opacity:1;
    transform:scale(1);

    transition:
        opacity 1.25s cubic-bezier(.77,0,.18,1),
        transform 1.5s cubic-bezier(.2,.8,.2,1);
}

#entrance.exit{
    opacity:0;
    transform:scale(1.035);
    pointer-events:none;
}


/* =========================================================
   PAGE 1 LOGO
========================================================= */

.brand{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;
    user-select:none;
}

.logo{
    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    transform:translateY(24px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .2s forwards;
}

.logo img{
    display:block;
    width:clamp(260px,28vw,520px);
    height:auto;
}


/* =========================================================
   幻灵
========================================================= */

.chinese-name{
    margin-top:24px;

    font-size:clamp(18px,2vw,28px);
    font-weight:300;

    letter-spacing:.55em;
    margin-left:.55em;

    color:rgba(255,255,255,.72);

    opacity:0;
    transform:translateY(16px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .45s forwards;
}


/* =========================================================
   SLOGAN
========================================================= */

.slogan{
    position:relative;
    z-index:2;

    margin-top:58px;

    text-align:center;

    opacity:0;
    transform:translateY(18px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .75s forwards;
}

.slogan .line-one,
.slogan .line-two{
    font-size:clamp(17px,1.45vw,21px);

    font-weight:300;

    letter-spacing:.14em;
    margin-left:.14em;

    line-height:2;
}

.slogan .line-one{
    color:rgba(255,255,255,.82);
}

.slogan .line-two{
    color:rgba(255,255,255,.45);
}


/* =========================================================
   ENTER
========================================================= */

.enter-area{
    position:relative;
    z-index:5;

    margin-top:72px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.enter-bg{
    position:absolute;

    white-space:nowrap;

    pointer-events:none;

    font-size:clamp(48px,8vw,110px);

    font-weight:200;

    letter-spacing:.18em;
    margin-left:.18em;

    color:rgba(255,255,255,0);

    filter:blur(9px);

    transform:scale(.94);

    transition:
        color 1s ease,
        filter 1.2s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.enter-area:hover .enter-bg{
    color:rgba(255,255,255,.045);
    filter:blur(2px);
    transform:scale(1);
}

.enter{
    position:relative;
    z-index:2;

    padding:18px 32px;

    cursor:pointer;
    user-select:none;

    font-family:Arial,Helvetica,sans-serif;

    font-size:14px;
    font-weight:400;

    letter-spacing:.42em;
    margin-left:.42em;

    color:rgba(255,255,255,.7);

    transition:
        color .6s ease,
        letter-spacing .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter::before{
    content:"";

    position:absolute;
    inset:0;

    border:1px solid rgba(255,255,255,.08);

    opacity:0;

    transform:scale(.92);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter:hover{
    color:rgba(255,255,255,.95);
    letter-spacing:.55em;
}

.enter:hover::before{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   PAGE 2
========================================================= */

#world{
    position:fixed;
    inset:0;

    z-index:20;

    width:100%;
    height:100%;

    background:#000;

    opacity:0;
    visibility:hidden;

    transform:scale(1.04);

    pointer-events:none;

    overflow:hidden;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear 1.5s;
}

#world.show{
    opacity:1;
    visibility:visible;

    transform:scale(1);

    pointer-events:auto;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s;
}


/* =========================================================
   VIDEO
========================================================= */

.life-video{
    position:absolute;

    inset:-5%;

    width:110%;
    height:110%;

    object-fit:cover;
    object-position:center;

    display:block;

    border:0;
    outline:0;

    background:#000;

    opacity:0;

    transform:scale(1.08);

    filter:
        brightness(.32)
        contrast(1.08)
        saturate(.65);

    pointer-events:none;

    user-select:none;

    transition:
        opacity 4s cubic-bezier(.2,.8,.2,1),
        transform 8s cubic-bezier(.2,.8,.2,1);
}

#world.show .life-video{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   VIDEO ATMOSPHERE
========================================================= */

.life-overlay{
    position:absolute;
    inset:0;

    z-index:2;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,.12) 35%,
            rgba(0,0,0,.48) 72%,
            rgba(0,0,0,.82) 100%
        );
}

.life-vignette{
    position:absolute;
    inset:0;

    z-index:3;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.72) 100%
        );
}


/* =========================================================
   SMALL LOGO
========================================================= */

.world-logo{
    position:absolute;

    left:42px;
    top:34px;

    z-index:10;

    opacity:0;

    transform:translateY(-10px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    transition-delay:5.8s;
}

#world.show .world-logo{
    opacity:.7;
    transform:translateY(0);
}

.world-logo img{
    width:90px;
    height:auto;
    display:block;
}


/* =========================================================
   CENTER TEXT
========================================================= */

.core{
    position:absolute;

    left:50%;
    top:50%;

    z-index:7;

    transform:
        translate(-50%,-50%)
        translateY(20px);

    width:max-content;

    text-align:center;

    pointer-events:none;

    opacity:0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay:5.8s;
}

#world.show .core{
    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}

.core-cn{
    font-size:clamp(18px,2vw,28px);

    font-weight:300;

    letter-spacing:.28em;
    margin-left:.28em;

    color:rgba(255,255,255,.9);
}

.core-en{
    margin-top:20px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:clamp(9px,.9vw,12px);

    font-weight:300;

    letter-spacing:.3em;
    margin-left:.3em;

    color:rgba(255,255,255,.52);
}


/* =========================================================
   FLOATING STAR
========================================================= */

.light{
    position:absolute;

    z-index:9;

    width:32px;
    height:32px;

    cursor:pointer;

    opacity:0;

    transform:scale(.55);

    transition:
        opacity 1.8s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   FOUR POSITIONS
========================================================= */

.light.fantasy{
    left:50%;
    top:20%;

    margin-left:-16px;
    margin-top:-16px;

    animation:
        floatFantasy 6s ease-in-out infinite;
}

.light.yonder{
    left:24%;
    top:50%;

    margin-left:-16px;
    margin-top:-16px;

    animation:
        floatYonder 7s ease-in-out infinite;
}

.light.infinite{
    right:24%;
    top:48%;

    margin-right:-16px;
    margin-top:-16px;

    animation:
        floatInfinite 6.5s ease-in-out infinite;
}

.light.life{
    left:50%;
    bottom:19%;

    margin-left:-16px;
    margin-bottom:-16px;

    animation:
        floatLife 5.5s ease-in-out infinite;
}


/* =========================================================
   LIGHT APPEAR
========================================================= */

#world.lights-active .light{
    opacity:1;
    transform:scale(1);
}


/* =========================================================
   STAR CORE
========================================================= */

.light::before{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:5px;
    height:5px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    background:rgba(255,255,255,.92);

    border-radius:
        45% 55% 48% 52%;

    box-shadow:
        0 0 7px rgba(255,255,255,.8),
        0 0 18px rgba(255,255,255,.38),
        0 0 45px rgba(255,255,255,.14);

    animation:
        starPulse 4.8s ease-in-out infinite;
}


/* =========================================================
   STAR RAYS
========================================================= */

.light::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:44px;
    height:44px;

    transform:
        translate(-50%,-50%)
        rotate(45deg);

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,.16) 42%,
            rgba(255,255,255,.75) 50%,
            rgba(255,255,255,.16) 58%,
            transparent 100%
        ),

        linear-gradient(
            0deg,
            transparent 0%,
            rgba(255,255,255,.12) 42%,
            rgba(255,255,255,.65) 50%,
            rgba(255,255,255,.12) 58%,
            transparent 100%
        );

    filter:blur(1px);

    opacity:.55;

    animation:
        starRay 5.5s ease-in-out infinite;
}


/* =========================================================
   DIFFERENT STAR RHYTHMS
========================================================= */

.light.fantasy::before{
    animation-delay:0s;
}

.light.yonder::before{
    animation-delay:-1.7s;
}

.light.infinite::before{
    animation-delay:-3.1s;
}

.light.life::before{
    animation-delay:-4.2s;
}

.light.fantasy::after{
    animation-delay:0s;
}

.light.yonder::after{
    animation-delay:-2.3s;
}

.light.infinite::after{
    animation-delay:-3.8s;
}

.light.life::after{
    animation-delay:-1.2s;
}


/* =========================================================
   STAR PULSE
========================================================= */

@keyframes starPulse{

    0%{
        opacity:.32;

        transform:
            translate(-50%,-50%)
            rotate(45deg)
            scale(.65);

        box-shadow:
            0 0 5px rgba(255,255,255,.4),
            0 0 16px rgba(255,255,255,.16);
    }

    35%{
        opacity:.75;

        transform:
            translate(-50%,-50%)
            rotate(58deg)
            scale(.85);

        box-shadow:
            0 0 9px rgba(255,255,255,.7),
            0 0 28px rgba(255,255,255,.32);
    }

    55%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            rotate(38deg)
            scale(1.15);

        box-shadow:
            0 0 12px rgba(255,255,255,.9),
            0 0 42px rgba(255,255,255,.38),
            0 0 75px rgba(255,255,255,.12);
    }

    75%{
        opacity:.55;

        transform:
            translate(-50%,-50%)
            rotate(51deg)
            scale(.82);
    }

    100%{
        opacity:.32;

        transform:
            translate(-50%,-50%)
            rotate(45deg)
            scale(.65);
    }
}


/* =========================================================
   STAR RAY
========================================================= */

@keyframes starRay{

    0%,100%{
        opacity:.22;

        transform:
            translate(-50%,-50%)
            rotate(45deg)
            scale(.65);
    }

    45%{
        opacity:.55;

        transform:
            translate(-50%,-50%)
            rotate(42deg)
            scale(1);
    }

    60%{
        opacity:.8;

        transform:
            translate(-50%,-50%)
            rotate(48deg)
            scale(1.25);
    }

    80%{
        opacity:.3;

        transform:
            translate(-50%,-50%)
            rotate(43deg)
            scale(.8);
    }
}


/* =========================================================
   FLOATING MOVEMENT
========================================================= */

@keyframes floatFantasy{

    0%,100%{
        margin-top:-16px;
    }

    50%{
        margin-top:-27px;
    }
}

@keyframes floatYonder{

    0%,100%{
        margin-left:-16px;
    }

    50%{
        margin-left:-4px;
    }
}

@keyframes floatInfinite{

    0%,100%{
        margin-right:-16px;
    }

    50%{
        margin-right:-4px;
    }
}

@keyframes floatLife{

    0%,100%{
        margin-bottom:-16px;
    }

    50%{
        margin-bottom:-5px;
    }
}


/* =========================================================
   LABEL
========================================================= */

.light-label{
    position:absolute;

    left:50%;
    top:50%;

    width:max-content;

    pointer-events:none;

    opacity:0;

    transition:
        opacity .8s ease,
        transform .9s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   LABEL TITLE
========================================================= */

.light-name{
    font-size:18px;

    font-weight:300;

    letter-spacing:.3em;
    margin-left:.3em;

    color:rgba(255,255,255,.92);

    text-align:center;
}

.light-meaning{
    margin-top:10px;

    font-size:11px;

    font-weight:300;

    letter-spacing:.1em;
    margin-left:.1em;

    color:rgba(255,255,255,.65);

    text-align:center;
}

.light-tags{
    margin-top:6px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:8px;

    letter-spacing:.1em;
    margin-left:.1em;

    color:rgba(255,255,255,.34);

    text-align:center;
}


/* =========================================================
   UNIFIED LABEL DISTANCE
========================================================= */

.light.fantasy .light-label{
    transform:
        translate(-50%,-50%)
        translateY(-62px);
}

.light.fantasy:hover .light-label{
    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(-68px);
}


.light.yonder .light-label{
    transform:
        translate(-100%,-50%)
        translateX(-48px);
}

.light.yonder:hover .light-label{
    opacity:1;

    transform:
        translate(-100%,-50%)
        translateX(-54px);
}


.light.infinite .light-label{
    transform:
        translate(0,-50%)
        translateX(48px);
}

.light.infinite:hover .light-label{
    opacity:1;

    transform:
        translate(0,-50%)
        translateX(54px);
}


.light.life .light-label{
    transform:
        translate(-50%,-50%)
        translateY(62px);
}

.light.life:hover .light-label{
    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(68px);
}


/* =========================================================
   HOVER STAR
========================================================= */

.light:hover{
    z-index:15;

    transform:scale(1.2);
}

.light:hover::before{

    animation-play-state:paused;

    opacity:1;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        scale(1.55);

    box-shadow:
        0 0 15px rgba(255,255,255,.95),
        0 0 45px rgba(255,255,255,.55),
        0 0 100px rgba(255,255,255,.2);
}

.light:hover::after{

    opacity:1;

    transform:
        translate(-50%,-50%)
        rotate(45deg)
        scale(1.6);
}


/* =========================================================
   CENTER DIM WHEN HOVER
========================================================= */

#world:has(.light:hover) .core{
    opacity:.35;
}


/* =========================================================
   REALM
========================================================= */

.realm{
    position:absolute;

    left:50%;
    bottom:3.8%;

    z-index:9;

    transform:
        translateX(-50%)
        translateY(10px);

    text-align:center;

    pointer-events:none;

    opacity:0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay:5.9s;
}

#world.show .realm{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

.realm::before{
    content:"";

    display:block;

    width:18px;
    height:1px;

    margin:0 auto 10px;

    background:rgba(255,255,255,.16);
}

.realm-title{
    font-family:Arial,Helvetica,sans-serif;

    font-size:clamp(8px,.8vw,11px);

    font-weight:300;

    letter-spacing:.45em;
    margin-left:.45em;

    color:rgba(255,255,255,.3);
}


/* =========================================================
   COMING SOON MODAL
========================================================= */

.coming-soon{
    position:fixed;
    inset:0;

    z-index:200;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.58);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    opacity:0;
    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .8s ease,
        visibility 0s linear .8s;
}

.coming-soon.show{
    opacity:1;
    visibility:visible;

    pointer-events:auto;

    transition:
        opacity .8s ease,
        visibility 0s;
}


.coming-panel{
    position:relative;

    width:min(420px,82vw);

    padding:52px 36px 48px;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.015)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55);

    transform:
        translateY(18px)
        scale(.97);

    opacity:0;

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);
}

.coming-soon.show .coming-panel{
    opacity:1;

    transform:
        translateY(0)
        scale(1);
}


.coming-panel::before{
    content:"";

    position:absolute;

    left:50%;
    top:-1px;

    width:40px;
    height:1px;

    transform:translateX(-50%);

    background:rgba(255,255,255,.4);
}


.coming-world{
    font-size:clamp(22px,2.4vw,30px);

    font-weight:300;

    letter-spacing:.38em;
    margin-left:.38em;

    color:rgba(255,255,255,.92);
}


.coming-meaning{
    margin-top:16px;

    font-size:12px;

    font-weight:300;

    letter-spacing:.16em;
    margin-left:.16em;

    color:rgba(255,255,255,.48);
}


.coming-en{
    margin-top:32px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:9px;

    font-weight:300;

    letter-spacing:.38em;
    margin-left:.38em;

    color:rgba(255,255,255,.3);
}


.coming-line{
    width:22px;
    height:1px;

    margin:26px auto 20px;

    background:rgba(255,255,255,.12);
}


.coming-close{
    display:inline-block;

    padding:8px 18px;

    cursor:pointer;

    font-family:Arial,Helvetica,sans-serif;

    font-size:9px;

    letter-spacing:.3em;
    margin-left:.3em;

    color:rgba(255,255,255,.38);

    transition:
        color .5s ease,
        letter-spacing .6s ease;
}

.coming-close:hover{
    color:rgba(255,255,255,.85);

    letter-spacing:.42em;
}


/* =========================================================
   WORLD TRANSITION
========================================================= */

#world.entering-world::after{
    content:"";

    position:absolute;
    inset:0;

    z-index:100;

    background:#fff;

    opacity:0;

    animation:
        worldFlash .9s ease forwards;

    pointer-events:none;
}

@keyframes worldFlash{

    0%{
        opacity:0;
    }

    35%{
        opacity:.16;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   LOGO ANIMATION
========================================================= */

@keyframes logoIn{

    from{
        opacity:0;
        transform:translateY(24px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .logo img{
        width:220px;
    }

    .chinese-name{
        margin-top:20px;
        font-size:18px;
        letter-spacing:.45em;
        margin-left:.45em;
    }

    .slogan{
        margin-top:46px;
    }

    .slogan .line-one,
    .slogan .line-two{
        font-size:14px;
        letter-spacing:.1em;
        margin-left:.1em;
    }

    .enter-area{
        margin-top:60px;
    }

    .enter-bg{
        font-size:54px;
    }

    .world-logo{
        left:20px;
        top:22px;
    }

    .world-logo img{
        width:70px;
    }

    .core{
        width:90vw;
    }

    .core-cn{
        font-size:15px;
        letter-spacing:.12em;
        margin-left:.12em;
    }

    .core-en{
        font-size:7px;
        letter-spacing:.12em;
        margin-left:.12em;
    }

    .light.fantasy{
        top:19%;
    }

    .light.yonder{
        left:17%;
    }

    .light.infinite{
        right:17%;
    }

    .light.life{
        bottom:20%;
    }

    .light-name{
        font-size:16px;
    }

    .light-meaning{
        font-size:9px;
    }

    .light-tags{
        font-size:6px;
        max-width:180px;
        white-space:normal;
        line-height:1.7;
    }

    .coming-panel{
        width:82vw;

        padding:
            46px
            24px
            42px;
    }

    .coming-world{
        font-size:21px;
    }

    .coming-meaning{
        font-size:10px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     PAGE 1
======================================================= -->

<section id="entrance">

    <div class="brand">

        <div class="logo">

            <img
                src="./logo1.png"
                alt="HYOOL"
            >

        </div>

    </div>


    <div class="slogan">

        <div class="line-one">
            自幻想，奔赴彼岸。
        </div>

        <div class="line-two">
            于无限，孕育生命。
        </div>

    </div>


    <div class="enter-area">

        <div class="enter-bg">
            进入幻灵
        </div>

        <div
            class="enter"
            id="enterButton"
        >
            ENTER HYOOL
        </div>

    </div>

</section>



<!-- =======================================================
     PAGE 2
======================================================= -->

<section id="world">


    <!-- VIDEO -->

    <video
        class="life-video"
        id="lifeVideo"
        src="./life.mp4"
        muted
        playsinline
        webkit-playsinline
        autoplay
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
    ></video>


    <div class="life-overlay"></div>

    <div class="life-vignette"></div>


    <!-- LOGO -->

    <div class="world-logo">

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </div>


    <!-- ===================================================
         FANTASY
    ==================================================== -->

    <div
        class="light fantasy"
        data-world="fantasy"
    >

        <div class="light-label">

            <div class="light-name">
                幻想
            </div>

            <div class="light-meaning">
                让想象成为作品。
            </div>

            <div class="light-tags">
                AI 图片 · 视频 · 音乐 · 故事 · 角色
            </div>

        </div>

    </div>


    <!-- ===================================================
         YONDER
    ==================================================== -->

    <div
        class="light yonder"
        data-world="yonder"
    >

        <div class="light-label">

            <div class="light-name">
                彼岸
            </div>

            <div class="light-meaning">
                让作品抵达彼岸。
            </div>

            <div class="light-tags">
                展示 · 分享 · 发现 · 个人空间 · 社区
            </div>

        </div>

    </div>


    <!-- ===================================================
         INFINITE
    ==================================================== -->

    <div
        class="light infinite"
        data-world="infinite"
    >

        <div class="light-label">

            <div class="light-name">
                无限
            </div>

            <div class="light-meaning">
                让创造拥有无限可能。
            </div>

            <div class="light-tags">
                AI 模型 · 工具 · 素材 · 工作流 · 实验
            </div>

        </div>

    </div>


    <!-- ===================================================
         LIFE
    ==================================================== -->

    <div
        class="light life"
        data-world="life"
    >

        <div class="light-label">

            <div class="light-name">
                生命
            </div>

            <div class="light-meaning">
                让创造拥有真正的存在。
            </div>

            <div class="light-tags">
                AI 角色 · 数字人格 · 智能体 · 虚拟生命
            </div>

        </div>

    </div>


    <!-- ===================================================
         CENTER
    ==================================================== -->

    <div class="core">

        <div class="core-cn">
            幻想 × 彼岸 × 无限 × 生命
        </div>

        <div class="core-en">
            Fantasy · Yonder · Infinite · Life
        </div>

    </div>


    <!-- ===================================================
         REALM
    ==================================================== -->

    <div class="realm">

        <div class="realm-title">
            HYOOL REALM
        </div>

    </div>


</section>



<!-- =======================================================
     COMING SOON MODAL
======================================================= -->

<div
    class="coming-soon"
    id="comingSoon"
>

    <div
        class="coming-panel"
        id="comingPanel"
    >

        <div
            class="coming-world"
            id="comingWorld"
        >
            幻想
        </div>

        <div
            class="coming-meaning"
            id="comingMeaning"
        >
            让想象成为作品。
        </div>

        <div class="coming-en">
            THE WORLD IS COMING
        </div>

        <div class="coming-line"></div>

        <div
            class="coming-close"
            id="comingClose"
        >
            CLOSE
        </div>

    </div>

</div>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const entrance =
    document.getElementById("entrance");

const world =
    document.getElementById("world");

const button =
    document.getElementById("enterButton");

const enterArea =
    document.querySelector(".enter-area");

const lifeVideo =
    document.getElementById("lifeVideo");

const lights =
    document.querySelectorAll(".light");


/* =========================================================
   COMING SOON ELEMENTS
========================================================= */

const comingSoon =
    document.getElementById("comingSoon");

const comingWorld =
    document.getElementById("comingWorld");

const comingMeaning =
    document.getElementById("comingMeaning");

const comingClose =
    document.getElementById("comingClose");


/* =========================================================
   WORLD INFORMATION
========================================================= */

const worldInfo = {

    fantasy:{
        name:"幻想",
        meaning:"让想象成为作品。"
    },

    infinite:{
        name:"无限",
        meaning:"让创造拥有无限可能。"
    },

    life:{
        name:"生命",
        meaning:"让创造拥有真正的存在。"
    }

};


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        entrance.classList.add("active");

    }
);


/* =========================================================
   ENTER HYOOL
========================================================= */

button.addEventListener(
    "click",
    () => {

        button.style.pointerEvents =
            "none";


        /* 第一页离开 */

        entrance.classList.add("exit");


        /* 第二页进入 */

        setTimeout(
            () => {

                world.classList.add("show");


                /* 从第一帧开始 */

                try{

                    lifeVideo.currentTime = 0;

                }catch(e){}


                /* 保证静音 */

                lifeVideo.muted = true;


                /* 自动播放 */

                const playPromise =
                    lifeVideo.play();


                if(
                    playPromise !== undefined
                ){

                    playPromise.catch(
                        () => {}
                    );

                }


                /*
                 * 约 3 秒后
                 * 四个星芒开始出现
                 */

                setTimeout(
                    () => {

                        world.classList.add(
                            "lights-active"
                        );

                    },
                    3000
                );


            },
            450
        );

    }
);


/* =========================================================
   ENTER MAGNETIC EFFECT
========================================================= */

enterArea.addEventListener(
    "mousemove",
    event => {

        const rect =
            enterArea.getBoundingClientRect();

        const centerX =
            rect.left +
            rect.width / 2;

        const centerY =
            rect.top +
            rect.height / 2;

        const x =
            event.clientX -
            centerX;

        const y =
            event.clientY -
            centerY;

        const moveX =
            Math.max(
                -6,
                Math.min(
                    6,
                    x * .08
                )
            );

        const moveY =
            Math.max(
                -4,
                Math.min(
                    4,
                    y * .08
                )
            );

        button.style.transform =
            `translate(${moveX}px,${moveY}px)`;

    }
);


/* =========================================================
   ENTER RESET
========================================================= */

enterArea.addEventListener(
    "mouseleave",
    () => {

        button.style.transform = "";

    }
);


/* =========================================================
   VIDEO END
========================================================= */

lifeVideo.addEventListener(
    "ended",
    () => {

        lifeVideo.pause();

    }
);


/* =========================================================
   OPEN COMING SOON
========================================================= */

function openComingSoon(worldName){

    const info =
        worldInfo[worldName];

    if(!info){
        return;
    }


    comingWorld.textContent =
        info.name;

    comingMeaning.textContent =
        info.meaning;


    comingSoon.classList.add("show");

}


/* =========================================================
   CLOSE COMING SOON
========================================================= */

function closeComingSoon(){

    comingSoon.classList.remove("show");

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

comingClose.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        closeComingSoon();

    }
);


/* =========================================================
   CLICK BACKGROUND TO CLOSE
========================================================= */

comingSoon.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            comingSoon
        ){

            closeComingSoon();

        }

    }
);


/* =========================================================
   ESC TO CLOSE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeComingSoon();

        }

    }
);


/* =========================================================
   FOUR WORLD ENTRANCES
========================================================= */

lights.forEach(
    light => {

        light.addEventListener(
            "click",
            event => {

                event.stopPropagation();


                const worldName =
                    light.dataset.world;


                /* =========================================
                   彼岸：正式进入
                ========================================= */

                if(
                    worldName === "yonder"
                ){

                    world.classList.add(
                        "entering-world"
                    );


                    setTimeout(
                        () => {

                            window.location.href =
                                "yonder.html";

                        },
                        650
                    );


                    return;

                }


                /* =========================================
                   幻想 / 无限 / 生命
                   暂未开放
                ========================================= */

                if(
                    worldName === "fantasy" ||
                    worldName === "infinite" ||
                    worldName === "life"
                ){

                    openComingSoon(
                        worldName
                    );

                }

            }
        );

    }
);

</script>

</body>
</html>
