<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#000000">

<title>HYOOL · 幻灵</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}


/* =========================================================
   PAGE 1
========================================================= */

#entrance {

    position: fixed;

    inset: 0;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #000;

    opacity: 1;

    transform: scale(1);

    transition:
        opacity 1.25s cubic-bezier(.77,0,.18,1),
        transform 1.5s cubic-bezier(.2,.8,.2,1);
}

#entrance.exit {

    opacity: 0;

    transform: scale(1.035);

    pointer-events: none;
}


/* =========================================================
   FIRST PAGE ATMOSPHERE
========================================================= */

#entrance::before {

    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 800px;
    max-height: 800px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.035) 0%,
            rgba(255,255,255,.012) 35%,
            transparent 72%
        );

    opacity: 0;

    transform: scale(.75);

    pointer-events: none;

    transition:
        opacity 1.5s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);
}

#entrance.active::before {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   BRAND
========================================================= */

.brand {

    position: relative;

    z-index: 2;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    user-select: none;
}


/* =========================================================
   LOGO
========================================================= */

.logo {

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    transform: translateY(24px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .2s forwards;
}

.logo img {

    display: block;

    width:
        clamp(
            260px,
            28vw,
            520px
        );

    height: auto;

    object-fit: contain;
}


/* =========================================================
   CHINESE NAME
========================================================= */

.chinese-name {

    margin-top: 24px;

    font-size:
        clamp(
            18px,
            2vw,
            28px
        );

    font-weight: 300;

    letter-spacing: .55em;

    margin-left: .55em;

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    opacity: 0;

    transform: translateY(16px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .45s forwards;
}


/* =========================================================
   SLOGAN
========================================================= */

.slogan {

    position: relative;

    z-index: 2;

    margin-top: 58px;

    text-align: center;

    opacity: 0;

    transform: translateY(18px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1)
        .75s forwards;
}

.slogan .line-one,
.slogan .line-two {

    font-size:
        clamp(
            17px,
            1.45vw,
            21px
        );

    font-weight: 300;

    letter-spacing: .14em;

    margin-left: .14em;

    line-height: 2;
}

.slogan .line-one {

    color:
        rgba(
            255,
            255,
            255,
            .82
        );
}

.slogan .line-two {

    color:
        rgba(
            255,
            255,
            255,
            .45
        );
}


/* =========================================================
   ENTER AREA
========================================================= */

.enter-area {

    position: relative;

    z-index: 5;

    margin-top: 72px;

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   ENTER BACKGROUND TEXT
========================================================= */

.enter-bg {

    position: absolute;

    white-space: nowrap;

    pointer-events: none;

    font-size:
        clamp(
            48px,
            8vw,
            110px
        );

    font-weight: 200;

    letter-spacing: .18em;

    margin-left: .18em;

    color:
        rgba(
            255,
            255,
            255,
            0
        );

    filter: blur(9px);

    transform: scale(.94);

    transition:
        color 1s ease,
        filter 1.2s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.enter-area:hover .enter-bg {

    color:
        rgba(
            255,
            255,
            255,
            .045
        );

    filter: blur(2px);

    transform: scale(1);
}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enter {

    position: relative;

    z-index: 2;

    padding: 18px 32px;

    cursor: pointer;

    user-select: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 14px;

    font-weight: 400;

    letter-spacing: .42em;

    margin-left: .42em;

    color:
        rgba(
            255,
            255,
            255,
            .7
        );

    transition:
        color .6s ease,
        letter-spacing .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter::before {

    content: "";

    position: absolute;

    inset: 0;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    opacity: 0;

    transform: scale(.92);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter:hover {

    color:
        rgba(
            255,
            255,
            255,
            .95
        );

    letter-spacing: .55em;
}

.enter:hover::before {

    opacity: 1;

    transform: scale(1);
}

.enter::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;
    height: 90px;

    transform:
        translate(-50%,-50%)
        scale(.6);

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.08),
            transparent 70%
        );

    opacity: 0;

    filter: blur(18px);

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);

    pointer-events: none;

    z-index: -1;
}

.enter:hover::after {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   PAGE 2
========================================================= */

#world {

    position: fixed;

    inset: 0;

    z-index: 20;

    width: 100%;
    height: 100%;

    background: #000;

    opacity: 0;

    visibility: hidden;

    transform: scale(1.04);

    pointer-events: none;

    overflow: hidden;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s linear 1.5s;
}

#world.show {

    opacity: 1;

    visibility: visible;

    transform: scale(1);

    pointer-events: auto;

    transition:
        opacity 1.5s cubic-bezier(.77,0,.18,1),
        transform 2s cubic-bezier(.2,.8,.2,1),
        visibility 0s;
}


/* =========================================================
   LIFE VIDEO
========================================================= */

.life-video {

    position: absolute;

    inset: -5%;

    width: 110%;
    height: 110%;

    display: block;

    object-fit: cover;

    object-position: center;

    border: none;

    outline: none;

    background: #000;

    opacity: 0;

    transform: scale(1.08);

    filter:
        brightness(.32)
        contrast(1.08)
        saturate(.65);

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

    transition:
        opacity 4s cubic-bezier(.2,.8,.2,1),
        transform 8s cubic-bezier(.2,.8,.2,1);
}

#world.show .life-video {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   VIDEO ATMOSPHERE
========================================================= */

.life-overlay {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 0%,
            rgba(0,0,0,.12) 35%,
            rgba(0,0,0,.48) 72%,
            rgba(0,0,0,.82) 100%
        );
}

.life-vignette {

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.72) 100%
        );
}


/* =========================================================
   SMALL LOGO
========================================================= */

.world-logo {

    position: absolute;

    left: 42px;

    top: 34px;

    z-index: 10;

    opacity: 0;

    transform: translateY(-10px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    transition-delay: 5.8s;
}

#world.show .world-logo {

    opacity: .7;

    transform: translateY(0);
}

.world-logo img {

    width: 90px;

    height: auto;

    display: block;
}


/* =========================================================
   CENTRAL PHRASE
========================================================= */

.core {

    position: absolute;

    left: 50%;

    top: 50%;

    z-index: 7;

    transform:
        translate(-50%,-50%)
        translateY(20px);

    width: max-content;

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay: 5.8s;
}

#world.show .core {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}

.core-cn {

    font-size:
        clamp(
            18px,
            2vw,
            28px
        );

    font-weight: 300;

    letter-spacing: .28em;

    margin-left: .28em;

    color:
        rgba(
            255,
            255,
            255,
            .9
        );
}

.core-en {

    margin-top: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            9px,
            .9vw,
            12px
        );

    font-weight: 300;

    letter-spacing: .3em;

    margin-left: .3em;

    color:
        rgba(
            255,
            255,
            255,
            .52
        );
}


/* =========================================================
   FOUR FLOATING LIGHTS
========================================================= */

.light {

    position: absolute;

    z-index: 9;

    width: 18px;

    height: 18px;

    border-radius: 50%;

    cursor: pointer;

    opacity: 0;

    transform: scale(.55);

    transition:
        opacity 1.8s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   LIGHT POSITIONS
========================================================= */

.light.fantasy {

    left: 50%;

    top: 20%;

    margin-left: -9px;

    margin-top: -9px;

    animation:
        floatFantasy 5.8s ease-in-out
        infinite;

    animation-delay: 3.3s;
}


.light.yonder {

    left: 24%;

    top: 50%;

    margin-left: -9px;

    margin-top: -9px;

    animation:
        floatYonder 7s ease-in-out
        infinite;

    animation-delay: 3.6s;
}


.light.infinite {

    right: 24%;

    top: 48%;

    margin-right: -9px;

    margin-top: -9px;

    animation:
        floatInfinite 6.5s ease-in-out
        infinite;

    animation-delay: 3.9s;
}


.light.life {

    left: 50%;

    bottom: 19%;

    margin-left: -9px;

    margin-bottom: -9px;

    animation:
        floatLife 5.2s ease-in-out
        infinite;

    animation-delay: 4.2s;
}


/* =========================================================
   LIGHT CORE
========================================================= */

.light::before {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    transform:
        translate(-50%,-50%);

    background:
        rgba(
            255,
            255,
            255,
            .82
        );

    box-shadow:
        0 0 8px
        rgba(255,255,255,.45),

        0 0 24px
        rgba(255,255,255,.16);

    transition:
        width .8s ease,
        height .8s ease,
        box-shadow 1s ease;
}


/* =========================================================
   LIGHT HALO
========================================================= */

.light::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 70px;

    height: 70px;

    border-radius: 50%;

    transform:
        translate(-50%,-50%)
        scale(.45);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.09) 0%,
            rgba(255,255,255,.025) 30%,
            transparent 72%
        );

    filter: blur(7px);

    opacity: .45;

    transition:
        transform 1.2s cubic-bezier(.2,.8,.2,1),
        opacity 1s ease;
}


/* =========================================================
   LIGHT REVEAL
========================================================= */

#world.lights-active .light {

    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   HOVER LIGHT
========================================================= */

.light:hover {

    z-index: 15;

    transform: scale(1.2);
}

.light:hover::before {

    width: 11px;

    height: 11px;

    box-shadow:
        0 0 12px
        rgba(255,255,255,.65),

        0 0 40px
        rgba(255,255,255,.28),

        0 0 80px
        rgba(255,255,255,.08);
}

.light:hover::after {

    transform:
        translate(-50%,-50%)
        scale(1.4);

    opacity: 1;
}


/* =========================================================
   LIGHT LABEL
========================================================= */

.light-label {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%)
        translateY(20px);

    white-space: nowrap;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity .8s ease,
        transform .9s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   LABEL TITLE
========================================================= */

.light-name {

    font-size: 18px;

    font-weight: 300;

    letter-spacing: .3em;

    margin-left: .3em;

    color:
        rgba(
            255,
            255,
            255,
            .92
        );

    text-align: center;
}


/* =========================================================
   LABEL MEANING
========================================================= */

.light-meaning {

    margin-top: 10px;

    font-size: 11px;

    font-weight: 300;

    letter-spacing: .1em;

    margin-left: .1em;

    color:
        rgba(
            255,
            255,
            255,
            .65
        );

    text-align: center;
}


/* =========================================================
   LABEL TAGS
========================================================= */

.light-tags {

    margin-top: 6px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 8px;

    letter-spacing: .1em;

    margin-left: .1em;

    color:
        rgba(
            255,
            255,
            255,
            .34
        );

    text-align: center;
}


/* =========================================================
   HOVER LABEL
========================================================= */

.light:hover .light-label {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        translateY(38px);
}


/* =========================================================
   FANTASY LABEL POSITION
========================================================= */

.light.fantasy .light-label {

    top: -4px;
}


/* =========================================================
   YONDER LABEL
========================================================= */

.light.yonder .light-label {

    left: 0;

    top: 50%;

    transform:
        translate(-100%,-50%)
        translateX(-18px);
}

.light.yonder:hover .light-label {

    transform:
        translate(-100%,-50%)
        translateX(-28px);
}


/* =========================================================
   INFINITE LABEL
========================================================= */

.light.infinite .light-label {

    left: 0;

    top: 50%;

    transform:
        translate(100%,-50%)
        translateX(18px);
}

.light.infinite:hover .light-label {

    transform:
        translate(100%,-50%)
        translateX(28px);
}


/* =========================================================
   LIFE LABEL
========================================================= */

.light.life .light-label {

    top: 4px;
}

.light.life:hover .light-label {

    transform:
        translate(-50%,-50%)
        translateY(-78px);
}


/* =========================================================
   LIFE LIGHT
========================================================= */

.light.life::before {

    animation:
        breathe 3.5s ease-in-out
        infinite;
}


/* =========================================================
   FLOAT ANIMATIONS
========================================================= */

@keyframes floatFantasy {

    0%,100% {
        margin-top: -9px;
    }

    50% {
        margin-top: -20px;
    }
}


@keyframes floatYonder {

    0%,100% {
        margin-left: -9px;
    }

    50% {
        margin-left: 6px;
    }
}


@keyframes floatInfinite {

    0%,100% {
        margin-right: -9px;
    }

    50% {
        margin-right: 8px;
    }
}


@keyframes floatLife {

    0%,100% {
        margin-bottom: -9px;
    }

    50% {
        margin-bottom: 6px;
    }
}


@keyframes breathe {

    0%,100% {

        width: 6px;
        height: 6px;

        box-shadow:
            0 0 8px
            rgba(255,255,255,.35);
    }

    50% {

        width: 10px;
        height: 10px;

        box-shadow:
            0 0 14px
            rgba(255,255,255,.55),

            0 0 38px
            rgba(255,255,255,.18);
    }
}


/* =========================================================
   CORE DIM WHEN LIGHT HOVER
========================================================= */

#world:has(.light:hover) .core {

    opacity: .35;
}


/* =========================================================
   REALM
========================================================= */

.realm {

    position: absolute;

    left: 50%;

    bottom: 3.8%;

    z-index: 9;

    transform:
        translateX(-50%)
        translateY(10px);

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition:
        opacity 2s ease,
        transform 2s cubic-bezier(.2,.8,.2,1);

    transition-delay: 5.9s;
}

#world.show .realm {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   REALM SEPARATOR
========================================================= */

.realm::before {

    content: "";

    display: block;

    width: 18px;

    height: 1px;

    margin: 0 auto 10px;

    background:
        rgba(
            255,
            255,
            255,
            .16
        );
}


/* =========================================================
   REALM TITLE
========================================================= */

.realm-title {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        clamp(
            8px,
            .8vw,
            11px
        );

    font-weight: 300;

    letter-spacing: .45em;

    margin-left: .45em;

    color:
        rgba(
            255,
            255,
            255,
            .3
        );
}


/* =========================================================
   PAGE TRANSITION WHEN ENTERING WORLD
========================================================= */

#world.entering-world::after {

    content: "";

    position: absolute;

    inset: 0;

    z-index: 100;

    background: #fff;

    opacity: 0;

    animation:
        worldFlash .9s ease
        forwards;

    pointer-events: none;
}


@keyframes worldFlash {

    0% {
        opacity: 0;
    }

    35% {
        opacity: .16;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   LOGO ANIMATION
========================================================= */

@keyframes logoIn {

    from {

        opacity: 0;

        transform:
            translateY(24px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {


    .logo img {

        width: 220px;
    }


    .chinese-name {

        margin-top: 20px;

        font-size: 18px;

        letter-spacing: .45em;

        margin-left: .45em;
    }


    .slogan {

        margin-top: 46px;
    }


    .slogan .line-one,
    .slogan .line-two {

        font-size: 14px;

        letter-spacing: .1em;

        margin-left: .1em;
    }


    .enter-area {

        margin-top: 60px;
    }


    .enter-bg {

        font-size: 54px;
    }


    .world-logo {

        left: 20px;

        top: 22px;
    }


    .world-logo img {

        width: 70px;
    }


    .core {

        width: 90vw;
    }


    .core-cn {

        font-size: 15px;

        letter-spacing: .12em;

        margin-left: .12em;
    }


    .core-en {

        font-size: 7px;

        letter-spacing: .12em;

        margin-left: .12em;
    }


    .light.fantasy {

        top: 19%;
    }


    .light.yonder {

        left: 17%;
    }


    .light.infinite {

        right: 17%;
    }


    .light.life {

        bottom: 20%;
    }


    .light-name {

        font-size: 16px;
    }


    .light-meaning {

        font-size: 9px;
    }


    .light-tags {

        font-size: 6px;

        max-width: 180px;

        white-space: normal;

        line-height: 1.7;
    }


    .light.yonder .light-label {

        left: 0;

        transform:
            translate(-100%,-50%)
            translateX(-12px);
    }


    .light.infinite .light-label {

        left: 0;

        transform:
            translate(100%,-50%)
            translateX(12px);
    }


    .realm {

        bottom: 4%;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        transition-duration: .01ms !important;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     PAGE 1
======================================================= -->

<section id="entrance">


    <div class="brand">


        <div class="logo">

            <img
                src="./logo1.png"
                alt="HYOOL"
            >

        </div>


    </div>


    <div class="slogan">


        <div class="line-one">

            自幻想，奔赴彼岸。

        </div>


        <div class="line-two">

            于无限，孕育生命。

        </div>


    </div>


    <div class="enter-area">


        <div class="enter-bg">

            进入幻灵

        </div>


        <div
            class="enter"
            id="enterButton"
        >

            ENTER HYOOL

        </div>


    </div>


</section>



<!-- =======================================================
     PAGE 2
======================================================= -->

<section id="world">


    <!-- LIFE VIDEO -->

    <video
        class="life-video"
        id="lifeVideo"
        src="./life.mp4"
        muted
        playsinline
        webkit-playsinline
        autoplay
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
    ></video>


    <div class="life-overlay"></div>

    <div class="life-vignette"></div>


    <!-- SMALL LOGO -->

    <div class="world-logo">

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </div>


    <!-- ===================================================
         FLOATING LIGHT — FANTASY
    ==================================================== -->

    <div
        class="light fantasy"
        data-world="fantasy"
    >

        <div class="light-label">

            <div class="light-name">

                幻想

            </div>

            <div class="light-meaning">

                让想象成为作品。

            </div>

            <div class="light-tags">

                AI 图片 · 视频 · 音乐 · 故事 · 角色

            </div>

        </div>

    </div>


    <!-- ===================================================
         FLOATING LIGHT — YONDER
    ==================================================== -->

    <div
        class="light yonder"
        data-world="yonder"
    >

        <div class="light-label">

            <div class="light-name">

                彼岸

            </div>

            <div class="light-meaning">

                让作品抵达彼岸。

            </div>

            <div class="light-tags">

                展示 · 分享 · 发现 · 个人空间 · 社区

            </div>

        </div>

    </div>


    <!-- ===================================================
         FLOATING LIGHT — INFINITE
    ==================================================== -->

    <div
        class="light infinite"
        data-world="infinite"
    >

        <div class="light-label">

            <div class="light-name">

                无限

            </div>

            <div class="light-meaning">

                让创造拥有无限可能。

            </div>

            <div class="light-tags">

                AI 模型 · 工具 · 素材 · 工作流 · 实验

            </div>

        </div>

    </div>


    <!-- ===================================================
         FLOATING LIGHT — LIFE
    ==================================================== -->

    <div
        class="light life"
        data-world="life"
    >

        <div class="light-label">

            <div class="light-name">

                生命

            </div>

            <div class="light-meaning">

                让创造拥有真正的存在。

            </div>

            <div class="light-tags">

                AI 角色 · 数字人格 · 智能体 · 虚拟生命

            </div>

        </div>

    </div>


    <!-- ===================================================
         CORE
    ==================================================== -->

    <div class="core">

        <div class="core-cn">

            幻想 × 彼岸 × 无限 × 生命

        </div>


        <div class="core-en">

            Fantasy · Yonder · Infinite · Life

        </div>

    </div>


    <!-- ===================================================
         REALM
    ==================================================== -->

    <div class="realm">

        <div class="realm-title">

            HYOOL REALM

        </div>

    </div>


</section>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const entrance =
    document.getElementById("entrance");

const world =
    document.getElementById("world");

const button =
    document.getElementById("enterButton");

const enterArea =
    document.querySelector(".enter-area");

const lifeVideo =
    document.getElementById("lifeVideo");

const lights =
    document.querySelectorAll(".light");


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        entrance.classList.add("active");

    }
);


/* =========================================================
   ENTER HYOOL
========================================================= */

button.addEventListener(
    "click",
    () => {


        button.style.pointerEvents =
            "none";


        /* PAGE 1 EXIT */

        entrance.classList.add("exit");


        /* PAGE 2 */

        setTimeout(
            () => {


                world.classList.add("show");


                /*
                 * Video always starts
                 * from the beginning.
                 */

                try {

                    lifeVideo.currentTime = 0;

                } catch (error) {

                    console.log(error);

                }


                lifeVideo.muted = true;


                /*
                 * Start video
                 */

                const playPromise =
                    lifeVideo.play();


                if (
                    playPromise !== undefined
                ) {

                    playPromise.catch(
                        error => {

                            console.log(
                                "Video playback blocked:",
                                error
                            );

                        }
                    );

                }


                /*
                 * IMPORTANT
                 *
                 * We do NOT wait for the
                 * 10 second video.
                 *
                 * At around 3 seconds,
                 * the four lights become
                 * available.
                 */

                setTimeout(
                    () => {

                        world.classList.add(
                            "lights-active"
                        );

                    },
                    3000
                );


            },
            450
        );

    }
);


/* =========================================================
   ENTER MAGNETIC EFFECT
========================================================= */

enterArea.addEventListener(
    "mousemove",
    event => {


        const rect =
            enterArea.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const x =
            event.clientX -
            centerX;


        const y =
            event.clientY -
            centerY;


        const moveX =
            Math.max(
                -6,
                Math.min(
                    6,
                    x * .08
                )
            );


        const moveY =
            Math.max(
                -4,
                Math.min(
                    4,
                    y * .08
                )
            );


        button.style.transform =
            `translate(
                ${moveX}px,
                ${moveY}px
            )`;

    }
);


/* =========================================================
   RESET ENTER
========================================================= */

enterArea.addEventListener(
    "mouseleave",
    () => {

        button.style.transform = "";

    }
);


/* =========================================================
   VIDEO END
========================================================= */

lifeVideo.addEventListener(
    "ended",
    () => {

        /*
         * Stop at final frame.
         */

        lifeVideo.pause();

    }
);


/* =========================================================
   LIGHT INTERACTION
========================================================= */

lights.forEach(
    light => {


        light.addEventListener(
            "mouseenter",
            () => {

                const worldName =
                    light.dataset.world;

                console.log(
                    "HYOOL WORLD:",
                    worldName
                );

            }
        );


        light.addEventListener(
            "click",
            () => {


                const worldName =
                    light.dataset.world;


                /*
                 * Temporary transition.
                 *
                 * Later:
                 *
                 * fantasy  -> fantasy.html
                 * yonder   -> yonder.html
                 * infinite -> infinite.html
                 * life     -> life.html
                 */


                world.classList.add(
                    "entering-world"
                );


                /*
                 * Give the flash
                 * animation time.
                 */

                setTimeout(
                    () => {


                        if (
                            worldName ===
                            "fantasy"
                        ) {

                            window.location.href =
                                "fantasy.html";

                        }


                        else if (
                            worldName ===
                            "yonder"
                        ) {

                            window.location.href =
                                "yonder.html";

                        }


                        else if (
                            worldName ===
                            "infinite"
                        ) {

                            window.location.href =
                                "infinite.html";

                        }


                        else if (
                            worldName ===
                            "life"
                        ) {

                            window.location.href =
                                "life.html";

                        }


                    },
                    650
                );

            }
        );

    }
);


/* =========================================================
   TOUCH SUPPORT
========================================================= */

lights.forEach(
    light => {

        light.addEventListener(
            "touchstart",
            () => {

                light.classList.add(
                    "touch-active"
                );

            },
            {
                passive: true
            }
        );

    }
);


/* =========================================================
   FUTURE AUDIO
========================================================= */

/*
 * Background music can be added later.
 *
 * DO NOT change the visual architecture.
 *
 * Example:
 *
 * const audio =
 *     new Audio("./ambient.mp3");
 *
 * audio.loop = true;
 * audio.volume = 0;
 *
 * audio.play();
 *
 * Then gradually increase:
 *
 * audio.volume += 0.01;
 *
 */


/* =========================================================
   FUTURE WORLD ROUTES
========================================================= */

/*
 *
 * fantasy.html
 * ----------------------------------
 * AI 图片 / 视频 / 音乐 / 故事 / 角色
 *
 *
 * yonder.html
 * ----------------------------------
 * 作品 / 分享 / 个人空间 / 社区
 *
 *
 * infinite.html
 * ----------------------------------
 * AI 模型 / 工具 / 素材 / 工作流 / 实验
 *
 *
 * life.html
 * ----------------------------------
 * AI 角色 / 数字人格 / 智能体 / 数字生命
 *
 */

</script>


</body>

</html>
