<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HYOOL — 幻灵 · 数字世界</title>

    <meta name="description" content="HYOOL — 幻灵 · 数字世界">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050507;
            color: #ffffff;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        /* 背景 */
        .background {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.055) 0%,
                    rgba(255, 255, 255, 0.018) 25%,
                    transparent 55%
                ),
                #050507;
        }

        /* 中央微光 */
        .light {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 320px;
            height: 320px;

            transform: translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.12) 0%,
                    rgba(255, 255, 255, 0.035) 30%,
                    transparent 70%
                );

            filter: blur(20px);

            opacity: 0;

            animation:
                lightAppear 2.2s ease forwards,
                lightBreath 5s ease-in-out 2.2s infinite;
        }

        /* 主内容 */
        .container {
            position: relative;

            z-index: 2;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 40px;
        }

        /* Logo */
        .logo {
            width: 600px;
            max-width: 78vw;
            height: auto;

            opacity: 0;

            transform:
                scale(0.88)
                translateY(15px);

            filter:
                brightness(0.75)
                drop-shadow(
                    0 0 0 rgba(255, 255, 255, 0)
                );

            animation:
                logoAppear 1.8s
                cubic-bezier(0.22, 1, 0.36, 1)
                0.35s
                forwards,

                logoBreath 5s
                ease-in-out
                2.2s
                infinite;
        }

        /* 副标题 */
        .subtitle {
            margin-top: 28px;

            font-size: 18px;

            letter-spacing: 8px;

            color: rgba(255, 255, 255, 0.58);

            opacity: 0;

            transform: translateY(12px);

            animation:
                subtitleAppear 1.5s
                ease
                1.4s
                forwards;
        }

        /* 进入 HYOOL */
        .enter {
            display: inline-block;

            margin-top: 28px;

            padding: 10px 22px;

            color: rgba(255, 255, 255, 0.65);

            font-size: 16px;

            letter-spacing: 4px;

            text-decoration: none;

            border: 1px solid rgba(255, 255, 255, 0.15);

            opacity: 0;

            transform: translateY(12px);

            animation:
                enterAppear 1.5s
                ease
                1.8s
                forwards;

            transition:
                color 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease,
                transform 0.3s ease;
        }

        /* 鼠标经过 */
        .enter:hover {
            color: #ffffff;

            border-color:
                rgba(255, 255, 255, 0.5);

            background:
                rgba(255, 255, 255, 0.05);

            transform:
                translateY(-2px);
        }

        /* Logo 出现 */
        @keyframes logoAppear {

            0% {
                opacity: 0;

                transform:
                    scale(0.88)
                    translateY(15px);

                filter:
                    brightness(0.5)
                    blur(8px);
            }

            60% {
                opacity: 1;

                filter:
                    brightness(1)
                    blur(0);
            }

            100% {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

                filter:
                    brightness(1)
                    drop-shadow(
                        0 0 18px
                        rgba(255, 255, 255, 0.08)
                    );
            }
        }

        /* Logo 呼吸 */
        @keyframes logoBreath {

            0%,
            100% {
                transform: scale(1);

                filter:
                    brightness(1)
                    drop-shadow(
                        0 0 14px
                        rgba(255, 255, 255, 0.06)
                    );
            }

            50% {
                transform: scale(1.025);

                filter:
                    brightness(1.05)
                    drop-shadow(
                        0 0 28px
                        rgba(255, 255, 255, 0.12)
                    );
            }
        }

        /* 微光出现 */
        @keyframes lightAppear {

            0% {
                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(0.6);
            }

            100% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }
        }

        /* 微光呼吸 */
        @keyframes lightBreath {

            0%,
            100% {
                opacity: 0.65;

                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                opacity: 1;

                transform:
                    translate(-50%, -50%)
                    scale(1.15);
            }
        }

        /* 副标题出现 */
        @keyframes subtitleAppear {

            0% {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* 进入按钮出现 */
        @keyframes enterAppear {

            0% {
                opacity: 0;

                transform:
                    translateY(12px);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* 手机端 */
        @media (max-width: 600px) {

            .logo {
                width: 300px;
                max-width: 82vw;
            }

            .subtitle {
                font-size: 14px;
                letter-spacing: 5px;
            }

            .enter {
                font-size: 14px;
                letter-spacing: 3px;
            }

            .light {
                width: 240px;
                height: 240px;
            }
        }

        /* 减少动画 */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class="light"></div>

    <main class="container">

        <img
            src="logo.png"
            alt="HYOOL"
            class="logo"
        >

        <div class="subtitle">
            幻灵 · 数字世界
        </div>

        <a
            href="home.html"
            class="enter"
        >
            进入 HYOOL
        </a>

    </main>

</body>
</html>
