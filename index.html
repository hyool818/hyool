<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#000000"
>

<title>HYOOL · 幻灵</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;

}


/* =========================================================
   PAGE 1
========================================================= */

#entrance {

    position: fixed;

    inset: 0;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background: #000;

    opacity: 1;

    transform: scale(1);

    transition:

        opacity 1.25s
        cubic-bezier(.77,0,.18,1),

        transform 1.5s
        cubic-bezier(.2,.8,.2,1);

}


#entrance.exit {

    opacity: 0;

    transform: scale(1.035);

    pointer-events: none;

}


/* =========================================================
   FIRST PAGE ATMOSPHERE
========================================================= */

#entrance::before {

    content: "";

    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 800px;
    max-height: 800px;

    border-radius: 50%;

    background:

        radial-gradient(

            circle,

            rgba(255,255,255,.035) 0%,

            rgba(255,255,255,.012) 35%,

            transparent 72%

        );

    opacity: 0;

    transform: scale(.75);

    pointer-events: none;

    transition:

        opacity 1.5s ease,

        transform 2s
        cubic-bezier(.2,.8,.2,1);

}


#entrance.active::before {

    opacity: 1;

    transform: scale(1);

}


/* =========================================================
   BRAND
========================================================= */

.brand {

    position: relative;

    z-index: 2;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-align: center;

    user-select: none;

}


/* =========================================================
   LOGO
========================================================= */

.logo {

    display: flex;

    align-items: center;

    justify-content: center;

    opacity: 0;

    transform: translateY(24px);

    animation:

        logoIn 1.5s
        cubic-bezier(.2,.8,.2,1)
        .2s
        forwards;

}


.logo img {

    display: block;

    width:

        clamp(

            260px,

            28vw,

            520px

        );

    height: auto;

    object-fit: contain;

}


/* =========================================================
   CHINESE NAME
========================================================= */

.chinese-name {

    margin-top: 24px;

    font-size:

        clamp(

            18px,

            2vw,

            28px

        );

    font-weight: 300;

    letter-spacing: .55em;

    margin-left: .55em;

    color:

        rgba(

            255,
            255,
            255,
            .72

        );

    opacity: 0;

    transform: translateY(16px);

    animation:

        logoIn 1.5s
        cubic-bezier(.2,.8,.2,1)
        .45s
        forwards;

}


/* =========================================================
   SLOGAN
========================================================= */

.slogan {

    position: relative;

    z-index: 2;

    margin-top: 58px;

    text-align: center;

    opacity: 0;

    transform: translateY(18px);

    animation:

        logoIn 1.5s
        cubic-bezier(.2,.8,.2,1)
        .75s
        forwards;

}


.slogan .line-one,
.slogan .line-two {

    font-size:

        clamp(

            15px,
            1.45vw,
            20px

        );

    font-weight: 300;

    letter-spacing: .18em;

    margin-left: .18em;

    line-height: 2;

}


.slogan .line-one {

    color:

        rgba(

            255,
            255,
            255,
            .82

        );

}


.slogan .line-two {

    color:

        rgba(

            255,
            255,
            255,
            .45

        );

}


/* =========================================================
   ENTER AREA
========================================================= */

.enter-area {

    position: relative;

    z-index: 5;

    margin-top: 72px;

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   BACKGROUND CHINESE
========================================================= */

.enter-bg {

    position: absolute;

    white-space: nowrap;

    pointer-events: none;

    font-size:

        clamp(

            48px,
            8vw,
            110px

        );

    font-weight: 200;

    letter-spacing: .18em;

    margin-left: .18em;

    color:

        rgba(

            255,
            255,
            255,
            0

        );

    filter: blur(9px);

    transform: scale(.94);

    transition:

        color 1s ease,

        filter 1.2s ease,

        transform 1.2s
        cubic-bezier(.2,.8,.2,1);

}


.enter-area:hover .enter-bg {

    color:

        rgba(

            255,
            255,
            255,
            .045

        );

    filter: blur(2px);

    transform: scale(1);

}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enter {

    position: relative;

    z-index: 2;

    padding: 18px 32px;

    cursor: pointer;

    user-select: none;

    font-family:

        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;

    font-weight: 400;

    letter-spacing: .35em;

    margin-left: .35em;

    color:

        rgba(

            255,
            255,
            255,
            .7

        );

    transition:

        color .6s ease,

        letter-spacing .8s
        cubic-bezier(.2,.8,.2,1),

        transform .8s
        cubic-bezier(.2,.8,.2,1);

}


.enter::before {

    content: "";

    position: absolute;

    inset: 0;

    border:

        1px solid
        rgba(
            255,
            255,
            255,
            .08
        );

    opacity: 0;

    transform: scale(.92);

    transition:

        opacity .6s ease,

        transform .8s
        cubic-bezier(.2,.8,.2,1);

}


.enter:hover {

    color:

        rgba(

            255,
            255,
            255,
            .95

        );

    letter-spacing: .48em;

}


.enter:hover::before {

    opacity: 1;

    transform: scale(1);

}


/* =========================================================
   ENTER GLOW
========================================================= */

.enter::after {

    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 180px;
    height: 90px;

    transform:

        translate(-50%,-50%)
        scale(.6);

    background:

        radial-gradient(

            ellipse,

            rgba(255,255,255,.08),

            transparent 70%

        );

    opacity: 0;

    filter: blur(18px);

    transition:

        opacity .8s ease,

        transform 1s
        cubic-bezier(.2,.8,.2,1);

    pointer-events: none;

    z-index: -1;

}


.enter:hover::after {

    opacity: 1;

    transform:

        translate(-50%,-50%)
        scale(1);

}


/* =========================================================
   PAGE 2
========================================================= */

#world {

    position: fixed;

    inset: 0;

    z-index: 20;

    width: 100%;
    height: 100%;

    background: #000;

    opacity: 0;

    visibility: hidden;

    transform: scale(1.04);

    pointer-events: none;

    overflow: hidden;

    transition:

        opacity 1.5s
        cubic-bezier(.77,0,.18,1),

        transform 2s
        cubic-bezier(.2,.8,.2,1),

        visibility 0s linear 1.5s;

}


#world.show {

    opacity: 1;

    visibility: visible;

    transform: scale(1);

    pointer-events: auto;

    transition:

        opacity 1.5s
        cubic-bezier(.77,0,.18,1),

        transform 2s
        cubic-bezier(.2,.8,.2,1),

        visibility 0s;

}


/* =========================================================
   LIFE VIDEO
   视频是“空间”，不是播放器
========================================================= */

.life-video {

    position: absolute;

    inset: -5%;

    width: 110%;
    height: 110%;

    display: block;

    object-fit: cover;

    object-position: center;

    border: none;

    outline: none;

    background: #000;

    opacity: 0;

    transform: scale(1.08);

    filter:

        brightness(.32)

        contrast(1.08)

        saturate(.65);

    pointer-events: none;

    user-select: none;

    -webkit-user-select: none;

    transition:

        opacity 4s
        cubic-bezier(.2,.8,.2,1),

        transform 8s
        cubic-bezier(.2,.8,.2,1);

}


/* 视频出现 */

#world.show .life-video {

    opacity: 1;

    transform: scale(1);

}


/* =========================================================
   LIFE OVERLAY
========================================================= */

.life-overlay {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        radial-gradient(

            ellipse at center,

            rgba(0,0,0,0) 0%,

            rgba(0,0,0,.12) 35%,

            rgba(0,0,0,.48) 72%,

            rgba(0,0,0,.82) 100%

        );

}


/* =========================================================
   VIGNETTE
========================================================= */

.life-vignette {

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:

        radial-gradient(

            ellipse at center,

            transparent 20%,

            rgba(0,0,0,.25) 55%,

            rgba(0,0,0,.72) 100%

        );

}


/* =========================================================
   WORLD LOGO
========================================================= */

.world-logo {

    position: absolute;

    left: 42px;

    top: 34px;

    z-index: 7;

    opacity: 0;

    transform: translateY(-10px);

    transition:

        opacity 1.5s ease,

        transform 1.5s ease;

    transition-delay: 5.8s;

}


#world.show .world-logo {

    opacity: .7;

    transform: translateY(0);

}


.world-logo img {

    width: 90px;

    height: auto;

    display: block;

}


/* =========================================================
   LIFE COPY
========================================================= */

.life-copy {

    position: absolute;

    left: 50%;

    top: 50%;

    z-index: 5;

    transform:

        translate(-50%,-50%)
        translateY(25px);

    text-align: center;

    white-space: nowrap;

    opacity: 0;

    transition:

        opacity 2s ease,

        transform 2s
        cubic-bezier(.2,.8,.2,1);

    transition-delay: 8.3s;

}


#world.show .life-copy {

    opacity: 1;

    transform:

        translate(-50%,-50%)
        translateY(0);

}


/* =========================================================
   CHINESE LIFE TEXT
========================================================= */

.life-copy .cn {

    font-size:

        clamp(

            18px,
            2vw,
            28px

        );

    font-weight: 300;

    letter-spacing: .28em;

    margin-left: .28em;

    color:

        rgba(

            255,
            255,
            255,
            .9

        );

}


/* =========================================================
   ENGLISH LIFE TEXT
========================================================= */

.life-copy .en {

    margin-top: 20px;

    font-family:

        Arial,
        Helvetica,
        sans-serif;

    font-size:

        clamp(

            9px,
            .9vw,
            12px

        );

    font-weight: 300;

    letter-spacing: .3em;

    margin-left: .3em;

    color:

        rgba(

            255,
            255,
            255,
            .52

        );

}


/* =========================================================
   NAVIGATION
========================================================= */

.main-nav {

    position: absolute;

    left: 50%;

    bottom: 7%;

    z-index: 6;

    transform:

        translateX(-50%)
        translateY(15px);

    display: flex;

    align-items: center;

    gap:

        clamp(

            28px,
            5vw,
            80px

        );

    opacity: 0;

    transition:

        opacity 1.5s ease,

        transform 1.5s
        cubic-bezier(.2,.8,.2,1);

    transition-delay: 9s;

}


#world.show .main-nav {

    opacity: 1;

    transform:

        translateX(-50%)
        translateY(0);

}


/* =========================================================
   NAV ITEM
========================================================= */

.nav-item {

    position: relative;

    color:

        rgba(

            255,
            255,
            255,
            .6

        );

    text-decoration: none;

    font-family:

        Arial,
        Helvetica,
        sans-serif;

    font-size: 11px;

    font-weight: 400;

    letter-spacing: .28em;

    margin-left: .28em;

    cursor: pointer;

    transition:

        color .5s ease,

        letter-spacing .6s ease;

}


.nav-item::after {

    content: "";

    position: absolute;

    left: 50%;

    bottom: -8px;

    width: 0;

    height: 1px;

    background:

        rgba(

            255,
            255,
            255,
            .7

        );

    transform: translateX(-50%);

    transition:

        width .6s
        cubic-bezier(.2,.8,.2,1);

}


.nav-item:hover {

    color:

        rgba(

            255,
            255,
            255,
            1

        );

    letter-spacing: .38em;

}


.nav-item:hover::after {

    width: 100%;

}


/* =========================================================
   ANIMATION
========================================================= */

@keyframes logoIn {

    from {

        opacity: 0;

        transform:
            translateY(24px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {


    .logo img {

        width: 220px;

    }


    .chinese-name {

        margin-top: 20px;

        font-size: 18px;

        letter-spacing: .45em;

        margin-left: .45em;

    }


    .slogan {

        margin-top: 46px;

    }


    .slogan .line-one,
    .slogan .line-two {

        font-size: 14px;

        letter-spacing: .12em;

        margin-left: .12em;

    }


    .enter-area {

        margin-top: 60px;

    }


    .enter-bg {

        font-size: 54px;

    }


    .life-copy .cn {

        font-size: 17px;

        letter-spacing: .18em;

        margin-left: .18em;

    }


    .life-copy .en {

        font-size: 8px;

        letter-spacing: .2em;

        margin-left: .2em;

    }


    .main-nav {

        bottom: 6%;

        gap: 24px;

    }


    .nav-item {

        font-size: 9px;

        letter-spacing: .18em;

        margin-left: .18em;

    }


    .world-logo {

        left: 20px;

        top: 22px;

    }


    .world-logo img {

        width: 70px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    * {

        animation-duration: .01ms !important;

        transition-duration: .01ms !important;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     PAGE 1
======================================================= -->

<section id="entrance">


    <div class="brand">


        <div class="logo">

            <img
                src="./logo1.png"
                alt="HYOOL"
            >

        </div>


    </div>


    <div class="slogan">

        <div class="line-one">

            自幻想，奔赴彼岸。

        </div>


        <div class="line-two">

            于无限，孕育生命。

        </div>

    </div>


    <div class="enter-area">


        <div class="enter-bg">

            进入幻灵

        </div>


        <div
            class="enter"
            id="enterButton"
        >

            ENTER HYOOL

        </div>


    </div>


</section>



<!-- =======================================================
     PAGE 2
======================================================= -->

<section id="world">


    <!-- ===================================================
         LIFE VIDEO
         注意：这里绝对不要加入 controls
    ==================================================== -->

    <video
        class="life-video"
        id="lifeVideo"
        src="./life.mp4"
        muted
        playsinline
        webkit-playsinline
        autoplay
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
    ></video>


    <!-- ===================================================
         ATMOSPHERE
    ==================================================== -->

    <div class="life-overlay"></div>

    <div class="life-vignette"></div>


    <!-- ===================================================
         WORLD LOGO
    ==================================================== -->

    <div class="world-logo">

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </div>


    <!-- ===================================================
         CORE MESSAGE
    ==================================================== -->

    <div class="life-copy">


        <div class="cn">

            幻想 × 彼岸 × 无限 × 生命

        </div>


        <div class="en">

            Fantasy · Yonder · Infinite · Life

        </div>


    </div>


    <!-- ===================================================
         NAVIGATION
    ==================================================== -->

    <nav class="main-nav">


        <div
            class="nav-item"
            data-page="create"
        >

            CREATE

        </div>


        <div
            class="nav-item"
            data-page="explore"
        >

            EXPLORE

        </div>


        <div
            class="nav-item"
            data-page="life"
        >

            LIFE

        </div>


    </nav>


</section>



<script>

/* =========================================================
   ELEMENTS
========================================================= */

const entrance =
    document.getElementById("entrance");

const world =
    document.getElementById("world");

const button =
    document.getElementById("enterButton");

const enterArea =
    document.querySelector(".enter-area");

const lifeVideo =
    document.getElementById("lifeVideo");


/* =========================================================
   PAGE LOAD
========================================================= */

window.addEventListener(
    "load",
    () => {

        entrance.classList.add("active");

    }
);


/* =========================================================
   ENTER HYOOL
========================================================= */

button.addEventListener(
    "click",
    () => {


        /*
           防止重复点击
        */

        button.style.pointerEvents =
            "none";


        /*
           第一页退出
        */

        entrance.classList.add("exit");


        /*
           第二页进入
        */

        setTimeout(
            () => {


                world.classList.add("show");


                /*
                   从第一帧开始
                */

                try {

                    lifeVideo.currentTime = 0;

                }

                catch (error) {

                    console.log(error);

                }


                /*
                   确保视频处于静音状态

                   浏览器允许静音自动播放。
                */

                lifeVideo.muted = true;

                lifeVideo.setAttribute(
                    "muted",
                    ""
                );


                /*
                   开始播放
                */

                const playPromise =
                    lifeVideo.play();


                if (
                    playPromise !== undefined
                ) {

                    playPromise.catch(
                        (error) => {

                            console.log(
                                "Video autoplay blocked:",
                                error
                            );

                        }
                    );

                }

            },
            450
        );

    }
);


/* =========================================================
   ENTER MAGNETIC EFFECT
========================================================= */

enterArea.addEventListener(
    "mousemove",
    (event) => {


        const rect =
            enterArea.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const x =
            event.clientX -
            centerX;


        const y =
            event.clientY -
            centerY;


        const moveX =
            Math.max(
                -6,
                Math.min(
                    6,
                    x * .08
                )
            );


        const moveY =
            Math.max(
                -4,
                Math.min(
                    4,
                    y * .08
                )
            );


        button.style.transform =

            `translate(
                ${moveX}px,
                ${moveY}px
            )`;

    }
);


/* =========================================================
   RESET ENTER BUTTON
========================================================= */

enterArea.addEventListener(
    "mouseleave",
    () => {

        button.style.transform = "";

    }
);


/* =========================================================
   VIDEO END
========================================================= */

/*
   不循环。

   视频播放结束后停在最后一帧，
   让用户看到已经“苏醒”的生命世界。
*/

lifeVideo.addEventListener(
    "ended",
    () => {

        lifeVideo.pause();

    }
);


/* =========================================================
   NAVIGATION
========================================================= */

document
    .querySelectorAll(".nav-item")
    .forEach(
        (item) => {


            item.addEventListener(
                "click",
                () => {


                    const page =
                        item.dataset.page;


                    console.log(
                        "HYOOL:",
                        page
                    );


                    /*
                       后续接入真正页面：

                       CREATE
                       EXPLORE
                       LIFE
                    */

                }
            );

        }
    );


/* =========================================================
   MOBILE TOUCH
========================================================= */

button.addEventListener(
    "touchstart",
    () => {

        button.style.color =
            "rgba(255,255,255,.95)";

    }
);

</script>


</body>

</html>
