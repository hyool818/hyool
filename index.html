<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HYOOL · 幻灵</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
}

/* =========================
   第一页：黑色入口
========================= */

#entrance {
    position: fixed;
    inset: 0;
    z-index: 10;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #000;

    transition:
        opacity 1.2s cubic-bezier(.77, 0, .18, 1),
        transform 1.2s cubic-bezier(.77, 0, .18, 1);
}

/* 极淡的环境光 */

#entrance::before {
    content: "";
    position: absolute;
    width: 55vw;
    height: 55vw;
    max-width: 700px;
    max-height: 700px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(255,255,255,0.035) 0%,
        rgba(255,255,255,0.012) 35%,
        transparent 70%
    );

    opacity: 0;
    transform: scale(.7);

    transition:
        opacity 1.2s ease,
        transform 1.5s cubic-bezier(.2,.8,.2,1);

    pointer-events: none;
}

#entrance.active::before {
    opacity: 1;
    transform: scale(1);
}

/* =========================
   Logo
========================= */

.brand {
    position: relative;
    z-index: 2;

    text-align: center;

    user-select: none;
}

.logo {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: clamp(52px, 8vw, 110px);

    font-weight: 300;

    letter-spacing:
        clamp(10px, 1.4vw, 22px);

    margin-left:
        clamp(10px, 1.4vw, 22px);

    line-height: 1;

    opacity: 0;

    transform: translateY(20px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1) .25s forwards;
}

.chinese-name {
    margin-top: 24px;

    font-size: clamp(18px, 2vw, 28px);

    font-weight: 300;

    letter-spacing: .55em;

    margin-left: .55em;

    color: rgba(255,255,255,.72);

    opacity: 0;

    transform: translateY(15px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1) .55s forwards;
}

/* =========================
   文案
========================= */

.slogan {
    position: relative;
    z-index: 2;

    margin-top: 58px;

    text-align: center;

    opacity: 0;

    transform: translateY(18px);

    animation:
        logoIn 1.5s cubic-bezier(.2,.8,.2,1) .85s forwards;
}

.slogan .cn {
    font-size: clamp(15px, 1.45vw, 20px);

    font-weight: 300;

    letter-spacing: .18em;

    margin-left: .18em;

    color: rgba(255,255,255,.78);

    line-height: 2;
}

.slogan .cn + .cn {
    color: rgba(255,255,255,.45);
}

/* =========================
   进入按钮区域
========================= */

.enter-area {
    position: relative;
    z-index: 5;

    margin-top: 72px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* 汉字背景 */

.enter-bg {
    position: absolute;

    white-space: nowrap;

    font-size: clamp(46px, 8vw, 110px);

    font-weight: 200;

    letter-spacing: .18em;

    color: rgba(255,255,255,0);

    filter: blur(8px);

    transform: scale(.95);

    pointer-events: none;

    transition:
        color 1s ease,
        filter 1.2s ease,
        transform 1.2s cubic-bezier(.2,.8,.2,1);
}

.enter-area:hover .enter-bg {
    color: rgba(255,255,255,.045);

    filter: blur(2px);

    transform: scale(1);
}

/* =========================
   ENTER HYOOL
========================= */

.enter {
    position: relative;

    padding: 18px 32px;

    cursor: pointer;

    user-select: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;

    font-weight: 400;

    letter-spacing: .35em;

    margin-left: .35em;

    color: rgba(255,255,255,.7);

    transition:
        color .6s ease,
        letter-spacing .8s cubic-bezier(.2,.8,.2,1),
        transform .8s cubic-bezier(.2,.8,.2,1);
}

/* 按钮微弱边界 */

.enter::before {
    content: "";

    position: absolute;
    inset: 0;

    border: 1px solid rgba(255,255,255,.08);

    opacity: 0;

    transform: scale(.92);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.enter:hover {
    color: rgba(255,255,255,.95);

    letter-spacing: .48em;

    transform: translateY(-2px);
}

.enter:hover::before {
    opacity: 1;

    transform: scale(1);
}

/* 微弱光晕 */

.enter::after {
    content: "";

    position: absolute;

    left: 50%;
    top: 50%;

    width: 160px;
    height: 80px;

    transform:
        translate(-50%, -50%)
        scale(.6);

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.08),
            transparent 70%
        );

    opacity: 0;

    filter: blur(15px);

    transition:
        opacity .8s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);

    pointer-events: none;

    z-index: -1;
}

.enter:hover::after {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

/* =========================
   点击进入
========================= */

#entrance.exit {
    opacity: 0;

    transform: scale(1.04);

    pointer-events: none;
}

/* =========================
   第二页
========================= */

#world {
    position: fixed;
    inset: 0;

    z-index: 1;

    background: #000;

    opacity: 0;

    transform: scale(1.04);

    pointer-events: none;

    transition:
        opacity 1.4s cubic-bezier(.77,0,.18,1),
        transform 1.5s cubic-bezier(.2,.8,.2,1);
}

#world.active {
    opacity: 1;

    transform: scale(1);

    pointer-events: auto;
}

/* 第二页占位 */

.world-content {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.5);

    font-size: 14px;

    letter-spacing: .3em;
}

/* =========================
   动画
========================= */

@keyframes logoIn {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

/* =========================
   手机端
========================= */

@media (max-width: 600px) {

    .logo {
        font-size: 54px;

        letter-spacing: 9px;

        margin-left: 9px;
    }

    .chinese-name {
        margin-top: 20px;

        font-size: 18px;

        letter-spacing: .45em;

        margin-left: .45em;
    }

    .slogan {
        margin-top: 48px;
    }

    .slogan .cn {
        font-size: 14px;

        letter-spacing: .12em;

        margin-left: .12em;
    }

    .enter-area {
        margin-top: 62px;
    }

    .enter-bg {
        font-size: 54px;
    }

}
</style>
</head>

<body>

<!-- =========================
     第一页
========================= -->

<section id="entrance">

    <div class="brand">

        <div class="logo">
            HYOOL
        </div>

        <div class="chinese-name">
            幻灵
        </div>

    </div>


    <div class="slogan">

        <div class="cn">
            自幻想，奔赴彼岸。
        </div>

        <div class="cn">
            于无限之中，孕育数字生命。
        </div>

    </div>


    <div class="enter-area">

        <!-- 鼠标靠近时出现 -->

        <div class="enter-bg">
            进入幻灵
        </div>


        <div
            class="enter"
            id="enterButton"
        >
            ENTER HYOOL
        </div>

    </div>

</section>


<!-- =========================
     第二页
========================= -->

<section id="world">

    <div class="world-content">
        LIFE IS BEGINNING
    </div>

</section>


<script>

/* =========================
   第一页启动
========================= */

window.addEventListener("load", () => {

    document
        .getElementById("entrance")
        .classList
        .add("active");

});


/* =========================
   ENTER HYOOL
========================= */

const entrance =
    document.getElementById("entrance");

const world =
    document.getElementById("world");

const button =
    document.getElementById("enterButton");


button.addEventListener("click", () => {

    /*
       第一页开始退出
    */

    entrance.classList.add("exit");


    /*
       稍微延迟，让黑场完成
    */

    setTimeout(() => {

        world.classList.add("active");

    }, 500);

});


/* =========================
   鼠标磁吸
========================= */

const enterArea =
    document.querySelector(".enter-area");

enterArea.addEventListener(
    "mousemove",
    (event) => {

        const rect =
            enterArea.getBoundingClientRect();

        const x =
            event.clientX -
            (rect.left + rect.width / 2);

        const y =
            event.clientY -
            (rect.top + rect.height / 2);

        const moveX =
            Math.max(
                -6,
                Math.min(6, x * 0.08)
            );

        const moveY =
            Math.max(
                -4,
                Math.min(4, y * 0.08)
            );

        button.style.transform =
            `translate(${moveX}px, ${moveY}px)`;

    }
);


enterArea.addEventListener(
    "mouseleave",
    () => {

        button.style.transform =
            "";

    }
);


/* =========================
   手机端点击
========================= */

button.addEventListener(
    "touchstart",
    () => {

        button.style.color =
            "rgba(255,255,255,.95)";

    }
);

</script>

</body>
</html>
