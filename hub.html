<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 数字生命库</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed; min-height: 100vh; overflow-x: hidden; line-height: 1.7;
}
a { color: inherit; text-decoration: none; }

.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 72px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 28px;
  background: linear-gradient(to bottom, rgba(5,5,8,.52), transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .12em; font-size: 15px; }
.header .logo img { height: 30px; width: auto; }
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 9px 14px; border-radius: 999px; font-size: 13px; cursor: pointer;
  transition: background .2s, color .2s, transform .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); transform: translateY(-1px); }
.header-link.accent { background: var(--accent); color: #0a0a12; font-weight: 600; }
.header-link.accent:hover { opacity: .88; }

.page { max-width: 1100px; margin: 0 auto; padding: 110px 24px 100px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
.page-head h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -.02em; }
.page-head p { color: var(--muted); font-size: .9rem; margin-top: .3rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.2rem; }

.card {
  border: 1px solid var(--glass-border); background: rgba(255,255,255,.05);
  border-radius: 18px; overflow: hidden; cursor: pointer;
  transition: transform .25s, background .25s, border .25s;
  backdrop-filter: blur(18px); display: flex; flex-direction: column;
  position: relative;
}
@media (hover: hover) { .card:hover { transform: translateY(-4px); background: rgba(255,255,255,.08); border-color: rgba(139,139,255,.3); } }
.card .thumb { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #0c0d14; display: block; }
.card .body { padding: 1rem 1.1rem 1.2rem; flex: 1; display: flex; flex-direction: column; }
.card .name { font-size: 1.05rem; font-weight: 700; margin-bottom: .15rem; }
.card .world { font-size: .74rem; color: var(--accent); margin-bottom: .5rem; }
.card .hook { font-size: .82rem; color: rgba(255,255,255,.6); line-height: 1.55; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { font-size: .7rem; color: var(--muted); margin-top: .8rem; display: flex; justify-content: space-between; align-items: center; }

/* Card action buttons */
.card-actions {
  position: absolute; top: 10px; right: 10px; display: flex; gap: 6px;
  opacity: 0; transition: opacity .2s; z-index: 5;
}
.card:hover .card-actions { opacity: 1; }
@media (hover: none) { .card-actions { opacity: 1; } }
.card-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: all .2s;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.card-btn.edit { background: rgba(255,255,255,.15); color: rgba(255,255,255,.9); }
.card-btn.edit:hover { background: rgba(139,139,255,.4); color: #fff; }
.card-btn.del { background: rgba(255,80,80,.2); color: rgba(255,160,160,.9); }
.card-btn.del:hover { background: rgba(255,80,80,.45); color: #fff; }

.empty {
  padding: 80px 20px; text-align: center; border: 1px dashed rgba(255,255,255,.10);
  border-radius: 20px; color: rgba(255,255,255,.32); font-size: 14px;
}
.empty .big { font-size: 2.4rem; margin-bottom: .8rem; opacity: .5; }
.empty .go {
  margin-top: 1.4rem; display: inline-block; border: 0; border-radius: 12px;
  padding: 12px 26px; background: var(--accent); color: #0a0a12; font-weight: 700;
  cursor: pointer; transition: opacity .2s, transform .2s;
}
.empty .go:hover { opacity: .88; transform: translateY(-1px); }

.loading-screen { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.spinner { width: 26px; height: 26px; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Edit modal */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s linear .3s;
}
.modal-overlay.show { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
.modal {
  width: min(520px, 90vw); max-height: 85vh; overflow-y: auto;
  background: linear-gradient(135deg, #161722, #0c0d14);
  border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 28px 24px; transform: translateY(16px) scale(.97); opacity: 0;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .3s;
}
.modal-overlay.show .modal { transform: translateY(0) scale(1); opacity: 1; }
.modal h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 1.2rem; }
.modal .field-group { margin-bottom: 1rem; }
.modal .field-group label { display: block; font-size: .74rem; color: var(--muted); margin-bottom: .35rem; }
.modal .field-group input, .modal .field-group textarea {
  width: 100%; border: 1px solid rgba(255,255,255,.10); border-radius: 10px;
  padding: 10px 14px; background: rgba(255,255,255,.05); color: #fff;
  outline: none; font: inherit; font-size: .88rem; transition: border .3s;
}
.modal .field-group input:focus, .modal .field-group textarea:focus { border-color: var(--accent); }
.modal .field-group textarea { min-height: 70px; resize: vertical; line-height: 1.6; }
.modal-actions { display: flex; gap: .8rem; margin-top: 1.4rem; }
.modal-actions .btn {
  flex: 1; border: 0; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer;
  font-weight: 600; transition: opacity .2s, transform .2s;
}
.modal-actions .btn-save { background: var(--accent); color: #0a0a12; }
.modal-actions .btn-save:hover { opacity: .88; transform: translateY(-1px); }
.modal-actions .btn-save:disabled { opacity: .4; cursor: wait; }
.modal-actions .btn-cancel { background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.1); }
.modal-actions .btn-cancel:hover { background: rgba(255,255,255,.14); color: #fff; }

/* Delete confirm */
.confirm-text { font-size: .92rem; color: rgba(255,255,255,.8); line-height: 1.6; text-align: center; }
.confirm-name { color: var(--accent); font-weight: 700; }
.modal-actions .btn-delete { background: rgba(255,80,80,.5); color: #fff; }
.modal-actions .btn-delete:hover { background: rgba(255,80,80,.7); }

@media (max-width: 600px) {
  .header { height: 58px; padding: 0 16px; }
  .page { padding: 80px 16px calc(60px + env(safe-area-inset-bottom)); }
  .page-head h1 { font-size: 1.5rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .8rem; }
  .card .body { padding: .7rem .8rem .8rem; }
  .card .name { font-size: .92rem; }
  .header-link { padding: 7px 12px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="loading-screen" id="loading"><span class="spinner"></span></div>

<div id="app" style="display:none;">
  <header class="header">
    <div style="display:flex;align-items:center;gap:14px;">
      <a href="/" id="backLink" class="header-link" style="padding:8px 13px;font-size:13px;">← 返回</a>
      <a class="logo" href="/?entered=1"><img src="/logo1.png" alt="HYOOL"></a>
    </div>
    <div style="display:flex;gap:.6rem;" id="headerActions">
      <a class="header-link accent" href="/create" id="createLink">+ 创造</a>
      <button class="header-link" id="logoutBtn">退出</button>
      <a class="header-link accent" href="/yonder" id="loginLink" style="display:none;">登录</a>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div><h1>数字生命库</h1><p id="subTitle">你孕育的所有数字生命都在这里。</p></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
      <div class="big">○</div>
      <span id="emptyText">这里还没有数字生命。<br>去创造你的第一个吧。</span>
      <div><button class="go" onclick="location.href='/yonder.html?next=/create'">登录后创造</button></div>
    </div>
  </main>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>编辑角色</h2>
    <div class="field-group">
      <label>名字</label>
      <input type="text" id="editName" maxlength="40">
    </div>
    <div class="field-group">
      <label>外貌</label>
      <textarea id="editAppearance" maxlength="800"></textarea>
    </div>
    <div class="field-group">
      <label>性格</label>
      <textarea id="editPersonality" maxlength="800"></textarea>
    </div>
    <div class="field-group">
      <label>背景</label>
      <textarea id="editBackground" maxlength="2000"></textarea>
    </div>
    <div class="field-group">
      <label>说话风格</label>
      <textarea id="editSpeech" maxlength="400"></textarea>
    </div>
    <div class="field-group">
      <label>世界名称</label>
      <input type="text" id="editWorldName" maxlength="80">
    </div>
    <div class="field-group">
      <label>世界描述</label>
      <textarea id="editWorldDesc" maxlength="1200"></textarea>
    </div>
    <div class="field-group">
      <label>故事钩子</label>
      <textarea id="editHook" maxlength="400"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="editCancel">取消</button>
      <button class="btn btn-save" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h2>删除角色</h2>
    <p class="confirm-text">确定删除 <span class="confirm-name" id="deleteName"></span> 吗？<br>所有对话和记忆将一并删除，此操作不可撤销。</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="deleteCancel">取消</button>
      <button class="btn btn-delete" id="deleteConfirm">删除</button>
    </div>
  </div>
</div>

<script>
const api = (p, o = {}) => {
  const t = localStorage.getItem("hyool_token");
  const h = { "Content-Type": "application/json", ...(o.headers || {}) };
  if (t) h["Authorization"] = "Bearer " + t;
  return fetch(p, { credentials: "include", ...o, headers: h }).then(async r => { let d; try { d = await r.json(); } catch { d = { success:false, error:"服务器返回异常。" }; } if (!r.ok) throw new Error(d.error || "请求失败。"); return d; });
};

const escapeHtml = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const isSvg = u => u && (u.endsWith(".svg") || u.includes("/portrait"));

let allChars = [];
let editingChar = null;
let deletingChar = null;

async function checkAuthSoft() {
  const t = localStorage.getItem("hyool_token");
  try {
    const h = {};
    if (t) h["Authorization"] = "Bearer " + t;
    const res = await fetch("/api/me", { credentials: "include", cache: "no-store", headers: h });
    const data = await res.json();
    return data.authenticated ? data : null;
  } catch {
    return null;
  }
}

function renderCards(chars, isGuest) {
  allChars = chars;
  const grid = document.getElementById("grid");
  if (!chars.length) {
    document.getElementById("empty").style.display = "block";
    if (isGuest) document.getElementById("emptyText").innerHTML = "还没有公开的数字生命。<br>登录后来创造第一个吧。";
    return;
  }
  grid.innerHTML = chars.map((c, i) => {
    const href = isGuest ? "/yonder.html?next=/buddy/" + escapeHtml(c.id) : "/buddy/" + escapeHtml(c.id);
    const actions = isGuest ? "" : `
      <div class="card-actions">
        <button class="card-btn edit" onclick="event.stopPropagation();openEdit(${i})" title="编辑">✎</button>
        <button class="card-btn del" onclick="event.stopPropagation();openDelete(${i})" title="删除">✕</button>
      </div>`;
    const tag = isGuest ? "a" : "div";
    const linkAttr = isGuest ? `href="${href}"` : `onclick="location.href='${href}'"`;
    return `<${tag} class="card" ${linkAttr}>
      ${actions}
      <img class="thumb" src="${escapeHtml(c.image_url || '')}" alt="" onerror="this.style.opacity=.2">
      <div class="body">
        <div class="name">${escapeHtml(c.name || '未名')}</div>
        <div class="world">${escapeHtml(c.world_name || '')}</div>
        <div class="hook">${escapeHtml(c.story_hook || c.appearance || '')}</div>
        <div class="foot"><span>${c.created_at ? new Date(c.created_at).toLocaleDateString('zh-CN') : ''}</span></div>
      </div>
    </${tag}>`;
  }).join("");
}

/* Edit modal */
function openEdit(idx) {
  const c = allChars[idx];
  if (!c) return;
  editingChar = c;
  document.getElementById("editName").value = c.name || "";
  document.getElementById("editAppearance").value = c.appearance || "";
  document.getElementById("editPersonality").value = c.personality || "";
  document.getElementById("editBackground").value = c.background || "";
  document.getElementById("editSpeech").value = c.speech_style || "";
  document.getElementById("editWorldName").value = c.world_name || "";
  document.getElementById("editWorldDesc").value = c.world_description || "";
  document.getElementById("editHook").value = c.story_hook || "";
  document.getElementById("editModal").classList.add("show");
}

function closeEdit() {
  document.getElementById("editModal").classList.remove("show");
  editingChar = null;
}

async function saveEdit() {
  if (!editingChar) return;
  const btn = document.getElementById("editSave");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const res = await api("/api/characters/" + editingChar.id + "/update", {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("editName").value.trim(),
        appearance: document.getElementById("editAppearance").value.trim(),
        personality: document.getElementById("editPersonality").value.trim(),
        background: document.getElementById("editBackground").value.trim(),
        speech_style: document.getElementById("editSpeech").value.trim(),
        world_name: document.getElementById("editWorldName").value.trim(),
        world_description: document.getElementById("editWorldDesc").value.trim(),
        story_hook: document.getElementById("editHook").value.trim()
      })
    });
    if (!res.success) throw new Error(res.error || "保存失败。");
    Object.assign(editingChar, res.character);
    renderCards(allChars, false);
    closeEdit();
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "保存";
  }
}

/* Delete modal */
function openDelete(idx) {
  const c = allChars[idx];
  if (!c) return;
  deletingChar = c;
  document.getElementById("deleteName").textContent = c.name || "未名";
  document.getElementById("deleteModal").classList.add("show");
}

function closeDelete() {
  document.getElementById("deleteModal").classList.remove("show");
  deletingChar = null;
}

async function confirmDelete() {
  if (!deletingChar) return;
  const btn = document.getElementById("deleteConfirm");
  btn.disabled = true; btn.textContent = "删除中…";
  try {
    const res = await api("/api/characters/" + deletingChar.id + "/delete", { method: "POST" });
    if (!res.success) throw new Error(res.error || "删除失败。");
    allChars = allChars.filter(c => c.id !== deletingChar.id);
    renderCards(allChars, false);
    closeDelete();
  } catch (e) {
    alert(e.message);
  } finally {
    btn.disabled = false; btn.textContent = "删除";
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  const auth = await checkAuthSoft();
  const isGuest = !auth;

  if (auth && auth.user && auth.user.username) {
    document.getElementById("backLink").href = "/@" + auth.user.username;
  }

  if (isGuest) {
    document.getElementById("createLink").style.display = "none";
    document.getElementById("logoutBtn").style.display = "none";
    document.getElementById("loginLink").style.display = "";
    document.getElementById("subTitle").textContent = "浏览大家创造的数字生命，登录后即可开始聊天。";
  } else {
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      localStorage.removeItem("hyool_token");
      try { await api("/api/logout", { method: "POST" }); } catch {}
      location.href = "/yonder";
    });
  }

  document.getElementById("editCancel").addEventListener("click", closeEdit);
  document.getElementById("editSave").addEventListener("click", saveEdit);
  document.getElementById("deleteCancel").addEventListener("click", closeDelete);
  document.getElementById("deleteConfirm").addEventListener("click", confirmDelete);

  document.getElementById("editModal").addEventListener("click", e => {
    if (e.target.id === "editModal") closeEdit();
  });
  document.getElementById("deleteModal").addEventListener("click", e => {
    if (e.target.id === "deleteModal") closeDelete();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeEdit(); closeDelete(); }
  });

  try {
    const res = await api("/api/hub");
    renderCards(res.characters || [], isGuest);
  } catch (e) {
    document.getElementById("loading").innerHTML = '<div style="text-align:center;">加载失败：' + escapeHtml(e.message) + '</div>';
    return;
  }
  document.getElementById("loading").style.display = "none";
  document.getElementById("app").style.display = "block";
});
</script>
</body>
</html>
