<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>HYOOL · 相遇</title>
<style>
:root {
  --accent: #8b8bff;
  --text: rgba(255,255,255,.94);
  --muted: rgba(255,255,255,.55);
  --glass: rgba(255,255,255,.06);
  --glass-border: rgba(255,255,255,.11);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%),
    linear-gradient(135deg, #11121a, #090a10 55%, #050507);
  background-attachment: fixed;
  min-height: 100dvh; min-height: 100vh; overflow: hidden;
  line-height: 1.7;
}
a { color: inherit; text-decoration: none; }

/* Header */
.header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 64px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
  background: linear-gradient(to bottom, rgba(5,5,8,.62), transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.header .left { display: flex; align-items: center; gap: 14px; }
.back-link {
  font-size: 13px; color: var(--muted); cursor: pointer; letter-spacing: .02em;
  transition: color .2s; background: none; border: 0;
}
.back-link:hover { color: #fff; }
.char-name { font-weight: 700; font-size: .95rem; }
.char-sub { font-size: .72rem; color: var(--muted); }
.header-link {
  border: 0; background: rgba(255,255,255,.06); color: rgba(255,255,255,.76);
  padding: 8px 13px; border-radius: 999px; font-size: 12px; cursor: pointer;
  transition: background .2s, color .2s;
}
.header-link:hover { color: #fff; background: rgba(255,255,255,.12); }

/* Settings Modal */
.settings-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,.5); backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.settings-overlay.show { display: flex; }
.settings-panel {
  background: linear-gradient(145deg, #1a1b2e, #12131f);
  border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 24px; width: 90%; max-width: 380px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.settings-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
.setting-row { margin-bottom: 18px; }
.setting-label { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
.setting-label .val { color: var(--accent); font-weight: 600; }
.setting-slider { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); outline: none; }
.setting-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
.setting-slider::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none; }
.setting-seg { display: flex; gap: 6px; }
.setting-seg button {
  flex: 1; padding: 8px 0; border: 1px solid var(--glass-border); border-radius: 8px;
  background: transparent; color: var(--muted); font-size: .8rem; cursor: pointer; transition: all .2s;
}
.setting-seg button.active { background: rgba(139,139,255,.15); color: var(--accent); border-color: rgba(139,139,255,.4); }
.intimacy-bar { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.intimacy-fill { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
.intimacy-fill span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #c084fc); border-radius: 3px; transition: width .4s; }
.settings-close {
  width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 10px;
  background: rgba(139,139,255,.15); color: var(--accent); font-size: .9rem; cursor: pointer;
  transition: background .2s;
}
.settings-close:hover { background: rgba(139,139,255,.25); }

/* Main layout: split view */
.main {
  display: flex; height: 100dvh; height: 100vh; padding-top: 64px;
}

/* Portrait panel */
.portrait-panel {
  flex: 0 0 42%; max-width: 560px; min-width: 280px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  position: relative; overflow: hidden;
  background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,.4) 100%);
  border-right: 1px solid var(--glass-border);
}
.portrait-panel::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 50% 60%, rgba(139,139,255,.10), transparent 50%);
}
.portrait-stage {
  position: relative; width: 100%; flex: 1; display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 0; overflow: hidden;
}
.portrait-img {
  width: 100%; height: 100%; object-fit: cover; object-position: center top;
  filter: drop-shadow(0 8px 40px rgba(0,0,0,.5));
  animation: portraitBreathe 5s ease-in-out infinite;
  position: relative; z-index: 2;
}
.portrait-glow {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 60%; height: 40%; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at 50% 100%, rgba(139,139,255,.20), transparent 60%);
  opacity: .5; animation: glowPulse 5s ease-in-out infinite;
}
.portrait-stage.speaking .portrait-glow {
  opacity: 1; animation: speakGlow 1.2s ease-in-out infinite;
}
.portrait-stage.speaking .portrait-img {
  animation: portraitSpeak 1.2s ease-in-out infinite;
}
.portrait-ripple {
  position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
  width: 30%; height: 30%; border-radius: 50%; pointer-events: none; z-index: 0;
  border: 1px solid rgba(139,139,255,.15);
  opacity: 0;
}
.portrait-stage.speaking .portrait-ripple {
  animation: rippleOut 1.5s ease-out infinite;
}
@keyframes portraitBreathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.015); }
}
@keyframes glowPulse {
  0%, 100% { opacity: .4; }
  50% { opacity: .65; }
}
@keyframes portraitSpeak {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}
@keyframes speakGlow {
  0%, 100% { opacity: .6; }
  50% { opacity: 1; }
}
@keyframes rippleOut {
  0% { transform: translateX(-50%) scale(.8); opacity: .4; }
  100% { transform: translateX(-50%) scale(1.8); opacity: 0; }
}

/* Portrait toolbar (future features) */
.portrait-toolbar {
  flex: 0 0 auto; width: 100%; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  display: flex; justify-content: center; gap: .5rem; z-index: 5;
  background: linear-gradient(to top, rgba(0,0,0,.5), transparent);
}
.tool-btn {
  border: 1px solid var(--glass-border); background: var(--glass);
  color: rgba(255,255,255,.5); padding: 7px 14px; border-radius: 999px;
  font-size: 12px; cursor: pointer; transition: all .2s; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
.tool-btn:hover { background: rgba(255,255,255,.10); color: rgba(255,255,255,.7); }
.tool-btn .badge { font-size: 9px; background: rgba(139,139,255,.2); color: var(--accent); padding: 1px 5px; border-radius: 4px; }

/* Chat panel */
.chat-panel {
  flex: 1; display: flex; flex-direction: column; min-width: 0; height: 100%;
}
.chat-area { flex: 1; overflow-y: auto; padding: 20px 24px 8px; }
.chat-inner { max-width: 680px; margin: 0 auto; }

/* Messages */
.msg-row { display: flex; margin-bottom: 1.1rem; animation: fadeUp .4s cubic-bezier(.2,.8,.2,1); }
.msg-row.user { flex-direction: row-reverse; }
.msg-row .bubble {
  max-width: 78%; padding: 13px 16px; border-radius: 18px; font-size: .92rem;
  white-space: pre-wrap; word-break: break-word; line-height: 1.65;
}
.msg-row.assistant .bubble {
  background: rgba(255,255,255,.06); border: 1px solid var(--glass-border);
  border-top-left-radius: 4px;
}
.msg-row.user .bubble {
  background: var(--accent); color: #0a0a12; border-top-right-radius: 4px; font-weight: 500;
}
.msg-time { font-size: .68rem; color: var(--muted); margin: 4px 10px 0; align-self: flex-end; }
.msg-row.user .msg-time { text-align: right; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.typing .bubble { display: flex; gap: 5px; align-items: center; padding: 16px 18px; }
.typing .bubble span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  animation: dotBounce 1.2s infinite ease-in-out;
}
.typing .bubble span:nth-child(2) { animation-delay: .15s; }
.typing .bubble span:nth-child(3) { animation-delay: .3s; }
@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-6px); opacity: 1; }
}
/* Memory bar */
.mem-bar {
  max-width: 680px; margin: 0 auto 8px; padding: 6px 4px;
  font-size: .72rem; color: var(--muted); display: flex; align-items: center; gap: 6px;
}
.mem-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* Composer */
.composer {
  padding: 12px 24px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.06);
  background: rgba(5,5,8,.4); backdrop-filter: blur(8px); flex: 0 0 auto;
}
.composer-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.composer textarea {
  flex: 1; min-height: 48px; max-height: 140px; resize: none;
  border: 1px solid rgba(255,255,255,.10); border-radius: 16px;
  padding: 13px 16px; background: rgba(255,255,255,.06); color: #fff;
  outline: none; font: inherit; font-size: .92rem; line-height: 1.5; transition: border .3s;
}
.composer textarea:focus { border-color: var(--accent); }
.composer textarea::placeholder { color: rgba(255,255,255,.28); }
.send-btn {
  border: 0; border-radius: 16px; padding: 0 20px; height: 48px; cursor: pointer;
  background: var(--accent); color: #0a0a12; font-weight: 700; font-size: 14px;
  transition: opacity .2s, transform .2s; white-space: nowrap;
}
.send-btn:hover { opacity: .88; transform: translateY(-1px); }
.send-btn:disabled { opacity: .4; cursor: wait; }

/* Mobile toggle for portrait */
.portrait-toggle {
  display: none; position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); right: 16px; z-index: 40;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-border);
  background: rgba(20,20,30,.8); backdrop-filter: blur(10px); color: var(--accent);
  cursor: pointer; font-size: 18px; align-items: center; justify-content: center;
  transition: transform .2s;
}
.portrait-toggle:hover { transform: scale(1.08); }

/* States */
.loading-screen {
  position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: .9rem; flex-direction: column; gap: 14px;
  background: radial-gradient(circle at 50% 0%, rgba(100,100,180,.20), transparent 42%), #050507;
}
.spinner {
  width: 26px; height: 26px; border: 2px solid rgba(255,255,255,.15);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err-screen { text-align: center; padding: 2rem; }
.err-screen a { color: var(--accent); }

/* Mobile: portrait becomes overlay */
@media (max-width: 768px) {
  .header { padding: 0 16px; height: 58px; }
  .main { padding-top: 58px; flex-direction: column; }
  .portrait-panel {
    position: fixed; inset: 58px 0 auto 0; z-index: 30; max-width: none; min-width: 0;
    height: 45%; border-right: 0; border-bottom: 1px solid var(--glass-border);
    transform: translateY(-100%); transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .portrait-panel.mobile-show { transform: translateY(0); }
  .chat-panel { flex: 1; }
  .chat-area, .composer { padding-left: 14px; padding-right: 14px; }
  .msg-row .bubble { max-width: 88%; }
  .char-sub { display: none; }
  .portrait-toggle { display: flex; }
  .portrait-toolbar { padding-bottom: 6px; }
  .tool-btn { padding: 6px 10px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="loading-screen" id="loading"><span class="spinner"></span><span>正在相遇……</span></div>

<div id="app" style="display:none;">
  <header class="header">
    <div class="left">
      <button class="back-link" id="backBtn">← 返回</button>
      <div>
        <div class="char-name" id="charName"></div>
        <div class="char-sub" id="charWorld"></div>
      </div>
    </div>
    <div style="display:flex;gap:.5rem;">
      <button class="header-link" id="settingsBtn">⚙ 设置</button>
      <a class="header-link" id="shareLink" href="#">分享</a>
      <button class="header-link" id="logoutBtn">退出</button>
    </div>
  </header>

  <div class="main">
    <!-- Portrait Panel -->
    <aside class="portrait-panel" id="portraitPanel">
      <div class="portrait-stage" id="portraitStage">
        <div class="portrait-ripple"></div>
        <div class="portrait-glow"></div>
        <img class="portrait-img" id="portraitImg" alt="" src="">
      </div>
      <div class="portrait-toolbar">
        <button class="tool-btn" onclick="alert('装扮功能即将上线')">装扮 <span class="badge">soon</span></button>
        <button class="tool-btn" onclick="alert('场景功能即将上线')">场景 <span class="badge">soon</span></button>
        <button class="tool-btn" onclick="alert('天气功能即将上线')">天气 <span class="badge">soon</span></button>
      </div>
    </aside>

    <!-- Chat Panel -->
    <div class="chat-panel">
      <div class="chat-area" id="chatArea">
        <div class="chat-inner" id="chatInner"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="msgInput" placeholder="对 TA 说点什么……" rows="1"></textarea>
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile portrait toggle -->
  <button class="portrait-toggle" id="portraitToggle">👤</button>
</div>

<!-- Settings Modal -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-title">角色设定</div>

    <div class="setting-row">
      <div class="setting-label"><span>灵魂 · 沉稳/灵动</span><span class="val" id="tempVal">0.9</span></div>
      <input type="range" class="setting-slider" id="tempSlider" min="0.3" max="1.1" step="0.1" value="0.9">
      <div style="font-size:.72rem;color:var(--muted);margin-top:4px;">超过1.0角色可能语无伦次，建议0.7~1.0</div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>话语 · 寡言/健谈</span><span class="val" id="tokenVal">150</span></div>
      <input type="range" class="setting-slider" id="tokenSlider" min="60" max="300" step="20" value="150">
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>主动程度</span></div>
      <div class="setting-seg" id="proSeg">
        <button data-v="passive">被动</button>
        <button data-v="balanced" class="active">适中</button>
        <button data-v="active">主动</button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-label"><span>羁绊</span></div>
      <div class="intimacy-bar">
        <span id="intimacyLabel">初识</span>
        <div class="intimacy-fill"><span id="intimacyFill" style="width:0%"></span></div>
        <span id="intimacyNum">0</span>
      </div>
    </div>

    <button class="settings-close" id="settingsClose">完成</button>
  </div>
</div>

<script>
const api = (p, o = {}) => {
  const t = localStorage.getItem("hyool_token");
  const h = { "Content-Type": "application/json", ...(o.headers || {}) };
  if (t) h["Authorization"] = "Bearer " + t;
  return fetch(p, { credentials: "include", ...o, headers: h }).then(async r => { let d; try { d = await r.json(); } catch { d = { success:false, error:"服务器返回异常。" }; } if (!r.ok) throw new Error(d.error || "请求失败。"); return d; });
};

const $ = id => document.getElementById(id);
const escapeHtml = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

function getCharId() {
  const parts = location.pathname.split("/").filter(Boolean);
  return parts[1] || "";
}

let character = null;
let sending = false;
let chatConfig = { temperature: 0.9, max_tokens: 150, proactivity: "balanced" };
let currentIntimacy = 0;

function scrollBottom() { const a = $("chatArea"); a.scrollTop = a.scrollHeight; }
if (window.visualViewport) window.visualViewport.addEventListener("resize", scrollBottom);

function addMessage(role, content, animate) {
  const row = document.createElement("div");
  row.className = "msg-row " + role + (animate ? " typing" : "");
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (animate) {
    bubble.innerHTML = "<span></span><span></span><span></span>";
  } else {
    bubble.innerHTML = escapeHtml(content).replace(/\n/g, "<br>");
  }
  row.appendChild(bubble);
  $("chatInner").appendChild(row);
  scrollBottom();
  return row;
}

async function checkAuth() {
  const t = localStorage.getItem("hyool_token");
  for (let i = 0; i < 2; i++) {
    try {
      const h = {};
      if (t) h["Authorization"] = "Bearer " + t;
      const res = await fetch("/api/me", { credentials: "include", cache: "no-store", headers: h });
      const data = await res.json();
      if (data.authenticated) return true;
      if (i === 1) { location.href = "/yonder.html?next=" + encodeURIComponent(location.pathname); return false; }
    } catch {
      if (i === 1) { location.href = "/yonder.html?next=" + encodeURIComponent(location.pathname); return false; }
      await new Promise(r => setTimeout(r, 800));
    }
  }
  location.href = "/yonder.html?next=" + encodeURIComponent(location.pathname);
  return false;
}

function intimacyLabel(v) {
  if (v >= 50) return "灵魂羁绊";
  if (v >= 30) return "亲密";
  if (v >= 10) return "熟识";
  if (v >= 1) return "初见";
  return "初识";
}
function intimacyPct(v) { return Math.min(100, (v / 50) * 100); }

function renderCharacter(c) {
  $("charName").textContent = c.name || "TA";
  $("charWorld").textContent = c.world_name || "";
  const img = $("portraitImg");
  if (c.image_url) {
    img.src = c.image_url;
    img.style.display = "";
  } else {
    img.style.display = "none";
  }
  if (c.share_url) $("shareLink").href = c.share_url;
  if (c.chat_config) {
    try { chatConfig = { ...chatConfig, ...(typeof c.chat_config === "string" ? JSON.parse(c.chat_config) : c.chat_config) }; } catch {}
  }
  // 安全clamp，极端值自动修正
  chatConfig.temperature = Math.min(1.1, Math.max(0.3, chatConfig.temperature || 0.9));
  chatConfig.max_tokens  = Math.min(300, Math.max(60, chatConfig.max_tokens || 150));
  if (!["passive","balanced","active"].includes(chatConfig.proactivity)) chatConfig.proactivity = "balanced";
  currentIntimacy = c.intimacy || 0;
  updateSettingsUI();
}

function updateSettingsUI() {
  $("tempVal").textContent = chatConfig.temperature.toFixed(1);
  $("tempSlider").value = chatConfig.temperature;
  // 高温预警：>=1.0 时数值变红
  const tempWarn = chatConfig.temperature >= 1.0;
  $("tempVal").style.color = tempWarn ? "#f87171" : "";
  $("tokenVal").textContent = chatConfig.max_tokens;
  $("tokenSlider").value = chatConfig.max_tokens;
  document.querySelectorAll("#proSeg button").forEach(b => {
    b.classList.toggle("active", b.dataset.v === chatConfig.proactivity);
  });
  $("intimacyLabel").textContent = intimacyLabel(currentIntimacy);
  $("intimacyNum").textContent = currentIntimacy;
  $("intimacyFill").style.width = intimacyPct(currentIntimacy) + "%";
}

let saveTimer = null;
function saveConfig() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await api("/api/buddy/" + getCharId() + "/chat-config", {
        method: "POST",
        body: JSON.stringify(chatConfig)
      });
    } catch {}
  }, 500);
}

function setSpeaking(on) {
  const stage = $("portraitStage");
  if (on) stage.classList.add("speaking");
  else stage.classList.remove("speaking");
}

async function loadMessages() {
  const id = getCharId();
  try {
    const res = await api("/api/buddy/" + id + "/messages");
    character = res.character;
    renderCharacter(character);
    (res.messages || []).forEach(m => addMessage(m.role, m.content, false));
    if (res.memories_count) {
      const bar = document.createElement("div");
      bar.className = "mem-bar";
      bar.innerHTML = '<span class="dot"></span> TA 记得 ' + res.memories_count + ' 段与你有关的记忆';
      $("chatInner").insertBefore(bar, $("chatInner").firstChild);
    }
    if (!res.messages || res.messages.length === 0) {
      addMessage("assistant", "（你们的故事从这里开始。对 TA 说第一句话吧。）", false);
    }
    $("loading").style.display = "none";
    $("app").style.display = "flex";
    scrollBottom();
  } catch (e) {
    $("loading").innerHTML = '<div class="err-screen">加载失败：' + escapeHtml(e.message) + '<br><a href="/hub">返回数字生命库</a></div>';
  }
}

async function sendMessage() {
  if (sending) return;
  const input = $("msgInput");
  const text = input.value.trim();
  if (!text) return;
  sending = true;
  $("sendBtn").disabled = true;
  input.value = "";
  input.style.height = "auto";
  addMessage("user", text, false);
  const typingRow = addMessage("assistant", "", true);
  setSpeaking(true);
  try {
    const res = await api("/api/buddy/" + getCharId() + "/chat", {
      method: "POST", body: JSON.stringify({ message: text })
    });
    if (!res.success) throw new Error(res.error || "对话失败。");
    setSpeaking(false);
    typingRow.classList.remove("typing");
    typingRow.querySelector(".bubble").innerHTML = escapeHtml(res.reply).replace(/\n/g, "<br>");
    if (res.intimacy !== undefined) {
      currentIntimacy = res.intimacy;
      updateSettingsUI();
    }
    if (res.memories_count !== undefined) {
      const bar = document.querySelector(".mem-bar");
      if (bar) {
        bar.innerHTML = '<span class="dot"></span> TA 记得 ' + res.memories_count + ' 段与你有关的记忆';
      }
    }
    scrollBottom();
  } catch (e) {
    setSpeaking(false);
    typingRow.remove();
    const errRow = addMessage("assistant", "（出了点问题：" + e.message + "）", false);
    errRow.querySelector(".bubble").style.color = "#ff8b8b";
  } finally {
    sending = false;
    $("sendBtn").disabled = false;
    input.focus();
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  if (!(await checkAuth())) return;
  if (!getCharId()) { location.href = "/hub"; return; }

  $("backBtn").addEventListener("click", () => { location.href = "/hub"; });
  $("logoutBtn").addEventListener("click", async () => {
    localStorage.removeItem("hyool_token");
    try { await api("/api/logout", { method: "POST" }); } catch {}
    location.href = "/yonder";
  });

  // Mobile portrait toggle
  $("portraitToggle").addEventListener("click", () => {
    $("portraitPanel").classList.toggle("mobile-show");
  });

  // Settings
  $("settingsBtn").addEventListener("click", () => {
    updateSettingsUI();
    $("settingsOverlay").classList.add("show");
  });
  $("settingsClose").addEventListener("click", () => {
    $("settingsOverlay").classList.remove("show");
  });
  $("settingsOverlay").addEventListener("click", (e) => {
    if (e.target === $("settingsOverlay")) $("settingsOverlay").classList.remove("show");
  });
  $("tempSlider").addEventListener("input", (e) => {
    chatConfig.temperature = parseFloat(e.target.value);
    $("tempVal").textContent = chatConfig.temperature.toFixed(1);
    saveConfig();
  });
  $("tokenSlider").addEventListener("input", (e) => {
    chatConfig.max_tokens = parseInt(e.target.value);
    $("tokenVal").textContent = chatConfig.max_tokens;
    saveConfig();
  });
  document.querySelectorAll("#proSeg button").forEach(btn => {
    btn.addEventListener("click", () => {
      chatConfig.proactivity = btn.dataset.v;
      document.querySelectorAll("#proSeg button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      saveConfig();
    });
  });

  const input = $("msgInput");
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  $("sendBtn").addEventListener("click", sendMessage);

  await loadMessages();
});
</script>
</body>
</html>
