<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>彼岸 · HYOOL</title>

<style>
  
:root {
    --accent: #8b8bff;
    --text: rgba(255,255,255,.94);
    --muted: rgba(255,255,255,.55);
    --glass: rgba(255,255,255,.07);
    --glass-border: rgba(255,255,255,.11);
}

.logo img {
    display: block;
    height: 24px;
    width: auto;
    object-fit: contain;
}

    
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(100,100,180,.20),
            transparent 42%
        ),
        linear-gradient(
            135deg,
            #11121a,
            #090a10 55%,
            #050507
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

#background-layer {

    position: fixed;

    inset: 0;

    z-index: -10;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(120,120,220,.18),
            transparent 45%
        );

    transition:
        background .4s ease;
}

#background-image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    display: none;

    transition:
        opacity .4s ease;
}

#background-overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.10),
            rgba(0,0,0,.48)
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    z-index: 100;

    background:
        linear-gradient(
            to bottom,
            rgba(5,5,8,.52),
            rgba(5,5,8,0)
        );

    backdrop-filter:
        blur(10px);
}

.logo {

    text-decoration: none;

    color: white;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: .22em;

    opacity: .95;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 10px;
}

.header-link,
.edit-button {

    border: 0;

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.76);

    text-decoration: none;

    padding:
        9px 14px;

    border-radius: 999px;

    font-size: 13px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.header-link:hover,
.edit-button:hover {

    color: white;

    background:
        rgba(255,255,255,.12);

    transform:
        translateY(-1px);
}

.edit-button {

    border:
        1px solid var(--accent);
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    padding:
        130px 24px 100px;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-section {

    text-align: center;

    margin-bottom: 90px;
}

.avatar {

    width: 112px;
    height: 112px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    margin:
        0 auto 24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.04)
        );

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 20px 70px rgba(0,0,0,.35);
}

.avatar-placeholder {

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        rgba(255,255,255,.75);

    font-size: 38px;

    font-weight: 500;
}

.display-name {

    margin: 0;

    font-size: 32px;

    font-weight: 600;

    letter-spacing: -.02em;
}

.username {

    margin-top: 8px;

    color:
        rgba(255,255,255,.42);

    font-size: 13px;
}

.bio {

    max-width: 600px;

    margin:
        20px auto 0;

    line-height: 1.8;

    color:
        rgba(255,255,255,.65);

    font-size: 15px;
}


/* =====================================================
   CONTENT
===================================================== */

.section {

    margin-top: 60px;
}

.section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.section-title h2 {

    margin: 0;

    font-size: 17px;

    font-weight: 500;

    letter-spacing: .05em;
}

.section-title span {

    color:
        rgba(255,255,255,.32);

    font-size: 12px;
}


/* =====================================================
   POSTS
===================================================== */

.posts {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 18px;
}

.post {

    padding: 24px;

    min-height: 150px;

    border:
        1px solid var(--glass-border);

    background:
        rgba(255,255,255,.055);

    border-radius: 20px;

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 18px 50px rgba(0,0,0,.16);

    transition:
        transform .25s ease,
        background .25s ease;
}

.post:hover {

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.08);
}

.post-content {

    line-height: 1.8;

    color:
        rgba(255,255,255,.83);

    white-space: pre-wrap;

    word-break: break-word;
}

.post-meta {

    margin-top: 20px;

    color:
        rgba(255,255,255,.30);

    font-size: 11px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    padding:
        60px 20px;

    text-align: center;

    border:
        1px dashed rgba(255,255,255,.10);

    border-radius: 20px;

    color:
        rgba(255,255,255,.32);

    font-size: 13px;
}


/* =====================================================
   EDIT PANEL
===================================================== */

.editor-backdrop {

    position: fixed;

    inset: 0;

    z-index: 500;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(8px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.editor-backdrop.active {

    display: flex;
}

.editor {

    width: 100%;

    max-width: 560px;

    max-height:
        calc(100vh - 40px);

    overflow-y: auto;

    padding: 28px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 24px;

    background:
        rgba(18,18,24,.94);

    box-shadow:
        0 40px 100px rgba(0,0,0,.55);
}

.editor-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 28px;
}

.editor-header h2 {

    margin: 0;

    font-size: 20px;

    font-weight: 600;
}

.close-button {

    border: 0;

    background: transparent;

    color:
        rgba(255,255,255,.55);

    font-size: 24px;

    cursor: pointer;
}

.form-group {

    margin-bottom: 22px;
}

.form-group label {

    display: block;

    margin-bottom: 9px;

    color:
        rgba(255,255,255,.65);

    font-size: 13px;
}

.form-group input,
.form-group select,
.form-group textarea {

    width: 100%;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 12px;

    padding:
        12px 14px;

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;

    font:
        inherit;
}

.form-group textarea {

    min-height: 90px;

    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    border-color:
        var(--accent);
}

.color-row {

    display: flex;

    gap: 10px;
}

.color-row input[type="color"] {

    width: 54px;

    height: 42px;

    padding: 3px;

    cursor: pointer;
}


.upload-row {

    display: flex;

    gap: 8px;

    align-items: center;
}


.upload-row input {

    flex: 1;
}


.upload-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 9px 14px;

    border-radius: 8px;

    background: rgba(255,255,255,.08);

    color: rgba(255,255,255,.82);

    font-size: 13px;

    cursor: pointer;

    white-space: nowrap;

    transition: background .2s;

}


.upload-btn:hover {

    background: rgba(255,255,255,.14);
}


.preview-area {

    margin-top: 10px;

    min-height: 0;
}


.preview-area img {

    width: 60px;

    height: 60px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid rgba(255,255,255,.12);
}


.preview-area .preview-bg {

    width: 100%;

    height: 80px;

    border-radius: 10px;

    object-fit: cover;

    border: 1px solid rgba(255,255,255,.12);

}


/* =====================================================
   CROP MODAL
===================================================== */

.crop-backdrop {
    position: fixed;
    inset: 0;
    z-index: 600;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.crop-backdrop.active { display: flex; }

.crop-modal {
    width: 100%;
    max-width: 360px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    background: rgba(18,18,24,.96);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
}

.crop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.crop-header h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
}

.crop-stage {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 20px;
    border-radius: 14px;
    overflow: hidden;
    background: #0a0a12;
}

#cropCanvas {
    display: block;
    width: 280px;
    height: 280px;
    touch-action: none;
    cursor: grab;
}

#cropCanvas:active { cursor: grabbing; }

.crop-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.crop-controls button {
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .2s;
}

.crop-controls button:hover { background: rgba(255,255,255,.18); }

.crop-controls input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
}

.crop-actions {
    display: flex;
    gap: 12px;
}

.crop-btn-cancel {
    flex: 1;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 12px;
    padding: 12px;
    background: transparent;
    color: rgba(255,255,255,.7);
    font-size: 14px;
    cursor: pointer;
    transition: background .2s;
}

.crop-btn-cancel:hover { background: rgba(255,255,255,.06); }

.crop-btn-confirm {
    flex: 1;
    border: 0;
    border-radius: 12px;
    padding: 12px;
    background: var(--accent);
    color: #0a0a12;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
}

.crop-btn-confirm:hover { opacity: .88; }

.crop-btn-confirm:disabled { opacity: .5; cursor: wait; }


/* =====================================================
   CHECKBOXES
===================================================== */

.checkbox-group {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.checkbox-item {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 12px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.70);

    font-size: 13px;

    cursor: pointer;
}

.checkbox-item input {

    accent-color:
        var(--accent);
}


/* =====================================================
   SAVE
===================================================== */

.save-button {

    width: 100%;

    border: 0;

    border-radius: 13px;

    padding:
        13px;

    background:
        var(--accent);

    color: white;

    font-size: 14px;

    cursor: pointer;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.save-button:hover {

    opacity: .88;

    transform:
        translateY(-1px);
}

.save-button:disabled {

    opacity: .45;

    cursor: wait;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        rgba(255,255,255,.45);

    font-size: 13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    .header {

        padding:
            0 16px;

    }

    .logo {

        font-size: 15px;

    }

    .header-link,
    .edit-button {

        padding:
            8px 11px;

        font-size: 12px;

    }

    .page {

        padding:
            110px 16px 70px;

    }

    .display-name {

        font-size: 27px;

    }

    .avatar {

        width: 94px;
        height: 94px;

    }

    .checkbox-group {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>

<div id="background-layer">

    <img
        id="background-image"
        alt=""
    >

    <div id="background-overlay"></div>

</div>


<div
    id="loading"
    class="loading"
>
    正在进入彼岸……
</div>


<div
    id="app"
    style="display:none;"
>


<header class="header">

   <a
    href="/"
    class="logo"
>
    <img
        src="/logo1.png"

    >
</a>


    <div class="header-right">

        <a
            href="/create"

        >创造数字生命</a>

            href="/hub"

        <button
            id="editButton"

        </button>

</header>


<main class="page">


    <!-- PROFILE -->

    <section

    >

        ></div>

            id="displayName"

        >

        </h1>


        <div
            id="username"
            class="username"
        >
            —
        </div>


        <div
            id="bio"
            class="bio"
        ></div>

    <section

</div>


<!-- =====================================================
     EDITOR
===================================================== -->

<div
    id="editorBackdrop"
    class="editor-backdrop"
>

                id="closeEditor"

<script>

/* =====================================================
   GLOBAL
===================================================== */

const state = {

    username: "",

    profile: null,

    settings: null,

    posts: [],

    isOwner: false

};


/* =====================================================
   GET USERNAME
===================================================== */

function getUsername() {

    const path =
        decodeURIComponent(
            window.location.pathname
        );

    if (
        path.startsWith("/@") &&
        path.length > 2
    ) {

        return path
            .substring(2)
            .split("/")[0]
            .trim()
            .toLowerCase();

    }

    return null;
}


/* =====================================================
   API
===================================================== */

async function loadYonder() {

    const username =
        getUsername();

    if (!username) {

        showError(
            "无法识别彼岸。"
        );

        return;

    }

    state.username =
        username;


    try {

        const response =
            await fetch(
                "/api/yonder/" +
                encodeURIComponent(username),
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "彼岸加载失败"
            );

        }


        state.profile =
            data.yonder.profile;

        state.settings =
            data.yonder.settings || {};

        state.posts =
            data.yonder.posts || [];


        await checkOwner();


        render();

    }

    catch (error) {

        console.error(
            "YONDER LOAD ERROR:",
            error
        );

        showError(
            error.message ||
            "彼岸加载失败。"
        );

    }

}


/* =====================================================
   CHECK OWNER
===================================================== */

async function checkOwner() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    credentials: "include",
                    cache: "no-store",
                    headers: (() => {
                        const h = {};
                        const t = localStorage.getItem("hyool_token");
                        if (t) h["Authorization"] = "Bearer " + t;
                        return h;
                    })()
                }
            );


        const data =
            await response.json();


        state.isOwner =
            Boolean(
                data.authenticated &&
                data.user &&
                data.user.username &&
                data.user.username.toLowerCase() ===
                    state.username
            );

    }

    catch {

        state.isOwner =
            false;

    }

}

   RENDER
===================================================== */

function render() {

    const settings =
        state.settings || {};

    applySettings(
        settings
    );

    renderProfile();

    renderPosts();

    document
        .getElementById(
            "editButton"
        )
        .style.display =
            state.isOwner
                ? "block"
                : "none";


    document
        .getElementById(
            "loading"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "app"
        )
        .style.display =
            "block";

}


/* =====================================================
   PROFILE
===================================================== */

function renderProfile() {

    const profile =
        state.profile || {};

    const avatar =
        document.getElementById(
            "avatarContainer"
        );

    if (profile.avatar_url) {

        avatar.innerHTML = `
            <img
                class="avatar"
                src="${escapeHtml(profile.avatar_url)}"
                alt=""
            >
        `;

    }

    else {

        const letter =
            String(
                profile.display_name ||
                profile.username ||
                "H"
            )
            .charAt(0)
            .toUpperCase();

        avatar.innerHTML = `
            <div class="avatar avatar-placeholder">
                ${escapeHtml(letter)}
            </div>
        `;

    }


    document
        .getElementById(
            "displayName"
        )
        .textContent =
            profile.display_name ||
            profile.username ||
            "未命名";


    document
        .getElementById(
            "username"
        )
        .textContent =
            "@" +
            (
                profile.username ||
                state.username
            );


    document
        .getElementById(
            "bio"
        )
        .textContent =
            profile.bio ||
            "";

}


/* =====================================================
   POSTS
===================================================== */

function renderPosts() {

    const container =
        document.getElementById(
            "posts"
        );

    if (!state.posts.length) {

        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1;">
                这里还没有留下内容。
            </div>
        `;

        return;

    }


    container.innerHTML =
        state.posts
            .map(
                post =>
                    renderPost(post)
            )
            .join("");

}


/* =====================================================
   POST
===================================================== */

function renderPost(post) {

    const content =
        post.content ||
        post.text ||
        post.body ||
        "";

    const createdAt =
        post.created_at ||
        "";


    return `
        <article class="post">

            <div class="post-content">
                ${escapeHtml(content)}
            </div>

            ${
                createdAt
                    ? `
                        <div class="post-meta">
                            ${escapeHtml(
                                formatDate(createdAt)
                            )}
                        </div>
                    `
                    : ""
            }

        </article>
    `;

}


/* =====================================================
   SETTINGS
===================================================== */

function applySettings(
    settings
) {

    const accent =
        settings.accent_color ||
        "#8b8bff";

    document
        .documentElement
        .style
        .setProperty(
            "--accent",
            accent
        );


    const backgroundType =
        settings.background_type ||
        "gradient";

    const backgroundValue =
        settings.background_value ||
        "";

    const layer =
        document.getElementById(
            "background-layer"
        );

    const image =
        document.getElementById(
            "background-image"
        );


    image.style.display =
        "none";

    image.style.opacity =
        "0";


    if (
        backgroundType ===
        "color"
    ) {

        layer.style.background =
            backgroundValue ||
            "#090a10";

    }

    else if (
        backgroundType ===
        "image"
    ) {

        if (backgroundValue) {

            image.src =
                backgroundValue;

            image.style.display =
                "block";

            requestAnimationFrame(
                () => {
                    image.style.opacity =
                        "1";
                }
            );

        }

        layer.style.background =
            "rgba(0,0,0,.25)";

    }

    else {

        layer.style.background =
            `
            radial-gradient(
                circle at 50% 0%,
                ${hexToRgba(
                    accent,
                    .25
                )},
                transparent 45%
            ),
            linear-gradient(
                135deg,
                #11121a,
                #090a10 55%,
                #050507
            )
            `;

    }


    setVisible(
        "profileSection",
        settings.show_profile !== 0
    );

    setVisible(
        "postsSection",
        settings.show_posts !== 0
    );

    setVisible(
        "worksSection",
        settings.show_works !== 0
    );

    setVisible(
        "infiniteSection",
        settings.show_infinite !== 0
    );


    if (
        settings.custom_css
    ) {

        let customStyle =
            document.getElementById(
                "custom-user-style"
            );

        if (!customStyle) {

            customStyle =
                document.createElement(
                    "style"
                );

            customStyle.id =
                "custom-user-style";

            document.head.appendChild(
                customStyle
            );

        }

        customStyle.textContent =
            settings.custom_css;

    }

}

/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings() {

    const button =
        document.getElementById(
            "saveButton"
        );

    button.disabled =
        true;

    button.textContent =
        "保存中……";


    try {

        // Save profile first

        const profilePayload = {

            display_name:
                document
                    .getElementById(
                        "editDisplayName"
                    )
                    .value
                    .trim(),

            avatar_url:
                document
                    .getElementById(
                        "editAvatarUrl"
                    )
                    .value
                    .trim(),

            bio:
                document
                    .getElementById(
                        "editBio"
                    )
                    .value
                    .trim()

        };


        const profileResponse =
            await fetch(
                "/api/profile/update",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json",
                        ...(() => {
                            const h = {};
                            const t = localStorage.getItem("hyool_token");
                            if (t) h["Authorization"] = "Bearer " + t;
                            return h;
                        })()
                    },

                    body:
                        JSON.stringify(
                            profilePayload
                        )
                }
            );


        const profileData =
            await profileResponse.json();


        if (!profileData.success) {

            throw new Error(
                profileData.error ||
                "资料保存失败"
            );

        }


        state.profile =
            profileData.profile;


        // Now save settings

        const backgroundType =
            document
                .getElementById(
                    "backgroundType"
                )
                .value;


        const backgroundValue =
            document
                .getElementById(
                    "backgroundValue"
                )
                .value
                .trim();


        const accent =
            document
                .getElementById(
                    "accentColorText"
                )
                .value
                .trim();


        const payload = {

            background_type:
                backgroundType,

            background_value:
                backgroundValue,

            accent_color:
                validColor(accent)
                    ? accent
                    : "#8b8bff",

            layout:
                "default",

            show_profile:
                document
                    .getElementById(
                        "showProfile"
                    )
                    .checked,

            show_posts:
                document
                    .getElementById(
                        "showPosts"
                    )
                    .checked,

            show_works:
                document
                    .getElementById(
                        "showWorks"
                    )
                    .checked,

            show_infinite:
                document
                    .getElementById(
                        "showInfinite"
                    )
                    .checked,

            custom_css:
                ""

        };


        const response =
            await fetch(
                "/api/yonder/settings",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json",
                        ...(() => {
                            const h = {};
                            const t = localStorage.getItem("hyool_token");
                            if (t) h["Authorization"] = "Bearer " + t;
                            return h;
                        })()
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "保存失败"
            );

        }


        state.settings =
            data.settings;


        applySettings(
            state.settings
        );


        renderProfile();


        closeEditor();

    }

    catch (error) {

        alert(
            error.message ||
            "保存失败。"
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "保存彼岸";

    }

}


/* =====================================================

===================================================== */

function setVisible(
    id,
    visible
) {

    const element =
        document.getElementById(
            id
        );

    if (!element) {
        return;
    }

    element.style.display =
        visible
            ? ""
            : "none";

}


function validColor(
    value
) {

    return /^#[0-9a-fA-F]{6}$/
        .test(value);

}


function hexToRgba(
    hex,
    alpha
) {

    if (
        !validColor(hex)
    ) {

        return `rgba(139,139,255,${alpha})`;

    }

    const r =
        parseInt(
            hex.substring(1,3),
            16
        );

    const g =
        parseInt(
            hex.substring(3,5),
            16
        );

    const b =
        parseInt(
            hex.substring(5,7),
            16
        );

    return `rgba(${r},${g},${b},${alpha})`;

}


function escapeHtml(
    value
) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function formatDate(
    value
) {

    try {

        const date =
            new Date(
                value
            );

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }

        return date
            .toLocaleString(
                "zh-CN",
                {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }

    catch {

        return value;

    }

}


function showError(
    message
) {

    document
        .getElementById(
            "loading"
        )
        .textContent =
            message;

}

/* =====================================================
   FILE UPLOAD
===================================================== */

async function uploadFile(
    fileInput
) {

    const file =
        fileInput.files &&
        fileInput.files[0];

    if (!file) return null;

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    const response =
        await fetch(
            "/api/upload",
            {
                method: "POST",
                credentials: "include",
                headers: (() => {
                    const h = {};
                    const t = localStorage.getItem("hyool_token");
                    if (t) h["Authorization"] = "Bearer " + t;
                    return h;
                })(),
                body: formData
            }
        );

    const data =
        await response.json();

    if (!data.success) {

        throw new Error(
            data.error ||
            "上传失败"
        );

    }

    return data.url;

}

/* =====================================================
   AVATAR CROP
===================================================== */

const cropState = {
    img: null,
    baseScale: 1,
    zoom: 1,
    offsetX: 0,
    offsetY: 0,
    dragging: false,
    dragStartX: 0,
    dragStartY: 0,
    stageSize: 280,
    cropSize: 240
};

function renderCrop() {
    const canvas = document.getElementById("cropCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const S = cropState.stageSize;
    const C = cropState.cropSize;

    ctx.fillStyle = "#0a0a12";
    ctx.fillRect(0, 0, S, S);

    if (!cropState.img) return;

    const scale = cropState.baseScale * cropState.zoom;
    const sw = cropState.img.width * scale;
    const sh = cropState.img.height * scale;
    const dx = S / 2 - sw / 2 + cropState.offsetX;
    const dy = S / 2 - sh / 2 + cropState.offsetY;

    ctx.drawImage(cropState.img, dx, dy, sw, sh);

    const cropX = (S - C) / 2;
    const cropY = (S - C) / 2;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(0, 0, S, cropY);
    ctx.fillRect(0, cropY + C, S, cropY);
    ctx.fillRect(0, cropY, cropX, C);
    ctx.fillRect(cropX + C, cropY, cropX, C);

    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = 2;
    ctx.strokeRect(cropX, cropY, C, C);
}

function openCropModal(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            cropState.img = img;
            const minDim = Math.min(img.width, img.height);
            cropState.baseScale = cropState.cropSize / minDim;
            cropState.zoom = 1;
            cropState.offsetX = 0;
            cropState.offsetY = 0;

            const zoomEl = document.getElementById("cropZoom");
            if (zoomEl) {
                zoomEl.value = 100;
                zoomEl.min = 100;
                zoomEl.max = 400;
            }

            renderCrop();
            document.getElementById("cropBackdrop").classList.add("active");
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function closeCropModal() {
    document.getElementById("cropBackdrop").classList.remove("active");
    cropState.img = null;
}

function confirmCrop() {
    if (!cropState.img) return;

    const btn = document.getElementById("cropConfirm");
    if (btn) btn.disabled = true;

    const S = cropState.stageSize;
    const C = cropState.cropSize;
    const scale = cropState.baseScale * cropState.zoom;
    const sw = cropState.img.width * scale;
    const sh = cropState.img.height * scale;
    const imgStartX = S / 2 - sw / 2 + cropState.offsetX;
    const imgStartY = S / 2 - sh / 2 + cropState.offsetY;
    const cropX = (S - C) / 2;
    const cropY = (S - C) / 2;

    const srcX = (cropX - imgStartX) / scale;
    const srcY = (cropY - imgStartY) / scale;
    const srcSize = C / scale;

    const out = document.createElement("canvas");
    out.width = 256;
    out.height = 256;
    const octx = out.getContext("2d");
    octx.drawImage(cropState.img, srcX, srcY, srcSize, srcSize, 0, 0, 256, 256);

    closeCropModal();

    out.toBlob(async function(blob) {
        if (btn) btn.disabled = false;
        if (!blob) {
            alert("裁剪失败，请重试。");
            return;
        }

        const formData = new FormData();
        formData.append("file", blob, "avatar.png");

        try {
            const response = await fetch("/api/upload", {
                method: "POST",
                credentials: "include",
                headers: (() => {
                    const h = {};
                    const t = localStorage.getItem("hyool_token");
                    if (t) h["Authorization"] = "Bearer " + t;
                    return h;
                })(),
                body: formData
            });

            const data = await response.json();
            if (!data.success) {
                throw new Error(data.error || "上传失败");
            }

            document.getElementById("editAvatarUrl").value = data.url;
            document.getElementById("avatarPreview").innerHTML =
                '<img src="' + escapeHtml(data.url) + '" alt="">';
        } catch (error) {
            alert(error.message || "头像上传失败。");
        }
    }, "image/png");
}


/* ---- crop event listeners ---- */

document.getElementById("closeCrop").addEventListener("click", closeCropModal);
document.getElementById("cropCancel").addEventListener("click", closeCropModal);
document.getElementById("cropConfirm").addEventListener("click", confirmCrop);

document.getElementById("cropZoomIn").addEventListener("click", function() {
    const el = document.getElementById("cropZoom");
    el.value = Math.min(parseInt(el.value) + 20, parseInt(el.max));
    cropState.zoom = el.value / 100;
    renderCrop();
});

document.getElementById("cropZoomOut").addEventListener("click", function() {
    const el = document.getElementById("cropZoom");
    el.value = Math.max(parseInt(el.value) - 20, parseInt(el.min));
    cropState.zoom = el.value / 100;
    renderCrop();
});

document.getElementById("cropZoom").addEventListener("input", function() {
    cropState.zoom = this.value / 100;
    renderCrop();
});

(function() {
    const canvas = document.getElementById("cropCanvas");

    function getPoint(e) {
        if (e.touches && e.touches.length) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    function onDown(e) {
        e.preventDefault();
        const p = getPoint(e);
        cropState.dragging = true;
        cropState.dragStartX = p.x;
        cropState.dragStartY = p.y;
    }

    function onMove(e) {
        if (!cropState.dragging) return;
        e.preventDefault();
        const p = getPoint(e);
        cropState.offsetX += p.x - cropState.dragStartX;
        cropState.offsetY += p.y - cropState.dragStartY;
        cropState.dragStartX = p.x;
        cropState.dragStartY = p.y;
        renderCrop();
    }

    function onUp() {
        cropState.dragging = false;
    }

    canvas.addEventListener("mousedown", onDown);
    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseup", onUp);
    canvas.addEventListener("mouseleave", onUp);
    canvas.addEventListener("touchstart", onDown, { passive: false });
    canvas.addEventListener("touchmove", onMove, { passive: false });
    canvas.addEventListener("touchend", onUp);
})();
