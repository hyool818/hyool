<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>彼岸 · HYOOL</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{

    width:100%;
    min-height:100%;

    background:#050505;

    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        Arial,
        sans-serif;
}


body{

    overflow-x:hidden;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

    position:fixed;

    inset:0;

    z-index:0;

    pointer-events:none;

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.045),
            transparent 34%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(255,255,255,.025),
            transparent 32%
        ),

        #050505;

}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:78px;

    z-index:20;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 42px;

    background:

        linear-gradient(
            to bottom,
            rgba(0,0,0,.72),
            rgba(0,0,0,0)
        );

}


/* =========================================================
   LOGO
========================================================= */

.logo{

    display:flex;

    align-items:center;

    text-decoration:none;

}


.logo img{

    display:block;

    width:88px;

    height:auto;

}


/* =========================================================
   HEADER RIGHT
========================================================= */

.header-right{

    display:flex;

    align-items:center;

    gap:28px;

}


.header-link{

    color:
        rgba(255,255,255,.45);

    text-decoration:none;

    font-family:
        Arial,
        sans-serif;

    font-size:11px;

    font-weight:300;

    letter-spacing:.18em;

    transition:
        color .4s ease;

}


.header-link:hover{

    color:
        rgba(255,255,255,.95);

}


/* =========================================================
   MAIN
========================================================= */

.main{

    position:relative;

    z-index:5;

    width:100%;

    max-width:1100px;

    min-height:100vh;

    margin:0 auto;

    padding:
        150px 30px 100px;

}


/* =========================================================
   PROFILE
========================================================= */

.profile{

    text-align:center;

    opacity:0;

    transform:
        translateY(25px);

    animation:

        profileIn
        1.2s
        cubic-bezier(.2,.8,.2,1)
        forwards;

}


@keyframes profileIn{

    from{

        opacity:0;

        transform:
            translateY(25px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   AVATAR
========================================================= */

.avatar{

    width:118px;

    height:118px;

    margin:
        0 auto 28px;

    border-radius:50%;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.14),
            rgba(255,255,255,.025)
        );

    color:
        rgba(255,255,255,.82);

    font-family:
        Arial,
        sans-serif;

    font-size:36px;

    font-weight:300;

    box-shadow:

        0 0 80px
        rgba(255,255,255,.035);

}


.avatar img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

}


/* =========================================================
   DISPLAY NAME
========================================================= */

.display-name{

    font-size:
        clamp(
            26px,
            4vw,
            42px
        );

    font-weight:300;

    letter-spacing:.08em;

    color:
        rgba(255,255,255,.94);

}


/* =========================================================
   USERNAME
========================================================= */

.username{

    margin-top:12px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:13px;

    font-weight:300;

    letter-spacing:.12em;

    color:
        rgba(255,255,255,.38);

}


/* =========================================================
   BIO
========================================================= */

.bio{

    max-width:560px;

    margin:
        24px auto 0;

    font-size:14px;

    line-height:2;

    font-weight:300;

    color:
        rgba(255,255,255,.55);

    word-break:break-word;

}


/* =========================================================
   DIVIDER
========================================================= */

.divider{

    width:40px;

    height:1px;

    margin:
        55px auto 48px;

    background:
        rgba(255,255,255,.15);

}


/* =========================================================
   WORKS TITLE
========================================================= */

.works-title{

    text-align:center;

    margin-bottom:32px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:10px;

    font-weight:300;

    letter-spacing:.38em;

    color:
        rgba(255,255,255,.3);

}


/* =========================================================
   WORKS
========================================================= */

.works{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

}


/* =========================================================
   WORK
========================================================= */

.work{

    position:relative;

    aspect-ratio:1 / 1;

    overflow:hidden;

    cursor:pointer;

    border:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(255,255,255,.025);

    transition:

        transform .6s
        cubic-bezier(.2,.8,.2,1),

        border-color .5s ease,

        background .5s ease;

}


.work:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(255,255,255,.18);

    background:
        rgba(255,255,255,.045);

}


/* =========================================================
   EMPTY WORK
========================================================= */

.work-empty{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:
        rgba(255,255,255,.18);

    font-size:11px;

    font-weight:300;

    letter-spacing:.16em;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

    margin-top:100px;

    text-align:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:9px;

    font-weight:300;

    letter-spacing:.3em;

    color:
        rgba(255,255,255,.18);

}


/* =========================================================
   ERROR STATE
========================================================= */

.error-state{

    display:none;

    text-align:center;

    padding-top:100px;

}


.error-title{

    font-size:24px;

    font-weight:300;

    letter-spacing:.08em;

    color:
        rgba(255,255,255,.8);

}


.error-message{

    margin-top:18px;

    font-size:12px;

    font-weight:300;

    color:
        rgba(255,255,255,.35);

}


.error-back{

    display:inline-block;

    margin-top:35px;

    padding:
        12px 24px;

    border:
        1px solid
        rgba(255,255,255,.12);

    color:
        rgba(255,255,255,.55);

    text-decoration:none;

    font-size:10px;

    letter-spacing:.2em;

    transition:
        all .4s ease;

}


.error-back:hover{

    color:#fff;

    border-color:
        rgba(255,255,255,.35);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .header{

        height:65px;

        padding:
            0 20px;

    }


    .logo img{

        width:70px;

    }


    .header-right{

        gap:16px;

    }


    .header-link{

        font-size:9px;

        letter-spacing:.12em;

    }


    .main{

        padding:
            120px 18px 70px;

    }


    .avatar{

        width:96px;

        height:96px;

        margin-bottom:24px;

        font-size:30px;

    }


    .display-name{

        font-size:28px;

    }


    .username{

        font-size:11px;

    }


    .bio{

        max-width:90%;

        font-size:13px;

    }


    .divider{

        margin:
            45px auto 38px;

    }


    .works{

        grid-template-columns:
            repeat(2,1fr);

        gap:10px;

    }


    .work-empty{

        font-size:9px;

    }


    .footer{

        margin-top:70px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(
    prefers-reduced-motion:reduce
){

    *,
    *::before,
    *::after{

        animation-duration:
            .01ms !important;

        transition-duration:
            .01ms !important;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background"></div>



<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">


    <!-- HYOOL LOGO -->

    <a
        href="/"
        class="logo"
        aria-label="HYOOL"
    >

        <img
            src="./logo1.png"
            alt="HYOOL"
        >

    </a>



    <!-- HEADER NAV -->

    <div class="header-right">


        <a
            href="/yonder.html"
            class="header-link"
        >
            彼岸
        </a>


        <a
            href="/"
            class="header-link"
        >
            返回幻灵
        </a>


    </div>


</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <!-- ===================================================
         PROFILE
    ==================================================== -->

    <section
        class="profile"
        id="profile"
    >


        <!-- AVATAR -->

        <div
            class="avatar"
            id="avatar"
        >

            H

        </div>



        <!-- DISPLAY NAME -->

        <div
            class="display-name"
            id="displayName"
        >

            HYOOL

        </div>



        <!-- USERNAME -->

        <div
            class="username"
            id="username"
        >

            @loading

        </div>



        <!-- BIO -->

        <div
            class="bio"
            id="bio"
        >

            这是我的彼岸。

        </div>


    </section>



    <!-- ===================================================
         DIVIDER
    ==================================================== -->

    <div
        class="divider"
        id="divider"
    ></div>



    <!-- ===================================================
         WORKS
    ==================================================== -->

    <section
        id="worksSection"
    >


        <div class="works-title">

            WORKS

        </div>



        <div class="works">


            <!-- WORK 1 -->

            <div class="work">

                <div class="work-empty">

                    暂无作品

                </div>

            </div>



            <!-- WORK 2 -->

            <div class="work">

                <div class="work-empty">

                    暂无作品

                </div>

            </div>



            <!-- WORK 3 -->

            <div class="work">

                <div class="work-empty">

                    暂无作品

                </div>

            </div>


        </div>


    </section>



    <!-- ===================================================
         ERROR
    ==================================================== -->

    <section
        class="error-state"
        id="errorState"
    >


        <div
            class="error-title"
            id="errorTitle"
        >

            彼岸不存在

        </div>


        <div
            class="error-message"
            id="errorMessage"
        >

            这个空间还没有抵达 HYOOL。

        </div>


        <a
            href="/yonder.html"
            class="error-back"
        >

            RETURN TO YONDER

        </a>


    </section>



    <!-- ===================================================
         FOOTER
    ==================================================== -->

    <footer class="footer">

        HYOOL · YONDER

    </footer>


</main>



<script>

/* =========================================================
   GET USERNAME
========================================================= */

function getUsername(){

    const pathname =
        window.location.pathname;


    /*
     * 例如：
     *
     * /@333123
     */

    if(
        !pathname.startsWith("/@")
    ){

        return null;

    }


    const username =
        pathname.substring(2);


    if(!username){

        return null;

    }


    return decodeURIComponent(
        username
    );

}



/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    title,
    message
){

    const profile =
        document.getElementById(
            "profile"
        );


    const divider =
        document.getElementById(
            "divider"
        );


    const works =
        document.getElementById(
            "worksSection"
        );


    const error =
        document.getElementById(
            "errorState"
        );


    profile.style.display =
        "none";


    divider.style.display =
        "none";


    works.style.display =
        "none";


    error.style.display =
        "block";


    document.getElementById(
        "errorTitle"
    ).textContent =
        title;


    document.getElementById(
        "errorMessage"
    ).textContent =
        message;

}



/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    const username =
        getUsername();


    /*
     * 没有用户名
     */

    if(!username){

        showError(
            "彼岸不存在",
            "没有找到有效的用户地址。"
        );

        return;

    }


    /*
     * 先显示用户名
     */

    document.getElementById(
        "username"
    ).textContent =
        "@" + username;



    try{


        /* ================================================
           REQUEST API
        ================================================ */

        const response =
            await fetch(
                "/api/profile/" +
                encodeURIComponent(
                    username
                ),
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        /*
         * HTTP 错误
         */

        if(!response.ok){

            if(
                response.status === 404
            ){

                showError(
                    "彼岸不存在",
                    "这个用户还没有建立自己的彼岸。"
                );

            }
            else{

                showError(
                    "无法抵达彼岸",
                    "服务器暂时无法读取这个空间。"
                );

            }

            return;

        }


        /* ================================================
           PARSE JSON
        ================================================ */

        const data =
            await response.json();


        /*
         * API 返回错误
         */

        if(
            !data.success ||
            !data.profile
        ){

            showError(
                "彼岸不存在",
                "这个用户还没有建立自己的彼岸。"
            );

            return;

        }


        const profile =
            data.profile;



        /* ================================================
           DISPLAY NAME
        ================================================ */

        const displayName =
            profile.display_name ||
            profile.username ||
            username;


        document.getElementById(
            "displayName"
        ).textContent =
            displayName;



        /* ================================================
           USERNAME
        ================================================ */

        document.getElementById(
            "username"
        ).textContent =
            "@" +
            profile.username;



        /* ================================================
           BIO
        ================================================ */

        document.getElementById(
            "bio"
        ).textContent =
            profile.bio ||
            "这是我的彼岸。";



        /* ================================================
           AVATAR
        ================================================ */

        const avatar =
            document.getElementById(
                "avatar"
            );


        if(
            profile.avatar_url &&
            profile.avatar_url.trim() !== ""
        ){

            avatar.innerHTML = "";


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                profile.avatar_url;


            image.alt =
                displayName;


            image.loading =
                "eager";


            image.onerror =
                function(){

                    avatar.innerHTML = "";

                    avatar.textContent =
                        getAvatarLetter(
                            profile.username
                        );

                };


            avatar.appendChild(
                image
            );

        }
        else{

            avatar.textContent =
                getAvatarLetter(
                    profile.username
                );

        }



        /* ================================================
           BACKGROUND
        ================================================ */

        if(
            profile.background_url &&
            profile.background_url.trim() !== ""
        ){

            document.body.style.background =
                "#050505";


            document.querySelector(
                ".background"
            ).style.background =

                `

                linear-gradient(
                    rgba(0,0,0,.68),
                    rgba(0,0,0,.88)
                ),

                url("${escapeCssUrl(
                    profile.background_url
                )}")

                center / cover
                fixed

                `;

        }



        /* ================================================
           PAGE TITLE
        ================================================ */

        document.title =
            displayName +
            " · 彼岸 · HYOOL";


    }
    catch(error){

        console.error(
            "HYOOL profile error:",
            error
        );


        showError(
            "无法抵达彼岸",
            "网络连接或服务器暂时出现问题。"
        );

    }

}



/* =========================================================
   AVATAR LETTER
========================================================= */

function getAvatarLetter(
    username
){

    if(!username){

        return "H";

    }


    /*
     * 取用户名第一个字符
     */

    return username
        .charAt(0)
        .toUpperCase();

}



/* =========================================================
   CSS URL ESCAPE
========================================================= */

function escapeCssUrl(
    url
){

    return url
        .replace(/\\/g,"\\\\")
        .replace(/"/g,'\\"')
        .replace(/\)/g,"\\)");

}



/* =========================================================
   START
========================================================= */

loadProfile();

</script>


</body>

</html>
