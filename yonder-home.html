<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>彼岸 · HYOOL</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #080808;

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Microsoft YaHei",
                sans-serif;

        }


        body {

            min-height: 100vh;

        }


        a {

            color: inherit;

            text-decoration: none;

        }


        button {

            font: inherit;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 42px;

            z-index: 100;

            background:
                linear-gradient(
                    to bottom,
                    rgba(8,8,8,.96),
                    rgba(8,8,8,.72),
                    transparent
                );

            backdrop-filter: blur(10px);

        }


        /* =====================================================
           HYOOL LOGO
        ===================================================== */

        .brand {

            font-size: 18px;

            font-weight: 600;

            letter-spacing: 4px;

            color:
                rgba(255,255,255,.92);

            user-select: none;

        }


        /* =====================================================
           HEADER NAV
        ===================================================== */

        .header-right {

            display: flex;

            align-items: center;

            gap: 28px;

        }


        .header-link {

            font-size: 14px;

            color:
                rgba(255,255,255,.62);

            transition:
                color .2s ease,
                opacity .2s ease;

            cursor: pointer;

        }


        .header-link:hover {

            color: #ffffff;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .page {

            width: 100%;

            max-width: 1080px;

            margin: 0 auto;

            padding:
                130px 28px
                80px;

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .profile {

            display: flex;

            align-items: center;

            gap: 24px;

            margin-bottom: 70px;

        }


        .avatar {

            width: 92px;

            height: 92px;

            border-radius: 50%;

            overflow: hidden;

            flex-shrink: 0;

            background:
                linear-gradient(
                    135deg,
                    #252525,
                    #111111
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            color:
                rgba(255,255,255,.72);

        }


        .avatar img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .profile-info {

            min-width: 0;

        }


        .display-name {

            font-size: 30px;

            font-weight: 600;

            margin-bottom: 6px;

        }


        .username {

            font-size: 14px;

            color:
                rgba(255,255,255,.42);

            margin-bottom: 14px;

        }


        .bio {

            font-size: 15px;

            line-height: 1.7;

            color:
                rgba(255,255,255,.72);

            max-width: 650px;

        }


        /* =====================================================
           SECTION
        ===================================================== */

        .section-title {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 24px;

        }


        .section-title h2 {

            margin: 0;

            font-size: 20px;

            font-weight: 500;

            letter-spacing: 2px;

        }


        .section-title span {

            font-size: 12px;

            color:
                rgba(255,255,255,.35);

        }


        /* =====================================================
           POSTS
        ===================================================== */

        .posts {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap: 18px;

        }


        .post {

            position: relative;

            min-height: 220px;

            padding: 24px;

            border-radius: 14px;

            background:
                rgba(255,255,255,.035);

            border:
                1px solid
                rgba(255,255,255,.07);

            cursor: pointer;

            transition:
                transform .25s ease,
                background .25s ease,
                border-color .25s ease;

        }


        .post:hover {

            transform:
                translateY(-4px);

            background:
                rgba(255,255,255,.06);

            border-color:
                rgba(255,255,255,.15);

        }


        .post-type {

            display: inline-block;

            font-size: 11px;

            letter-spacing: 1px;

            color:
                rgba(255,255,255,.4);

            margin-bottom: 18px;

        }


        .post-title {

            font-size: 19px;

            line-height: 1.5;

            margin-bottom: 12px;

        }


        .post-content {

            font-size: 14px;

            line-height: 1.7;

            color:
                rgba(255,255,255,.55);

            display:
                -webkit-box;

            -webkit-line-clamp: 5;

            -webkit-box-orient: vertical;

            overflow: hidden;

        }


        .post-time {

            position: absolute;

            left: 24px;

            bottom: 20px;

            font-size: 11px;

            color:
                rgba(255,255,255,.3);

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            grid-column: 1 / -1;

            padding: 90px 20px;

            text-align: center;

            border-radius: 16px;

            border:
                1px dashed
                rgba(255,255,255,.1);

            color:
                rgba(255,255,255,.35);

        }


        .empty-title {

            font-size: 18px;

            margin-bottom: 12px;

            color:
                rgba(255,255,255,.6);

        }


        .empty-text {

            font-size: 13px;

            line-height: 1.8;

        }


        /* =====================================================
           LOADING
        ===================================================== */

        .loading {

            grid-column: 1 / -1;

            padding: 100px 20px;

            text-align: center;

            color:
                rgba(255,255,255,.35);

            font-size: 14px;

        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {

            grid-column: 1 / -1;

            padding: 100px 20px;

            text-align: center;

            color:
                rgba(255,255,255,.5);

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {


            .header {

                padding:
                    0 20px;

            }


            .header-right {

                gap: 17px;

            }


            .header-link {

                font-size: 13px;

            }


            .brand {

                font-size: 16px;

                letter-spacing: 3px;

            }


            .page {

                padding:
                    110px 18px
                    60px;

            }


            .profile {

                align-items: flex-start;

                margin-bottom: 50px;

            }


            .avatar {

                width: 72px;

                height: 72px;

                font-size: 24px;

            }


            .display-name {

                font-size: 24px;

            }


            .posts {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <!-- HYOOL LOGO
         这里只是品牌标识，不跳转 -->

    <div class="brand">

        HYOOL

    </div>


    <!-- NAV -->

    <nav class="header-right">


        <a
            href="/infinite.html"
            class="header-link"
        >
            无限
        </a>


        <a
            href="/life.html"
            class="header-link"
        >
            生命
        </a>


        <a
            href="javascript:void(0)"
            class="header-link"
            onclick="goBack()"
        >
            返回
        </a>


    </nav>


</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


    <!-- =================================================
         PROFILE
    ================================================== -->

    <section
        class="profile"
        id="profile"
    >


        <div
            class="avatar"
            id="avatar"
        >

            Y

        </div>


        <div class="profile-info">


            <div
                class="display-name"
                id="displayName"
            >
                加载中…
            </div>


            <div
                class="username"
                id="username"
            >
                @
            </div>


            <div
                class="bio"
                id="bio"
            >
                正在进入彼岸……
            </div>


        </div>


    </section>



    <!-- =================================================
         POSTS
    ================================================== -->

    <section>


        <div class="section-title">


            <h2>
                我的彼岸
            </h2>


            <span
                id="postCount"
            >
                0
            </span>


        </div>


        <div
            class="posts"
            id="posts"
        >

            <div class="loading">
                正在读取彼岸……
            </div>

        </div>


    </section>


</main>



<script>

/* =====================================================
   RETURN
===================================================== */

function goBack() {

    if (
        window.history.length > 1
    ) {

        window.history.back();

        return;

    }


    /*
     * 如果没有历史记录，
     * 默认返回彼岸入口。
     */

    window.location.href =
        "/yonder.html";

}


/* =====================================================
   GET USERNAME
===================================================== */

function getUsername() {

    const pathname =
        decodeURIComponent(
            window.location.pathname
        );


    if (
        pathname.startsWith("/@")
    ) {

        return pathname
            .substring(2)
            .split("/")[0]
            .trim()
            .toLowerCase();

    }


    return null;

}


/* =====================================================
   API
===================================================== */

async function api(
    url
) {

    const response =
        await fetch(
            url,
            {
                method: "GET",

                credentials: "include",

                cache: "no-store"
            }
        );


    let data;


    try {

        data =
            await response.json();

    }

    catch {

        throw new Error(
            "服务器返回异常。"
        );

    }


    if (
        !response.ok
    ) {

        throw new Error(
            data.error ||
            "请求失败。"
        );

    }


    return data;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(
            String(value)
                .replace(
                    " ",
                    "T"
                )
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(
        "zh-CN",
        {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    );

}


/* =====================================================
   RENDER PROFILE
===================================================== */

function renderProfile(
    profile
) {

    const displayName =
        profile.display_name ||
        profile.username ||
        "彼岸";


    document
        .getElementById(
            "displayName"
        )
        .textContent =
            displayName;


    document
        .getElementById(
            "username"
        )
        .textContent =
            "@" +
            profile.username;


    document
        .getElementById(
            "bio"
        )
        .textContent =
            profile.bio ||
            "这是我的彼岸。";


    const avatar =
        document.getElementById(
            "avatar"
        );


    if (
        profile.avatar_url
    ) {

        avatar.innerHTML = `

            <img
                src="${escapeHTML(
                    profile.avatar_url
                )}"
                alt=""
            >

        `;

    }

    else {

        avatar.textContent =
            displayName
                .charAt(0)
                .toUpperCase();

    }

}


/* =====================================================
   RENDER POSTS
===================================================== */

function renderPosts(
    posts
) {

    const container =
        document.getElementById(
            "posts"
        );


    const count =
        document.getElementById(
            "postCount"
        );


    count.textContent =
        posts.length;


    if (
        !posts.length
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-title">

                    这里还什么都没有

                </div>


                <div class="empty-text">

                    当你开始留下想法、作品和故事，

                    <br>

                    它们就会慢慢成为你的彼岸。

                </div>

            </div>

        `;

        return;

    }


    container.innerHTML =
        posts
            .map(
                post => {


                    const type =
                        post.type ||
                        post.post_type ||
                        "CONTENT";


                    const title =
                        post.title ||
                        "未命名内容";


                    const content =
                        post.content ||
                        post.description ||
                        "";


                    const createdAt =
                        post.created_at ||
                        post.published_at ||
                        "";


                    return `

                        <article
                            class="post"
                            data-id="${escapeHTML(
                                post.id || ""
                            )}"
                        >

                            <div class="post-type">

                                ${escapeHTML(
                                    type
                                )}

                            </div>


                            <div class="post-title">

                                ${escapeHTML(
                                    title
                                )}

                            </div>


                            <div class="post-content">

                                ${escapeHTML(
                                    content
                                )}

                            </div>


                            <div class="post-time">

                                ${escapeHTML(
                                    formatTime(
                                        createdAt
                                    )
                                )}

                            </div>

                        </article>

                    `;

                }
            )
            .join("");

}


/* =====================================================
   LOAD YONDER
===================================================== */

async function loadYonder() {


    const username =
        getUsername();


    if (!username) {

        document
            .getElementById(
                "posts"
            )
            .innerHTML = `

                <div class="error">

                    无法识别彼岸。

                </div>

            `;

        return;

    }


    try {


        /*
         * 读取彼岸主页
         */

        const result =
            await api(
                "/api/yonder/" +
                encodeURIComponent(
                    username
                )
            );


        if (
            !result.success ||
            !result.yonder ||
            !result.yonder.profile
        ) {

            throw new Error(
                "彼岸不存在。"
            );

        }


        renderProfile(
            result.yonder.profile
        );


        /*
         * 读取内容
         */

        let posts =
            Array.isArray(
                result.yonder.posts
            )
                ? result.yonder.posts
                : null;


        /*
         * 如果主页接口没有 posts，
         * 再读取独立 posts API。
         */

        if (
            !posts
        ) {

            const postResult =
                await api(
                    "/api/yonder/" +
                    encodeURIComponent(
                        username
                    ) +
                    "/posts"
                );


            posts =
                Array.isArray(
                    postResult.posts
                )
                    ? postResult.posts
                    : [];

        }


        renderPosts(
            posts
        );


    }

    catch (error) {


        console.error(
            "YONDER LOAD ERROR:",
            error
        );


        document
            .getElementById(
                "posts"
            )
            .innerHTML = `

                <div class="error">

                    彼岸暂时无法加载。

                    <br><br>

                    ${escapeHTML(
                        error.message ||
                        "服务器异常"
                    )}

                </div>

            `;

    }

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        loadYonder();

    }
);

</script>


</body>

</html>
