<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>彼岸 · HYOOL</title>

<style>

:root {
    --accent: #8b8bff;
    --text: rgba(255,255,255,.94);
    --muted: rgba(255,255,255,.55);
    --glass: rgba(255,255,255,.07);
    --glass-border: rgba(255,255,255,.11);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(100,100,180,.20),
            transparent 42%
        ),
        linear-gradient(
            135deg,
            #11121a,
            #090a10 55%,
            #050507
        );

    background-attachment: fixed;

    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

#background-layer {

    position: fixed;

    inset: 0;

    z-index: -10;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(120,120,220,.18),
            transparent 45%
        );

    transition:
        background .4s ease;
}

#background-image {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    display: none;

    transition:
        opacity .4s ease;
}

#background-overlay {

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.10),
            rgba(0,0,0,.48)
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    z-index: 100;

    background:
        linear-gradient(
            to bottom,
            rgba(5,5,8,.52),
            rgba(5,5,8,0)
        );

    backdrop-filter:
        blur(10px);
}

.logo {

    text-decoration: none;

    color: white;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: .22em;

    opacity: .95;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 10px;
}

.header-link,
.edit-button {

    border: 0;

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.76);

    text-decoration: none;

    padding:
        9px 14px;

    border-radius: 999px;

    font-size: 13px;

    cursor: pointer;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.header-link:hover,
.edit-button:hover {

    color: white;

    background:
        rgba(255,255,255,.12);

    transform:
        translateY(-1px);
}

.edit-button {

    border:
        1px solid var(--accent);
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    padding:
        130px 24px 100px;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-section {

    text-align: center;

    margin-bottom: 90px;
}

.avatar {

    width: 112px;
    height: 112px;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    margin:
        0 auto 24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            rgba(255,255,255,.04)
        );

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 20px 70px rgba(0,0,0,.35);
}

.avatar-placeholder {

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        rgba(255,255,255,.75);

    font-size: 38px;

    font-weight: 500;
}

.display-name {

    margin: 0;

    font-size: 32px;

    font-weight: 600;

    letter-spacing: -.02em;
}

.username {

    margin-top: 8px;

    color:
        rgba(255,255,255,.42);

    font-size: 13px;
}

.bio {

    max-width: 600px;

    margin:
        20px auto 0;

    line-height: 1.8;

    color:
        rgba(255,255,255,.65);

    font-size: 15px;
}


/* =====================================================
   CONTENT
===================================================== */

.section {

    margin-top: 60px;
}

.section-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;
}

.section-title h2 {

    margin: 0;

    font-size: 17px;

    font-weight: 500;

    letter-spacing: .05em;
}

.section-title span {

    color:
        rgba(255,255,255,.32);

    font-size: 12px;
}


/* =====================================================
   POSTS
===================================================== */

.posts {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );

    gap: 18px;
}

.post {

    padding: 24px;

    min-height: 150px;

    border:
        1px solid var(--glass-border);

    background:
        rgba(255,255,255,.055);

    border-radius: 20px;

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 18px 50px rgba(0,0,0,.16);

    transition:
        transform .25s ease,
        background .25s ease;
}

.post:hover {

    transform:
        translateY(-3px);

    background:
        rgba(255,255,255,.08);
}

.post-content {

    line-height: 1.8;

    color:
        rgba(255,255,255,.83);

    white-space: pre-wrap;

    word-break: break-word;
}

.post-meta {

    margin-top: 20px;

    color:
        rgba(255,255,255,.30);

    font-size: 11px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    padding:
        60px 20px;

    text-align: center;

    border:
        1px dashed rgba(255,255,255,.10);

    border-radius: 20px;

    color:
        rgba(255,255,255,.32);

    font-size: 13px;
}


/* =====================================================
   EDIT PANEL
===================================================== */

.editor-backdrop {

    position: fixed;

    inset: 0;

    z-index: 500;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(8px);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.editor-backdrop.active {

    display: flex;
}

.editor {

    width: 100%;

    max-width: 560px;

    max-height:
        calc(100vh - 40px);

    overflow-y: auto;

    padding: 28px;

    border:
        1px solid rgba(255,255,255,.12);

    border-radius: 24px;

    background:
        rgba(18,18,24,.94);

    box-shadow:
        0 40px 100px rgba(0,0,0,.55);
}

.editor-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 28px;
}

.editor-header h2 {

    margin: 0;

    font-size: 20px;

    font-weight: 600;
}

.close-button {

    border: 0;

    background: transparent;

    color:
        rgba(255,255,255,.55);

    font-size: 24px;

    cursor: pointer;
}

.form-group {

    margin-bottom: 22px;
}

.form-group label {

    display: block;

    margin-bottom: 9px;

    color:
        rgba(255,255,255,.65);

    font-size: 13px;
}

.form-group input,
.form-group select,
.form-group textarea {

    width: 100%;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 12px;

    padding:
        12px 14px;

    background:
        rgba(255,255,255,.06);

    color: white;

    outline: none;

    font:
        inherit;
}

.form-group textarea {

    min-height: 90px;

    resize: vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    border-color:
        var(--accent);
}

.color-row {

    display: flex;

    gap: 10px;
}

.color-row input[type="color"] {

    width: 54px;

    height: 42px;

    padding: 3px;

    cursor: pointer;
}


/* =====================================================
   CHECKBOXES
===================================================== */

.checkbox-group {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;
}

.checkbox-item {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 12px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.045);

    color:
        rgba(255,255,255,.70);

    font-size: 13px;

    cursor: pointer;
}

.checkbox-item input {

    accent-color:
        var(--accent);
}


/* =====================================================
   SAVE
===================================================== */

.save-button {

    width: 100%;

    border: 0;

    border-radius: 13px;

    padding:
        13px;

    background:
        var(--accent);

    color: white;

    font-size: 14px;

    cursor: pointer;

    transition:
        opacity .2s ease,
        transform .2s ease;
}

.save-button:hover {

    opacity: .88;

    transform:
        translateY(-1px);
}

.save-button:disabled {

    opacity: .45;

    cursor: wait;
}


/* =====================================================
   LOADING
===================================================== */

.loading {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        rgba(255,255,255,.45);

    font-size: 13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    .header {

        padding:
            0 16px;

    }

    .logo {

        font-size: 15px;

    }

    .header-link,
    .edit-button {

        padding:
            8px 11px;

        font-size: 12px;

    }

    .page {

        padding:
            110px 16px 70px;

    }

    .display-name {

        font-size: 27px;

    }

    .avatar {

        width: 94px;
        height: 94px;

    }

    .checkbox-group {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>

<div id="background-layer">

    <img
        id="background-image"
        alt=""
    >

    <div id="background-overlay"></div>

</div>


<div
    id="loading"
    class="loading"
>
    正在进入彼岸……
</div>


<div
    id="app"
    style="display:none;"
>


<header class="header">

    <a
        href="/"
        class="logo"
    >
        HYOOL
    </a>


    <div class="header-right">

        <button
            id="editButton"
            class="edit-button"
            style="display:none;"
        >
            编辑彼岸
        </button>


        <a
            href="/yonder.html"
            class="header-link"
        >
            返回
        </a>

    </div>

</header>


<main class="page">


    <!-- PROFILE -->

    <section
        id="profileSection"
        class="profile-section"
    >

        <div
            id="avatarContainer"
        ></div>


        <h1
            id="displayName"
            class="display-name"
        >
            —
        </h1>


        <div
            id="username"
            class="username"
        >
            —
        </div>


        <div
            id="bio"
            class="bio"
        ></div>

    </section>


    <!-- POSTS -->

    <section
        id="postsSection"
        class="section"
    >

        <div class="section-title">

            <h2>
                记录
            </h2>

            <span>
                YONDER
            </span>

        </div>


        <div
            id="posts"
            class="posts"
        ></div>

    </section>


    <!-- WORKS -->

    <section
        id="worksSection"
        class="section"
    >

        <div class="section-title">

            <h2>
                作品
            </h2>

            <span>
                LIFE
            </span>

        </div>


        <div class="empty">
            这里以后会成为你的作品空间。
        </div>

    </section>


    <!-- INFINITE -->

    <section
        id="infiniteSection"
        class="section"
    >

        <div class="section-title">

            <h2>
                无限
            </h2>

            <span>
                EXPLORE
            </span>

        </div>


        <div class="empty">

            发现别人留下的想法与作品。

            <br><br>

            无限正在生长。

        </div>

    </section>


</main>


</div>


<!-- =====================================================
     EDITOR
===================================================== -->

<div
    id="editorBackdrop"
    class="editor-backdrop"
>

    <div class="editor">

        <div class="editor-header">

            <h2>
                编辑彼岸
            </h2>

            <button
                id="closeEditor"
                class="close-button"
            >
                ×
            </button>

        </div>


        <!-- BACKGROUND -->

        <div class="form-group">

            <label>
                背景类型
            </label>

            <select
                id="backgroundType"
            >

                <option value="gradient">
                    渐变
                </option>

                <option value="color">
                    纯色
                </option>

                <option value="image">
                    图片
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                背景内容
            </label>

            <input
                id="backgroundValue"
                type="text"
                placeholder="颜色 / 图片 URL"
            >

        </div>


        <!-- ACCENT -->

        <div class="form-group">

            <label>
                强调色
            </label>

            <div class="color-row">

                <input
                    id="accentColor"
                    type="color"
                    value="#8b8bff"
                >

                <input
                    id="accentColorText"
                    type="text"
                    value="#8b8bff"
                >

            </div>

        </div>


        <!-- MODULES -->

        <div class="form-group">

            <label>
                页面模块
            </label>

            <div class="checkbox-group">

                <label class="checkbox-item">

                    <input
                        id="showProfile"
                        type="checkbox"
                        checked
                    >

                    个人信息

                </label>


                <label class="checkbox-item">

                    <input
                        id="showPosts"
                        type="checkbox"
                        checked
                    >

                    动态

                </label>


                <label class="checkbox-item">

                    <input
                        id="showWorks"
                        type="checkbox"
                        checked
                    >

                    作品

                </label>


                <label class="checkbox-item">

                    <input
                        id="showInfinite"
                        type="checkbox"
                        checked
                    >

                    无限

                </label>

            </div>

        </div>


        <!-- SAVE -->

        <button
            id="saveButton"
            class="save-button"
        >
            保存彼岸
        </button>

    </div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

const state = {

    username: "",

    profile: null,

    settings: null,

    posts: [],

    isOwner: false

};


/* =====================================================
   GET USERNAME
===================================================== */

function getUsername() {

    const path =
        decodeURIComponent(
            window.location.pathname
        );

    if (
        path.startsWith("/@") &&
        path.length > 2
    ) {

        return path
            .substring(2)
            .split("/")[0]
            .trim()
            .toLowerCase();

    }

    return null;
}


/* =====================================================
   API
===================================================== */

async function loadYonder() {

    const username =
        getUsername();

    if (!username) {

        showError(
            "无法识别彼岸。"
        );

        return;

    }

    state.username =
        username;


    try {

        const response =
            await fetch(
                "/api/yonder/" +
                encodeURIComponent(username),
                {
                    method: "GET",
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "彼岸加载失败"
            );

        }


        state.profile =
            data.yonder.profile;

        state.settings =
            data.yonder.settings || {};

        state.posts =
            data.yonder.posts || [];


        await checkOwner();


        render();

    }

    catch (error) {

        console.error(
            "YONDER LOAD ERROR:",
            error
        );

        showError(
            error.message ||
            "彼岸加载失败。"
        );

    }

}


/* =====================================================
   CHECK OWNER
===================================================== */

async function checkOwner() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        state.isOwner =
            Boolean(
                data.authenticated &&
                data.user &&
                data.user.username &&
                data.user.username.toLowerCase() ===
                    state.username
            );

    }

    catch {

        state.isOwner =
            false;

    }

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const settings =
        state.settings || {};

    applySettings(
        settings
    );

    renderProfile();

    renderPosts();

    document
        .getElementById(
            "editButton"
        )
        .style.display =
            state.isOwner
                ? "block"
                : "none";


    document
        .getElementById(
            "loading"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "app"
        )
        .style.display =
            "block";

}


/* =====================================================
   PROFILE
===================================================== */

function renderProfile() {

    const profile =
        state.profile || {};

    const avatar =
        document.getElementById(
            "avatarContainer"
        );

    if (profile.avatar_url) {

        avatar.innerHTML = `
            <img
                class="avatar"
                src="${escapeHtml(profile.avatar_url)}"
                alt=""
            >
        `;

    }

    else {

        const letter =
            String(
                profile.display_name ||
                profile.username ||
                "H"
            )
            .charAt(0)
            .toUpperCase();

        avatar.innerHTML = `
            <div class="avatar avatar-placeholder">
                ${escapeHtml(letter)}
            </div>
        `;

    }


    document
        .getElementById(
            "displayName"
        )
        .textContent =
            profile.display_name ||
            profile.username ||
            "未命名";


    document
        .getElementById(
            "username"
        )
        .textContent =
            "@" +
            (
                profile.username ||
                state.username
            );


    document
        .getElementById(
            "bio"
        )
        .textContent =
            profile.bio ||
            "";

}


/* =====================================================
   POSTS
===================================================== */

function renderPosts() {

    const container =
        document.getElementById(
            "posts"
        );

    if (!state.posts.length) {

        container.innerHTML = `
            <div class="empty" style="grid-column:1/-1;">
                这里还没有留下内容。
            </div>
        `;

        return;

    }


    container.innerHTML =
        state.posts
            .map(
                post =>
                    renderPost(post)
            )
            .join("");

}


/* =====================================================
   POST
===================================================== */

function renderPost(post) {

    const content =
        post.content ||
        post.text ||
        post.body ||
        "";

    const createdAt =
        post.created_at ||
        "";


    return `
        <article class="post">

            <div class="post-content">
                ${escapeHtml(content)}
            </div>

            ${
                createdAt
                    ? `
                        <div class="post-meta">
                            ${escapeHtml(
                                formatDate(createdAt)
                            )}
                        </div>
                    `
                    : ""
            }

        </article>
    `;

}


/* =====================================================
   SETTINGS
===================================================== */

function applySettings(
    settings
) {

    const accent =
        settings.accent_color ||
        "#8b8bff";

    document
        .documentElement
        .style
        .setProperty(
            "--accent",
            accent
        );


    const backgroundType =
        settings.background_type ||
        "gradient";

    const backgroundValue =
        settings.background_value ||
        "";

    const layer =
        document.getElementById(
            "background-layer"
        );

    const image =
        document.getElementById(
            "background-image"
        );


    image.style.display =
        "none";

    image.style.opacity =
        "0";


    if (
        backgroundType ===
        "color"
    ) {

        layer.style.background =
            backgroundValue ||
            "#090a10";

    }

    else if (
        backgroundType ===
        "image"
    ) {

        if (backgroundValue) {

            image.src =
                backgroundValue;

            image.style.display =
                "block";

            requestAnimationFrame(
                () => {
                    image.style.opacity =
                        "1";
                }
            );

        }

        layer.style.background =
            "rgba(0,0,0,.25)";

    }

    else {

        layer.style.background =
            `
            radial-gradient(
                circle at 50% 0%,
                ${hexToRgba(
                    accent,
                    .25
                )},
                transparent 45%
            ),
            linear-gradient(
                135deg,
                #11121a,
                #090a10 55%,
                #050507
            )
            `;

    }


    setVisible(
        "profileSection",
        settings.show_profile !== 0
    );

    setVisible(
        "postsSection",
        settings.show_posts !== 0
    );

    setVisible(
        "worksSection",
        settings.show_works !== 0
    );

    setVisible(
        "infiniteSection",
        settings.show_infinite !== 0
    );


    if (
        settings.custom_css
    ) {

        let customStyle =
            document.getElementById(
                "custom-user-style"
            );

        if (!customStyle) {

            customStyle =
                document.createElement(
                    "style"
                );

            customStyle.id =
                "custom-user-style";

            document.head.appendChild(
                customStyle
            );

        }

        customStyle.textContent =
            settings.custom_css;

    }

}


/* =====================================================
   OPEN EDITOR
===================================================== */

function openEditor() {

    const settings =
        state.settings || {};


    document
        .getElementById(
            "backgroundType"
        )
        .value =
            settings.background_type ||
            "gradient";


    document
        .getElementById(
            "backgroundValue"
        )
        .value =
            settings.background_value ||
            "";


    const accent =
        settings.accent_color ||
        "#8b8bff";


    document
        .getElementById(
            "accentColor"
        )
        .value =
            validColor(accent)
                ? accent
                : "#8b8bff";


    document
        .getElementById(
            "accentColorText"
        )
        .value =
            accent;


    document
        .getElementById(
            "showProfile"
        )
        .checked =
            settings.show_profile !== 0;


    document
        .getElementById(
            "showPosts"
        )
        .checked =
            settings.show_posts !== 0;


    document
        .getElementById(
            "showWorks"
        )
        .checked =
            settings.show_works !== 0;


    document
        .getElementById(
            "showInfinite"
        )
        .checked =
            settings.show_infinite !== 0;


    document
        .getElementById(
            "editorBackdrop"
        )
        .classList
        .add("active");

}


/* =====================================================
   CLOSE EDITOR
===================================================== */

function closeEditor() {

    document
        .getElementById(
            "editorBackdrop"
        )
        .classList
        .remove("active");

}


/* =====================================================
   SAVE SETTINGS
===================================================== */

async function saveSettings() {

    const button =
        document.getElementById(
            "saveButton"
        );

    button.disabled =
        true;

    button.textContent =
        "保存中……";


    try {

        const backgroundType =
            document
                .getElementById(
                    "backgroundType"
                )
                .value;


        const backgroundValue =
            document
                .getElementById(
                    "backgroundValue"
                )
                .value
                .trim();


        const accent =
            document
                .getElementById(
                    "accentColorText"
                )
                .value
                .trim();


        const payload = {

            background_type:
                backgroundType,

            background_value:
                backgroundValue,

            accent_color:
                validColor(accent)
                    ? accent
                    : "#8b8bff",

            layout:
                "default",

            show_profile:
                document
                    .getElementById(
                        "showProfile"
                    )
                    .checked,

            show_posts:
                document
                    .getElementById(
                        "showPosts"
                    )
                    .checked,

            show_works:
                document
                    .getElementById(
                        "showWorks"
                    )
                    .checked,

            show_infinite:
                document
                    .getElementById(
                        "showInfinite"
                    )
                    .checked,

            custom_css:
                ""

        };


        const response =
            await fetch(
                "/api/yonder/settings",
                {
                    method: "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            payload
                        )
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "保存失败"
            );

        }


        state.settings =
            data.settings;


        applySettings(
            state.settings
        );


        closeEditor();

    }

    catch (error) {

        alert(
            error.message ||
            "保存失败。"
        );

    }

    finally {

        button.disabled =
            false;

        button.textContent =
            "保存彼岸";

    }

}


/* =====================================================
   HELPERS
===================================================== */

function setVisible(
    id,
    visible
) {

    const element =
        document.getElementById(
            id
        );

    if (!element) {
        return;
    }

    element.style.display =
        visible
            ? ""
            : "none";

}


function validColor(
    value
) {

    return /^#[0-9a-fA-F]{6}$/
        .test(value);

}


function hexToRgba(
    hex,
    alpha
) {

    if (
        !validColor(hex)
    ) {

        return `rgba(139,139,255,${alpha})`;

    }

    const r =
        parseInt(
            hex.substring(1,3),
            16
        );

    const g =
        parseInt(
            hex.substring(3,5),
            16
        );

    const b =
        parseInt(
            hex.substring(5,7),
            16
        );

    return `rgba(${r},${g},${b},${alpha})`;

}


function escapeHtml(
    value
) {

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function formatDate(
    value
) {

    try {

        const date =
            new Date(
                value
            );

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return value;

        }

        return date
            .toLocaleString(
                "zh-CN",
                {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }

    catch {

        return value;

    }

}


function showError(
    message
) {

    document
        .getElementById(
            "loading"
        )
        .textContent =
            message;

}
